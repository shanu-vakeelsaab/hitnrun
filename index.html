                <span className="d-num">{d.day}</span>
                <span className="d-wd">{d.weekday}</span>
              </button>
            ))}
          </div>
        </div>

        {/* STEP 2 */}
        <div className="booking-step">
          <div className="step-label">
            <span className="step-num">2</span>
            <span className="step-title">What's the game?</span>
          </div>
          {sportsError && <SportsRetry onRetry={onRetrySports}/>}
          {!sportsError && !sports && (
            <div className="sport-grid">{[0,1,2].map(i => <div key={i} className="sport-card shimmer" style={{height:76}}/>)}</div>
          )}
          {sports && sports.length === 0 && (
            <div className="empty-block"><div className="ic">🗓️</div><div className="empty-title">No online bookings right now</div><div style={{fontSize:13}}>Call us on {VENUE.phone} to book.</div></div>
          )}
          {sports && sports.length > 0 && (
            <div className="sport-grid">
              {sports.map(s => (
                <button key={s.id} className={`sport-card ${sportId===s.id?'active':''}`} onClick={()=>setSportId(s.id)}>
                  <span className="ic">{s.icon}</span>
                  <div className="sport-card-text">
                    <div className="name">{s.name}</div>
                    {s.tagline && <div className="price">{s.tagline}</div>}
                    <div className="price">{priceLabel(s)}</div>
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>

        {/* STEP 3 */}
        <div className="booking-step">
          <div className="step-label">
            <span className={`step-num ${sport?'':'dim'}`}>3</span>
            <span className="step-title">Pick your time</span>
            <span className="step-meta">{!sport ? 'Choose a sport first ↑' : !avail ? 'Checking…' : `${hours.length} available`}</span>
          </div>
          {!sport && (
            <div className="empty-block"><div className="ic">🎯</div><div className="empty-title">Pick a sport above</div><div style={{fontSize:13}}>We'll show you what's open on {dateNice(date)}</div></div>
          )}
          {sport && availError && !avail && (
            <div className="empty-block">
              <div className="ic">📡</div><div className="empty-title">Couldn't load availability</div>
              <div style={{fontSize:13,marginBottom:16}}>{availError}</div>
              <button className="btn-secondary" style={{padding:'10px 22px'}} onClick={()=>setAvailNonce(n => n + 1)}>↻ Retry</button>
            </div>
          )}
          {sport && !avail && !availError && (
            <div className="loading-block"><Spinner/><div style={{marginTop:16,fontSize:13,color:'var(--text-2)'}}>Fetching live availability…</div></div>
          )}
          {sport && avail && hours.length === 0 && (
            <div className="empty-block"><div className="ic">📭</div><div className="empty-title">Fully booked</div><div style={{fontSize:13}}>No slots left for {sport.name} on {dateNice(date)}.<br/>Try a different day or sport.</div></div>
          )}
          {sport && avail && hours.length > 0 && (
            <div className="slots-grid">
              {hours.map(h => {
                const active = selectedSlot && selectedSlot.slot_time === h.slot_time;
                const [startT, endT] = h.slot_time.split('-');
                return (
                  <button key={h.slot_time} className={`slot-card ${active?'active':''}`} style={{animationDelay:`${Math.min(hours.indexOf(h),12)*35}ms`}} onClick={()=>setSelectedSlot(h)}>
                    {isSession(sport) ? (
                      <div className="time-row"><span className="slot-time">{startTime12(h.slot_time)}</span></div>
                    ) : (
                      <div className="time-row">
                        <span className="slot-time">{time12(startT)}</span>
                        <span className="slot-arrow">→</span>
                        <span className="slot-time end">{time12(endT)}</span>
                      </div>
                    )}
                    <div className="slot-price">₹{Number(h.price).toLocaleString('en-IN')}{isSession(sport) ? '' : ' / hr'}</div>
                    <div className="slot-meta">{h.available} left</div>
                  </button>
                );
              })}
            </div>
          )}
        </div>

        {/* STEP 3.5 — Duration picker (only when a slot is selected) */}
        {selectedSlot && (
          <div className="booking-step anim-rise-fast">
            <div className="step-label">
              <span className="step-num">⏱</span>
              <span className="step-title">{isSession(sport) ? `How many ${sport.session_unit}?` : 'Duration'}</span>
              <span className="step-meta">{isSession(sport)
                ? (maxDur >= 2 ? `Up to ${sessionQty(sport, maxDur)} available` : `${sessionQty(sport, 1)} only`)
                : (maxDur >= 2 ? `Up to ${maxDur} hours available` : '1 hour only')}</span>
            </div>
            <div className="duration-grid">
              {Array.from({ length: maxPerBooking }, (_, i) => i + 1).map(h => {
                const disabled = h > maxDur;
                const active = effectiveDuration === h;
                return (
                  <button
                    key={h}
                    className={`duration-card ${active?'active':''} ${disabled?'disabled':''}`}
                    onClick={()=>!disabled && setDuration(h)}
                    disabled={disabled}
                    title={disabled ? 'Not enough consecutive slots available' : ''}
                  >
                    <div className="dur-h">{durationText(sport, h)}</div>
                    <div className="dur-price">{displayTotal(h)}</div>
                    {disabled && <div className="dur-sub">unavailable</div>}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* STEP 4 */}
        {selectedSlot && (
          <div className="booking-step anim-rise-fast">
            <div className="step-label">
              <span className="step-num">4</span>
              <span className="step-title">Your details</span>
              <span className="step-meta">Almost there.</span>
            </div>
            <div className="form-grid">
              {returning && returning.found && (
                <div className="return-banner anim-rise-fast">
                  <span className="return-emoji">👋</span>
                  <div className="return-text">
                    <strong>Welcome back, {returning.customer_name}!</strong>
                    <span className="sub">{returning.booking_count} previous {returning.booking_count===1?'booking':'bookings'}{lastSportName?` · Last played ${lastSportName}`:''}</span>
                  </div>
                </div>
              )}
              {returning && returning.pass && !passCovered && (
                <div className="return-banner anim-rise-fast" style={{borderColor:'rgba(var(--lime-rgb),.5)'}}>
                  <span className="return-emoji">🎟️</span>
                  <div className="return-text">
                    <strong>{returning.pass.plan_label} on this number</strong>
                    <span className="sub">
                      {returning.pass.hours_left !== null ? `${returning.pass.hours_left} of ${returning.pass.hours_quota} hrs left · ` : ''}valid till {dateNice(returning.pass.end_date)}
                      {quote && quote.pass_reason ? ` · ${quote.pass_reason}` : ''}
                    </span>
                  </div>
                </div>
              )}
              <div className="form-field">
                <label className="form-label">Phone *</label>
                <input type="tel" className="form-input" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="98765 43210" maxLength={15} autoComplete="tel"/>
                <div className="field-hint">10 digits, with or without country code</div>
              </div>
              <div className="form-field">
                <label className="form-label">Name *</label>
                <input type="text" className="form-input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Your full name" autoComplete="name"/>
              </div>
              <div className="form-field">
                <label className="form-label">Email * <span style={{ textTransform:'none', letterSpacing:0, fontWeight:500, color:'var(--text-3)' }}>(for booking confirmation)</span></label>
                <input type="email" className="form-input" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="you@example.com" autoComplete="email" required/>
                {!isValidEmail(form.email) && form.email && <div className="field-hint" style={{color:'var(--danger)'}}>Looks like an invalid email</div>}
                {!form.email && <div className="field-hint">Required — we'll send your booking ID and venue details here</div>}
              </div>
              <div className="form-field">
                <label className="form-label">Players</label>
                <input type="number" className="form-input" value={form.members} onChange={e=>setForm({...form,members:e.target.value})} min={1} max={30}/>
              </div>
              <div className="form-field span-2">
                <label className="form-label">Notes (optional)</label>
                <input type="text" className="form-input" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Team name, special equipment, anything we should know…"/>
              </div>
            </div>
            {passCovered && (
              <div className="pass-box anim-pop" style={{marginTop:22}}>
                <span className="ic">🎟️</span>
                <div>
                  <strong>Paid from your pass</strong>
                  <span>{inr(quote.pass_value || quote.total)} deducted from {quote.pass.plan_label} · {quote.pass.hours_left !== null ? `${quote.pass.hours_left} hr${quote.pass.hours_left===1?'':'s'} left · ` : ''}{inr(quote.pass.value_left)} advance left · nothing to pay now, GST bill emailed.</span>
                </div>
              </div>
            )}
            {online && !passCovered && (
              <div style={{marginTop:22}}>
                {coupon ? (
                  <div className="coupon-applied">
                    <span>Coupon <strong>{coupon}</strong> applied{quote && quote.discount ? ` · you save ${inr(quote.discount)}` : ''}</span>
                    <button onClick={removeCoupon}>Remove</button>
                  </div>
                ) : (
                  <>
                    <div className="coupon-row">
                      <input className="form-input" value={couponInput} onChange={e=>{ setCouponInput(e.target.value); setCouponErr(null); }}
                        onKeyDown={e=>e.key==='Enter' && applyCoupon()} placeholder="Coupon code" maxLength={20} aria-label="Coupon code"/>
                      <button className="coupon-btn" onClick={applyCoupon} disabled={couponBusy || !couponInput.trim()}>{couponBusy ? 'Checking…' : 'Apply'}</button>
                    </div>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',margin:'-6px 0 14px',gap:10,flexWrap:'wrap'}}>
                      <button className="acct-link" onClick={()=>setOffersOpen(true)}>🎉 See all offers{coupons && coupons.length ? ` (${coupons.length})` : ''}</button>
                      {coupons && coupons.length > 0 && <span style={{fontSize:12,color:'var(--text-3)'}}>Best: <b style={{color:'var(--lime)'}}>{coupons[0].code}</b> · {couponOff(coupons[0])}</span>}
                    </div>
                  </>
                )}
                {offersOpen && <CouponsModal coupons={coupons} onClose={()=>setOffersOpen(false)} onUse={code=>{ setCouponInput(code); setCouponErr(null); setTimeout(()=>{ const c = code.trim().toUpperCase(); if (normalizePhone(form.phone).length === 10) { setCouponBusy(true); fetchQuote(c).then(()=>setCoupon(c)).catch(e=>setCouponErr(e.message)).finally(()=>setCouponBusy(false)); } }, 0); }}/>}
                {couponErr && <div className="coupon-err">{couponErr}</div>}
                <div className="pay-box">
                  {!quote ? <div style={{textAlign:'center',padding:8}}><Spinner small/></div> : <>
                    {quote.discount > 0 && <div className="pay-row"><span>Booking total</span><strong>{inr(quote.total)}</strong></div>}
                    {quote.discount > 0 && <div className="pay-row"><span>Coupon {quote.coupon_code}</span><strong className="disc">− {inr(quote.discount)}</strong></div>}
                    <div className="pay-row total"><span>Total (incl. GST)</span><strong>{inr(quote.net)}</strong></div>
                    <div className="pay-row now"><span>Pay now to confirm</span><strong>{inr(quote.advance)}</strong></div>
                    <div className="pay-row"><span>Pay at venue</span><strong>{inr(quote.balance)}</strong></div>
                    <div className="pay-gst">Includes GST @ {quote.gst_rate}% ({inr(quote.gst)}). GST invoice emailed after payment.</div>
                  </>}
                </div>
              </div>
            )}
            <div className="submit-row">
              {online && !passCovered && (
                <label className="policy-check">
                  <input type="checkbox" checked={agree} onChange={e=>setAgree(e.target.checked)}/>
                  <span>I agree to the <a href="#policies" onClick={e=>{e.preventDefault();document.getElementById('policies')?.scrollIntoView({behavior:'smooth'});}}>cancellation policy</a>: free cancellation up to {payCfg.refund_cutoff_hours} hours before the slot; the advance is non-refundable after that.</span>
                </label>
              )}
              <button className="btn-submit" onClick={submit} disabled={!canBook || submitting}>
                {submitting
                  ? <><Spinner small/> {online && !passCovered ? 'Processing payment…' : 'Booking…'}</>
                  : passCovered
                    ? <>Confirm with pass · {durationText(sport, effectiveDuration)} <span>→</span></>
                  : online
                    ? <>Pay {quote ? inr(quote.advance) : ''} & confirm <span>→</span></>
                    : <>Lock in {durationText(sport, effectiveDuration)} · {displayTotal(effectiveDuration)} <span>→</span></>}
              </button>
              {passCovered
                ? <div className="submit-note">🎟️ Deducted from your pass — no payment at the venue. A GST invoice is emailed for every booking.</div>
                : online
                ? <div className="secure-note">Secured by Razorpay · UPI, cards, netbanking, wallets</div>
                : <div className="submit-note">💰 Pay at the venue — cash or UPI. Cancel anytime by calling us.</div>}
              {payInfo && <div className={`pay-status ${payInfo.kind}`}>{payInfo.text}</div>}
            </div>
          </div>
        )}
        {error && <div style={{marginTop:16,background:'rgba(239,68,68,.1)',border:'1px solid var(--danger)',borderRadius:12,padding:'12px 16px',fontSize:13,color:'#fca5a5'}}>⚠ {error}</div>}
      </div>
    </section>
  );
}

            ? <div><strong>{Number(booking.balance_due) > 0 ? `Pay ${inr(booking.balance_due)} at the venue` : 'Fully paid'}</strong>{Number(booking.balance_due) > 0 ? 'Cash or UPI on arrival. Your advance is received.' : 'Nothing more to pay.'}</div>
            : <div><strong>Pay at the venue</strong>Cash or UPI accepted on arrival.</div>}

        <div className="ticket-actions">
          <a className="ticket-btn" href={VENUE.maps} target="_blank" rel="noopener">📍 Get directions</a>

          <a className="ticket-btn" href={`tel:${VENUE.phone.replace(/\s/g,'')}`}>📞 Call venue</a>
          <button className="ticket-btn" onClick={copyShare}>{copied?'✓ Copied!':'📤 Share details'}</button>

function ManageBooking({ id, token, onDone, account, onAccount }){
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [confirming, setConfirming] = useState(false);
  const [result, setResult] = useState(null);

  async function load(){
    setErr(null);
    try { setData(await API.get('getManagedBooking', { id, t: token })); }
    catch(e){ setErr(e.message); }
  }
  useEffect(()=>{ load(); }, [id, token]);

  async function cancel(){
    setBusy(true);
    try { const r = await API.post('cancelMyBooking', { id, t: token }); setResult(r); setConfirming(false); load(); }
    catch(e){ setErr(e.message); setConfirming(false); }
    finally { setBusy(false); }
  }

  const b = data && data.booking;
  const t = data && data.terms;
  const sm = data && data.sport_meta;
  const timeText = b ? (sm && sm.pricing_mode === 'session' ? `${startTime12(b.slot_time)} · ${sm.session_qty * (b.duration_hrs||1)} ${sm.session_unit}` : slotRange12(b.slot_time)) : '';
  const statusText = b ? ({ confirmed:'Confirmed', cancelled:'Cancelled', pending_payment:'Awaiting payment', expired:'Not completed' }[b.status] || b.status) : '';
  return (
    <section className="section" id="book" style={{paddingTop:120}}>
      <div className="section-head" style={{textAlign:'center'}}>
        <span className="section-eyebrow">Your booking</span>
        <h2 className="section-h2">Manage<br/><span className="lime">booking.</span></h2>
      </div>
      <div className="manage-card anim-rise">
        {!data && !err && <div className="loading-block"><Spinner/></div>}
        {err && !data && <div className="empty-block"><div className="empty-title">Couldn't open this booking</div><div style={{fontSize:13}}>{err}</div></div>}
        {b && <>
          <div className="ticket-row"><span className="ticket-label">Booking ID</span><span className="ticket-value mono">{b.booking_id}</span></div>
          <div className="ticket-row"><span className="ticket-label">Status</span><span className="ticket-value" style={{color: b.status==='confirmed' ? 'var(--lime)' : '#fca5a5'}}>{statusText}</span></div>
          <div className="ticket-row"><span className="ticket-label">Sport</span><span className="ticket-value">{data.sport_name}</span></div>
          <div className="ticket-row"><span className="ticket-label">Date</span><span className="ticket-value">{dateLong(b.booking_date)}</span></div>
          <div className="ticket-row"><span className="ticket-label">Time</span><span className="ticket-value">{timeText}</span></div>
          {b.payment_mode === 'pass'
            ? <><div className="ticket-row"><span className="ticket-label">Total (incl. GST)</span><span className="ticket-value">{inr(b.amount)}</span></div><div className="ticket-row"><span className="ticket-label">Payment</span><span className="ticket-value lime">Paid from your pass</span></div></>
            : <div className="ticket-row"><span className="ticket-label">Total (incl. GST)</span><span className="ticket-value">{inr(b.amount)}</span></div>}

                  {t.refund > 0 ? `Cancel now and get ${inr(t.refund)} back.` : `This is within ${t.cutoff_hours} hours of your slot, so the advance can't be refunded.`}
                </div>
                <button className="btn-danger" onClick={()=>setConfirming(true)}>Cancel booking</button>

            {confirming && (
              <div className="pay-status err" style={{textAlign:'center'}}>

            )}
            {t && !t.can_cancel && b.status === 'confirmed' && <div className="field-hint" style={{textAlign:'center'}}>{t.reason} Call {VENUE.phone} for help.</div>}

        </>}

        <button className="btn-secondary" onClick={onAccount}>👤 {account ? 'My account' : 'See all my bookings'}</button>
      </div>
    </section>
  );
}

function planCovers(p){ return p.category === 'turf' ? 'Cricket · Football · Volleyball' : p.category === 'net' ? 'Cricket net practice' : 'Badminton'; }
function planBullets(p){
  const b = [];
  b.push(`${p.days} days validity`);
  b.push(p.hours_quota ? `${p.hours_quota} hours included` : 'Unlimited hours during validity');
  b.push(planCovers(p));
  if (p.day_rule === 'weekday') b.push('Weekdays only (Mon–Fri)');
  if (p.day_rule === 'weekend') b.push('Weekends only (Sat–Sun)');
  if (p.max_members) b.push(`Team pass · up to ${p.max_members} players`);
  b.push('Bookings deducted from the pass — nothing to pay at the venue');
  return b;
}

function PassBuyModal({ plan, payCfg, onClose, onDone, account }){
  const [form, setForm] = useState({ name: (account && account.name) || '', phone:'', email: (account && account.email) || '', team:'', start: formatDateISO(new Date()) });
  const [agree, setAgree] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [info, setInfo] = useState(null);
  const [result, setResult] = useState(null);
  useEffect(()=>{ const h = e => e.key === 'Escape' && !busy && onClose(); window.addEventListener('keydown', h); return ()=>window.removeEventListener('keydown', h); }, [busy]);
  useEffect(()=>{ loadRazorpay().catch(()=>{}); }, []);
  const next15 = useMemo(()=>getNext15Days(),[]);
  const phoneOk = normalizePhone(form.phone).length === 10;
  const canPay = form.name.trim() && phoneOk && isValidEmail(form.email) && agree && !busy;
  const endDate = (() => { const d = new Date(form.start + 'T00:00:00'); d.setDate(d.getDate() + plan.days); return formatDateISO(d); })();

  async function pay(){
    if (!canPay) return;
    setBusy(true); setErr(null); setInfo(null);
    let order;
    try {
      await loadRazorpay();
      order = await API.post('createPassOrder', { plan_key: plan.key, customer_name: form.name.trim(), phone: normalizePhone(form.phone), email: form.email.trim(), team_name: form.team.trim(), start_date: form.start });
    } catch(e){ setBusy(false); setErr(e.message); return; }
    let settled = false;
    const finish = r => { settled = true; setResult(r); setBusy(false); onDone && onDone(r); };
    const poll = async () => {
      setInfo('Confirming your payment with the bank… please keep this page open.');
      for (let i = 0; i < 40 && !settled; i++) {
        await sleep(3000);
        try { const st = await API.get('getPassPaymentStatus', { member_id: order.member_id, order_id: order.order_id }); if (st.status === 'active') return finish({ status:'active', pass: st.pass }); } catch(_) {}
      }
      if (!settled) { setBusy(false); setInfo(`We haven't received confirmation yet. If money was deducted, your pass activates automatically and you'll get an email. Ref: ${order.member_id}`); }
    };
    const rz = new window.Razorpay({
      key: order.key_id, order_id: order.order_id, amount: order.amount, currency: order.currency,
      name: order.name, description: order.description, image: 'https://hitnrunarena.in/logo.jpeg',
      prefill: order.prefill, notes: { member_id: order.member_id, kind: 'pass' }, theme: { color: '#c4f000' }, timeout: order.timeout,
      retry: { enabled: true, max_count: 3 },
      handler: async resp => {
        setInfo('Payment received. Activating your pass…');
        try { const r = await API.post('verifyPassPayment', { ...resp }); if (r.status === 'active') return finish(r); poll(); }
        catch(e){ if (e.code === 'NOT_CAPTURED') return poll(); setBusy(false); setErr(e.message + ` (ref ${order.member_id})`); }
      },
      modal: { confirm_close: true, ondismiss: async () => { if (settled) return; setBusy(false); setErr('Payment cancelled. No pass was issued.'); try { await API.post('abandonPassOrder', { member_id: order.member_id, order_id: order.order_id }); } catch(_) {} } }
    });
    rz.on('payment.failed', r => setErr(((r && r.error && (r.error.description || r.error.reason)) || 'Payment failed') + '. You can try again with another method.'));
    rz.open();
  }

  const m = result && result.pass;
  return (
    <div className="acct-backdrop" onClick={e=>e.target===e.currentTarget && !busy && onClose()}>
      <div className="acct-modal" role="dialog" aria-label="Buy pass">
        <div className="acct-head">
          <div>
            <div className="acct-title">{m ? 'Pass active' : 'Buy a pass'}</div>
            <div className="acct-sub">{m ? `Your ${m.plan_label} is live. A receipt is on its way to ${form.email}.` : `${plan.label} · ₹${Number(plan.price).toLocaleString('en-IN')} · ${plan.days} days`}</div>
          </div>
          {!busy && <button className="cp-x" onClick={onClose} aria-label="Close">×</button>}
        </div>
        {m ? (
          <div>
            <div className="ticket-check pulse-glow" style={{display:'grid',margin:'6px auto 18px'}}>✓</div>
            <div className="pass-card">
              <div className="pt">🎟️ {m.plan_label}</div>
              <div className="ps">Pass ID <span className="mono">{m.member_id}</span> · valid {dateNice(m.start_date)} → {dateNice(m.end_date)}{m.day_rule !== 'all' ? ` · ${m.day_rule}s only` : ''}</div>
              <div className="pass-nums" style={{marginTop:10}}><span><b>{m.hours_quota ? `${m.hours_quota} hrs` : 'Unlimited hours'}</b></span><span><b>{m.days_left}</b> days left</span></div>
            </div>
            <div className="buy-summary">
              <div><b>How to use:</b> book any slot on this site with <b>{normalizePhone(form.phone)}</b> — it's deducted from your pass and needs no payment. Walk-ins at the counter work the same way.</div>
              <div>Days and hours left are always in <b>My Account</b>.</div>
            </div>
            <button className="btn-submit" onClick={()=>{ onClose(); document.getElementById('book')?.scrollIntoView({behavior:'smooth'}); }}>Book my first slot <span>→</span></button>
          </div>
        ) : (
          <div>
            <div className="form-grid">
              <div className="form-field">
                <label className="form-label">Phone * <span style={{textTransform:'none',letterSpacing:0,fontWeight:500,color:'var(--text-3)'}}>(the pass is linked to this)</span></label>
                <input type="tel" className="form-input" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="98765 43210" maxLength={15} autoComplete="tel"/>
              </div>
              <div className="form-field">
                <label className="form-label">Name *</label>
                <input className="form-input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Your full name" autoComplete="name"/>
              </div>
              <div className="form-field">
                <label className="form-label">Email * <span style={{textTransform:'none',letterSpacing:0,fontWeight:500,color:'var(--text-3)'}}>(receipt)</span></label>
                <input type="email" className="form-input" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="you@example.com" autoComplete="email"/>
              </div>
              <div className="form-field">
                <label className="form-label">Start from</label>
                <select className="form-input" value={form.start} onChange={e=>setForm({...form,start:e.target.value})}>
                  {next15.map(d => <option key={d.iso} value={d.iso}>{d.label === 'Today' || d.label === 'Tomorrow' ? d.label : dateNice(d.iso)}</option>)}
                </select>
              </div>
              {plan.max_members > 0 && (
                <div className="form-field span-2">
                  <label className="form-label">Team name</label>
                  <input className="form-input" value={form.team} onChange={e=>setForm({...form,team:e.target.value})} placeholder="e.g. Eagles XI"/>
                </div>
              )}
            </div>
            <div className="buy-summary">
              <div><b>{plan.label}</b> · {planCovers(plan)}</div>
              <div>Valid <b>{dateNice(form.start)}</b> → <b>{dateNice(endDate)}</b> · {plan.hours_quota ? `${plan.hours_quota} hours` : 'unlimited hours'}{plan.day_rule !== 'all' ? ` · ${plan.day_rule}s only` : ''}</div>
              <div style={{fontSize:16}}>Pay now: <b style={{color:'var(--lime)',fontFamily:'var(--display)',fontSize:22,letterSpacing:'.02em'}}>₹{Number(plan.price).toLocaleString('en-IN')}</b> <span style={{fontSize:11,color:'var(--text-3)'}}>incl. GST</span></div>
            </div>
            <label className="policy-check">
              <input type="checkbox" checked={agree} onChange={e=>setAgree(e.target.checked)}/>
              <span>I understand the pass is non-refundable, non-transferable, valid for the dates above on the phone number entered, and subject to slot availability.</span>
            </label>
            {err && <div className="pay-status err">{err}</div>}
            {info && <div className="pay-status info">{info}</div>}
            <button className="btn-submit" style={{marginTop:14}} onClick={pay} disabled={!canPay}>{busy ? <><Spinner small/> Processing…</> : <>Pay ₹{Number(plan.price).toLocaleString('en-IN')} &amp; activate <span>→</span></>}</button>
            <div className="secure-note">Secured by Razorpay · UPI, cards, netbanking, wallets</div>
          </div>
        )}
      </div>
    </div>
  );

// Optional: booking never requires signing in.

function OtpInput({ value, onChange, onComplete, disabled }){
  const refs = useRef([]);
  const digits = Array.from({ length: 6 }, (_, i) => value[i] || '');
  function set(i, ch){
    const next = digits.slice(); next[i] = ch;
    const v = next.join('').slice(0, 6);
    onChange(v);
    if (ch && i < 5) refs.current[i + 1]?.focus();
    if (v.replace(/\D/g, '').length === 6) onComplete && onComplete(v);
  }
  function onKey(e, i){
    if (e.key === 'Backspace' && !digits[i] && i > 0) { refs.current[i - 1]?.focus(); }
    if (e.key === 'ArrowLeft' && i > 0) refs.current[i - 1]?.focus();
    if (e.key === 'ArrowRight' && i < 5) refs.current[i + 1]?.focus();
  }
  function onPaste(e){
    const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
    if (t.length) { e.preventDefault(); onChange(t); refs.current[Math.min(5, t.length - 1)]?.focus(); if (t.length === 6) onComplete && onComplete(t); }
  }
  return (
    <div className="otp-row" onPaste={onPaste}>
      {digits.map((d, i) => (
        <input key={i} ref={el => refs.current[i] = el} className={`otp-box ${d?'filled':''}`} inputMode="numeric" pattern="[0-9]*" maxLength={1}
          value={d} disabled={disabled} autoFocus={i === 0}
          onChange={e => set(i, e.target.value.replace(/\D/g, '').slice(-1))}
          onKeyDown={e => onKey(e, i)} aria-label={`Digit ${i + 1}`}/>
      ))}
    </div>
  );
}

function AccountModal({ account, onLogin, onLogout, onClose, onManage }){
  const [step, setStep] = useState(account ? 'account' : 'email');
  const [email, setEmail] = useState(account ? account.email : '');
  const [code, setCode] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [resendIn, setResendIn] = useState(0);
  const [data, setData] = useState(null);
  const [tab, setTab] = useState('upcoming');
  const [shake, setShake] = useState(false);

  useEffect(()=>{ if (!resendIn) return; const t = setTimeout(()=>setResendIn(n => n - 1), 1000); return ()=>clearTimeout(t); }, [resendIn]);
  useEffect(()=>{ const h = e => e.key === 'Escape' && onClose(); window.addEventListener('keydown', h); return ()=>window.removeEventListener('keydown', h); }, []);

  async function load(tok){
    setErr(null);
    try {
      const d = await API.get('getMyAccount', { token: tok });
      setData(d);
      if (d.profile && d.profile.name && (!account || account.name !== d.profile.name)) onLogin({ ...(account || {}), token: tok, email: d.email, expires_at: d.session_expires_at, name: d.profile.name }, true);
      if (!d.upcoming.length && (d.passes.length || d.past.length)) setTab(d.passes.some(p => p.is_active) ? 'passes' : 'past');
    } catch(e){
      if (e.code === 'SESSION_EXPIRED') { onLogout(); setStep('email'); setErr('Your session expired. Sign in again.'); }
      else setErr(e.message);
    }
  }
  useEffect(()=>{ if (account && step === 'account') load(account.token); }, []);

  async function sendCode(){
    const e = email.trim().toLowerCase();
    if (!isValidEmail(e)) { setErr('Enter a valid email address.'); return; }
    setBusy(true); setErr(null);
    try {
      const r = await API.post('requestAccountOtp', { email: e });
      setEmail(e); setCode(''); setStep('code'); setResendIn(r.resend_in || 45);
    } catch(ex){
      if (ex.code === 'TOO_SOON') { setStep('code'); setErr(ex.message); const m = /(\d+)s/.exec(ex.message); setResendIn(m ? +m[1] : 30); }
      else setErr(ex.message);
    } finally { setBusy(false); }
  }
  async function verify(v){
    const c = (v || code).replace(/\D/g, '');
    if (c.length !== 6 || busy) return;
    setBusy(true); setErr(null);
    try {
      const r = await API.post('verifyAccountOtp', { email, code: c });
      const acct = { token: r.token, email: r.email, expires_at: r.expires_at, name: null };
      onLogin(acct);
      setStep('account');
      await load(r.token);
    } catch(ex){
      setErr(ex.message); setShake(true); setTimeout(()=>setShake(false), 600);
      if (ex.code === 'OTP_EXPIRED' || ex.code === 'OTP_LOCKED') { setCode(''); }
    } finally { setBusy(false); }
  }

  const p = data && data.profile;
  const initial = ((p && p.name ? p.name : email) || '?').trim().charAt(0).toUpperCase() || '?';
  const list = data ? (tab === 'upcoming' ? data.upcoming : tab === 'past' ? data.past : []) : [];

  function BookingCard({ b }){
    const d = new Date(b.booking_date + 'T00:00:00');
    const when = b.pricing_mode === 'session' ? `${startTime12(b.slot_time)} · ${b.session_qty * b.duration_hrs} ${b.session_unit}` : slotRange12(b.slot_time);
    const cls = b.status === 'confirmed' ? 'ok' : b.status === 'cancelled' ? 'bad' : 'warn';
    return (
      <div className={`bk-card ${b.status === 'cancelled' ? 'cancelled' : ''}`}>
        <div className="bk-date"><div className="d">{d.getDate()}</div><div className="m">{d.toLocaleDateString('en-IN',{month:'short'})}</div></div>
        <div className="bk-main">
          <div className="t">{b.icon} {b.sport_name}</div>
          <div className="s">{d.toLocaleDateString('en-IN',{weekday:'short'})} · {when}{b.duration_hrs > 1 && b.pricing_mode !== 'session' ? ` · ${b.duration_hrs} hrs` : ''} · <span className="mono">{b.booking_id}</span></div>
          <div className="tags">
            <span className={`tag ${cls}`}>{b.status_label}</span>
            {b.on_pass ? <span className="tag pass">Paid from pass</span>
              : b.status === 'confirmed' && (b.payment_status === 'paid' ? <span className="tag ok">Paid</span> : b.balance_due > 0 ? <span className="tag warn">Pay {inr(b.balance_due)} at venue</span> : null)}
            {b.refund_amount > 0 && <span className="tag">{inr(b.refund_amount)} refund {b.refund_status === 'processed' ? 'done' : 'in progress'}</span>}
          </div>
        </div>
        <div className="bk-amt"><div className="a">{inr(b.amount)}</div><div className="l">{b.on_pass ? 'from pass' : b.status === 'confirmed' ? 'total' : 'amount'}</div></div>
        {(b.status === 'confirmed' || b.invoice_url) && (
          <div className="bk-actions">
            {b.status === 'confirmed' && b.manage_url && <button onClick={()=>onManage(b.manage_url)}>{b.can_cancel ? '⚙️ Manage / cancel' : '⚙️ View booking'}</button>}
            {b.invoice_url && <a href={b.invoice_url} target="_blank" rel="noopener">🧾 Invoice</a>}
            {b.status === 'confirmed' && <a href={buildCalendarLink({ ...b, amount: b.amount })} target="_blank" rel="noopener">📅 Calendar</a>}
            {b.status === 'confirmed' && <a href={VENUE.maps} target="_blank" rel="noopener">📍 Directions</a>}
          </div>
        )}
      </div>
    );
  }

  function PassCard({ m }){
    const used = m.hours_quota ? Math.min(100, Math.round(100 * m.hours_used / m.hours_quota)) : 0;
    const daysPct = m.days_total ? Math.min(100, Math.round(100 * (m.days_total - m.days_left) / m.days_total)) : 0;
    return (
      <div className={`pass-card ${m.is_active ? '' : 'off'}`}>
        <div className="pt">🎟️ {m.plan_label}</div>
        <div className="ps">
          <span className="mono">{m.member_id}</span> · {m.team_name && m.team_name !== m.contact_name ? `${m.team_name} · ` : ''}{m.contact_phone ? `${m.contact_phone} · ` : ''}
          {m.is_active ? `${dateNice(m.start_date)} → ${dateNice(m.end_date)}` : m.status === 'cancelled' ? 'Cancelled' : m.is_expired ? `Expired ${dateNice(m.end_date)}` : `Starts ${dateNice(m.start_date)}`}
          {m.day_rule !== 'all' ? ` · ${m.day_rule}s only` : ''} · covers {m.category === 'turf' ? 'turf sports' : m.category === 'net' ? 'net practice' : m.category}
        </div>
        {m.hours_quota ? <>
          <div className="pass-bar"><i style={{width: used + '%'}}/></div>
          <div className="pass-nums"><span><b>{m.hours_left}</b> of {m.hours_quota} hrs left</span><span>{m.hours_used} used</span></div>
        </> : <div className="pass-nums" style={{marginTop:10}}><span><b>Unlimited</b> hours during validity</span></div>}
        {m.is_active && <>
          <div className="pass-bar" style={{marginTop:10,height:5}}><i style={{width: daysPct + '%', background:'linear-gradient(90deg,var(--text-3),var(--text-2))'}}/></div>
          <div className="pass-nums"><span><b>{m.days_left}</b> day{m.days_left===1?'':'s'} left</span><span>{dateNice(m.end_date)}</span></div>
          <div className="buy-summary" style={{margin:'12px 0 0',padding:'10px 12px'}}>
            <div>Advance paid <b>{inr(m.amount_paid)}</b>{m.source === 'online' ? ' (online)' : ''} · used <b>{inr(m.value_used)}</b> · left <b style={{color:'var(--lime)'}}>{inr(m.value_left)}</b></div>
            <div style={{fontSize:11.5,color:'var(--text-3)'}}>Every booking is deducted at its normal price and gets its own GST invoice (in History).</div>
          </div>
        </>}
        {m.is_active && m.hours_quota && m.hours_left === 0 && <div className="pay-status err" style={{marginTop:10,padding:'8px 12px',fontSize:12}}>All hours used — bookings on this number are charged normally until you renew.</div>}
      </div>
    );
  }

  return (
    <div className="acct-backdrop" onClick={e=>e.target===e.currentTarget && onClose()}>
      <div className={`acct-modal ${step === 'account' ? 'wide' : ''} ${shake ? 'shake' : ''}`} role="dialog" aria-label="My account">
        <div className="acct-head">
          <div>
            <div className="acct-title">{step === 'account' ? 'My Account' : step === 'code' ? 'Check your inbox' : 'My Account'}</div>
            <div className="acct-sub">
              {step === 'email' && 'See your bookings, passes and invoices. We\'ll email you a one-time code — no password needed.'}
              {step === 'code' && <>We sent a 6-digit code to <strong style={{color:'var(--text)'}}>{email}</strong>. It's valid for 10 minutes.</>}
              {step === 'account' && 'Your bookings and passes, all in one place.'}
            </div>
          </div>
          <button className="cp-x" onClick={onClose} aria-label="Close">×</button>
        </div>

        {step === 'email' && (
          <div>
            <label className="form-label">Email address</label>
            <input className="form-input" type="email" value={email} autoFocus onChange={e=>{ setEmail(e.target.value); setErr(null); }} onKeyDown={e=>e.key==='Enter' && sendCode()} placeholder="you@example.com" autoComplete="email"/>
            <div className="field-hint">Use the email you booked with.</div>
            {err && <div className="pay-status err">{err}</div>}
            <button className="btn-submit" style={{marginTop:18}} onClick={sendCode} disabled={busy || !email.trim()}>{busy ? <><Spinner small/> Sending…</> : <>Send me a code <span>→</span></>}</button>
            <div className="submit-note" style={{marginTop:12}}>Booking a slot doesn't need an account. This is just to look things up.</div>
          </div>
        )}

        {step === 'code' && (
          <div>
            <OtpInput value={code} onChange={v=>{ setCode(v); setErr(null); }} onComplete={verify} disabled={busy}/>
            {err && <div className="pay-status err" style={{textAlign:'center'}}>{err}</div>}
            <button className="btn-submit" style={{marginTop:14}} onClick={()=>verify()} disabled={busy || code.replace(/\D/g,'').length !== 6}>{busy ? <><Spinner small/> Checking…</> : <>Sign in <span>→</span></>}</button>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:14,gap:10,flexWrap:'wrap'}}>
              <button className="acct-link" onClick={()=>{ setStep('email'); setErr(null); setCode(''); }}>← Change email</button>
              <button className="acct-link" onClick={sendCode} disabled={busy || resendIn > 0}>{resendIn > 0 ? `Resend in ${resendIn}s` : 'Resend code'}</button>
            </div>
            <div className="submit-note" style={{marginTop:14}}>Can't find it? Check spam, or that it's the email you booked with.</div>
          </div>
        )}

        {step === 'account' && (
          <div>
            <div className="acct-profile">
              <div className="acct-avatar">{initial}</div>
              <div style={{flex:1,minWidth:0}}>
                <div className="acct-name">{p && p.name ? p.name : 'Player'}</div>
                <div className="acct-meta">{email}{p && p.phone ? ` · ${p.phone}` : ''}{p ? ` · ${p.bookings_count} booking${p.bookings_count===1?'':'s'}` : ''}</div>
              </div>
              <button className="acct-link" onClick={()=>{ onLogout(); onClose(); }}>Sign out</button>
            </div>
            {!data && !err && <div className="loading-block"><Spinner/><div style={{marginTop:14,fontSize:13,color:'var(--text-2)'}}>Fetching your bookings…</div></div>}
            {err && !data && <div className="pay-status err">{err}</div>}
            {data && <>
              <div className="acct-tabs">
                <button className={`acct-tab ${tab==='upcoming'?'active':''}`} onClick={()=>setTab('upcoming')}>Upcoming<b>{data.upcoming.length}</b></button>
                <button className={`acct-tab ${tab==='passes'?'active':''}`} onClick={()=>setTab('passes')}>Passes<b>{data.passes.length}</b></button>
                <button className={`acct-tab ${tab==='past'?'active':''}`} onClick={()=>setTab('past')}>History<b>{data.past.length}</b></button>
              </div>
              {tab === 'passes' && (data.passes.length ? data.passes.map(m => <PassCard key={m.member_id} m={m}/>) : (
                <div className="empty-block"><div className="ic">🎟️</div><div className="empty-title">No passes yet</div><div style={{fontSize:13,marginBottom:14}}>Weekly and monthly passes make every booking ₹0. Buy one online or at the venue.</div><button className="btn-cta" onClick={()=>{ onClose(); document.getElementById('passes')?.scrollIntoView({behavior:'smooth'}); }}>See passes</button></div>
              ))}
              {tab !== 'passes' && (list.length ? list.map((b, i) => <div key={b.booking_id} style={{animationDelay:`${i*40}ms`}}><BookingCard b={b}/></div>) : (
                <div className="empty-block"><div className="ic">{tab==='upcoming'?'🗓️':'📭'}</div><div className="empty-title">{tab==='upcoming'?'Nothing booked yet':'No past bookings'}</div>
                  <div style={{fontSize:13,marginBottom:tab==='upcoming'?16:0}}>{tab==='upcoming' ? 'Pick a slot and we\'ll see you on the ground.' : `Bookings made with ${email} will show up here.`}</div>
                  {tab==='upcoming' && <button className="btn-cta" onClick={()=>{ onClose(); document.getElementById('book')?.scrollIntoView({behavior:'smooth'}); }}>Book a slot</button>}
                </div>
              ))}
            </>}
          </div>
        )}
      </div>
    </div>
  );
}


class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state = { error: null }; }
  static getDerivedStateFromError(e){ return { error: e }; }
  componentDidCatch(e, i){ console.error('Crash:', e, i); }
  render(){
    if (this.state.error) {
      return (
        <div className="config-err">
          <div style={{maxWidth:520,textAlign:'center'}}>
            <div style={{fontSize:48,marginBottom:16}}>⚠️</div>
            <div style={{fontFamily:'var(--display)',fontSize:24,marginBottom:10}}>Something broke</div>
            <div style={{fontSize:13,color:'var(--text-2)',lineHeight:1.7,marginBottom:18}}>Please refresh the page. If it persists, share the error below.</div>
            <pre style={{background:'var(--surface)',padding:'12px 14px',borderRadius:10,fontSize:12,color:'var(--lime)',border:'1px solid var(--border)',overflowX:'auto',maxHeight:200,textAlign:'left'}}>{String(this.state.error?.message || this.state.error)}</pre>
            <button onClick={()=>location.reload()} style={{marginTop:18,padding:'10px 24px',background:'var(--lime)',color:'#000',border:'none',borderRadius:8,fontSize:13,fontWeight:800,cursor:'pointer'}}>Reload</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function App(){
  const [booking, setBooking] = useState(null);
  const [liveSlotsToday, setLiveSlotsToday] = useState(null);
  const [toast, setToast] = useState({ show:false });
  const [sports, setSports] = useState(null);         // null = loading
  const [sportsError, setSportsError] = useState(null);
  const [payCfg, setPayCfg] = useState(null);         // getVenueInfo().payments
  const [coupons, setCoupons] = useState([]);         // listPublicCoupons
  const [manage, setManage] = useState(() => {
    const q = new URLSearchParams(location.search);
    return q.get('manage') && q.get('t') ? { id: q.get('manage'), t: q.get('t') } : null;
  });
  const [account, setAccount] = useState(loadAccount);
  const [acctOpen, setAcctOpen] = useState(() => new URLSearchParams(location.search).get('account') === '1');
  const [ready, setReady] = useState(false);        // preloader
  const [plans, setPlans] = useState([]);            // listPassPlansPublic
  const [buyPlan, setBuyPlan] = useState(null);
  const [helpCtx, setHelpCtx] = useState(null);
  useReveal([booking, manage, sports]);

  async function loadSports(){
    setSportsError(null); setSports(null);
    try { setSports(await API.get('getSports') || []); }
    catch(e){ setSportsError(e.message || 'Request failed'); }
  }

  // Hours today where at least one sport can still be booked
  const refreshSlotCount = async (fresh) => {
    try {
      const d = await loadAvailability(formatDateISO(new Date()), fresh);
      const open = new Set();
      d.sports.forEach(s => s.hours.forEach(h => { if (h.available > 0) open.add(h.slot_time); }));
      setLiveSlotsToday(open.size);
    } catch(_) { setLiveSlotsToday(0); }
  };

  useEffect(()=>{
    const t0 = Date.now();
    const done = Promise.allSettled([loadSports(), refreshSlotCount(),
      API.get('getVenueInfo').then(v => setPayCfg(v.payments || { online:false }), () => setPayCfg({ online:false }))]);
    API.get('listPublicCoupons').then(c => setCoupons(Array.isArray(c) ? c : []), () => {});
    API.get('listPassPlansPublic').then(p => setPlans(Array.isArray(p) ? p : []), () => {});
    const hc = e => setHelpCtx(e.detail);
    window.addEventListener('hnr-help-context', hc);
    // Preloader: wait for the first data, but never longer than ~3.5s and never shorter than the warm-up animation
    const fallback = sleep(3500);
    Promise.race([done, fallback]).then(() => sleep(Math.max(0, PRELOAD_MIN_MS - (Date.now() - t0)))).then(() => setReady(true));
  }, []);

  function login(a, silent){ setAccount(a); saveAccount(a); if (!silent) setToast({ show:true, message:'Signed in', icon:'👤' }); }
  function logout(){ setAccount(null); saveAccount(null); }
  function openManageFromAccount(url){
    const q = new URL(url, location.href).searchParams;
    setAcctOpen(false);
    setBooking(null);
    setManage({ id: q.get('manage'), t: q.get('t') });
    history.replaceState(null, '', `?manage=${encodeURIComponent(q.get('manage'))}&t=${encodeURIComponent(q.get('t'))}`);
    setTimeout(()=>window.scrollTo({ top: 0, behavior: 'smooth' }), 50);
  }

  function leaveManage(){
    setManage(null);
    history.replaceState(null, '', location.pathname);
    setTimeout(()=>document.getElementById('book')?.scrollIntoView({behavior:'smooth'}), 100);
  }

  function complete(r){
    setBooking(r);
    setToast({ show:true, message:'Booking confirmed!', icon:'✓' });
    setTimeout(()=>document.getElementById('book')?.scrollIntoView({behavior:'smooth'}), 100);
  }

  function reset(){
    setBooking(null);
    refreshSlotCount(true);
    setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}), 100);
  }

  return (
    <>
      <Preloader ready={ready}/>
      <div className="stage-bg"><div className="orb orb-1"/><div className="orb orb-2"/><div className="orb orb-3"/></div>
      <div className="grain"/>
      <OfferBar coupons={coupons}/>
      <Nav account={account} onAccount={()=>setAcctOpen(true)}/>
      {manage ? <ManageBooking id={manage.id} token={manage.t} onDone={leaveManage} account={account} onAccount={()=>setAcctOpen(true)}/> : <>
        {!booking && <Hero liveSlotsToday={liveSlotsToday} sports={sports} sportsError={sportsError} payCfg={payCfg}/>}
        {!booking && <Ticker sports={sports}/>}
        {booking
          ? <ConfirmationTicket booking={booking} onReset={reset} onAccount={()=>setAcctOpen(true)}/>
          : <BookingWidget sports={sports} sportsError={sportsError} onRetrySports={loadSports} onComplete={complete} payCfg={payCfg} coupons={coupons}/>}
        {!booking && <><Features payCfg={payCfg}/><PricingCallout sports={sports} error={sportsError} onRetry={loadSports}/><PassesSection plans={plans} payCfg={payCfg} onBuy={setBuyPlan} onAccount={()=>setAcctOpen(true)}/><Gallery items={MEDIA.gallery}/><VenueInfo/></>}
      </>}
      <Policies payCfg={payCfg}/>
      <Footer onAccount={()=>setAcctOpen(true)}/>
      <WhatsAppHelp context={helpCtx}/>
      {buyPlan && <PassBuyModal plan={buyPlan} payCfg={payCfg} account={account} onClose={()=>setBuyPlan(null)} onDone={()=>setToast({ show:true, message:'Pass activated!', icon:'🎟️' })}/>}
      {acctOpen && <AccountModal account={account} onLogin={login} onLogout={logout} onClose={()=>setAcctOpen(false)} onManage={openManageFromAccount}/>}
      <Toast toast={toast} onClose={()=>setToast({show:false})}/>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
