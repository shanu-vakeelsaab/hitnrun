<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Admin · Hit N Run Sports Arena</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: #f9fafb; color: #111; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    input, textarea, select, button { font-family: 'Outfit', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f3f4f6; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 99px; }

    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    @keyframes live-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: .55; } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    .anim-up { animation: rise .2s ease both; }
    .spin { animation: spin .8s linear infinite; }
    .pulse { animation: pulse 1.4s infinite; }
    .shake { animation: shake .4s; }

    .live-dot-green {
      width: 7px; height: 7px; border-radius: 50%;
      background: #10b981; display: inline-block;
      animation: live-pulse 2s ease-in-out infinite;
    }

    /* ═══════ MOBILE RESPONSIVE ═══════ */
    @media (max-width: 700px) {
      .top-bar { padding: 0 12px !important; gap: 6px !important; }
      .top-bar-date { display: none !important; }
      .live-text-full { display: none !important; }
      .top-bar-actions { gap: 6px !important; }
      .brand-sub { display: none !important; }
      .stat-grid { grid-template-columns: repeat(2, 1fr) !important; padding: 12px 12px 0 !important; gap: 8px !important; }
      .stat-card { padding: 12px 14px !important; }
      .stat-card-num { font-size: 22px !important; }
      .stat-card-label { font-size: 10px !important; }
      .tab-bar { padding: 12px 12px 0 !important; overflow-x: auto !important; flex-wrap: nowrap !important; scrollbar-width: none; }
      .tab-bar::-webkit-scrollbar { display: none; }
      .tab-bar button { white-space: nowrap !important; flex-shrink: 0; padding: 9px 14px !important; }
      .content-card { margin: 0 12px 20px !important; padding: 14px !important; border-radius: 12px !important; }
      .bookings-table-wrap { display: none !important; }
      .bookings-mobile { display: flex !important; }
      .slot-card-mobile { padding: 12px !important; }
      .resource-row { padding: 8px 10px !important; font-size: 12px !important; }
      .lead-grid { grid-template-columns: 1fr !important; gap: 18px !important; }
      .date-strip-admin button { min-width: 60px !important; padding: 6px 10px !important; }
      .filter-row { gap: 5px !important; }
      .filter-row button { padding: 6px 11px !important; font-size: 11px !important; }
      .pass-pricing { grid-template-columns: 1fr !important; gap: 8px !important; }
      .revenue-cards { grid-template-columns: 1fr !important; gap: 10px !important; }
      .revenue-split { grid-template-columns: 1fr !important; gap: 18px !important; }
      .modal-inner { padding: 16px !important; max-width: calc(100vw - 24px) !important; }
      .form-grid-2 { grid-template-columns: 1fr !important; }
    }
    .bookings-mobile { display: none; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";
const REFRESH_INTERVAL_MS = 15000; // 15s auto-refresh

// PLANS — must match Code.gs PLANS array
const PLANS = [
  { key: 'turf_weekly',  label: 'Turf Weekly Team Pass',  category: 'turf', price:  4999, days:  7, max_members: 12 },
  { key: 'turf_monthly', label: 'Turf Monthly Team Pass', category: 'turf', price: 14999, days: 30, max_members: 18 },
  { key: 'net_week_weekday', label: 'Net Weekly (Weekday)', category: 'net', price: 1800, days: 7 },
  { key: 'net_week_weekend', label: 'Net Weekly (Weekend)', category: 'net', price: 1400, days: 7 },
  { key: 'net_week_full',    label: 'Net Weekly (Mon–Sun)', category: 'net', price: 2500, days: 7 },
  { key: 'net_month_basic',    label: 'Net Monthly Basic (12 hrs)',    category: 'net', price: 4200, days: 30, hours_quota: 12 },
  { key: 'net_month_standard', label: 'Net Monthly Standard (20 hrs)', category: 'net', price: 6500, days: 30, hours_quota: 20 },
  { key: 'net_month_premium',  label: 'Net Monthly Premium (30 hrs)',  category: 'net', price: 9000, days: 30, hours_quota: 30 }
];

const SPORTS_TURF = ['Cricket', 'Football'];

const API = {
  async get(action, params = {}) {
    const adminKey = sessionStorage.getItem('hnr_admin_key') || '';
    const qs = new URLSearchParams({ action, adminKey, ...params }).toString();
    const res = await fetch(API_URL + '?' + qs);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Request failed');
    return data.data;
  },
  async post(action, body = {}) {
    const adminKey = sessionStorage.getItem('hnr_admin_key') || '';
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, adminKey, ...body })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Request failed');
    return data.data;
  },
  async validateKey(key) {
    const res = await fetch(API_URL + '?action=validateKey&adminKey=' + encodeURIComponent(key));
    const data = await res.json();
    return data.ok && data.data && data.data.valid;
  }
};

// ── Utils ──────────────────────────────────────────────────
function formatDateISO(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function formatDateLong(){ return new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'short' }); }
function formatDateShort(iso){ if(!iso) return ''; return new Date(iso+'T00:00:00').toLocaleDateString('en-IN', { day:'2-digit', month:'short' }); }
function getNext15Days(){
  const t = new Date();
  return Array.from({length:15}, (_,i) => {
    const d = new Date(t); d.setDate(d.getDate()+i);
    return { iso: formatDateISO(d), label: i===0?'Today':i===1?'Tomorrow':d.toLocaleDateString('en-IN',{month:'short'}), day: d.getDate(), weekday: d.toLocaleDateString('en-IN',{weekday:'short'}) };
  });
}
function formatPhone(p){ if(!p) return ''; const s=String(p).replace(/\D/g,''); if(s.length===10) return s.slice(0,5)+' '+s.slice(5); return p; }
function normalizePhone(p){ return p ? String(p).replace(/\D/g,'').slice(-10) : ''; }
function relativeTime(then, now){
  if(!then) return 'never';
  const secs = Math.round((now-then)/1000);
  if(secs<5) return 'just now';
  if(secs<60) return secs+'s ago';
  if(secs<3600) return Math.round(secs/60)+'m ago';
  return Math.round(secs/3600)+'h ago';
}
function sportColor(sport){
  const map = {
    'Cricket': {bg:'#fef3c7', text:'#854d0e'},
    'Football': {bg:'#d1fae5', text:'#065f46'},
    'Cricket Net Practice': {bg:'#dbeafe', text:'#1e40af'}
  };
  return map[sport] || { bg:'#f3f4f6', text:'#6b7280' };
}
function paymentBadge(b){
  if(b.status === 'cancelled') return { bg:'#fee2e2', text:'#991b1b', label:'Cancelled' };
  if(b.payment_status === 'paid') return { bg:'#d1fae5', text:'#065f46', label:'Paid' };
  return { bg:'#fef3c7', text:'#92400e', label:'Pending' };
}

function Badge({ bg, text, children }){
  return <span style={{ background:bg, color:text, padding:'3px 9px', borderRadius:999, fontSize:11, fontWeight:700, whiteSpace:'nowrap' }}>{children}</span>;
}

function CancelBtn({ onClick, label, small }){
  return <button onClick={onClick} style={{
    fontSize:small?11:12, padding:small?'5px 11px':'7px 14px',
    background:'#fef2f2', color:'#991b1b', border:'1px solid #fecaca',
    borderRadius:6, fontWeight:700
  }}>{label||'Cancel'}</button>;
}

function Spinner({ small }){
  return <span className="spin" style={{
    display:'inline-block', width:small?14:24, height:small?14:24,
    border:`${small?2:3}px solid #e5e7eb`, borderTopColor:'#f59e0b', borderRadius:'50%'
  }}/>;
}

function LoadingBlock({ message }){
  return <div style={{ padding:50, textAlign:'center', color:'#9ca3af' }}>
    <Spinner/>
    <div style={{ marginTop:14, fontSize:13, fontWeight:600 }}>{message || 'Loading…'}</div>
  </div>;
}

function Toast({ toast, onClose }){
  useEffect(()=>{
    if(!toast?.show) return;
    const t = setTimeout(onClose, 4000);
    return ()=>clearTimeout(t);
  }, [toast?.show]);
  if(!toast?.show) return null;
  return <div style={{
    position:'fixed', bottom:24, left:'50%', transform:'translateX(-50%)',
    background: toast.isError?'#fef2f2':'#0a0a0a', color: toast.isError?'#991b1b':'#fff',
    padding:'12px 22px', borderRadius:99, fontSize:14, fontWeight:600,
    boxShadow:'0 12px 36px rgba(0,0,0,.2)', zIndex:200,
    border: toast.isError?'1px solid #fecaca':'none',
    display:'flex', alignItems:'center', gap:10, maxWidth:'90vw'
  }}>
    <span>{toast.isError?'⚠':'✓'}</span>
    <span>{toast.message}</span>
  </div>;
}

function ConfirmModal({ config, onClose }){
  if(!config?.show) return null;
  return (
    <div onClick={(e)=>e.target===e.currentTarget&&onClose()} style={{
      position:'fixed', inset:0, background:'rgba(0,0,0,.5)', zIndex:150,
      display:'grid', placeItems:'center', padding:16
    }}>
      <div className="modal-inner" style={{
        background:'#fff', borderRadius:16, padding:24, maxWidth:420, width:'100%',
        boxShadow:'0 24px 80px rgba(0,0,0,.3)'
      }}>
        <div style={{ fontSize:18, fontWeight:800, marginBottom:8 }}>{config.title}</div>
        <div style={{ fontSize:14, color:'#6b7280', marginBottom:20, lineHeight:1.6 }}>{config.message}</div>
        <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
          <button onClick={onClose} style={{ padding:'10px 18px', background:'#f3f4f6', color:'#374151', border:'none', borderRadius:8, fontSize:13, fontWeight:700 }}>Cancel</button>
          <button onClick={()=>{ config.onConfirm(); onClose(); }} style={{ padding:'10px 18px', background: config.danger?'#ef4444':'#f59e0b', color:'#fff', border:'none', borderRadius:8, fontSize:13, fontWeight:700 }}>{config.confirmLabel||'Confirm'}</button>
        </div>
      </div>
    </div>
  );
}

// ──────────────────────────────────────────────────────────
// LOGIN PAGE
// ──────────────────────────────────────────────────────────
function LoginPage({ onLogin }){
  const [pw, setPw] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);
  const [shake, setShake] = useState(false);
  const inputRef = useRef(null);

  useEffect(()=>{ inputRef.current?.focus(); }, []);

  async function attempt(){
    if(!pw || loading) return;
    setLoading(true); setErr(null);
    try {
      const ok = await API.validateKey(pw);
      if(ok){
        sessionStorage.setItem('hnr_admin_key', pw);
        onLogin();
      } else {
        setErr('Incorrect admin key.');
        setShake(true);
        setTimeout(()=>setShake(false), 400);
        setLoading(false);
      }
    } catch(e){
      setErr(e.message || 'Connection error');
      setLoading(false);
    }
  }

  return (
    <div style={{ minHeight:'100vh', background:'#0a0a0a', display:'grid', placeItems:'center', padding:16 }}>
      <div className={shake?'shake':''} style={{ maxWidth:380, width:'100%', textAlign:'center' }}>
        <div style={{ width:60, height:60, borderRadius:14, background:'linear-gradient(135deg,#c4f000,#94c800)', margin:'0 auto 22px', display:'grid', placeItems:'center', fontSize:30 }}>🏏</div>
        <div style={{ color:'#fff', fontSize:22, fontWeight:800, marginBottom:6 }}>Hit N Run Admin</div>
        <div style={{ color:'#666', fontSize:13, marginBottom:30 }}>Sign in to manage bookings</div>
        <div style={{ background:'#141414', padding:24, borderRadius:14, border:'1px solid #222' }}>
          <input ref={inputRef} type="password" value={pw} onChange={e=>setPw(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&attempt()}
            placeholder="Admin key" style={{
              width:'100%', padding:'13px 16px', background:'#0a0a0a',
              border:'1.5px solid #2a2a2a', borderRadius:10, color:'#fff',
              fontSize:14, outline:'none'
            }}/>
          {err && <div style={{ color:'#ef4444', fontSize:12, marginTop:10, fontWeight:600 }}>{err}</div>}
          <button onClick={attempt} disabled={!pw||loading} style={{
            width:'100%', marginTop:14, padding:'13px', background:!pw||loading?'#333':'#c4f000',
            color:!pw||loading?'#666':'#000', border:'none', borderRadius:10,
            fontSize:14, fontWeight:800, cursor:!pw||loading?'not-allowed':'pointer',
            display:'inline-flex', alignItems:'center', justifyContent:'center', gap:8
          }}>{loading?<><Spinner small/> Signing in…</>:'Sign In →'}</button>
        </div>
      </div>
    </div>
  );
}

// ──────────────────────────────────────────────────────────
// SPOT BOOKING MODAL
// ──────────────────────────────────────────────────────────
function SpotBookingModal({ onClose, onCreate, defaultDate }){
  const [form, setForm] = useState({
    customer_name:'', phone:'', email:'',
    booking_kind:'turf', sport:'Cricket',
    booking_date: defaultDate || formatDateISO(new Date()),
    slot_time:'',
    members_count: 1,
    amount: 1200,
    payment_status:'pending',
    payment_mode:''
  });
  const [submitting, setSubmitting] = useState(false);
  const [err, setErr] = useState(null);
  const [availSlots, setAvailSlots] = useState([]);
  const [loadingSlots, setLoadingSlots] = useState(false);

  // Fetch available slots whenever date or kind changes
  useEffect(()=>{
    let cancelled = false;
    (async ()=>{
      setLoadingSlots(true);
      setForm(f => ({ ...f, slot_time: '' })); // reset selected time on date/kind change
      try {
        const sport = form.booking_kind === 'turf' ? form.sport : 'Cricket Net Practice';
        const slots = await API.get('getSlots', { date: form.booking_date, sport });
        if (!cancelled) setAvailSlots(slots || []);
      } catch(e) {
        if (!cancelled) { setAvailSlots([]); setErr('Could not load available slots: ' + e.message); }
      } finally {
        if (!cancelled) setLoadingSlots(false);
      }
    })();
    return ()=>{ cancelled = true; };
  }, [form.booking_date, form.booking_kind, form.sport]);

  function setKind(k){
    setForm(f => ({
      ...f,
      booking_kind: k,
      sport: k==='turf' ? 'Cricket' : 'Cricket Net Practice',
      amount: k==='turf' ? 1200 : 400,
      slot_time: ''
    }));
  }

  async function submit(){
    setErr(null);
    if(!form.customer_name.trim()){ setErr('Customer name required'); return; }
    if(normalizePhone(form.phone).length !== 10){ setErr('Valid 10-digit phone required'); return; }
    if(!form.slot_time){ setErr('Please pick an available time slot'); return; }
    setSubmitting(true);
    try {
      const result = await API.post('createSpotBooking', {
        customer_name: form.customer_name.trim(),
        phone: normalizePhone(form.phone),
        email: form.email.trim(),
        sport: form.sport,
        booking_kind: form.booking_kind,
        booking_date: form.booking_date,
        slot_time: form.slot_time,
        members_count: parseInt(form.members_count,10)||1,
        amount: parseInt(form.amount,10)||0,
        payment_status: form.payment_status,
        payment_mode: form.payment_mode
      });
      onCreate(result);  // includes result.booking for optimistic UI
      onClose();
    } catch(e){ setErr(e.message); setSubmitting(false); }
  }

  const sportOptions = form.booking_kind === 'turf' ? SPORTS_TURF : ['Cricket Net Practice'];

  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{
      position:'fixed', inset:0, background:'rgba(0,0,0,.5)', zIndex:140,
      display:'grid', placeItems:'center', padding:16, overflowY:'auto'
    }}>
      <div className="modal-inner" style={{
        background:'#fff', borderRadius:16, padding:24, maxWidth:560, width:'100%',
        boxShadow:'0 24px 80px rgba(0,0,0,.3)', maxHeight:'92vh', overflowY:'auto'
      }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:18 }}>
          <div>
            <div style={{ fontSize:20, fontWeight:800 }}>Walk-in Booking</div>
            <div style={{ fontSize:12, color:'#9ca3af', marginTop:2 }}>Quick add for customers at the venue</div>
          </div>
          <button onClick={onClose} style={{ fontSize:22, color:'#9ca3af', padding:0, lineHeight:1 }}>×</button>
        </div>

        {/* Kind toggle */}
        <div style={{ display:'flex', gap:8, marginBottom:14, background:'#f3f4f6', padding:4, borderRadius:10 }}>
          <button onClick={()=>setKind('turf')} style={{
            flex:1, padding:'10px 14px', borderRadius:7,
            background: form.booking_kind==='turf'?'#fff':'transparent',
            color: form.booking_kind==='turf'?'#111':'#6b7280',
            fontWeight:700, fontSize:13,
            boxShadow: form.booking_kind==='turf'?'0 1px 3px rgba(0,0,0,.1)':'none'
          }}>🏏 Turf · ₹1,200/hr</button>
          <button onClick={()=>setKind('net')} style={{
            flex:1, padding:'10px 14px', borderRadius:7,
            background: form.booking_kind==='net'?'#fff':'transparent',
            color: form.booking_kind==='net'?'#111':'#6b7280',
            fontWeight:700, fontSize:13,
            boxShadow: form.booking_kind==='net'?'0 1px 3px rgba(0,0,0,.1)':'none'
          }}>🥅 Net · ₹400/hr</button>
        </div>

        {/* Date + Sport on top */}
        <div className="form-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:14 }}>
          <div>
            <label style={lblStyle}>Date *</label>
            <input type="date" value={form.booking_date} onChange={e=>setForm({...form, booking_date:e.target.value})} style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Sport</label>
            <select value={form.sport} onChange={e=>setForm({...form, sport:e.target.value})} style={inputStyle}>
              {sportOptions.map(s => <option key={s}>{s}</option>)}
            </select>
          </div>
        </div>

        {/* Time slot grid */}
        <div style={{ marginBottom:18 }}>
          <label style={lblStyle}>
            Available Time Slots * {form.slot_time && <span style={{ color:'#10b981', fontWeight:700, textTransform:'none', letterSpacing:0 }}>· Selected: {form.slot_time}</span>}
          </label>
          {loadingSlots ? (
            <div style={{ padding:'20px 16px', background:'#f9fafb', borderRadius:8, textAlign:'center', display:'flex', alignItems:'center', justifyContent:'center', gap:10, color:'#6b7280', fontSize:13 }}>
              <Spinner small/> Loading available slots…
            </div>
          ) : availSlots.length === 0 ? (
            <div style={{ padding:'20px 16px', background:'#fef2f2', border:'1px dashed #fecaca', borderRadius:8, textAlign:'center', color:'#991b1b', fontSize:13 }}>
              No {form.booking_kind === 'turf' ? 'turf' : 'net'} slots available for this date.
              {form.booking_kind === 'turf' && ' All slots may have net bookings or be booked.'}
            </div>
          ) : (
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(110px, 1fr))', gap:6, maxHeight:200, overflowY:'auto', padding:4, background:'#fafafa', borderRadius:8, border:'1px solid #e5e7eb' }}>
              {availSlots.map(s => {
                const active = form.slot_time === s.slot_time;
                return (
                  <button key={s.slot_id} type="button" onClick={()=>setForm({...form, slot_time: s.slot_time, amount: form.amount || s.price})}
                    style={{
                      padding:'9px 8px', borderRadius:7,
                      background: active ? '#f59e0b' : '#fff',
                      color: active ? '#fff' : '#111',
                      border: '1.5px solid ' + (active ? '#f59e0b' : '#e5e7eb'),
                      fontSize:12, fontWeight:700, lineHeight:1.3, cursor:'pointer'
                    }}>
                    <div style={{ fontFamily:'monospace' }}>{s.slot_time}</div>
                    {s.nets_available !== undefined && (
                      <div style={{ fontSize:9, fontWeight:600, opacity:.8, marginTop:2 }}>{s.nets_available}/3 free</div>
                    )}
                  </button>
                );
              })}
            </div>
          )}
        </div>

        <div className="form-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
          <div>
            <label style={lblStyle}>Customer Name *</label>
            <input value={form.customer_name} onChange={e=>setForm({...form, customer_name:e.target.value})} placeholder="Full name" style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Phone *</label>
            <input type="tel" value={form.phone} onChange={e=>setForm({...form, phone:e.target.value})} placeholder="98765 43210" style={inputStyle} maxLength={15}/>
          </div>
          <div>
            <label style={lblStyle}>Email</label>
            <input type="email" value={form.email} onChange={e=>setForm({...form, email:e.target.value})} placeholder="optional" style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Players</label>
            <input type="number" value={form.members_count} onChange={e=>setForm({...form, members_count:e.target.value})} min={1} max={30} style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Amount (₹)</label>
            <input type="number" value={form.amount} onChange={e=>setForm({...form, amount:e.target.value})} style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Payment Status</label>

const lblStyle = { display:'block', fontSize:11, fontWeight:700, color:'#6b7280', textTransform:'uppercase', letterSpacing:'.06em', marginBottom:6 };
const inputStyle = { width:'100%', padding:'10px 12px', border:'1.5px solid #e5e7eb', borderRadius:8, fontSize:14, outline:'none', background:'#fff' };

// ──────────────────────────────────────────────────────────
// EDIT BOOKING MODAL — change slot date/time and amount
// ──────────────────────────────────────────────────────────
function EditBookingModal({ booking, onClose, onSave }){
  const [form, setForm] = useState({
    booking_date: booking.booking_date,
    slot_id: booking.slot_id,
    slot_time: booking.slot_time,
    amount: booking.amount,
    notes: booking.notes || '',
    members_count: booking.members_count || 1
  });
  const [availSlots, setAvailSlots] = useState([]);
  const [loadingSlots, setLoadingSlots] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [err, setErr] = useState(null);

  // Fetch available slots whenever date changes (include the current slot too so admin can keep it)
  useEffect(()=>{
    let cancelled = false;
    (async ()=>{
      setLoadingSlots(true);
      try {
        const sport = booking.booking_kind === 'turf' ? booking.sport : 'Cricket Net Practice';
        const slots = await API.get('getSlots', { date: form.booking_date, sport });
        if (cancelled) return;
        // Inject the current slot at the top so admin can choose to keep current
        const list = (slots || []).slice();
        if (form.booking_date === booking.booking_date) {
          const hasCurrent = list.some(s => s.slot_id === booking.slot_id);
          if (!hasCurrent) {
            list.unshift({
              slot_id: booking.slot_id,
              slot_date: booking.booking_date,
              slot_time: booking.slot_time,
              resource: booking.resource,
              price: booking.amount,
              _current: true
            });
          }
        }
        setAvailSlots(list);
      } catch(e) {
        if (!cancelled) { setAvailSlots([]); setErr('Could not load slots: '+e.message); }
      } finally {
        if (!cancelled) setLoadingSlots(false);
      }
    })();
    return ()=>{ cancelled = true; };
  }, [form.booking_date]);

  async function submit(){
    setErr(null);
    if (!form.slot_id) { setErr('Pick a slot'); return; }
    setSubmitting(true);
    try {
      await API.post('updateBooking', {
        id: booking.booking_id,
        slot_id: form.slot_id,
        amount: parseInt(form.amount, 10) || 0,
        notes: form.notes,
        members_count: parseInt(form.members_count, 10) || 1
      });
      onSave();
      onClose();
    } catch(e){ setErr(e.message); setSubmitting(false); }
  }

  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{
      position:'fixed', inset:0, background:'rgba(0,0,0,.5)', zIndex:140,
      display:'grid', placeItems:'center', padding:16, overflowY:'auto'
    }}>
      <div className="modal-inner" style={{
        background:'#fff', borderRadius:16, padding:24, maxWidth:600, width:'100%',
        boxShadow:'0 24px 80px rgba(0,0,0,.3)', maxHeight:'92vh', overflowY:'auto'
      }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:18 }}>
          <div>
            <div style={{ fontSize:20, fontWeight:800 }}>Edit Booking</div>
            <div style={{ fontSize:12, color:'#9ca3af', marginTop:2, fontFamily:'monospace' }}>{booking.booking_id} · {booking.customer_name}</div>
          </div>
          <button onClick={onClose} style={{ fontSize:22, color:'#9ca3af', padding:0, lineHeight:1 }}>×</button>
        </div>

        <div style={{ background:'#f9fafb', padding:12, borderRadius:8, marginBottom:16, fontSize:13 }}>
          <div style={{ color:'#6b7280', fontSize:11, textTransform:'uppercase', letterSpacing:'.06em', fontWeight:700, marginBottom:4 }}>Current</div>
          <div><strong>{booking.sport}</strong> · {formatDateShort(booking.booking_date)} · {booking.slot_time} · ₹{booking.amount}</div>
        </div>

        <div style={{ marginBottom:14 }}>
          <label style={lblStyle}>Date</label>
          <input type="date" value={form.booking_date}
            onChange={e=>setForm({...form, booking_date:e.target.value, slot_id:''})}
            style={inputStyle}/>
        </div>

        <div style={{ marginBottom:16 }}>
          <label style={lblStyle}>
            Slot {form.slot_id && <span style={{ textTransform:'none', color:'#10b981', fontWeight:700, letterSpacing:0 }}>· Selected</span>}
          </label>
          {loadingSlots ? (
            <div style={{ padding:'20px', background:'#f9fafb', borderRadius:8, textAlign:'center', display:'flex', alignItems:'center', justifyContent:'center', gap:10, color:'#6b7280', fontSize:13 }}>
              <Spinner small/> Loading slots…
            </div>
          ) : availSlots.length === 0 ? (
            <div style={{ padding:'20px', background:'#fef2f2', border:'1px dashed #fecaca', borderRadius:8, textAlign:'center', color:'#991b1b', fontSize:13 }}>
              No slots available for this date.
            </div>
          ) : (
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(110px, 1fr))', gap:6, maxHeight:240, overflowY:'auto', padding:6, background:'#fafafa', borderRadius:8, border:'1px solid #e5e7eb' }}>
              {availSlots.map(s => {
                const active = form.slot_id === s.slot_id;
                return (
                  <button key={s.slot_id} type="button"
                    onClick={()=>setForm({...form, slot_id:s.slot_id, slot_time:s.slot_time})}
                    style={{
                      padding:'9px 8px', borderRadius:7,
                      background: active ? '#f59e0b' : (s._current ? '#ecfdf5' : '#fff'),
                      color: active ? '#fff' : '#111',
                      border: '1.5px solid ' + (active ? '#f59e0b' : (s._current ? '#10b981' : '#e5e7eb')),
                      fontSize:12, fontWeight:700, lineHeight:1.3, cursor:'pointer'
                    }}>
                    <div style={{ fontFamily:'monospace' }}>{s.slot_time}</div>
                    {s._current && <div style={{ fontSize:9, opacity:.8 }}>current</div>}
                    {s.nets_available !== undefined && !s._current && <div style={{ fontSize:9, opacity:.7 }}>{s.nets_available}/3 free</div>}
                  </button>
                );
              })}
            </div>
          )}
        </div>

        <div className="form-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:14 }}>
          <div>
            <label style={lblStyle}>Amount (₹)</label>
            <input type="number" value={form.amount}
              onChange={e=>setForm({...form, amount:e.target.value})}
              style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Players</label>
            <input type="number" value={form.members_count}
              onChange={e=>setForm({...form, members_count:e.target.value})}
              min={1} style={inputStyle}/>
          </div>
        </div>

        <div style={{ marginBottom:16 }}>
          <label style={lblStyle}>Notes</label>
          <textarea value={form.notes}
            onChange={e=>setForm({...form, notes:e.target.value})}
            style={{ ...inputStyle, minHeight:60, resize:'vertical' }}/>
        </div>

        {err && <div style={{ background:'#fef2f2', color:'#991b1b', padding:'10px 14px', borderRadius:8, fontSize:13, marginBottom:14 }}>⚠ {err}</div>}

        <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
          <button onClick={onClose} style={{ padding:'11px 18px', background:'#f3f4f6', color:'#374151', borderRadius:8, fontWeight:700, fontSize:13 }}>Cancel</button>
          <button onClick={submit} disabled={submitting || !form.slot_id} style={{ padding:'11px 22px', background:(submitting||!form.slot_id)?'#d1d5db':'#f59e0b', color:(submitting||!form.slot_id)?'#6b7280':'#fff', borderRadius:8, fontWeight:800, fontSize:13, display:'inline-flex', alignItems:'center', gap:8 }}>
            {submitting && <Spinner small/>}{submitting?'Saving…':'Save Changes'}
          </button>
        </div>
      </div>
    </div>
  );
}

  );
