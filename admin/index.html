<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Admin · Hit N Run Sports Arena</title>
  <link rel="icon" type="image/jpeg" href="/logo.jpeg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: #f9fafb; color: #111; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    input, textarea, select, button { font-family: 'Outfit', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f3f4f6; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 99px; }

    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    @keyframes live-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: .55; } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    @keyframes drawerSlide { from { transform: translateX(100%); } to { transform: translateX(0); } }

    .anim-up { animation: rise .2s ease both; }
    .spin { animation: spin .8s linear infinite; }
    .pulse { animation: pulse 1.4s infinite; }
    .shake { animation: shake .4s; }

    .live-dot-green {
      width: 7px; height: 7px; border-radius: 50%;
      background: #10b981; display: inline-block;
      animation: live-pulse 2s ease-in-out infinite;
    }

    /* Clickable booking row hover */
    .booking-row:hover { background: #f8fafc !important; }
    .booking-row:hover td:last-child { color: #f59e0b !important; }

    /* Mobile booking card hover */
    .bookings-mobile > div:hover { box-shadow: 0 4px 12px rgba(15,23,42,.08); transform: translateY(-1px); }

    /* ═══════ PRINT STYLES — Today's Bookings Day Sheet ═══════ */
    @media print {
      @page { margin: 12mm; }
      body { background: #fff !important; }
      .top-bar, .stat-grid, .sports-today, .tab-bar, .filter-row, .bookings-mobile,
      button, input, .content-card > div:first-child > div:last-child { display: none !important; }
      .content-card { box-shadow: none !important; border: none !important; margin: 0 !important; padding: 0 !important; }
      .bookings-table-wrap { display: block !important; overflow: visible !important; }
      .bookings-table-wrap td:last-child, .bookings-table-wrap th:last-child { display: none; }
      .booking-row { page-break-inside: avoid; }
      table { font-size: 12px !important; }
      body::before {
        content: "Hit N Run Sports Arena · Bookings Day Sheet · " attr(data-print-date);
        display: block; font-size: 14px; font-weight: 800; padding: 0 0 12px; border-bottom: 2px solid #000; margin-bottom: 12px;
      }
    }

    /* ═══════ MOBILE RESPONSIVE ═══════ */
    @media (max-width: 700px) {
      .top-bar { padding: 0 12px !important; gap: 6px !important; }
      .top-bar-date { display: none !important; }
      .live-text-full { display: none !important; }
      .top-bar-actions { gap: 6px !important; }
      .brand-sub { display: none !important; }
      .stat-grid { grid-template-columns: repeat(2, 1fr) !important; padding: 12px 12px 0 !important; gap: 8px !important; }
      .stat-card { padding: 12px 14px !important; }
      .stat-card-num { font-size: 22px !important; }
      .stat-card-label { font-size: 10px !important; }
      .tab-bar { padding: 12px 12px 0 !important; overflow-x: auto !important; flex-wrap: nowrap !important; scrollbar-width: none; }
      .tab-bar::-webkit-scrollbar { display: none; }
      .tab-bar button { white-space: nowrap !important; flex-shrink: 0; padding: 9px 14px !important; }
      .content-card { margin: 0 12px 20px !important; padding: 14px !important; border-radius: 12px !important; }
      .bookings-table-wrap { display: none !important; }
      .bookings-mobile { display: flex !important; }
      .slot-card-mobile { padding: 12px !important; }
      .resource-row { padding: 8px 10px !important; font-size: 12px !important; }
      .lead-grid { grid-template-columns: 1fr !important; gap: 18px !important; }
      .date-strip-admin button { min-width: 60px !important; padding: 6px 10px !important; }
      .filter-row { gap: 5px !important; }
      .filter-row button { padding: 6px 11px !important; font-size: 11px !important; }
      .pass-pricing { grid-template-columns: 1fr !important; gap: 8px !important; }
      .revenue-cards { grid-template-columns: 1fr !important; gap: 10px !important; }
      .revenue-split { grid-template-columns: 1fr !important; gap: 18px !important; }
      .modal-inner { padding: 16px !important; max-width: calc(100vw - 24px) !important; }
      .form-grid-2 { grid-template-columns: 1fr !important; }
    }
    .bookings-mobile { display: none; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const API_URL = "https://hitnrun-api.vercel.app/api";
const REFRESH_INTERVAL_MS = 15000; // 15s auto-refresh

// PLANS — must match Code.gs PLANS array
const PLANS = [
  { key: 'turf_weekly',  label: 'Turf Weekly Team Pass',  category: 'turf', price:  4999, days:  7, max_members: 12 },
  { key: 'turf_monthly', label: 'Turf Monthly Team Pass', category: 'turf', price: 14999, days: 30, max_members: 18 },
  { key: 'net_week_weekday', label: 'Net Weekly (Weekday)', category: 'net', price: 1800, days: 7 },
  { key: 'net_week_weekend', label: 'Net Weekly (Weekend)', category: 'net', price: 1400, days: 7 },
  { key: 'net_week_full',    label: 'Net Weekly (Mon–Sun)', category: 'net', price: 2500, days: 7 },
  { key: 'net_month_basic',    label: 'Net Monthly Basic (12 hrs)',    category: 'net', price: 4200, days: 30, hours_quota: 12 },
  { key: 'net_month_standard', label: 'Net Monthly Standard (20 hrs)', category: 'net', price: 6500, days: 30, hours_quota: 20 },
  { key: 'net_month_premium',  label: 'Net Monthly Premium (30 hrs)',  category: 'net', price: 9000, days: 30, hours_quota: 30 }
];

const API = {
  async get(action, params = {}) {
    const adminKey = sessionStorage.getItem('hnr_admin_key') || '';
    const qs = new URLSearchParams({ action, adminKey, ...params }).toString();
    const res = await fetch(API_URL + '?' + qs);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Request failed');
    return data.data;
  },
  async post(action, body = {}) {
    const adminKey = sessionStorage.getItem('hnr_admin_key') || '';
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, adminKey, ...body })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Request failed');
    return data.data;
  },
  async validateKey(key) {
    const res = await fetch(API_URL + '?action=validateKey&adminKey=' + encodeURIComponent(key));
    const data = await res.json();
    return data.ok && data.data && data.data.valid;
  }
};

// ── Sports / resources config (listSportsAdmin + listResourcesAdmin) ──
// Bookings store sport_id; look everything up here so archived sports keep their name + icon.
const ConfigCtx = React.createContext(null);
function useConfig(){ return React.useContext(ConfigCtx); }
const SPORT_COLORS = [
  {bg:'#fef3c7', text:'#854d0e'}, {bg:'#d1fae5', text:'#065f46'}, {bg:'#fed7aa', text:'#9a3412'},
  {bg:'#dbeafe', text:'#1e40af'}, {bg:'#e0e7ff', text:'#3730a3'}, {bg:'#fce7f3', text:'#9d174d'},
  {bg:'#ccfbf1', text:'#115e59'}, {bg:'#fae8ff', text:'#86198f'}
];
function makeConfig(sports, resources){
  const byId = {};
  sports.forEach((s, i) => { byId[s.sport_id] = { ...s, color: SPORT_COLORS[i % SPORT_COLORS.length] }; });
  const resById = {};
  resources.forEach(r => { resById[r.resource_id] = r; });
  return {
    sports, resources,
    bookable: sports.filter(s => s.active && !s.archived),
    sport: id => byId[id] || { sport_id: id, name: id || '—', icon: '🏷️', color: { bg:'#f3f4f6', text:'#6b7280' }, unknown: true },
    resourceLabel: id => (resById[id] && resById[id].label) || String(id || '').toUpperCase()
  };
}
// Open hours for one sport via getAvailability in admin mode (API.get sends adminKey): includes
// walk-in-only sports; with excludeId that booking's own slots count as free (Edit Booking).
async function loadSportHours(date, sportId, excludeId){
  const d = await API.get('getAvailability', excludeId ? { date, exclude_booking_id: excludeId } : { date });
  const sp = (d.sports || []).find(x => x.sport_id === sportId);
  return sp ? sp.hours.filter(h => h.available > 0) : [];
}
const isPooled = sp => (sp.resource_pool || []).length > 1;   // show "N left" only when there's a pool
function rupees(n){ return '₹' + (Number(n) || 0).toLocaleString('en-IN'); }
// pricing_mode "session" (API_CONTRACT.md): one slot = session_qty session_unit; never show it as hourly.
// Bookings don't store the mode, so it comes from the sport's current config.
function isSession(s){ return !!s && s.pricing_mode === 'session'; }
function sessionQty(s, n){ return `${(Number(s.session_qty) || 0) * (n || 1)} ${s.session_unit}`; }
function startTime12(slotTime){
  const [h, m] = String(slotTime).split('-')[0].split(':').map(Number);
  return `${(h % 12) || 12}:${String(m || 0).padStart(2,'0')} ${h >= 12 ? 'PM' : 'AM'}`;
}
function slotTimeText(sp, slotTime){ return isSession(sp) ? startTime12(slotTime) : slotTime; }
function sportPriceText(s){
  return isSession(s) ? `${rupees(s.price_per_slot)} · ${sessionQty(s, 1)}`
                      : `${rupees(s.price_per_slot)} / hr${s.unit_label ? ` · ${s.unit_label}` : ''}`;
}

// ── Utils ──────────────────────────────────────────────────
function formatDateISO(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function formatDateLong(){ return new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'short' }); }
function formatDateShort(iso){ if(!iso) return ''; return new Date(iso+'T00:00:00').toLocaleDateString('en-IN', { day:'2-digit', month:'short' }); }
function getNext15Days(){
  const t = new Date();
  return Array.from({length:15}, (_,i) => {
    const d = new Date(t); d.setDate(d.getDate()+i);
    return { iso: formatDateISO(d), label: i===0?'Today':i===1?'Tomorrow':d.toLocaleDateString('en-IN',{month:'short'}), day: d.getDate(), weekday: d.toLocaleDateString('en-IN',{weekday:'short'}) };
  });
}
function formatPhone(p){ if(!p) return ''; const s=String(p).replace(/\D/g,''); if(s.length===10) return s.slice(0,5)+' '+s.slice(5); return p; }
function normalizePhone(p){ return p ? String(p).replace(/\D/g,'').slice(-10) : ''; }
function relativeTime(then, now){
  if(!then) return 'never';
  const secs = Math.round((now-then)/1000);
  if(secs<5) return 'just now';
  if(secs<60) return secs+'s ago';
  if(secs<3600) return Math.round(secs/60)+'m ago';
  return Math.round(secs/3600)+'h ago';
}
function paymentBadge(b){
  if(b.status === 'cancelled') return { bg:'#fee2e2', text:'#991b1b', label:'Cancelled' };
  if(b.payment_status === 'paid') return { bg:'#d1fae5', text:'#065f46', label:'Paid' };
  return { bg:'#fef3c7', text:'#92400e', label:'Pending' };
}

function Badge({ bg, text, children }){
  return <span style={{ background:bg, color:text, padding:'3px 9px', borderRadius:999, fontSize:11, fontWeight:700, whiteSpace:'nowrap' }}>{children}</span>;
}

function CancelBtn({ onClick, label, small }){
  return <button onClick={onClick} style={{
    fontSize:small?11:12, padding:small?'5px 11px':'7px 14px',
    background:'#fef2f2', color:'#991b1b', border:'1px solid #fecaca',
    borderRadius:6, fontWeight:700
  }}>{label||'Cancel'}</button>;
}

function Spinner({ small }){
  return <span className="spin" style={{
    display:'inline-block', width:small?14:24, height:small?14:24,
    border:`${small?2:3}px solid #e5e7eb`, borderTopColor:'#f59e0b', borderRadius:'50%'
  }}/>;
}

function LoadingBlock({ message }){
  return <div style={{ padding:50, textAlign:'center', color:'#9ca3af' }}>
    <Spinner/>
    <div style={{ marginTop:14, fontSize:13, fontWeight:600 }}>{message || 'Loading…'}</div>
  </div>;
}

function Toast({ toast, onClose }){
  useEffect(()=>{
    if(!toast?.show) return;
    const t = setTimeout(onClose, 4000);
    return ()=>clearTimeout(t);
  }, [toast?.show]);
  if(!toast?.show) return null;
  return <div style={{
    position:'fixed', bottom:24, left:'50%', transform:'translateX(-50%)',
    background: toast.isError?'#fef2f2':'#0a0a0a', color: toast.isError?'#991b1b':'#fff',
    padding:'12px 22px', borderRadius:99, fontSize:14, fontWeight:600,
    boxShadow:'0 12px 36px rgba(0,0,0,.2)', zIndex:200,
    border: toast.isError?'1px solid #fecaca':'none',
    display:'flex', alignItems:'center', gap:10, maxWidth:'90vw'
  }}>
    <span>{toast.isError?'⚠':'✓'}</span>
    <span>{toast.message}</span>
  </div>;
}

function ConfirmModal({ config, onClose }){
  if(!config?.show) return null;
  return (
    <div onClick={(e)=>e.target===e.currentTarget&&onClose()} style={{
      position:'fixed', inset:0, background:'rgba(0,0,0,.5)', zIndex:150,
      display:'grid', placeItems:'center', padding:16
    }}>
      <div className="modal-inner" style={{
        background:'#fff', borderRadius:16, padding:24, maxWidth:420, width:'100%',
        boxShadow:'0 24px 80px rgba(0,0,0,.3)'
      }}>
        <div style={{ fontSize:18, fontWeight:800, marginBottom:8 }}>{config.title}</div>
        <div style={{ fontSize:14, color:'#6b7280', marginBottom:20, lineHeight:1.6 }}>{config.message}</div>
        <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
          <button onClick={onClose} style={{ padding:'10px 18px', background:'#f3f4f6', color:'#374151', border:'none', borderRadius:8, fontSize:13, fontWeight:700 }}>Cancel</button>
          <button onClick={()=>{ config.onConfirm(); onClose(); }} style={{ padding:'10px 18px', background: config.danger?'#ef4444':'#f59e0b', color:'#fff', border:'none', borderRadius:8, fontSize:13, fontWeight:700 }}>{config.confirmLabel||'Confirm'}</button>
        </div>
      </div>
    </div>
  );
}

// ──────────────────────────────────────────────────────────
// LOGIN PAGE
// ──────────────────────────────────────────────────────────
function LoginPage({ onLogin }){
  const [pw, setPw] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);
  const [shake, setShake] = useState(false);
  const inputRef = useRef(null);

  useEffect(()=>{ inputRef.current?.focus(); }, []);

  async function attempt(){
    if(!pw || loading) return;
    setLoading(true); setErr(null);
    try {
      const ok = await API.validateKey(pw);
      if(ok){
        sessionStorage.setItem('hnr_admin_key', pw);
        onLogin();
      } else {
        setErr('Incorrect admin key.');
        setShake(true);
        setTimeout(()=>setShake(false), 400);
        setLoading(false);
      }
    } catch(e){
      setErr(e.message || 'Connection error');
      setLoading(false);
    }
  }

  return (
    <div style={{ minHeight:'100vh', background:'#0a0a0a', display:'grid', placeItems:'center', padding:16 }}>
      <div className={shake?'shake':''} style={{ maxWidth:380, width:'100%', textAlign:'center' }}>
        <div style={{ width:60, height:60, borderRadius:14, background:'linear-gradient(135deg,#c4f000,#94c800)', margin:'0 auto 22px', display:'grid', placeItems:'center', fontSize:30 }}>🏏</div>
        <div style={{ color:'#fff', fontSize:22, fontWeight:800, marginBottom:6 }}>Hit N Run Admin</div>
        <div style={{ color:'#666', fontSize:13, marginBottom:30 }}>Sign in to manage bookings</div>
        <div style={{ background:'#141414', padding:24, borderRadius:14, border:'1px solid #222' }}>
          <input ref={inputRef} type="password" value={pw} onChange={e=>setPw(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&attempt()}
            placeholder="Admin key" style={{
              width:'100%', padding:'13px 16px', background:'#0a0a0a',
              border:'1.5px solid #2a2a2a', borderRadius:10, color:'#fff',
              fontSize:14, outline:'none'
            }}/>
          {err && <div style={{ color:'#ef4444', fontSize:12, marginTop:10, fontWeight:600 }}>{err}</div>}
          <button onClick={attempt} disabled={!pw||loading} style={{
            width:'100%', marginTop:14, padding:'13px', background:!pw||loading?'#333':'#c4f000',
            color:!pw||loading?'#666':'#000', border:'none', borderRadius:10,
            fontSize:14, fontWeight:800, cursor:!pw||loading?'not-allowed':'pointer',
            display:'inline-flex', alignItems:'center', justifyContent:'center', gap:8
          }}>{loading?<><Spinner small/> Signing in…</>:'Sign In →'}</button>
        </div>
      </div>
    </div>
  );
}

// ──────────────────────────────────────────────────────────
// SPOT BOOKING MODAL
// ──────────────────────────────────────────────────────────
function SportPicker({ sports, value, onChange }){
  return (
    <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(150px, 1fr))', gap:6 }}>
      {sports.map(s => {
        const active = value === s.sport_id;
        return (
          <button key={s.sport_id} type="button" onClick={()=>onChange(s.sport_id)} style={{
            padding:'9px 10px', borderRadius:8, textAlign:'left',
            background: active ? '#fff7ed' : '#fff',
            border: '1.5px solid ' + (active ? '#f59e0b' : '#e5e7eb'),
            fontSize:12, fontWeight:700, color:'#111', lineHeight:1.3
          }}>
            <div>{s.icon} {s.name}</div>
            <div style={{ fontSize:10, fontWeight:600, color:'#6b7280', marginTop:2 }}>
              {isSession(s) ? sportPriceText(s) : `${rupees(s.price_per_slot)}/hr${s.unit_label ? ` · ${s.unit_label}` : ''}`}{s.online_booking === false ? ' · walk-in only' : ''}
            </div>
          </button>
        );
      })}
    </div>
  );
}

function SpotBookingModal({ onClose, onCreate, defaultDate }){
  const cfg = useConfig();
  const sports = cfg.bookable;
  const [form, setForm] = useState({
    customer_name:'', phone:'', email:'',
    sport_id: sports[0] ? sports[0].sport_id : '',
    booking_date: defaultDate || formatDateISO(new Date()),
    slot_time:'',
    duration_hrs: 1,
    members_count: 1,
    amount: '',            // blank → server computes price_per_slot × hours
    payment_status:'pending',
    payment_mode:''
  });
  const [submitting, setSubmitting] = useState(false);
  const [err, setErr] = useState(null);
  const [availSlots, setAvailSlots] = useState([]);
  const [loadingSlots, setLoadingSlots] = useState(false);
  const sport = cfg.sport(form.sport_id);
  useEffect(()=>{ if (!form.sport_id && sports[0]) setForm(f => ({ ...f, sport_id: sports[0].sport_id })); }, [sports.length]);

  useEffect(()=>{
    if (!form.sport_id) return;
    let cancelled = false;
    (async ()=>{
      setLoadingSlots(true);
      setForm(f => ({ ...f, slot_time: '', duration_hrs: 1 }));
      try {
        const hours = await loadSportHours(form.booking_date, form.sport_id);
        if (!cancelled) setAvailSlots(hours);
      } catch(e) {
        if (!cancelled) { setAvailSlots([]); setErr('Could not load available slots: ' + e.message); }
      } finally {
        if (!cancelled) setLoadingSlots(false);
      }
    })();
    return ()=>{ cancelled = true; };
  }, [form.booking_date, form.sport_id]);

  const selectedSlot = availSlots.find(s => s.slot_time === form.slot_time);
  const maxDur = (selectedSlot && selectedSlot.max_duration) || 1;
  const hourOptions = Array.from({ length: sport.max_slots_per_booking || 3 }, (_, i) => i + 1);

  async function submit(){
    setErr(null);
    if(!form.customer_name.trim()){ setErr('Customer name required'); return; }
    if(normalizePhone(form.phone).length !== 10){ setErr('Valid 10-digit phone required'); return; }
    if(!form.slot_time){ setErr('Please pick an available time slot'); return; }
    setSubmitting(true);
    try {
      const result = await API.post('createSpotBooking', {
        customer_name: form.customer_name.trim(),
        phone: normalizePhone(form.phone),
        email: form.email.trim(),
        sport_id: form.sport_id,
        booking_date: form.booking_date,
        slot_time: form.slot_time,
        duration_hrs: parseInt(form.duration_hrs,10) || 1,
        members_count: parseInt(form.members_count,10)||1,
        amount: String(form.amount).trim() === '' ? undefined : parseInt(form.amount,10) || 0,
        payment_status: form.payment_status,
        payment_mode: form.payment_mode
      });
      onCreate(result);  // includes result.booking for optimistic UI
      onClose();
    } catch(e){ setErr(e.message); setSubmitting(false); }
  }

  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{
      position:'fixed', inset:0, background:'rgba(0,0,0,.5)', zIndex:140,
      display:'grid', placeItems:'center', padding:16, overflowY:'auto'
    }}>
      <div className="modal-inner" style={{
        background:'#fff', borderRadius:16, padding:24, maxWidth:560, width:'100%',
        boxShadow:'0 24px 80px rgba(0,0,0,.3)', maxHeight:'92vh', overflowY:'auto'
      }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:18 }}>
          <div>
            <div style={{ fontSize:20, fontWeight:800 }}>Walk-in Booking</div>
            <div style={{ fontSize:12, color:'#9ca3af', marginTop:2 }}>Quick add for customers at the venue</div>
          </div>
          <button onClick={onClose} style={{ fontSize:22, color:'#9ca3af', padding:0, lineHeight:1 }}>×</button>
        </div>

        <div style={{ marginBottom:14 }}>
          <label style={lblStyle}>Sport</label>
          {sports.length === 0
            ? <div style={{ padding:14, background:'#fef2f2', color:'#991b1b', borderRadius:8, fontSize:13 }}>No active sports. Turn one on in the Sports tab.</div>
            : <SportPicker sports={sports} value={form.sport_id} onChange={id=>setForm(f => ({ ...f, sport_id:id }))}/>}
        </div>

        <div style={{ marginBottom:14 }}>
          <label style={lblStyle}>Date *</label>
          <input type="date" value={form.booking_date} onChange={e=>setForm({...form, booking_date:e.target.value})} style={inputStyle}/>
        </div>

        {/* Time slot grid */}
        <div style={{ marginBottom:18 }}>
          <label style={lblStyle}>
            Available Time Slots * {form.slot_time && <span style={{ color:'#10b981', fontWeight:700, textTransform:'none', letterSpacing:0 }}>· Selected: {slotTimeText(sport, form.slot_time)}</span>}
          </label>
          {loadingSlots ? (
            <div style={{ padding:'20px 16px', background:'#f9fafb', borderRadius:8, textAlign:'center', display:'flex', alignItems:'center', justifyContent:'center', gap:10, color:'#6b7280', fontSize:13 }}>
              <Spinner small/> Loading available slots…
            </div>
          ) : availSlots.length === 0 ? (
            <div style={{ padding:'20px 16px', background:'#fef2f2', border:'1px dashed #fecaca', borderRadius:8, textAlign:'center', color:'#991b1b', fontSize:13 }}>
              No {sport.name} slots available for this date.
            </div>
          ) : (
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(110px, 1fr))', gap:6, maxHeight:200, overflowY:'auto', padding:4, background:'#fafafa', borderRadius:8, border:'1px solid #e5e7eb' }}>
              {availSlots.map(s => {
                const active = form.slot_time === s.slot_time;
                return (
                  <button key={s.slot_time} type="button" onClick={()=>setForm({...form, slot_time: s.slot_time, duration_hrs: 1})}
                    style={{
                      padding:'9px 8px', borderRadius:7,
                      background: active ? '#f59e0b' : '#fff',
                      color: active ? '#fff' : '#111',
                      border: '1.5px solid ' + (active ? '#f59e0b' : '#e5e7eb'),
                      fontSize:12, fontWeight:700, lineHeight:1.3, cursor:'pointer'
                    }}>
                    <div style={{ fontFamily:'monospace' }}>{slotTimeText(sport, s.slot_time)}</div>
                    {isPooled(sport) && <div style={{ fontSize:9, fontWeight:600, opacity:.8, marginTop:2 }}>{s.available} left</div>}
                    {s.max_duration > 1 && (
                      <div style={{ fontSize:9, fontWeight:600, opacity:.7, marginTop:1 }}>up to {isSession(sport) ? sessionQty(sport, s.max_duration) : `${s.max_duration}h`}</div>
                    )}
                  </button>
                );
              })}
            </div>
          )}
        </div>

        {/* Duration picker — only when a slot is selected */}
        {form.slot_time && (
          <div style={{ marginBottom:18 }}>
            <label style={lblStyle}>Duration {maxDur >= 2 && <span style={{ color:'#6b7280', fontWeight:600, textTransform:'none', letterSpacing:0 }}>· up to {isSession(sport) ? sessionQty(sport, maxDur) : `${maxDur} hours`} available</span>}</label>
            <div style={{ display:'grid', gridTemplateColumns:`repeat(${Math.min(hourOptions.length, 6)},1fr)`, gap:8 }}>
              {hourOptions.map(h => {
                const disabled = h > maxDur;
                const active = parseInt(form.duration_hrs,10) === h;
                return (
                  <button key={h} type="button" onClick={()=>!disabled && setForm({...form, duration_hrs:h})}
                    disabled={disabled}
                    style={{
                      padding:'12px 10px', borderRadius:8,
                      background: active ? '#f59e0b' : '#fff',
                      color: active ? '#fff' : (disabled ? '#9ca3af' : '#111'),
                      border: '1.5px solid ' + (active ? '#f59e0b' : '#e5e7eb'),
                      fontSize:13, fontWeight:700, cursor: disabled ? 'not-allowed' : 'pointer',
                      opacity: disabled ? 0.4 : 1
                    }}>
                    {isSession(sport) ? sessionQty(sport, h) : `${h} hr${h>1?'s':''}`}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        <div className="form-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
          <div>
            <label style={lblStyle}>Customer Name *</label>
            <input value={form.customer_name} onChange={e=>setForm({...form, customer_name:e.target.value})} placeholder="Full name" style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Phone *</label>
            <input type="tel" value={form.phone} onChange={e=>setForm({...form, phone:e.target.value})} placeholder="98765 43210" style={inputStyle} maxLength={15}/>
          </div>
          <div>
            <label style={lblStyle}>Email</label>
            <input type="email" value={form.email} onChange={e=>setForm({...form, email:e.target.value})} placeholder="optional" style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Players</label>
            <input type="number" value={form.members_count} onChange={e=>setForm({...form, members_count:e.target.value})} min={1} max={30} style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Amount (₹)</label>
            <input type="number" value={form.amount} onChange={e=>setForm({...form, amount:e.target.value})}
              placeholder={`Auto · ${rupees(sport.price_per_slot)}/hr`} style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Payment Status</label>
            <select value={form.payment_status} onChange={e=>setForm({...form, payment_status:e.target.value})} style={inputStyle}>
              <option value="pending">Pending</option>
              <option value="paid">Paid</option>
            </select>
          </div>
          {form.payment_status === 'paid' && (
            <div style={{ gridColumn:'span 2' }}>
              <label style={lblStyle}>Payment Mode</label>
              <select value={form.payment_mode} onChange={e=>setForm({...form, payment_mode:e.target.value})} style={inputStyle}>
                <option value="">-- select --</option>
                <option value="cash">Cash</option>
                <option value="upi">UPI</option>
                <option value="card">Card</option>
              </select>
            </div>
          )}
        </div>
        <div style={{ fontSize:11, color:'#6b7280', marginTop:6 }}>Leave Amount blank and the server charges the sport's hourly price × hours.</div>

        {err && <div style={{ background:'#fef2f2', color:'#991b1b', padding:'10px 14px', borderRadius:8, fontSize:13, marginTop:14 }}>⚠ {err}</div>}

        <div style={{ display:'flex', gap:8, marginTop:20, justifyContent:'flex-end' }}>
          <button onClick={onClose} style={{ padding:'11px 18px', background:'#f3f4f6', color:'#374151', borderRadius:8, fontWeight:700, fontSize:13 }}>Cancel</button>
          <button onClick={submit} disabled={submitting || !form.slot_time} style={{ padding:'11px 22px', background: (submitting||!form.slot_time)?'#d1d5db':'#f59e0b', color: (submitting||!form.slot_time)?'#6b7280':'#fff', borderRadius:8, fontWeight:800, fontSize:13, display:'inline-flex', alignItems:'center', gap:8 }}>
            {submitting && <Spinner small/>}{submitting?'Creating…':'Create Booking'}
          </button>
        </div>
      </div>
    </div>
  );
}

const lblStyle = { display:'block', fontSize:11, fontWeight:700, color:'#6b7280', textTransform:'uppercase', letterSpacing:'.06em', marginBottom:6 };
const inputStyle = { width:'100%', padding:'10px 12px', border:'1.5px solid #e5e7eb', borderRadius:8, fontSize:14, outline:'none', background:'#fff' };

// ──────────────────────────────────────────────────────────
// EDIT BOOKING MODAL — change sport, slot date/time, duration and amount
// ──────────────────────────────────────────────────────────
function EditBookingModal({ booking, onClose, onSave }){
  const cfg = useConfig();
  const [form, setForm] = useState({
    sport_id: booking.sport,
    booking_date: booking.booking_date,
    slot_id: booking.slot_id,
    slot_time: booking.slot_time,
    duration_hrs: booking.duration_hrs || 1,
    amount: '',            // blank → server rule (hourly rate × hours, or new sport's price)
    notes: booking.notes || '',
    members_count: booking.members_count || 1
  });
  const [availSlots, setAvailSlots] = useState([]);
  const [loadingSlots, setLoadingSlots] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [err, setErr] = useState(null);

  const current = cfg.sport(booking.sport);
  const sport = cfg.sport(form.sport_id);
  const sportChanged = form.sport_id !== booking.sport;
  // The booking's own sport stays selectable even if it has since been turned off or archived
  const sportOptions = cfg.bookable.some(s => s.sport_id === booking.sport) ? cfg.bookable : [current, ...cfg.bookable];
  const currentDur = booking.duration_hrs || 1;
  const maxHours = Math.max(sport.max_slots_per_booking || 3, currentDur);

  // Fetch open hours whenever date or sport changes. exclude_booking_id frees this booking's own slots,
  // so every hour listed is one updateBooking will accept (API_CONTRACT.md).
  useEffect(()=>{
    let cancelled = false;
    (async ()=>{
      setLoadingSlots(true);
      try {
        const hours = await loadSportHours(form.booking_date, form.sport_id, booking.booking_id);
        if (cancelled) return;
        const [startStr] = String(booking.slot_time).split('-');
        const keepCurrent = form.booking_date === booking.booking_date && !sportChanged;
        // The booking's own start hour keeps its slot_id, so the server keeps its current resource.
        const list = hours.map(h => keepCurrent && h.slot_time.startsWith(startStr + '-')
          ? { ...h, slot_id: booking.slot_id, _current: true } : h);
        if (keepCurrent) {
          const hasCurrent = list.some(s => s._current);
          if (!hasCurrent) {
            // Not listed because the hour has already started today; keep it selectable.
            // The booking's slot_time may span multiple hours (e.g. "14:00-17:00") — use the START hour.
            const [sh, sm] = startStr.split(':').map(Number);
            const startMin = sh * 60 + (sm || 0);
            const endMin = startMin + 60;
            const fmt = m => String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
            list.unshift({
              slot_id:   booking.slot_id,
              slot_date: booking.booking_date,
              slot_time: fmt(startMin) + '-' + fmt(endMin),
              resource:  booking.resource,
              max_duration: maxHours,
              _current:  true
            });
          }
        }
        setAvailSlots(list);
      } catch(e) {
        if (!cancelled) { setAvailSlots([]); setErr('Could not load slots: '+e.message); }
      } finally {
        if (!cancelled) setLoadingSlots(false);
      }
    })();
    return ()=>{ cancelled = true; };
  }, [form.booking_date, form.sport_id]);

  async function submit(){
    setErr(null);
    if (!form.slot_id) { setErr('Pick a slot'); return; }
    setSubmitting(true);
    try {
      await API.post('updateBooking', {
        id: booking.booking_id,
        slot_id: form.slot_id,
        sport_id: sportChanged ? form.sport_id : undefined,
        duration_hrs: parseInt(form.duration_hrs, 10) || 1,
        amount: String(form.amount).trim() === '' ? undefined : parseInt(form.amount, 10) || 0,
        notes: form.notes,
        members_count: parseInt(form.members_count, 10) || 1
      });
      onSave();
      onClose();
    } catch(e){ setErr(e.message); setSubmitting(false); }
  }

  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{
      position:'fixed', inset:0, background:'rgba(0,0,0,.5)', zIndex:140,
      display:'grid', placeItems:'center', padding:16, overflowY:'auto'
    }}>
      <div className="modal-inner" style={{
        background:'#fff', borderRadius:16, padding:24, maxWidth:600, width:'100%',
        boxShadow:'0 24px 80px rgba(0,0,0,.3)', maxHeight:'92vh', overflowY:'auto'
      }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:18 }}>
          <div>
            <div style={{ fontSize:20, fontWeight:800 }}>Edit Booking</div>
            <div style={{ fontSize:12, color:'#9ca3af', marginTop:2, fontFamily:'monospace' }}>{booking.booking_id} · {booking.customer_name}</div>
          </div>
          <button onClick={onClose} style={{ fontSize:22, color:'#9ca3af', padding:0, lineHeight:1 }}>×</button>
        </div>

        <div style={{ background:'#f9fafb', padding:12, borderRadius:8, marginBottom:16, fontSize:13 }}>
          <div style={{ color:'#6b7280', fontSize:11, textTransform:'uppercase', letterSpacing:'.06em', fontWeight:700, marginBottom:4 }}>Current</div>
          <div><strong>{current.icon} {current.name}</strong> · {formatDateShort(booking.booking_date)} · {slotTimeText(current, booking.slot_time)}{isSession(current) ? ` · ${sessionQty(current, booking.duration_hrs)}` : ''} · {rupees(booking.amount)}</div>
        </div>

        <div style={{ marginBottom:14 }}>
          <label style={lblStyle}>Sport {sportChanged && <span style={{ textTransform:'none', color:'#f59e0b', fontWeight:700, letterSpacing:0 }}>· changing from {current.name}</span>}</label>
          <SportPicker sports={sportOptions} value={form.sport_id} onChange={id=>setForm(f => ({ ...f, sport_id:id, slot_id:'' }))}/>
        </div>

        <div style={{ marginBottom:14 }}>
          <label style={lblStyle}>Date</label>
          <input type="date" value={form.booking_date}
            onChange={e=>setForm({...form, booking_date:e.target.value, slot_id:''})}
            style={inputStyle}/>
        </div>

        <div style={{ marginBottom:16 }}>
          <label style={lblStyle}>
            Slot {form.slot_id && <span style={{ textTransform:'none', color:'#10b981', fontWeight:700, letterSpacing:0 }}>· Selected</span>}
          </label>
          {loadingSlots ? (
            <div style={{ padding:'20px', background:'#f9fafb', borderRadius:8, textAlign:'center', display:'flex', alignItems:'center', justifyContent:'center', gap:10, color:'#6b7280', fontSize:13 }}>
              <Spinner small/> Loading slots…
            </div>
          ) : availSlots.length === 0 ? (
            <div style={{ padding:'20px', background:'#fef2f2', border:'1px dashed #fecaca', borderRadius:8, textAlign:'center', color:'#991b1b', fontSize:13 }}>
              No slots available for this date.
            </div>
          ) : (
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(110px, 1fr))', gap:6, maxHeight:240, overflowY:'auto', padding:6, background:'#fafafa', borderRadius:8, border:'1px solid #e5e7eb' }}>
              {availSlots.map(s => {
                const active = form.slot_id === s.slot_id;
                return (
                  <button key={s.slot_time} type="button"
                    onClick={()=>setForm({...form, slot_id:s.slot_id, slot_time:s.slot_time})}
                    style={{
                      padding:'9px 8px', borderRadius:7,
                      background: active ? '#f59e0b' : (s._current ? '#ecfdf5' : '#fff'),
                      color: active ? '#fff' : '#111',
                      border: '1.5px solid ' + (active ? '#f59e0b' : (s._current ? '#10b981' : '#e5e7eb')),
                      fontSize:12, fontWeight:700, lineHeight:1.3, cursor:'pointer'
                    }}>
                    <div style={{ fontFamily:'monospace' }}>{slotTimeText(sport, s.slot_time)}</div>
                    {s._current && <div style={{ fontSize:9, opacity:.8 }}>current</div>}
                    {isPooled(sport) && !s._current && <div style={{ fontSize:9, opacity:.7 }}>{s.available} left</div>}
                    {s.max_duration > 1 && !s._current && (
                      <div style={{ fontSize:9, opacity:.7 }}>up to {isSession(sport) ? sessionQty(sport, s.max_duration) : `${s.max_duration}h`}</div>
                    )}
                  </button>
                );
              })}
            </div>
          )}
        </div>

        {/* Duration picker — extend / shrink the booking */}
        {form.slot_id && (
          <div style={{ marginBottom:16 }}>
            <label style={lblStyle}>Duration <span style={{ color:'#6b7280', fontWeight:600, textTransform:'none', letterSpacing:0 }}>· extend or shrink the booking</span></label>
            <div style={{ display:'grid', gridTemplateColumns:`repeat(${Math.min(maxHours, 6)},1fr)`, gap:8 }}>
              {Array.from({ length: maxHours }, (_, i) => i + 1).map(h => {
                const active = parseInt(form.duration_hrs,10) === h;
                return (
                  <button key={h} type="button" onClick={()=>setForm({...form, duration_hrs:h})}
                    style={{
                      padding:'12px 10px', borderRadius:8,
                      background: active ? '#f59e0b' : '#fff',
                      color: active ? '#fff' : '#111',
                      border: '1.5px solid ' + (active ? '#f59e0b' : '#e5e7eb'),
                      fontSize:13, fontWeight:700, cursor:'pointer'
                    }}>
                    {isSession(sport) ? sessionQty(sport, h) : `${h} hr${h>1?'s':''}`}
                  </button>
                );
              })}
            </div>
            <div style={{ fontSize:11, color:'#6b7280', marginTop:6 }}>If consecutive slots aren't free, the system will show an error.</div>
          </div>
        )}

        <div className="form-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:6 }}>
          <div>
            <label style={lblStyle}>Amount (₹)</label>
            <input type="number" value={form.amount}
              onChange={e=>setForm({...form, amount:e.target.value})}
              placeholder={`Auto · now ${rupees(booking.amount)}`}
              style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Players</label>
            <input type="number" value={form.members_count}
              onChange={e=>setForm({...form, members_count:e.target.value})}
              min={1} style={inputStyle}/>
          </div>
        </div>
        <div style={{ fontSize:11, color:'#6b7280', marginBottom:14 }}>
          Leave Amount blank: the server keeps the hourly rate × new hours{sportChanged ? `, using ${sport.name}'s price` : ''}.
        </div>

        <div style={{ marginBottom:16 }}>
          <label style={lblStyle}>Notes</label>
          <textarea value={form.notes}
            onChange={e=>setForm({...form, notes:e.target.value})}
            style={{ ...inputStyle, minHeight:60, resize:'vertical' }}/>
        </div>

        {err && <div style={{ background:'#fef2f2', color:'#991b1b', padding:'10px 14px', borderRadius:8, fontSize:13, marginBottom:14 }}>⚠ {err}</div>}

        <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
          <button onClick={onClose} style={{ padding:'11px 18px', background:'#f3f4f6', color:'#374151', borderRadius:8, fontWeight:700, fontSize:13 }}>Cancel</button>
          <button onClick={submit} disabled={submitting || !form.slot_id} style={{ padding:'11px 22px', background:(submitting||!form.slot_id)?'#d1d5db':'#f59e0b', color:(submitting||!form.slot_id)?'#6b7280':'#fff', borderRadius:8, fontWeight:800, fontSize:13, display:'inline-flex', alignItems:'center', gap:8 }}>
            {submitting && <Spinner small/>}{submitting?'Saving…':'Save Changes'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ──────────────────────────────────────────────────────────
// PASS MODAL (create/edit member)
// ──────────────────────────────────────────────────────────
function PassModal({ onClose, onCreate, editing }){
  const [form, setForm] = useState(editing ? {
    plan_key: editing.plan_key || PLANS[0].key,
    team_name: editing.team_name || '',
    contact_name: editing.contact_name || '',
    contact_phone: editing.contact_phone || '',
    contact_email: editing.contact_email || '',
    members_list: editing.members_list || '',
    start_date: editing.start_date || formatDateISO(new Date()),
    amount_paid: editing.amount_paid || '',
    notes: editing.notes || ''
  } : {
    plan_key: PLANS[0].key,
    team_name: '', contact_name: '', contact_phone: '', contact_email: '',
    members_list: '',
    start_date: formatDateISO(new Date()),
    amount_paid: '',
    notes: ''
  });
  const [submitting, setSubmitting] = useState(false);
  const [err, setErr] = useState(null);

  const plan = PLANS.find(p => p.key === form.plan_key);

  useEffect(()=>{
    if(!form.amount_paid && plan) setForm(f => ({ ...f, amount_paid: plan.price }));
  }, [form.plan_key]);

  async function submit(){
    setErr(null);
    if(!form.team_name.trim()){ setErr('Team name required'); return; }
    if(!form.contact_name.trim()){ setErr('Contact name required'); return; }
    if(normalizePhone(form.contact_phone).length !== 10){ setErr('Valid 10-digit phone required'); return; }
    setSubmitting(true);
    try {
      if(editing){
        await API.post('updateMember', {
          id: editing.member_id,
          team_name: form.team_name.trim(),
          contact_name: form.contact_name.trim(),
          contact_phone: normalizePhone(form.contact_phone),
          contact_email: form.contact_email.trim(),
          members_list: form.members_list.trim(),
          amount_paid: parseInt(form.amount_paid,10) || plan.price,
          notes: form.notes.trim()
        });
      } else {
        await API.post('createMember', {
          plan_key: form.plan_key,
          team_name: form.team_name.trim(),
          contact_name: form.contact_name.trim(),
          contact_phone: normalizePhone(form.contact_phone),
          contact_email: form.contact_email.trim(),
          members_list: form.members_list.trim(),
          start_date: form.start_date,
          amount_paid: parseInt(form.amount_paid,10) || plan.price,
          notes: form.notes.trim()
        });
      }
      onCreate();
      onClose();
    } catch(e){ setErr(e.message); setSubmitting(false); }
  }

  const turfPlans = PLANS.filter(p => p.category === 'turf');
  const netPlans  = PLANS.filter(p => p.category === 'net');

  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{
      position:'fixed', inset:0, background:'rgba(0,0,0,.5)', zIndex:140,
      display:'grid', placeItems:'center', padding:16, overflowY:'auto'
    }}>
      <div className="modal-inner" style={{
        background:'#fff', borderRadius:16, padding:24, maxWidth:560, width:'100%',
        boxShadow:'0 24px 80px rgba(0,0,0,.3)', maxHeight:'92vh', overflowY:'auto'
      }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:18 }}>
          <div>
            <div style={{ fontSize:20, fontWeight:800 }}>{editing ? 'Edit Member' : 'New Membership'}</div>
            <div style={{ fontSize:12, color:'#9ca3af', marginTop:2 }}>{editing ? 'Update member details' : 'Issue a new turf or net pass'}</div>
          </div>
          <button onClick={onClose} style={{ fontSize:22, color:'#9ca3af', padding:0, lineHeight:1 }}>×</button>
        </div>

        {!editing && (
          <div style={{ marginBottom:18 }}>
            <label style={lblStyle}>Plan</label>
            <select value={form.plan_key} onChange={e=>setForm({...form, plan_key:e.target.value, amount_paid:''})} style={inputStyle}>
              <optgroup label="Turf Passes">
                {turfPlans.map(p => <option key={p.key} value={p.key}>{p.label} · ₹{p.price.toLocaleString('en-IN')}</option>)}
              </optgroup>
              <optgroup label="Net Practice Packages">
                {netPlans.map(p => <option key={p.key} value={p.key}>{p.label} · ₹{p.price.toLocaleString('en-IN')}</option>)}
              </optgroup>
            </select>
            {plan && (

function LeadModal({ onClose, onSave, editing }){
  const cfg = useConfig();
  const [form, setForm] = useState(editing ? {
    name: editing.name, phone: editing.phone, email: editing.email || '',
    sport: editing.sport || '', interest: editing.interest || '',
    status: editing.status || 'new', notes: editing.notes || ''
  } : { name:'', phone:'', email:'', sport:'', interest:'', status:'new', notes:'' });
  const [submitting, setSubmitting] = useState(false);
  const [err, setErr] = useState(null);

  async function submit(){
    setErr(null);
    if(!form.name.trim()){ setErr('Name required'); return; }
    if(normalizePhone(form.phone).length !== 10){ setErr('Valid 10-digit phone required'); return; }
    setSubmitting(true);
    try {
      if(editing){
        await API.post('updateLead', { id: editing.lead_id, ...form });
      } else {
        await API.post('createLead', {
          name: form.name.trim(),
          phone: normalizePhone(form.phone),
          email: form.email.trim(),
          sport: form.sport,
          interest: form.interest,
          source: 'manual',
          notes: form.notes.trim()
        });
      }
      onSave(); onClose();
    } catch(e){ setErr(e.message); setSubmitting(false); }
  }

  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{
      position:'fixed', inset:0, background:'rgba(0,0,0,.5)', zIndex:140,
      display:'grid', placeItems:'center', padding:16
    }}>
      <div className="modal-inner" style={{ background:'#fff', borderRadius:16, padding:24, maxWidth:460, width:'100%', boxShadow:'0 24px 80px rgba(0,0,0,.3)' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:18 }}>
          <div style={{ fontSize:20, fontWeight:800 }}>{editing ? 'Edit Lead' : 'New Lead'}</div>
          <button onClick={onClose} style={{ fontSize:22, color:'#9ca3af', padding:0, lineHeight:1 }}>×</button>
        </div>
        <div className="form-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
          <div><label style={lblStyle}>Name *</label><input value={form.name} onChange={e=>setForm({...form, name:e.target.value})} style={inputStyle}/></div>
          <div><label style={lblStyle}>Phone *</label><input value={form.phone} onChange={e=>setForm({...form, phone:e.target.value})} style={inputStyle} maxLength={15}/></div>
          <div><label style={lblStyle}>Email</label><input value={form.email} onChange={e=>setForm({...form, email:e.target.value})} style={inputStyle}/></div>
          <div><label style={lblStyle}>Sport Interest</label>
            <select value={form.sport} onChange={e=>setForm({...form, sport:e.target.value})} style={inputStyle}>
              <option value="">--</option>
              {cfg.sports.filter(s => !s.archived || s.sport_id === form.sport).map(s => <option key={s.sport_id} value={s.sport_id}>{s.icon} {s.name}</option>)}
            </select>
          </div>
          <div><label style={lblStyle}>Interest Type</label>
            <select value={form.interest} onChange={e=>setForm({...form, interest:e.target.value})} style={inputStyle}>
              <option value="">--</option>
              <option value="regular">Regular Booking</option>
              <option value="pass">Weekly/Monthly Pass</option>
              <option value="tournament">Tournament</option>
              <option value="coaching">Coaching</option>
            </select>
          </div>
          {editing && (
            <div><label style={lblStyle}>Status</label>
              <select value={form.status} onChange={e=>setForm({...form, status:e.target.value})} style={inputStyle}>
                <option>new</option><option>contacted</option><option>qualified</option><option>converted</option><option>lost</option>
              </select>
            </div>
          )}
          <div style={{ gridColumn: 'span 2' }}><label style={lblStyle}>Notes</label><input value={form.notes} onChange={e=>setForm({...form, notes:e.target.value})} style={inputStyle}/></div>
        </div>
        {err && <div style={{ background:'#fef2f2', color:'#991b1b', padding:'10px 14px', borderRadius:8, fontSize:13, marginTop:14 }}>⚠ {err}</div>}

          <button onClick={submit} disabled={submitting} style={{ padding:'11px 22px', background:'#6366f1', color:'#fff', borderRadius:8, fontWeight:800, fontSize:13, display:'inline-flex', alignItems:'center', gap:8 }}>

function ActionBtn({ as, href, target, onClick, bg, icon, label, disabled }){
  const baseStyle = {
    padding:'12px 10px', background: disabled ? '#cbd5e1' : bg, color:'#fff',
    borderRadius:10, fontWeight:700, fontSize:13,
    display:'inline-flex', alignItems:'center', justifyContent:'center', gap:6,
    textDecoration:'none', textAlign:'center', border:'none',
    cursor: disabled ? 'not-allowed' : 'pointer', opacity: disabled ? 0.5 : 1
  };
  if (as === 'a' && !disabled){
    return <a href={href} target={target} rel="noopener" style={baseStyle}><span>{icon}</span> {label}</a>;
  }
  return <button onClick={onClick} disabled={disabled} style={baseStyle}><span>{icon}</span> {label}</button>;
}

function formatDateFull(iso){
  if (!iso) return '';
  return new Date(iso + 'T00:00:00').toLocaleDateString('en-IN', {
    weekday:'long', day:'numeric', month:'long', year:'numeric'
  });
}

const ICON_SUGGESTIONS = ['🏏','⚽','🏐','🥅','🎯','🏸','🎾','🏀','🏓','🏑'];
const ID_RE = /^[a-z0-9-]{2,30}$/;   // sport_id / resource_id rule from API_CONTRACT.md
const isInt = v => /^-?\d+$/.test(String(v).trim());
function slugify(s){ return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30); }

function sportStatus(s){
  if (s.archived)        return { label:'Archived',     bg:'#f3f4f6', text:'#6b7280' };
  if (!s.active)         return { label:'Hidden',       bg:'#fee2e2', text:'#991b1b' };
  if (!s.online_booking) return { label:'Walk-in only', bg:'#fef3c7', text:'#92400e' };
  return                        { label:'Active',       bg:'#d1fae5', text:'#065f46' };
}
function impactLine(n){
  return n ? `${n} upcoming booking${n > 1 ? 's' : ''} will still be honoured.` : 'No upcoming bookings are affected.';
}

// Mirrors the backend's sport validation table (API_CONTRACT.md → "Sport validation").
function validateSport(f, isCreate, sports){
  const e = {};
  if (isCreate) {
    if (!ID_RE.test(f.sport_id)) e.sport_id = 'Use 2–30 lowercase letters, digits or dashes.';
    else if (sports.some(s => s.sport_id === f.sport_id)) e.sport_id = `Sport id "${f.sport_id}" already exists.`;
  }
  const name = f.name.trim();
  if (name.length < 1 || name.length > 40) e.name = 'Name must be 1–40 characters.';
  if (!isInt(f.price_per_slot) || +f.price_per_slot < 50 || +f.price_per_slot > 50000) e.price_per_slot = 'Whole rupees, 50–50000.';
  if (!f.resource_pool.length) e.resource_pool = 'Pick at least one resource.';
  const mc = String(f.max_concurrent).trim();
  if (mc !== '' && (!isInt(mc) || +mc < 1 || +mc > f.resource_pool.length)) e.max_concurrent = `Blank (= all), or 1–${f.resource_pool.length || 1}.`;
  if (!isInt(f.max_slots_per_booking) || +f.max_slots_per_booking < 1 || +f.max_slots_per_booking > 6) e.max_slots_per_booking = 'Whole hours, 1–6.';
  if (!isInt(f.sort_order)) e.sort_order = 'Whole number.';
  if (f.pricing_mode === 'session') {
    if (!isInt(f.session_qty) || +f.session_qty < 1 || +f.session_qty > 1000) e.session_qty = 'Whole number, 1–1000.';
    const u = f.session_unit.trim();
    if (u.length < 1 || u.length > 20) e.session_unit = 'Unit must be 1–20 characters.';
  }
  return e;
}

    </button>
  );
}

function FieldErr({ msg }){ return msg ? <div style={{ fontSize:11, color:'#dc2626', marginTop:4, fontWeight:600 }}>{msg}</div> : null; }

function SportDrawer({ sport, onClose, onSaved }){
  const cfg = useConfig();
  const isCreate = !sport;
  const nextSort = Math.max(0, ...cfg.sports.map(s => s.sort_order || 0)) + 10;
  const [f, setF] = useState(() => sport ? {
    sport_id: sport.sport_id, name: sport.name || '', icon: sport.icon || '', tagline: sport.tagline || '',
    unit_label: sport.unit_label || '', price_per_slot: String(sport.price_per_slot ?? ''),
    resource_pool: sport.resource_pool || [], max_concurrent: sport.max_concurrent == null ? '' : String(sport.max_concurrent),
    max_slots_per_booking: String(sport.max_slots_per_booking ?? 3), online_booking: sport.online_booking !== false,
    pricing_mode: sport.pricing_mode === 'session' ? 'session' : 'hourly',
    session_qty: sport.session_qty == null ? '' : String(sport.session_qty), session_unit: sport.session_unit || '',
    sort_order: String(sport.sort_order ?? 0)
  } : {
    sport_id:'', name:'', icon:'', tagline:'', unit_label:'', price_per_slot:'', resource_pool:[],
    max_concurrent:'', max_slots_per_booking:'3', online_booking:true, sort_order:String(nextSort),
    pricing_mode:'hourly', session_qty:'', session_unit:''
  });
  const [slugTouched, setSlugTouched] = useState(false);
  const [touched, setTouched] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [serverErr, setServerErr] = useState(null);
  const [saving, setSaving] = useState(false);
  const [archiveText, setArchiveText] = useState(null);   // null = archive confirm closed

  const errors = validateSport(f, isCreate, cfg.sports);
  const show = k => (submitted || touched[k]) ? errors[k] : null;
  const blur = k => () => setTouched(t => ({ ...t, [k]: true }));
  const set = (k, v) => setF(prev => {
    const next = { ...prev, [k]: v };
    if (k === 'name' && isCreate && !slugTouched) next.sport_id = slugify(v);
    return next;
  });
  function togglePool(id){
    // keep the existing pool order (it is the auto-assign order); new picks go last
    setF(prev => ({ ...prev, resource_pool: prev.resource_pool.includes(id) ? prev.resource_pool.filter(x => x !== id) : [...prev.resource_pool, id] }));
    setTouched(t => ({ ...t, resource_pool: true }));

  async function save(){
    setSubmitted(true); setServerErr(null);
    if (Object.keys(errors).length) return;
    setSaving(true);
    try {
      const saved = await API.post(isCreate ? 'createSport' : 'updateSport', {
        sport_id: f.sport_id.trim(), name: f.name.trim(), icon: f.icon.trim(), tagline: f.tagline.trim(),

function ResourceRow({ r, onToggle, onSaveConflicts, busy }){
  const cfg = useConfig();
  const saved = r.conflicts || [];
  const [draft, setDraft] = useState(saved);
  useEffect(()=>{ setDraft(saved); }, [saved.join(',')]);
  const dirty = [...draft].sort().join() !== [...saved].sort().join();
  const others = cfg.resources.filter(x => x.resource_id !== r.resource_id);
  const usedBy = cfg.sports.filter(sp => !sp.archived && (sp.resource_pool || []).includes(r.resource_id));
  return (
    <div style={{ border:'1px solid #e5e7eb', borderRadius:10, padding:'12px 14px', opacity: r.active ? 1 : .85, background: r.active ? '#fff' : '#fafafa' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:10, flexWrap:'wrap' }}>
        <div>
          <div style={{ fontWeight:800, fontSize:14 }}>{r.label} <span style={{ fontFamily:'monospace', fontSize:11, color:'#94a3b8', fontWeight:600 }}>{r.resource_id}</span></div>
          <div style={{ fontSize:11, color:'#64748b', marginTop:2 }}>
            {usedBy.length ? 'Used by ' + usedBy.map(sp => sp.name).join(', ') : 'Not used by any sport yet'}
          </div>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:8, fontSize:12, fontWeight:700, color: r.active ? '#065f46' : '#991b1b' }}>
          <Toggle on={r.active} disabled={busy} onChange={v=>onToggle(r, v)} label={`${r.label}: available or under maintenance`}/>
          {r.active ? 'Available' : 'Under maintenance'}
        </div>
      </div>
      <div style={{ marginTop:10 }}>
        <div style={{ fontSize:10.5, fontWeight:800, color:'#64748b', textTransform:'uppercase', letterSpacing:'.06em', marginBottom:6 }}>Shares space with</div>
        <div style={{ display:'flex', gap:5, flexWrap:'wrap', alignItems:'center' }}>
          {others.map(o => {
            const on = draft.includes(o.resource_id);
            return (
              <button key={o.resource_id} type="button" aria-pressed={on}
                onClick={()=>setDraft(d => on ? d.filter(x => x !== o.resource_id) : [...d, o.resource_id])}
                style={{ padding:'5px 10px', borderRadius:99, fontSize:11, fontWeight:700,
                  background: on ? '#111' : '#f3f4f6', color: on ? '#fff' : '#6b7280' }}>
                {on ? '✓ ' : ''}{o.label}
              </button>
            );
          })}
          {dirty && (
            <>
              <button onClick={()=>onSaveConflicts(r, draft)} disabled={busy} style={{ padding:'5px 12px', borderRadius:7, fontSize:11, fontWeight:800, background:'#f59e0b', color:'#fff' }}>Save</button>
              <button onClick={()=>setDraft(saved)} style={{ padding:'5px 10px', borderRadius:7, fontSize:11, fontWeight:700, color:'#6b7280' }}>Undo</button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

const AUDIT_FIELDS = {
  name:'name', icon:'icon', tagline:'tagline', unit_label:'unit', price_per_slot:'price',
  resource_pool:'resources', max_concurrent:'max at the same time', max_slots_per_booking:'max hours per booking',
  online_booking:'show on website', sort_order:'sort order', label:'label',
  pricing_mode:'charge per', session_qty:'session qty', session_unit:'session unit'
};
function auditVal(k, v, cfg){
  if (v == null || v === '') return k === 'max_concurrent' ? 'all' : '—';
  if (Array.isArray(v)) return v.map(cfg.resourceLabel).join(', ') || 'none';
  if (typeof v === 'boolean') return v ? 'on' : 'off';
  return String(v);
}
function describeAudit(e, cfg){
  const before = e.before || {}, after = e.after || {};
  const name = e.entity === 'sport'
    ? (after.name || before.name || cfg.sport(e.entity_id).name)
    : (after.label || before.label || cfg.resourceLabel(e.entity_id));
  switch (e.action) {
    case 'createSport':      return `${name} created`;
    case 'setSportActive':   return `${name} turned ${after.active ? 'on' : 'off'}`;
    case 'archiveSport':     return `${name} archived`;
    case 'restoreSport':     return `${name} restored`;
    case 'createResource':   return `Resource ${name} added`;
    case 'setResourceActive': return `${name} marked ${after.active ? 'available' : 'under maintenance'}`;
    case 'setResourceConflicts':
      return (after.conflicts || []).length
        ? `${name} now shares space with ${auditVal('', after.conflicts, cfg)}`
        : `${name} no longer shares space with anything`;
    case 'generateSlotsForResource':
      return `Slots generated for ${name}${after.added != null ? ` (${after.added} added)` : ''}`;
    case 'updateSport':
    case 'updateResource': {
      const changes = Object.keys(AUDIT_FIELDS)
        .filter(k => k in after && JSON.stringify(before[k]) !== JSON.stringify(after[k]))
        .map(k => `${AUDIT_FIELDS[k]} ${auditVal(k, before[k], cfg)} → ${auditVal(k, after[k], cfg)}`);
      return changes.length ? `${name} ${changes.join(', ')}` : `${name} saved (no changes)`;
    }
    default: return `${e.action} · ${e.entity_id}`;
  }
}
function auditTime(at){
  return new Date(at).toLocaleString('en-IN', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit', hour12:true, timeZone:'Asia/Kolkata' })
    .replace(/\b(am|pm)\b/i, m => m.toUpperCase());
}

function SportsManager({ patchConfig, ok, err, setConfirm }){
  const cfg = useConfig();
  const [drawer, setDrawer] = useState(null);        // { sport } — sport null = create
  const inFlight = useRef(new Set());                // ids of sports/resources with a write in flight
  const [, rerender] = useState(0);
  const isBusy = id => inFlight.current.has(id);
  const [audit, setAudit] = useState(null);
  const [auditErr, setAuditErr] = useState(null);
  const [newRes, setNewRes] = useState({ resource_id:'', label:'' });
  const [newResErr, setNewResErr] = useState(null);
  const [justAdded, setJustAdded] = useState(null);  // resource_id awaiting "Generate slots now"

  const loadAudit = useCallback(async () => {
    try { setAudit(await API.get('listAudit') || []); setAuditErr(null); }
    catch(e){ setAuditErr(e.message); }
  }, []);
  useEffect(()=>{ loadAudit(); }, []);

  // Apply each write's own response. Re-listing right after a write can hit a server instance whose
  // config cache is up to 30 s stale (API_CONTRACT.md) and show the old state until reload.
  const upsert = (list, key, row) => {
    const i = list.findIndex(x => x[key] === row[key]);
    const next = i < 0 ? [...list, row] : list.map((x, j) => j === i ? { ...x, ...row } : x);
    return next.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  };
  const applySport = sp => patchConfig(c => ({ sports: upsert(c.sports, 'sport_id', sp) }));
  const applyResource = r => patchConfig(c => ({ resources: upsert(c.resources, 'resource_id', r) }));
  // Conflicts are symmetric: update the other resources' lists too.
  const applyConflicts = (id, list) => patchConfig(c => ({ resources: c.resources.map(x => x.resource_id === id
    ? { ...x, conflicts: list }
    : { ...x, conflicts: list.includes(x.resource_id) ? [...new Set([...(x.conflicts || []), id])] : (x.conflicts || []).filter(y => y !== id) }) }));

  function afterWrite(msg){ if (msg) ok(msg); loadAudit(); }
  async function run(id, fn, onErr = e => err(e.message)){
    if (inFlight.current.has(id)) return;        // double click → still one request
    inFlight.current.add(id); rerender(n => n + 1);
    try { await fn(); } catch(e){ onErr(e); } finally { inFlight.current.delete(id); rerender(n => n + 1); }
  }

  function toggleSport(s, on){
    if (on) return run(s.sport_id, async () => {
      const r = await API.post('setSportActive', { sport_id: s.sport_id, active: true });
      applySport(r.sport);
      afterWrite(`${s.name} is on`);
    });
    return run(s.sport_id, async () => {
      const impact = await API.get('getSportImpact', { sport_id: s.sport_id });
      setConfirm({ show:true, title:`Turn off ${s.name}?`, danger:true, confirmLabel:'Turn off',
        message: `${impactLine(impact.count)} New online bookings will stop.`,
        onConfirm: () => run(s.sport_id, async () => {
          const r = await API.post('setSportActive', { sport_id: s.sport_id, active: false });
          applySport(r.sport);
          afterWrite(`${s.name} turned off`);
        })
      });
    });
  }

  function restoreSport(s){
    return run(s.sport_id, async () => {
      const r = await API.post('restoreSport', { sport_id: s.sport_id });
      applySport(r.sport);
      afterWrite(`${s.name} restored. It stays hidden until you turn it on.`);
    });
  }

  function toggleResource(r, on){
    if (on) return run(r.resource_id, async () => {
      const res = await API.post('setResourceActive', { resource_id: r.resource_id, active: true });
      applyResource(res.resource);
      afterWrite(`${r.label} is available`);
    });
    return run(r.resource_id, async () => {
      const impact = await API.get('getResourceImpact', { resource_id: r.resource_id });
      setConfirm({ show:true, title:`Put ${r.label} under maintenance?`, danger:true, confirmLabel:'Under maintenance',
        message: `${impactLine(impact.count)} ${r.label} won't be given to new bookings.`,
        onConfirm: () => run(r.resource_id, async () => {
          const res = await API.post('setResourceActive', { resource_id: r.resource_id, active: false });
          applyResource(res.resource);
          afterWrite(`${r.label} is under maintenance`);
        })
      });
    });
  }

  function saveConflicts(r, conflicts){
    return run(r.resource_id, async () => {
      const res = await API.post('setResourceConflicts', { resource_id: r.resource_id, conflicts });
      applyConflicts(res.resource_id, res.conflicts || []);
      afterWrite(`${r.label} conflicts saved`);
    });
  }

  async function addResource(){
    setNewResErr(null);
    const id = newRes.resource_id.trim(), label = newRes.label.trim();
    if (!ID_RE.test(id)) return setNewResErr('Id: 2–30 lowercase letters, digits or dashes (e.g. net4).');
    if (cfg.resources.some(r => r.resource_id === id)) return setNewResErr(`Resource "${id}" already exists.`);
    if (label.length < 1 || label.length > 40) return setNewResErr('Label must be 1–40 characters.');
    await run('new-resource', async () => {
      const row = await API.post('createResource', { resource_id: id, label });
      applyResource({ conflicts: [], ...row });
      setNewRes({ resource_id:'', label:'' });
      setJustAdded(id);
      afterWrite(`${label} added`);
    }, e => setNewResErr(e.message));
  }

  function generateSlots(id){
