function PricingCallout({ sports, error, onRetry }){
  return (
    <section className="section">
      <div className="price-callout">
        <div style={{marginBottom:32}}>
          <span className="section-eyebrow">Hourly rates</span>
          <h3 style={{fontFamily:'var(--display)',fontSize:'clamp(32px,4.5vw,52px)',letterSpacing:'-.01em',textTransform:'uppercase',lineHeight:1}}>Simple<br/><span className="lime">pricing.</span></h3>
        </div>
        {error && <SportsRetry onRetry={onRetry}/>}
        {!error && !sports && <div className="loading-block"><Spinner/></div>}
        {sports && (
          <div className="price-grid">
            {sports.map(s => (
              <div key={s.id} className="price-tile">
                <span className="price-tile-tag">{s.icon} {s.name}</span>
                <div className="price-tile-big">₹{Number(s.price).toLocaleString('en-IN')}</div>
                <div className="price-tile-meta">{isSession(s) ? sessionQty(s, 1) : `Per hour${s.unit_label ? ` · ${s.unit_label}` : ''}`}</div>
                {s.tagline && <div className="price-tile-meta" style={{marginBottom:0}}>{s.tagline}</div>}
              </div>
            ))}
          </div>
        )}
      </div>
    </section>
  );
}

function VenueInfo(){
  return (
    <section className="section">
      <div className="venue-grid">
        <div>
          <span className="section-eyebrow">Find us</span>
          <h2 className="section-h2" style={{fontSize:'clamp(36px,5vw,56px)'}}>{VENUE.area}.<br/>Open daily.</h2>
        </div>
        <div>
          <div className="venue-stat"><div className="ic">📍</div><div><div className="venue-stat-label">Address</div><div className="venue-stat-val">{VENUE.address}</div><a href={VENUE.maps} target="_blank" rel="noopener" className="lime" style={{fontSize:13,fontWeight:600,marginTop:6,display:'inline-block'}}>Open in Maps →</a></div></div>
          <div className="venue-stat"><div className="ic">⏰</div><div><div className="venue-stat-label">Hours</div><div className="venue-stat-val">{VENUE.hoursWeek}<br/>{VENUE.hoursWeekend}</div></div></div>
          <div className="venue-stat"><div className="ic">📞</div><div><div className="venue-stat-label">Phone</div><div className="venue-stat-val"><a href={`tel:${VENUE.phone.replace(/\s/g,'')}`}>{VENUE.phone}</a></div></div></div>
          <div className="venue-stat"><div className="ic">✉️</div><div><div className="venue-stat-label">Email</div><div className="venue-stat-val">{VENUE.email}</div></div></div>
        </div>
      </div>
    </section>
  );
}

function ManageBooking({ id, token, onDone }){
  const [data, setData] = useState(null);
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [confirming, setConfirming] = useState(false);
  const [result, setResult] = useState(null);

  async function load(){
    setErr(null);
    try { setData(await API.get('getManagedBooking', { id, t: token })); }
    catch(e){ setErr(e.message); }
  }
  useEffect(()=>{ load(); }, [id, token]);

  async function cancel(){
    setBusy(true);
    try { const r = await API.post('cancelMyBooking', { id, t: token }); setResult(r); setConfirming(false); load(); }
    catch(e){ setErr(e.message); setConfirming(false); }
    finally { setBusy(false); }
  }

  const b = data && data.booking;
  const t = data && data.terms;
  const sm = data && data.sport_meta;
  const timeText = b ? (sm && sm.pricing_mode === 'session' ? `${startTime12(b.slot_time)} · ${sm.session_qty * (b.duration_hrs||1)} ${sm.session_unit}` : b.slot_time) : '';
  const statusText = b ? ({ confirmed:'Confirmed', cancelled:'Cancelled', pending_payment:'Awaiting payment', expired:'Not completed' }[b.status] || b.status) : '';
  return (
    <section className="section" id="book" style={{paddingTop:120}}>
      <div className="section-head" style={{textAlign:'center'}}>
        <span className="section-eyebrow">Your booking</span>
        <h2 className="section-h2">Manage<br/><span className="lime">booking.</span></h2>
      </div>
      <div className="manage-card anim-rise">
        {!data && !err && <div className="loading-block"><Spinner/></div>}
        {err && !data && <div className="empty-block"><div className="empty-title">Couldn't open this booking</div><div style={{fontSize:13}}>{err}</div></div>}
        {b && <>
          <div className="ticket-row"><span className="ticket-label">Booking ID</span><span className="ticket-value mono">{b.booking_id}</span></div>
          <div className="ticket-row"><span className="ticket-label">Status</span><span className="ticket-value" style={{color: b.status==='confirmed' ? 'var(--lime)' : '#fca5a5'}}>{statusText}</span></div>
          <div className="ticket-row"><span className="ticket-label">Sport</span><span className="ticket-value">{data.sport_name}</span></div>
          <div className="ticket-row"><span className="ticket-label">Date</span><span className="ticket-value">{dateLong(b.booking_date)}</span></div>
          <div className="ticket-row"><span className="ticket-label">Time</span><span className="ticket-value">{timeText}</span></div>
          <div className="ticket-row"><span className="ticket-label">Total (incl. GST)</span><span className="ticket-value">{inr(b.amount)}</span></div>
          {Number(b.amount_paid) > 0 && <div className="ticket-row"><span className="ticket-label">Paid</span><span className="ticket-value">{inr(b.amount_paid)}</span></div>}
          {b.status === 'confirmed' && Number(b.balance_due) > 0 && <div className="ticket-row"><span className="ticket-label">Pay at venue</span><span className="ticket-value">{inr(b.balance_due)}</span></div>}
          {Number(b.refund_amount) > 0 && <div className="ticket-row"><span className="ticket-label">Refund</span><span className="ticket-value">{inr(b.refund_amount)} · {b.refund_status === 'processed' ? 'processed' : 'in progress (5-7 working days)'}</span></div>}

          {result && <div className="pay-status info">{result.refunded > 0 ? `Cancelled. ${inr(result.refunded)} is being refunded to your original payment method (5-7 working days).` : 'Cancelled. No refund applies to this booking.'}</div>}
          {err && <div className="pay-status err">{err}</div>}

          <div className="manage-actions">
            {data.invoice_url && <a className="btn-secondary" style={{justifyContent:'center'}} href={data.invoice_url} target="_blank" rel="noopener">View GST invoice</a>}
            <a className="btn-secondary" style={{justifyContent:'center'}} href={VENUE.maps} target="_blank" rel="noopener">Venue location</a>
            {t && t.can_cancel && !confirming && (
              <>
                <div className="field-hint" style={{textAlign:'center',fontSize:12}}>
                  {t.refund > 0 ? `Cancel now and get ${inr(t.refund)} back.` : `This is within ${t.cutoff_hours} hours of your slot, so the advance can't be refunded.`}
                </div>
                <button className="btn-danger" onClick={()=>setConfirming(true)}>Cancel booking</button>
              </>
            )}
            {confirming && (
              <div className="pay-status err" style={{textAlign:'center'}}>
                <div style={{marginBottom:12,fontWeight:700}}>Cancel this booking? {t.refund > 0 ? `${inr(t.refund)} will be refunded.` : 'No refund applies.'}</div>
                <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
                  <button className="btn-danger" disabled={busy} onClick={cancel}>{busy ? 'Cancelling…' : 'Yes, cancel'}</button>
                  <button className="btn-secondary" onClick={()=>setConfirming(false)}>Keep booking</button>
                </div>
              </div>
            )}
            {t && !t.can_cancel && b.status === 'confirmed' && <div className="field-hint" style={{textAlign:'center'}}>{t.reason} Call {VENUE.phone} for help.</div>}
          </div>
        </>}
      </div>
      <div style={{textAlign:'center',marginTop:28}}>
        <button className="btn-secondary" onClick={onDone}>Book another slot</button>
      </div>
    </section>
  );
}

function Policies({ payCfg }){
  const cutoff = (payCfg && payCfg.refund_cutoff_hours) || 12;
  const advance = (payCfg && payCfg.advance) || 300;
  return (
    <section className="section" id="policies">
      <div className="section-head">
        <span className="section-eyebrow">The fine print</span>
        <h2 className="section-h2" style={{fontSize:'clamp(36px,5vw,56px)'}}>Policies.</h2>
      </div>
      <div className="policy-grid">
        <div className="policy-card" id="refund-policy">
          <h3>Cancellation &amp; refunds</h3>
          <ul>
            <li>A ₹{advance} advance is paid online to confirm a booking. The balance is paid at the venue.</li>
            <li>Cancel at least {cutoff} hours before your slot for a full refund of the advance.</li>
            <li>Cancellations within {cutoff} hours of the slot, and no-shows, are not refunded.</li>
            <li>Refunds go back to the original payment method in 5-7 working days.</li>
            <li>If we cancel (weather, maintenance), you get a full refund.</li>
            <li>Cancel any time from the "Manage booking" link in your confirmation email.</li>
          </ul>
        </div>
        <div className="policy-card" id="terms">
          <h3>Terms of booking</h3>
          <ul>
            <li>Bookings are for the date, time and facility shown on your confirmation.</li>
            <li>Please arrive on time; slots end on schedule and can't be extended into the next booking.</li>
            <li>All prices include GST @ 18%. A GST tax invoice is issued for every paid booking.</li>
            <li>Follow staff instructions and venue rules; damage to equipment may be charged.</li>
            <li>For help, call {VENUE.phone} or email {VENUE.email}.</li>
          </ul>
        </div>
        <div className="policy-card" id="privacy">
          <h3>Privacy</h3>
          <ul>
            <li>We collect your name, phone and email only to manage your booking and send confirmations and invoices.</li>
            <li>Payments are processed by Razorpay; we never see or store your card or UPI details.</li>
            <li>We don't sell or share your details with anyone else.</li>
            <li>To have your details removed, email {VENUE.email}.</li>
          </ul>
        </div>
      </div>
    </section>
  );
}

function Footer(){
  return (
    <footer className="footer">
      <div className="footer-inner">
        <div className="footer-copy">© {new Date().getFullYear()} {VENUE.name}. {VENUE.area}, {VENUE.city}.</div>
        <div className="footer-links">
          <a href="#refund-policy">Cancellation &amp; refunds</a>
          <a href="#terms">Terms</a>
          <a href="#privacy">Privacy</a>
          <a href={VENUE.maps} target="_blank" rel="noopener">Location</a>
        </div>
        <div className="footer-copy">Built with ❤️ for the players.</div>
      </div>
    </footer>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state = { error: null }; }
  static getDerivedStateFromError(e){ return { error: e }; }
  componentDidCatch(e, i){ console.error('Crash:', e, i); }
  render(){
    if (this.state.error) {
      return (
        <div className="config-err">
          <div style={{maxWidth:520,textAlign:'center'}}>
            <div style={{fontSize:48,marginBottom:16}}>⚠️</div>
            <div style={{fontFamily:'var(--display)',fontSize:24,marginBottom:10}}>Something broke</div>
            <div style={{fontSize:13,color:'var(--text-2)',lineHeight:1.7,marginBottom:18}}>Please refresh the page. If it persists, share the error below.</div>
            <pre style={{background:'var(--surface)',padding:'12px 14px',borderRadius:10,fontSize:12,color:'var(--lime)',border:'1px solid var(--border)',overflowX:'auto',maxHeight:200,textAlign:'left'}}>{String(this.state.error?.message || this.state.error)}</pre>
            <button onClick={()=>location.reload()} style={{marginTop:18,padding:'10px 24px',background:'var(--lime)',color:'#000',border:'none',borderRadius:8,fontSize:13,fontWeight:800,cursor:'pointer'}}>Reload</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function App(){
  const [booking, setBooking] = useState(null);
  const [liveSlotsToday, setLiveSlotsToday] = useState(null);
  const [toast, setToast] = useState({ show:false });
  const [sports, setSports] = useState(null);         // null = loading
  const [sportsError, setSportsError] = useState(null);
  const [payCfg, setPayCfg] = useState(null);         // getVenueInfo().payments
  const [manage, setManage] = useState(() => {
    const q = new URLSearchParams(location.search);
    return q.get('manage') && q.get('t') ? { id: q.get('manage'), t: q.get('t') } : null;
  });

  async function loadSports(){
    setSportsError(null); setSports(null);
    try { setSports(await API.get('getSports') || []); }
    catch(e){ setSportsError(e.message || 'Request failed'); }
  }

  // Hours today where at least one sport can still be booked
  const refreshSlotCount = async (fresh) => {
    try {
      const d = await loadAvailability(formatDateISO(new Date()), fresh);
      const open = new Set();
      d.sports.forEach(s => s.hours.forEach(h => { if (h.available > 0) open.add(h.slot_time); }));
      setLiveSlotsToday(open.size);
    } catch(_) { setLiveSlotsToday(0); }
  };

  useEffect(()=>{
    loadSports(); refreshSlotCount();
    API.get('getVenueInfo').then(v => setPayCfg(v.payments || { online:false }), () => setPayCfg({ online:false }));
  }, []);

  function leaveManage(){
    setManage(null);
    history.replaceState(null, '', location.pathname);
    setTimeout(()=>document.getElementById('book')?.scrollIntoView({behavior:'smooth'}), 100);
  }

  function complete(r){
    setBooking(r);
    setToast({ show:true, message:'Booking confirmed!', icon:'✓' });
    setTimeout(()=>document.getElementById('book')?.scrollIntoView({behavior:'smooth'}), 100);
  }

  function reset(){
    setBooking(null);
    refreshSlotCount(true);
    setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}), 100);
  }

  return (
    <>
      <div className="stage-bg"><div className="orb orb-1"/><div className="orb orb-2"/><div className="orb orb-3"/></div>
      <div className="grain"/>
      <Nav/>
      {manage ? <ManageBooking id={manage.id} token={manage.t} onDone={leaveManage}/> : <>
        {!booking && <Hero liveSlotsToday={liveSlotsToday} sports={sports} sportsError={sportsError} payCfg={payCfg}/>}
        {booking
          ? <ConfirmationTicket booking={booking} onReset={reset}/>
          : <BookingWidget sports={sports} sportsError={sportsError} onRetrySports={loadSports} onComplete={complete} payCfg={payCfg}/>}
        {!booking && <><Features payCfg={payCfg}/><PricingCallout sports={sports} error={sportsError} onRetry={loadSports}/><VenueInfo/></>}
      </>}
      <Policies payCfg={payCfg}/>
      <Footer/>
      <Toast toast={toast} onClose={()=>setToast({show:false})}/>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
