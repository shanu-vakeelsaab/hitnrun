            <div className="ticket-row"><span className="ticket-label">Duration</span><span className="ticket-value big">{booking.duration_hrs} hours</span></div>
          )}
          <div className="ticket-row"><span className="ticket-label">Players</span><span className="ticket-value">{booking.members_count}</span></div>
          <div className="ticket-row"><span className="ticket-label">{booking.paid_online ? 'Total (incl. GST)' : 'Amount'}</span><span className="ticket-value big lime">{booking.on_pass ? 'On pass' : '₹' + parseInt(booking.amount||0).toLocaleString('en-IN')}</span></div>
          {booking.on_pass && booking.pass && <div className="ticket-row"><span className="ticket-label">Pass</span><span className="ticket-value">{booking.pass.plan_label}{booking.pass.hours_left !== null ? ` · ${booking.pass.hours_left} hrs left` : ''}</span></div>}
          {booking.paid_online && <div className="ticket-row"><span className="ticket-label">Paid online</span><span className="ticket-value">{inr(booking.amount_paid)}</span></div>}
          {booking.paid_online && booking.invoice_no && <div className="ticket-row"><span className="ticket-label">Invoice</span><span className="ticket-value mono">{booking.invoice_no}</span></div>}
        </div>
        <div className="ticket-pay-note">
          <span style={{fontSize:18}}>💰</span>
          {booking.on_pass
            ? <div><strong>Covered by your pass</strong>Nothing to pay. Just turn up and play.</div>
            : booking.paid_online
            ? <div><strong>{Number(booking.balance_due) > 0 ? `Pay ${inr(booking.balance_due)} at the venue` : 'Fully paid'}</strong>{Number(booking.balance_due) > 0 ? 'Cash or UPI on arrival. Your advance is received.' : 'Nothing more to pay.'}</div>
            : <div><strong>Pay at the venue</strong>Cash or UPI accepted on arrival.</div>}
        </div>
        <div className="ticket-actions">
          <a className="ticket-btn" href={VENUE.maps} target="_blank" rel="noopener">📍 Get directions</a>
          <a className="ticket-btn" href={buildCalendarLink(booking)} target="_blank" rel="noopener">📅 Add to calendar</a>
          <a className="ticket-btn" href={`tel:${VENUE.phone.replace(/\s/g,'')}`}>📞 Call venue</a>
          <button className="ticket-btn" onClick={copyShare}>{copied?'✓ Copied!':'📤 Share details'}</button>
          {booking.invoice_url && <a className="ticket-btn" href={booking.invoice_url} target="_blank" rel="noopener">🧾 GST invoice</a>}
          {booking.manage_url && <a className="ticket-btn" href={booking.manage_url}>⚙️ Manage / cancel</a>}
        </div>
      </div>
      <div style={{textAlign:'center',marginTop:32,display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
        <button className="btn-secondary" onClick={onReset}>Book another slot</button>
        <button className="btn-secondary" onClick={onAccount}>👤 See all my bookings</button>
      </div>
    </section>
  );
}

  return (
    <section className="section">
      <div className="venue-grid reveal">
        <div>
          <span className="section-eyebrow">Find us</span>
          <h2 className="section-h2" style={{fontSize:'clamp(36px,5vw,56px)'}}>{VENUE.area}.<br/>Open daily.</h2>
        </div>

function ManageBooking({ id, token, onDone, account, onAccount }){

  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [confirming, setConfirming] = useState(false);

  async function load(){
    setErr(null);
    try { setData(await API.get('getManagedBooking', { id, t: token })); }
    catch(e){ setErr(e.message); }
  }
  useEffect(()=>{ load(); }, [id, token]);

  async function cancel(){
    setBusy(true);
    try { const r = await API.post('cancelMyBooking', { id, t: token }); setResult(r); setConfirming(false); load(); }
    catch(e){ setErr(e.message); setConfirming(false); }
    finally { setBusy(false); }
  }

  const b = data && data.booking;
  const t = data && data.terms;
  const sm = data && data.sport_meta;
  const timeText = b ? (sm && sm.pricing_mode === 'session' ? `${startTime12(b.slot_time)} · ${sm.session_qty * (b.duration_hrs||1)} ${sm.session_unit}` : slotRange12(b.slot_time)) : '';

        {!data && !err && <div className="loading-block"><Spinner/></div>}
        {err && !data && <div className="empty-block"><div className="empty-title">Couldn't open this booking</div><div style={{fontSize:13}}>{err}</div></div>}
        {b && <>
          <div className="ticket-row"><span className="ticket-label">Booking ID</span><span className="ticket-value mono">{b.booking_id}</span></div>
          <div className="ticket-row"><span className="ticket-label">Status</span><span className="ticket-value" style={{color: b.status==='confirmed' ? 'var(--lime)' : '#fca5a5'}}>{statusText}</span></div>
          <div className="ticket-row"><span className="ticket-label">Sport</span><span className="ticket-value">{data.sport_name}</span></div>
          <div className="ticket-row"><span className="ticket-label">Date</span><span className="ticket-value">{dateLong(b.booking_date)}</span></div>
          <div className="ticket-row"><span className="ticket-label">Time</span><span className="ticket-value">{timeText}</span></div>
          {b.payment_mode === 'pass'
            ? <div className="ticket-row"><span className="ticket-label">Payment</span><span className="ticket-value lime">Covered by your pass</span></div>
            : <div className="ticket-row"><span className="ticket-label">Total (incl. GST)</span><span className="ticket-value">{inr(b.amount)}</span></div>}
          {b.payment_mode !== 'pass' && Number(b.amount_paid) > 0 && <div className="ticket-row"><span className="ticket-label">Paid</span><span className="ticket-value">{inr(b.amount_paid)}</span></div>}
          {b.status === 'confirmed' && Number(b.balance_due) > 0 && <div className="ticket-row"><span className="ticket-label">Pay at venue</span><span className="ticket-value">{inr(b.balance_due)}</span></div>}
          {Number(b.refund_amount) > 0 && <div className="ticket-row"><span className="ticket-label">Refund</span><span className="ticket-value">{inr(b.refund_amount)} · {b.refund_status === 'processed' ? 'processed' : 'in progress (5-7 working days)'}</span></div>}

          {result && <div className="pay-status info">{result.refunded > 0 ? `Cancelled. ${inr(result.refunded)} is being refunded to your original payment method (5-7 working days).` : 'Cancelled. No refund applies to this booking.'}</div>}
          {err && <div className="pay-status err">{err}</div>}

          <div className="manage-actions">
            {data.invoice_url && <a className="btn-secondary" style={{justifyContent:'center'}} href={data.invoice_url} target="_blank" rel="noopener">View GST invoice</a>}
            <a className="btn-secondary" style={{justifyContent:'center'}} href={VENUE.maps} target="_blank" rel="noopener">Venue location</a>
            {t && t.can_cancel && !confirming && (
              <>
                <div className="field-hint" style={{textAlign:'center',fontSize:12}}>
                  {t.refund > 0 ? `Cancel now and get ${inr(t.refund)} back.` : `This is within ${t.cutoff_hours} hours of your slot, so the advance can't be refunded.`}
                </div>
                <button className="btn-danger" onClick={()=>setConfirming(true)}>Cancel booking</button>
              </>
            )}
            {confirming && (
              <div className="pay-status err" style={{textAlign:'center'}}>
                <div style={{marginBottom:12,fontWeight:700}}>Cancel this booking? {t.refund > 0 ? `${inr(t.refund)} will be refunded.` : 'No refund applies.'}</div>
                <div style={{display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
                  <button className="btn-danger" disabled={busy} onClick={cancel}>{busy ? 'Cancelling…' : 'Yes, cancel'}</button>
                  <button className="btn-secondary" onClick={()=>setConfirming(false)}>Keep booking</button>

            {t && !t.can_cancel && b.status === 'confirmed' && <div className="field-hint" style={{textAlign:'center'}}>{t.reason} Call {VENUE.phone} for help.</div>}

      <div style={{textAlign:'center',marginTop:28,display:'flex',gap:10,justifyContent:'center',flexWrap:'wrap'}}>
        <button className="btn-secondary" onClick={onDone}>Book another slot</button>

    </section>
  );

function OtpInput({ value, onChange, onComplete, disabled }){
  const refs = useRef([]);
  const digits = Array.from({ length: 6 }, (_, i) => value[i] || '');
  function set(i, ch){
    const next = digits.slice(); next[i] = ch;
    const v = next.join('').slice(0, 6);
    onChange(v);
    if (ch && i < 5) refs.current[i + 1]?.focus();
    if (v.replace(/\D/g, '').length === 6) onComplete && onComplete(v);
  }
  function onKey(e, i){
    if (e.key === 'Backspace' && !digits[i] && i > 0) { refs.current[i - 1]?.focus(); }
    if (e.key === 'ArrowLeft' && i > 0) refs.current[i - 1]?.focus();
    if (e.key === 'ArrowRight' && i < 5) refs.current[i + 1]?.focus();
  }
  function onPaste(e){
    const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
    if (t.length) { e.preventDefault(); onChange(t); refs.current[Math.min(5, t.length - 1)]?.focus(); if (t.length === 6) onComplete && onComplete(t); }
  }
  return (
    <div className="otp-row" onPaste={onPaste}>
      {digits.map((d, i) => (
        <input key={i} ref={el => refs.current[i] = el} className={`otp-box ${d?'filled':''}`} inputMode="numeric" pattern="[0-9]*" maxLength={1}
          value={d} disabled={disabled} autoFocus={i === 0}
          onChange={e => set(i, e.target.value.replace(/\D/g, '').slice(-1))}
          onKeyDown={e => onKey(e, i)} aria-label={`Digit ${i + 1}`}/>
      ))}
    </div>
  );
}

function AccountModal({ account, onLogin, onLogout, onClose, onManage }){
  const [step, setStep] = useState(account ? 'account' : 'email');
  const [email, setEmail] = useState(account ? account.email : '');
  const [code, setCode] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [resendIn, setResendIn] = useState(0);
  const [data, setData] = useState(null);
  const [tab, setTab] = useState('upcoming');
  const [shake, setShake] = useState(false);

  useEffect(()=>{ if (!resendIn) return; const t = setTimeout(()=>setResendIn(n => n - 1), 1000); return ()=>clearTimeout(t); }, [resendIn]);
  useEffect(()=>{ const h = e => e.key === 'Escape' && onClose(); window.addEventListener('keydown', h); return ()=>window.removeEventListener('keydown', h); }, []);

  async function load(tok){
    setErr(null);
    try {
      const d = await API.get('getMyAccount', { token: tok });
      setData(d);
      if (d.profile && d.profile.name && (!account || account.name !== d.profile.name)) onLogin({ ...(account || {}), token: tok, email: d.email, expires_at: d.session_expires_at, name: d.profile.name }, true);
      if (!d.upcoming.length && (d.passes.length || d.past.length)) setTab(d.passes.some(p => p.is_active) ? 'passes' : 'past');
    } catch(e){
      if (e.code === 'SESSION_EXPIRED') { onLogout(); setStep('email'); setErr('Your session expired. Sign in again.'); }
      else setErr(e.message);
    }
  }
  useEffect(()=>{ if (account && step === 'account') load(account.token); }, []);

  async function sendCode(){
    const e = email.trim().toLowerCase();
    if (!isValidEmail(e)) { setErr('Enter a valid email address.'); return; }
    setBusy(true); setErr(null);
    try {
      const r = await API.post('requestAccountOtp', { email: e });
      setEmail(e); setCode(''); setStep('code'); setResendIn(r.resend_in || 45);
    } catch(ex){
      if (ex.code === 'TOO_SOON') { setStep('code'); setErr(ex.message); const m = /(\d+)s/.exec(ex.message); setResendIn(m ? +m[1] : 30); }
      else setErr(ex.message);
    } finally { setBusy(false); }
  }
  async function verify(v){
    const c = (v || code).replace(/\D/g, '');
    if (c.length !== 6 || busy) return;
    setBusy(true); setErr(null);
    try {
      const r = await API.post('verifyAccountOtp', { email, code: c });
      const acct = { token: r.token, email: r.email, expires_at: r.expires_at, name: null };
      onLogin(acct);
      setStep('account');
      await load(r.token);
    } catch(ex){
      setErr(ex.message); setShake(true); setTimeout(()=>setShake(false), 600);
      if (ex.code === 'OTP_EXPIRED' || ex.code === 'OTP_LOCKED') { setCode(''); }
    } finally { setBusy(false); }
  }

  const p = data && data.profile;
  const initial = ((p && p.name ? p.name : email) || '?').trim().charAt(0).toUpperCase() || '?';
  const list = data ? (tab === 'upcoming' ? data.upcoming : tab === 'past' ? data.past : []) : [];

  function BookingCard({ b }){
    const d = new Date(b.booking_date + 'T00:00:00');
    const when = b.pricing_mode === 'session' ? `${startTime12(b.slot_time)} · ${b.session_qty * b.duration_hrs} ${b.session_unit}` : slotRange12(b.slot_time);
    const cls = b.status === 'confirmed' ? 'ok' : b.status === 'cancelled' ? 'bad' : 'warn';
    return (
      <div className={`bk-card ${b.status === 'cancelled' ? 'cancelled' : ''}`}>
        <div className="bk-date"><div className="d">{d.getDate()}</div><div className="m">{d.toLocaleDateString('en-IN',{month:'short'})}</div></div>
        <div className="bk-main">
          <div className="t">{b.icon} {b.sport_name}</div>
          <div className="s">{d.toLocaleDateString('en-IN',{weekday:'short'})} · {when}{b.duration_hrs > 1 && b.pricing_mode !== 'session' ? ` · ${b.duration_hrs} hrs` : ''} · <span className="mono">{b.booking_id}</span></div>
          <div className="tags">
            <span className={`tag ${cls}`}>{b.status_label}</span>
            {b.on_pass ? <span className="tag pass">On pass</span>
              : b.status === 'confirmed' && (b.payment_status === 'paid' ? <span className="tag ok">Paid</span> : b.balance_due > 0 ? <span className="tag warn">Pay {inr(b.balance_due)} at venue</span> : null)}
            {b.refund_amount > 0 && <span className="tag">{inr(b.refund_amount)} refund {b.refund_status === 'processed' ? 'done' : 'in progress'}</span>}
          </div>
        </div>
        <div className="bk-amt"><div className="a">{b.on_pass ? '₹0' : inr(b.amount)}</div><div className="l">{b.on_pass ? 'pass' : b.status === 'confirmed' ? 'total' : 'amount'}</div></div>
        {(b.status === 'confirmed' || b.invoice_url) && (
          <div className="bk-actions">
            {b.status === 'confirmed' && b.manage_url && <button onClick={()=>onManage(b.manage_url)}>{b.can_cancel ? '⚙️ Manage / cancel' : '⚙️ View booking'}</button>}
            {b.invoice_url && <a href={b.invoice_url} target="_blank" rel="noopener">🧾 Invoice</a>}
            {b.status === 'confirmed' && <a href={buildCalendarLink({ ...b, amount: b.amount })} target="_blank" rel="noopener">📅 Calendar</a>}
            {b.status === 'confirmed' && <a href={VENUE.maps} target="_blank" rel="noopener">📍 Directions</a>}
          </div>
        )}
      </div>
    );
  }

  function PassCard({ m }){
    const used = m.hours_quota ? Math.min(100, Math.round(100 * m.hours_used / m.hours_quota)) : 0;
    return (
      <div className={`pass-card ${m.is_active ? '' : 'off'}`}>
        <div className="pt">🎟️ {m.plan_label}</div>
        <div className="ps">
          {m.team_name ? `${m.team_name} · ` : ''}{m.is_active ? `Valid till ${dateNice(m.end_date)}` : m.status === 'cancelled' ? 'Cancelled' : m.is_expired ? `Expired ${dateNice(m.end_date)}` : `Starts ${dateNice(m.start_date)}`}
          {m.day_rule !== 'all' ? ` · ${m.day_rule}s only` : ''}
        </div>
        {m.hours_quota ? <>
          <div className="pass-bar"><i style={{width: used + '%'}}/></div>
          <div className="pass-nums"><span><b>{m.hours_left}</b> hrs left</span><span>{m.hours_used} / {m.hours_quota} used</span></div>
        </> : <div className="pass-nums" style={{marginTop:10}}><span><b>Unlimited</b> {m.category === 'turf' ? 'turf' : 'net'} hours during validity</span></div>}
      </div>
    );
  }

  return (
    <div className="acct-backdrop" onClick={e=>e.target===e.currentTarget && onClose()}>
      <div className={`acct-modal ${step === 'account' ? 'wide' : ''} ${shake ? 'shake' : ''}`} role="dialog" aria-label="My account">
        <div className="acct-head">
          <div>
            <div className="acct-title">{step === 'account' ? 'My Account' : step === 'code' ? 'Check your inbox' : 'My Account'}</div>
            <div className="acct-sub">
              {step === 'email' && 'See your bookings, passes and invoices. We\'ll email you a one-time code — no password needed.'}
              {step === 'code' && <>We sent a 6-digit code to <strong style={{color:'var(--text)'}}>{email}</strong>. It's valid for 10 minutes.</>}
              {step === 'account' && 'Your bookings and passes, all in one place.'}
            </div>
          </div>
          <button className="cp-x" onClick={onClose} aria-label="Close">×</button>
        </div>

        {step === 'email' && (
          <div>
            <label className="form-label">Email address</label>
            <input className="form-input" type="email" value={email} autoFocus onChange={e=>{ setEmail(e.target.value); setErr(null); }} onKeyDown={e=>e.key==='Enter' && sendCode()} placeholder="you@example.com" autoComplete="email"/>
            <div className="field-hint">Use the email you booked with.</div>
            {err && <div className="pay-status err">{err}</div>}
            <button className="btn-submit" style={{marginTop:18}} onClick={sendCode} disabled={busy || !email.trim()}>{busy ? <><Spinner small/> Sending…</> : <>Send me a code <span>→</span></>}</button>
            <div className="submit-note" style={{marginTop:12}}>Booking a slot doesn't need an account. This is just to look things up.</div>
          </div>
        )}

        {step === 'code' && (
          <div>
            <OtpInput value={code} onChange={v=>{ setCode(v); setErr(null); }} onComplete={verify} disabled={busy}/>
            {err && <div className="pay-status err" style={{textAlign:'center'}}>{err}</div>}
            <button className="btn-submit" style={{marginTop:14}} onClick={()=>verify()} disabled={busy || code.replace(/\D/g,'').length !== 6}>{busy ? <><Spinner small/> Checking…</> : <>Sign in <span>→</span></>}</button>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:14,gap:10,flexWrap:'wrap'}}>
              <button className="acct-link" onClick={()=>{ setStep('email'); setErr(null); setCode(''); }}>← Change email</button>
              <button className="acct-link" onClick={sendCode} disabled={busy || resendIn > 0}>{resendIn > 0 ? `Resend in ${resendIn}s` : 'Resend code'}</button>
            </div>
            <div className="submit-note" style={{marginTop:14}}>Can't find it? Check spam, or that it's the email you booked with.</div>
          </div>
        )}

        {step === 'account' && (
          <div>
            <div className="acct-profile">
              <div className="acct-avatar">{initial}</div>
              <div style={{flex:1,minWidth:0}}>
                <div className="acct-name">{p && p.name ? p.name : 'Player'}</div>
                <div className="acct-meta">{email}{p && p.phone ? ` · ${p.phone}` : ''}{p ? ` · ${p.bookings_count} booking${p.bookings_count===1?'':'s'}` : ''}</div>
              </div>
              <button className="acct-link" onClick={()=>{ onLogout(); onClose(); }}>Sign out</button>
            </div>
            {!data && !err && <div className="loading-block"><Spinner/><div style={{marginTop:14,fontSize:13,color:'var(--text-2)'}}>Fetching your bookings…</div></div>}
            {err && !data && <div className="pay-status err">{err}</div>}
            {data && <>
              <div className="acct-tabs">
                <button className={`acct-tab ${tab==='upcoming'?'active':''}`} onClick={()=>setTab('upcoming')}>Upcoming<b>{data.upcoming.length}</b></button>
                <button className={`acct-tab ${tab==='passes'?'active':''}`} onClick={()=>setTab('passes')}>Passes<b>{data.passes.length}</b></button>
                <button className={`acct-tab ${tab==='past'?'active':''}`} onClick={()=>setTab('past')}>History<b>{data.past.length}</b></button>
              </div>
              {tab === 'passes' && (data.passes.length ? data.passes.map(m => <PassCard key={m.member_id} m={m}/>) : (
                <div className="empty-block"><div className="ic">🎟️</div><div className="empty-title">No passes yet</div><div style={{fontSize:13}}>Weekly and monthly passes are issued at the venue. Call {VENUE.phone} to get one — bookings on a pass are free here.</div></div>
              ))}
              {tab !== 'passes' && (list.length ? list.map((b, i) => <div key={b.booking_id} style={{animationDelay:`${i*40}ms`}}><BookingCard b={b}/></div>) : (
                <div className="empty-block"><div className="ic">{tab==='upcoming'?'🗓️':'📭'}</div><div className="empty-title">{tab==='upcoming'?'Nothing booked yet':'No past bookings'}</div>
                  <div style={{fontSize:13,marginBottom:tab==='upcoming'?16:0}}>{tab==='upcoming' ? 'Pick a slot and we\'ll see you on the ground.' : `Bookings made with ${email} will show up here.`}</div>
                  {tab==='upcoming' && <button className="btn-cta" onClick={()=>{ onClose(); document.getElementById('book')?.scrollIntoView({behavior:'smooth'}); }}>Book a slot</button>}
                </div>
              ))}
            </>}
          </div>
        )}
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state = { error: null }; }
  static getDerivedStateFromError(e){ return { error: e }; }
  componentDidCatch(e, i){ console.error('Crash:', e, i); }
  render(){
    if (this.state.error) {
      return (
        <div className="config-err">
          <div style={{maxWidth:520,textAlign:'center'}}>
            <div style={{fontSize:48,marginBottom:16}}>⚠️</div>
            <div style={{fontFamily:'var(--display)',fontSize:24,marginBottom:10}}>Something broke</div>
            <div style={{fontSize:13,color:'var(--text-2)',lineHeight:1.7,marginBottom:18}}>Please refresh the page. If it persists, share the error below.</div>
            <pre style={{background:'var(--surface)',padding:'12px 14px',borderRadius:10,fontSize:12,color:'var(--lime)',border:'1px solid var(--border)',overflowX:'auto',maxHeight:200,textAlign:'left'}}>{String(this.state.error?.message || this.state.error)}</pre>
            <button onClick={()=>location.reload()} style={{marginTop:18,padding:'10px 24px',background:'var(--lime)',color:'#000',border:'none',borderRadius:8,fontSize:13,fontWeight:800,cursor:'pointer'}}>Reload</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function App(){
  const [booking, setBooking] = useState(null);
  const [liveSlotsToday, setLiveSlotsToday] = useState(null);
  const [toast, setToast] = useState({ show:false });
  const [sports, setSports] = useState(null);         // null = loading
  const [sportsError, setSportsError] = useState(null);
  const [payCfg, setPayCfg] = useState(null);         // getVenueInfo().payments
  const [coupons, setCoupons] = useState([]);         // listPublicCoupons
  const [manage, setManage] = useState(() => {
    const q = new URLSearchParams(location.search);
    return q.get('manage') && q.get('t') ? { id: q.get('manage'), t: q.get('t') } : null;
  });
  const [account, setAccount] = useState(loadAccount);
  const [acctOpen, setAcctOpen] = useState(() => new URLSearchParams(location.search).get('account') === '1');
  const [ready, setReady] = useState(false);        // preloader
  useReveal([booking, manage, sports]);

  async function loadSports(){
    setSportsError(null); setSports(null);
    try { setSports(await API.get('getSports') || []); }
    catch(e){ setSportsError(e.message || 'Request failed'); }
  }

  // Hours today where at least one sport can still be booked
  const [todayAvail, setTodayAvail] = useState(null);
  const refreshSlotCount = async (fresh) => {
    try {
      const d = await loadAvailability(formatDateISO(new Date()), fresh);
      const open = new Set();
      d.sports.forEach(s => s.hours.forEach(h => { if (h.available > 0) open.add(h.slot_time); }));
      setLiveSlotsToday(open.size);
      setTodayAvail(d);
    } catch(_) { setLiveSlotsToday(0); setTodayAvail({ sports: [] }); }
  };
  // Hero board: per public sport, hours still open today + the next open start time
  const board = useMemo(()=>{
    if (!sports || !todayAvail) return null;
    const rows = sports.map(s => {
      const a = todayAvail.sports.find(x => x.sport_id === s.id);
      const hrs = a ? a.hours : [];
      const openHrs = hrs.filter(h => h.available > 0);
      return { ...s, open: openHrs.length, total: hrs.length, next: openHrs.length ? startTime12(openHrs[0].slot_time) : null };
    });
    const all = new Set(); todayAvail.sports.forEach(x => x.hours.forEach(h => { if (h.available > 0) all.add(h.slot_time); }));
    return { rows, totalHours: all.size };
  }, [sports, todayAvail]);

  useEffect(()=>{
    const t0 = Date.now();
    const done = Promise.allSettled([loadSports(), refreshSlotCount(),
      API.get('getVenueInfo').then(v => setPayCfg(v.payments || { online:false }), () => setPayCfg({ online:false }))]);
    API.get('listPublicCoupons').then(c => setCoupons(Array.isArray(c) ? c : []), () => {});
    // Preloader: wait for the first data, but never longer than ~3.5s and never shorter than the warm-up animation
    const fallback = sleep(3500);
    Promise.race([done, fallback]).then(() => sleep(Math.max(0, PRELOAD_MIN_MS - (Date.now() - t0)))).then(() => setReady(true));
  }, []);

  function login(a, silent){ setAccount(a); saveAccount(a); if (!silent) setToast({ show:true, message:'Signed in', icon:'👤' }); }
  function logout(){ setAccount(null); saveAccount(null); }
  function openManageFromAccount(url){
    const q = new URL(url, location.href).searchParams;
    setAcctOpen(false);
    setBooking(null);
    setManage({ id: q.get('manage'), t: q.get('t') });
    history.replaceState(null, '', `?manage=${encodeURIComponent(q.get('manage'))}&t=${encodeURIComponent(q.get('t'))}`);
    setTimeout(()=>window.scrollTo({ top: 0, behavior: 'smooth' }), 50);
  }

  function leaveManage(){
    setManage(null);
    history.replaceState(null, '', location.pathname);
    setTimeout(()=>document.getElementById('book')?.scrollIntoView({behavior:'smooth'}), 100);
  }

  function complete(r){
    setBooking(r);
    setToast({ show:true, message:'Booking confirmed!', icon:'✓' });
    setTimeout(()=>document.getElementById('book')?.scrollIntoView({behavior:'smooth'}), 100);
  }

  function reset(){
    setBooking(null);
    refreshSlotCount(true);
    setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}), 100);
  }

  return (
    <>
      <Preloader ready={ready}/>
      <div className="stage-bg"><div className="flood"/><div className="pitch"/><div className="stripes"/></div>
      <div className="grain"/>
      <OfferBar coupons={coupons}/>
      <Nav account={account} onAccount={()=>setAcctOpen(true)}/>
      {manage ? <ManageBooking id={manage.id} token={manage.t} onDone={leaveManage} account={account} onAccount={()=>setAcctOpen(true)}/> : <>
        {!booking && <Hero liveSlotsToday={liveSlotsToday} sports={sports} sportsError={sportsError} payCfg={payCfg} board={board}/>}
        {!booking && <Ticker sports={sports}/>}
        {booking
          ? <ConfirmationTicket booking={booking} onReset={reset} onAccount={()=>setAcctOpen(true)}/>
          : <BookingWidget sports={sports} sportsError={sportsError} onRetrySports={loadSports} onComplete={complete} payCfg={payCfg}/>}
        {!booking && <><Features payCfg={payCfg}/><PricingCallout sports={sports} error={sportsError} onRetry={loadSports}/><VenueInfo/></>}
      </>}
      <Policies payCfg={payCfg}/>
      <Footer onAccount={()=>setAcctOpen(true)}/>
      {acctOpen && <AccountModal account={account} onLogin={login} onLogout={logout} onClose={()=>setAcctOpen(false)} onManage={openManageFromAccount}/>}
      <Toast toast={toast} onClose={()=>setToast({show:false})}/>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
