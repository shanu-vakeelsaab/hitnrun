<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0d0a" />
  <title>Hit N Run Sports Arena · Book your turf in Dehradun</title>
  <meta name="description" content="Dehradun's premier multi-sport arena in Panditwari. Live availability, book online in 60 seconds, open daily. Pay at venue." />
  <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
  <meta property="og:title" content="Hit N Run Sports Arena · Book your turf in Dehradun" />
  <meta property="og:description" content="Dehradun's premier multi-sport arena in Panditwari. Live availability, book online in 60 seconds, open daily. Pay at venue." />
  <meta property="og:image" content="https://hitnrunarena.in/logo.jpeg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

  <style>
    :root {
      --bg:#0a0d0a; --bg-alt:#0e120e; --surface:#141914; --surface-2:#1a201a;
      --border:#232a23; --text:#f5f5f4; --text-2:#a8a29e; --text-3:#57534e;
      --lime:#c4f000; --lime-soft:#d9f99d; --lime-dim:#6b8a00;
      --orange:#fbbf24; --success:#10b981; --danger:#ef4444; --info:#38bdf8;
      --display:'Anton',system-ui,sans-serif; --body:'Outfit',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:var(--body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.5}
    input,textarea,select,button{font-family:var(--body)}
    button{background:none;border:none;cursor:pointer;color:inherit}
    a{color:inherit;text-decoration:none}

    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:var(--bg-alt)}
    ::-webkit-scrollbar-thumb{background:#2a352a;border-radius:99px}

    @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes risefade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(196,240,0,.4)}50%{box-shadow:0 0 0 12px rgba(196,240,0,0)}}
    @keyframes float-orb{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.05)}66%{transform:translate(-30px,25px) scale(.95)}}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .anim-rise{animation:rise .6s cubic-bezier(.16,1,.3,1) both}
    .anim-rise-fast{animation:risefade .35s cubic-bezier(.16,1,.3,1) both}
    .pulse-glow{animation:glow 2.4s infinite}
    .live-dot{animation:blink 1.6s ease-in-out infinite}
    .spin{animation:spin .9s linear infinite}
    .shimmer{background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}

    /* Visible loading on dark hero */
    .loading-dot{
      width:8px;height:8px;border-radius:50%;background:var(--lime);
      display:inline-block;animation:loading-bounce 1s ease-in-out infinite;
      box-shadow:0 0 12px rgba(196,240,0,.5)
    }
    @keyframes loading-bounce{
      0%,100%{opacity:.3;transform:scale(.8)}
      50%{opacity:1;transform:scale(1.1)}
    }

    .stage-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.18;animation:float-orb 16s ease-in-out infinite}
    .orb-1{width:460px;height:460px;background:#c4f000;top:-120px;left:-100px}
    .orb-2{width:380px;height:380px;background:#38bdf8;top:40%;right:-120px;animation-delay:-6s;opacity:.13}
    .orb-3{width:320px;height:320px;background:#fbbf24;bottom:-60px;left:30%;animation-delay:-10s;opacity:.1}
    .grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.04;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

    /* Nav */
    .nav{position:sticky;top:0;z-index:50;background:rgba(10,13,10,.7);backdrop-filter:blur(20px) saturate(1.2);border-bottom:1px solid rgba(255,255,255,.04)}
    .nav-inner{max-width:1280px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
    .logo{display:flex;align-items:center;gap:10px}
    .logo-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--lime) 0%,#94c800 100%);display:grid;place-items:center;font-size:16px;color:#000}
    .logo-text{font-family:var(--display);font-size:18px;letter-spacing:.04em}
    .logo-text small{font-family:var(--body);font-size:9px;font-weight:600;letter-spacing:.15em;color:var(--text-3);text-transform:uppercase;display:block;margin-top:-3px}
    .nav-cta{display:flex;align-items:center;gap:8px}
    .nav-link{font-size:13px;font-weight:600;color:var(--text-2);padding:8px 14px;border-radius:8px;transition:color .15s}
    .nav-link:hover{color:var(--text)}
    .btn-cta{background:var(--lime);color:#000;padding:9px 18px;border-radius:99px;font-size:13px;font-weight:800;letter-spacing:.02em;transition:transform .15s,box-shadow .15s}
    .btn-cta:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(196,240,0,.3)}
    @media (max-width:560px){
      .nav-inner{padding:12px 16px}
      .nav-link{display:none}
      .logo-text{font-size:15px}
      .btn-cta{padding:7px 14px;font-size:12px}
    }

    /* Hero */
    .hero{position:relative;z-index:2;min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;padding:80px 24px 60px;max-width:1280px;margin:0 auto}
    @media (max-width:720px){
      .hero{padding:40px 16px 40px;min-height:auto}
      .hero-h1{margin-bottom:18px!important}
      .hero-sub{margin-bottom:24px!important;font-size:14px!important}
      .hero-ctas{margin-bottom:36px!important}
      .btn-primary,.btn-secondary{padding:13px 22px!important;font-size:13px!important}
      .hero-stats{padding-top:22px!important;gap:10px!important}
      .hero-stat-num{font-size:28px!important}
      .hero-stat-lbl{font-size:9px!important}
    }
    .hero-tag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(196,240,0,.08);border:1px solid rgba(196,240,0,.2);border-radius:99px;font-size:11px;font-weight:700;color:var(--lime);letter-spacing:.15em;text-transform:uppercase;margin-bottom:28px;align-self:flex-start}
    .hero-tag .live-dot{width:6px;height:6px;background:var(--lime);border-radius:50%}
    .hero-h1{font-family:var(--display);font-size:clamp(56px,12vw,180px);line-height:.86;letter-spacing:-.02em;color:var(--text);margin-bottom:28px;text-transform:uppercase}
    .hero-h1 .accent{background:linear-gradient(180deg,var(--lime) 0%,#94c800 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .hero-sub{font-size:clamp(15px,1.6vw,19px);color:var(--text-2);max-width:580px;margin-bottom:36px;line-height:1.6}
    .hero-sub strong{color:var(--text);font-weight:600}
    .hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:60px}
    .btn-primary{background:var(--lime);color:#000;padding:16px 28px;border-radius:99px;font-size:14px;font-weight:800;letter-spacing:.03em;display:inline-flex;align-items:center;gap:10px;transition:transform .15s,box-shadow .2s}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(196,240,0,.35)}
    .btn-primary svg{transition:transform .2s}
    .btn-primary:hover svg{transform:translateX(4px)}
    .btn-secondary{background:transparent;color:var(--text);padding:16px 28px;border-radius:99px;border:1.5px solid var(--border);font-size:14px;font-weight:700;letter-spacing:.02em;display:inline-flex;align-items:center;gap:10px;transition:border-color .15s,background .15s}
    .btn-secondary:hover{border-color:var(--text-2);background:rgba(255,255,255,.02)}
    .hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;max-width:780px;padding-top:32px;border-top:1px solid var(--border)}
    .hero-stat-num{font-family:var(--display);font-size:38px;line-height:1;color:var(--lime);margin-bottom:4px;letter-spacing:.01em}
    .hero-stat-lbl{font-size:11px;font-weight:600;color:var(--text-2);letter-spacing:.12em;text-transform:uppercase}

    /* Sections */
    .section{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:80px 24px}
    @media (max-width:720px){.section{padding:48px 16px} .section-head{margin-bottom:24px!important}}
    .section-head{margin-bottom:40px}
    .section-eyebrow{display:inline-block;font-size:11px;font-weight:700;color:var(--lime);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
    .section-h2{font-family:var(--display);font-size:clamp(40px,6.5vw,76px);line-height:.95;letter-spacing:-.01em;color:var(--text);text-transform:uppercase;margin-bottom:16px}
    .section-sub{font-size:16px;color:var(--text-2);max-width:620px;line-height:1.6}

    /* Booking */
    .booking-card{background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:36px;position:relative}
    @media (max-width:720px){
      .booking-card{padding:18px 14px;border-radius:20px}
      .booking-step{margin-bottom:24px!important}
      .step-label{gap:8px!important;margin-bottom:12px!important;flex-wrap:wrap}
      .step-title{font-size:16px!important}
      .step-meta{font-size:11px!important}
    }
    .booking-step{margin-bottom:36px}
    .booking-step:last-child{margin-bottom:0}
    .step-label{display:flex;align-items:center;gap:10px;margin-bottom:18px}
    .step-num{width:26px;height:26px;border-radius:50%;background:var(--lime);color:#000;font-family:var(--mono);font-size:12px;font-weight:700;display:grid;place-items:center}
    .step-num.dim{background:var(--border);color:var(--text-2)}
    .step-title{font-family:var(--display);font-size:22px;letter-spacing:.02em;color:var(--text);text-transform:uppercase}
    .step-meta{margin-left:auto;font-size:12px;color:var(--text-2);font-weight:500}

    /* Date pills */
    .date-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
    .date-strip::-webkit-scrollbar{height:4px}
    .date-pill{flex:0 0 auto;padding:12px 16px;background:var(--bg-alt);border:1.5px solid var(--border);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px;transition:all .15s;scroll-snap-align:start}
    .date-pill:hover{border-color:var(--text-3);transform:translateY(-1px)}
    .date-pill.active{background:var(--lime);color:#000;border-color:var(--lime)}
    .date-pill .d-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
    .date-pill.active .d-label{color:#000}
    .date-pill .d-num{font-family:var(--display);font-size:26px;line-height:1;color:var(--text)}
    .date-pill.active .d-num{color:#000}
    .date-pill .d-wd{font-size:10px;color:var(--text-3);font-weight:600}
    .date-pill.active .d-wd{color:rgba(0,0,0,.5)}
    @media (max-width:720px){
      .date-pill{min-width:64px;padding:9px 11px;border-radius:11px}
      .date-pill .d-label{font-size:9px}
      .date-pill .d-num{font-size:20px}
      .date-pill .d-wd{font-size:9px}
    }

    /* Sport selector */
    .sport-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    @media (max-width:560px){.sport-grid{grid-template-columns:1fr;gap:8px}}
    .sport-card{background:var(--bg-alt);border:1.5px solid var(--border);border-radius:16px;padding:18px 16px;display:flex;align-items:center;gap:14px;transition:all .15s;text-align:left}
    .sport-card:hover{border-color:var(--text-3);transform:translateY(-2px)}
    .sport-card.active{background:var(--lime);color:#000;border-color:var(--lime);transform:translateY(-2px);box-shadow:0 12px 32px rgba(196,240,0,.2)}
    .sport-card .ic{font-size:30px;flex-shrink:0}
    .sport-card-text{flex:1;min-width:0}
    .sport-card .name{font-family:var(--display);font-size:17px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
    .sport-card .price{font-size:11px;color:var(--text-2);font-weight:600;margin-top:3px}
    .sport-card.active .price{color:rgba(0,0,0,.6)}

    /* Slots */
    .slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
    @media (max-width:720px){.slots-grid{grid-template-columns:repeat(3,1fr);gap:7px}}
    @media (max-width:380px){.slots-grid{grid-template-columns:repeat(2,1fr)}}
    .slot-card{background:var(--bg-alt);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;transition:all .15s;text-align:left}
    @media (max-width:720px){.slot-card{padding:11px 9px;border-radius:11px}}
    .slot-card:hover{border-color:var(--lime);transform:translateY(-2px);box-shadow:0 8px 24px rgba(196,240,0,.08)}
    .slot-card.active{background:var(--lime);color:#000;border-color:var(--lime);transform:translateY(-2px);box-shadow:0 12px 32px rgba(196,240,0,.3)}
    .slot-card .time-row{display:flex;align-items:baseline;gap:6px;margin-bottom:6px;flex-wrap:wrap}
    .slot-time{font-family:var(--display);font-size:21px;letter-spacing:.02em;color:var(--text)}
    .slot-time.end{font-size:14px;opacity:.7}
    .slot-card.active .slot-time{color:#000}
    .slot-arrow{font-size:11px;color:var(--text-3)}
    .slot-card.active .slot-arrow{color:rgba(0,0,0,.5)}
    .slot-price{font-size:12px;font-weight:700;color:var(--lime);display:inline-flex;align-items:center;gap:4px}
    .slot-card.active .slot-price{color:#000}
    .slot-meta{font-size:10px;font-weight:700;color:var(--text-2);letter-spacing:.08em;text-transform:uppercase;margin-top:5px}
    .slot-card.active .slot-meta{color:rgba(0,0,0,.6)}
    @media (max-width:720px){
      .slot-time{font-size:16px}
      .slot-time.end{font-size:12px}
      .slot-price{font-size:11px}
      .slot-meta{font-size:9px}
    }

    /* Duration picker */
    .duration-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px}
    .duration-card{background:var(--bg-alt);border:1.5px solid var(--border);border-radius:14px;padding:16px 14px;transition:all .15s;text-align:center;cursor:pointer;color:var(--text)}
    .duration-card:hover:not(.disabled){border-color:var(--lime);transform:translateY(-2px)}
    .duration-card.active{background:var(--lime);color:#000;border-color:var(--lime);transform:translateY(-2px);box-shadow:0 12px 32px rgba(196,240,0,.3)}
    .duration-card.disabled{opacity:.35;cursor:not-allowed;background:transparent}
    .dur-h{font-family:var(--display);font-size:20px;letter-spacing:.02em;margin-bottom:4px}
    .dur-price{font-size:13px;font-weight:700;color:var(--lime)}
    .duration-card.active .dur-price{color:#000}
    .dur-sub{font-size:10px;font-weight:700;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
    @media (max-width:720px){.dur-h{font-size:16px}.dur-price{font-size:11px}}

    /* Form */
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media (max-width:560px){.form-grid{grid-template-columns:1fr}}
    .form-field.span-2{grid-column:span 2}
    @media (max-width:560px){.form-field.span-2{grid-column:span 1}}
    .form-label{display:block;font-size:11px;font-weight:700;color:var(--text-2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
    .form-input{width:100%;padding:14px 16px;background:var(--bg-alt);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-weight:500;transition:border-color .15s,background .15s;outline:none}
    .form-input:focus{border-color:var(--lime);background:var(--bg)}
    .form-input::placeholder{color:var(--text-3)}
    .field-hint{font-size:11px;color:var(--text-3);margin-top:6px}

    /* Returning */
    .return-banner{background:linear-gradient(135deg,rgba(196,240,0,.12) 0%,rgba(196,240,0,.04) 100%);border:1px solid rgba(196,240,0,.3);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px;grid-column:span 2}
    @media (max-width:560px){.return-banner{grid-column:span 1}}
    .return-emoji{font-size:26px}
    .return-text{font-size:14px;color:var(--text)}
    .return-text strong{color:var(--lime)}
    .return-text .sub{font-size:12px;color:var(--text-2);display:block;margin-top:2px}

    /* Submit */
    .submit-row{margin-top:24px;display:flex;flex-direction:column;gap:10px}
    .btn-submit{width:100%;padding:18px 28px;background:var(--lime);color:#000;border-radius:14px;font-family:var(--display);font-size:18px;letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:12px;transition:transform .15s,box-shadow .2s}
    .btn-submit:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 40px rgba(196,240,0,.35)}
    .btn-submit:disabled{background:var(--border);color:var(--text-3);cursor:not-allowed}
    .submit-note{font-size:12px;color:var(--text-2);text-align:center}

    /* Loading */
    .loading-block{padding:50px 0;text-align:center}
    .loading-spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--lime);border-radius:50%}
    .loading-spinner.small{width:18px;height:18px;border-width:2px}
    .empty-block{padding:40px;text-align:center;color:var(--text-2);border:1.5px dashed var(--border);border-radius:16px}
    .empty-block .ic{font-size:38px;margin-bottom:10px}
    .empty-title{font-family:var(--display);font-size:20px;color:var(--text);letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px}

    /* Ticket */
    .ticket{max-width:540px;margin:0 auto;background:var(--surface);border:1.5px solid var(--lime);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 24px 80px rgba(196,240,0,.15)}
    .ticket-head{padding:36px 32px 24px;text-align:center;background:linear-gradient(180deg,rgba(196,240,0,.06) 0%,transparent 100%)}
    .ticket-check{width:64px;height:64px;border-radius:50%;background:var(--lime);color:#000;display:inline-grid;place-items:center;font-size:32px;margin-bottom:20px;box-shadow:0 0 0 8px rgba(196,240,0,.15)}
    .ticket-title{font-family:var(--display);font-size:32px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:6px}
    .ticket-sub{font-size:13px;color:var(--text-2)}
    .ticket-divider{position:relative;height:36px;padding:0 32px;display:flex;align-items:center}
    .ticket-divider::before,.ticket-divider::after{content:'';position:absolute;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1.5px solid var(--lime);top:50%;transform:translateY(-50%)}
    .ticket-divider::before{left:-12px}
    .ticket-divider::after{right:-12px}
    .ticket-divider .dash{flex:1;border-top:1.5px dashed var(--border)}
    .ticket-body{padding:8px 32px 32px}
    .ticket-row{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--border)}
    .ticket-row:last-child{border-bottom:none}
    .ticket-label{font-size:10px;color:var(--text-2);letter-spacing:.15em;text-transform:uppercase;font-weight:700}
    .ticket-value{font-size:16px;color:var(--text);font-weight:600}
    .ticket-value.mono{font-family:var(--mono);font-size:14px}
    .ticket-value.big{font-family:var(--display);font-size:24px;letter-spacing:.02em}
    .ticket-actions{padding:0 32px 32px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .ticket-btn{padding:12px;border-radius:10px;background:var(--bg-alt);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
    .ticket-btn:hover{background:var(--surface-2);border-color:var(--text-3)}
    .ticket-pay-note{margin:16px 32px 0;background:rgba(196,240,0,.06);border:1px solid rgba(196,240,0,.2);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--lime-soft);display:flex;gap:10px;align-items:flex-start}
    .ticket-pay-note strong{color:var(--lime);display:block;margin-bottom:2px}

    /* Features */
    .features{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    @media (max-width:900px){.features{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:480px){.features{grid-template-columns:1fr}}
    .feat-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px 22px;transition:border-color .15s,transform .15s}
    .feat-card:hover{border-color:var(--lime);transform:translateY(-3px)}
    .feat-ic{width:44px;height:44px;border-radius:12px;background:rgba(196,240,0,.1);border:1px solid rgba(196,240,0,.2);color:var(--lime);display:grid;place-items:center;font-size:20px;margin-bottom:16px}
    .feat-title{font-family:var(--display);font-size:18px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px}
    .feat-text{font-size:13px;color:var(--text-2);line-height:1.6}

    /* Pricing callout */
    .price-callout{background:linear-gradient(135deg,var(--surface) 0%,var(--surface-2) 100%);border:1.5px solid var(--border);border-radius:28px;padding:48px;overflow:hidden;position:relative}
    @media (max-width:720px){.price-callout{padding:28px 20px;border-radius:20px}}
    .price-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
    @media (max-width:720px){.price-grid{grid-template-columns:1fr;gap:14px}}
    .price-tile{background:var(--bg-alt);border:1.5px solid var(--border);border-radius:18px;padding:24px 24px}
    .price-tile-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--lime);letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}
    .price-tile-title{font-family:var(--display);font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:10px}
    .price-tile-big{font-family:var(--display);font-size:48px;line-height:1;color:var(--lime);margin-bottom:6px}
    .price-tile-meta{font-size:13px;color:var(--text-2);margin-bottom:14px}

    /* Venue */
    .venue-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
    @media (max-width:800px){.venue-grid{grid-template-columns:1fr}}
    .venue-stat{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--border)}
    .venue-stat:last-child{border-bottom:none}
    .venue-stat .ic{width:40px;height:40px;border-radius:10px;background:var(--surface);display:grid;place-items:center;font-size:18px;flex-shrink:0}
    .venue-stat-label{font-size:11px;color:var(--text-2);letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
    .venue-stat-val{font-size:15px;color:var(--text);font-weight:500}
    .venue-stat-val a{color:var(--lime)}

    /* Footer */
    .footer{border-top:1px solid var(--border);padding:40px 24px;margin-top:40px;position:relative;z-index:2}
    .footer-inner{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
    .footer-copy{font-size:12px;color:var(--text-3)}

    /* Toast */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);padding:14px 22px;border-radius:99px;display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:500;z-index:100;box-shadow:0 24px 64px rgba(0,0,0,.5)}
    .toast.err{border-color:var(--danger);background:rgba(239,68,68,.1);color:#fca5a5}

    /* Config error */
    .config-err{min-height:100vh;display:grid;place-items:center;padding:24px}
    .config-err code{font-family:var(--mono);color:var(--lime)}
    .config-err pre{background:var(--surface);padding:14px 16px;border-radius:10px;font-size:12px;color:var(--lime);border:1px solid var(--border);overflow-x:auto;margin:14px 0;font-family:var(--mono)}

    .lime{color:var(--lime)}
    .mono{font-family:var(--mono)}
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const API_URL = "https://hitnrun-api.vercel.app/api";

const VENUE = {
  name:    "Hit N Run Sports Arena",
  city:    "Dehradun",
  area:    "Panditwari",
  address: "Hit N Run Sports Arena, Panditwari, Dehradun, Uttarakhand 248007",
  phone:   "+91 82733 95003",
  phone2:  "+91 82733 95003",
  phoneNet:"+91 82733 95003",
  whatsapp:"918273395003",
  maps:    "https://maps.google.com/?q=Hit+N+Run+Sports+Arena+Panditwari+Dehradun+248007",
  hoursWeek: "Mon–Fri 8 AM – 4:30 PM",
  hoursWeekend: "Sat–Sun 6 AM – 11:30 PM",
  email:   "contact@hitnrunarena.in",
  website: "hitnrunarena.in"
};

const API = {
  async get(action, params = {}) {
    const qs = new URLSearchParams({ action, ...params }).toString();
    const res = await fetch(API_URL + '?' + qs);
    return unwrap(await res.json());
  },
  async post(action, body = {}) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...body })
    });
    return unwrap(await res.json());
  }
};

function unwrap(data){
  if (data.ok) return data.data;
  const e = new Error(data.error || 'Request failed');
  e.code = data.code;  // SLOT_TAKEN, SPORT_FULL, … (see API_CONTRACT.md)
  throw e;
}

// getAvailability cache: date -> Promise. One call returns every public sport for that date.
const availCache = {};
function loadAvailability(date, fresh){
  if (fresh || !availCache[date]) {
    const p = API.get('getAvailability', { date });
    availCache[date] = p;
    p.catch(() => { if (availCache[date] === p) delete availCache[date]; });
  }
  return availCache[date];
}
function clearAvailabilityCache(){ Object.keys(availCache).forEach(k => delete availCache[k]); }

function formatDateISO(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function dateLong(iso){ if(!iso) return ''; return new Date(iso+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function dateNice(iso){ if(!iso) return ''; return new Date(iso+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}); }
function getNext15Days(){
  const t=new Date();
  return Array.from({length:15},(_,i)=>{
    const d=new Date(t); d.setDate(d.getDate()+i);
    let label = i===0 ? 'Today' : i===1 ? 'Tomorrow' : d.toLocaleDateString('en-IN',{month:'short'});
    return { iso: formatDateISO(d), label, day: d.getDate(), weekday: d.toLocaleDateString('en-IN',{weekday:'short'}) };
  });
}
function normalizePhone(p){ if(!p) return ''; return String(p).replace(/\D/g,'').slice(-10); }
function isValidEmail(e){ if(!e) return false; return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function buildCalendarLink(b){
  const [s,e]=b.slot_time.split('-').map(s=>s.trim().replace(':',''));
  const date=b.booking_date.replace(/-/g,'');
  const params = new URLSearchParams({
    action:'TEMPLATE',
    text:`${b.sport_name} at ${VENUE.name}`,
    dates:`${date}T${s}00/${date}T${e}00`,
    details:`Booking ID: ${b.booking_id}\nPay ₹${b.amount} at venue.\n\n${VENUE.address}`,
    location:VENUE.address,
    ctz:'Asia/Kolkata'
  });
  return 'https://calendar.google.com/calendar/render?'+params.toString();
}
function buildShareText(b){
  return `${b.icon || '✅'} Booked at ${VENUE.name}!\n\n📅 ${dateLong(b.booking_date)}\n⏰ ${b.slot_time}\n🎯 ${b.sport_name}\n\nBooking ID: ${b.booking_id}\nhttps://${VENUE.website}`;
}

function Spinner({ small }){ return <span className={`loading-spinner ${small?'small':''} spin`}/>; }

function Toast({ toast, onClose }){
  useEffect(()=>{ if(!toast?.show) return; const t=setTimeout(onClose,4000); return ()=>clearTimeout(t); },[toast?.show]);
  if(!toast?.show) return null;
  return <div className={`toast ${toast.isError?'err':''}`}><span>{toast.icon||(toast.isError?'⚠️':'✓')}</span><span>{toast.message}</span></div>;
}

function Nav(){
  const scroll = () => document.getElementById('book')?.scrollIntoView({behavior:'smooth'});
  return (
    <nav className="nav">
      <div className="nav-inner">
        <a href="#" className="logo" onClick={e=>{e.preventDefault();window.scrollTo({top:0,behavior:'smooth'})}}>
          <img src="/logo.jpeg" alt="Hit N Run Sports Arena" style={{height:48,width:'auto',borderRadius:8}} />
          <span className="logo-text">{VENUE.name.split(' ').slice(0,3).join(' ')}<small>{VENUE.area}, {VENUE.city}</small></span>
        </a>
        <div className="nav-cta">
          <a className="nav-link" href={`tel:${VENUE.phone.replace(/\s/g,'')}`}>📞 {VENUE.phone}</a>
          <button className="btn-cta" onClick={scroll}>Book Slot</button>
        </div>
      </div>
    </nav>
  );
}

function priceLabel(s){ return `₹${Number(s.price).toLocaleString('en-IN')} / hr${s.unit_label ? ' · ' + s.unit_label : ''}`; }

function SportsRetry({ onRetry }){
  return (
    <div className="empty-block">
      <div className="ic">📡</div>
      <div className="empty-title">Couldn't load sports</div>
      <div style={{fontSize:13,marginBottom:16}}>Check your connection and try again.</div>
      <button className="btn-secondary" style={{padding:'10px 22px'}} onClick={onRetry}>↻ Retry</button>
    </div>
  );
}

function Hero({ liveSlotsToday, sports, sportsError }){
  const scroll = () => document.getElementById('book')?.scrollIntoView({behavior:'smooth'});
  const minPrice = sports && sports.length ? Math.min(...sports.map(s => Number(s.price))) : null;
  return (
    <section className="hero">
      <div className="hero-tag anim-rise">
        <span className="live-dot"></span>
        <span>Live availability · {VENUE.area}, {VENUE.city}</span>
      </div>
      <h1 className="hero-h1 anim-rise" style={{animationDelay:'.05s'}}>
        Book your<br/><span className="accent">ground.</span>
      </h1>
      <p className="hero-sub anim-rise" style={{animationDelay:'.15s'}}>
        Dehradun's premier multi-sport arena in <strong>{VENUE.area}</strong>. Pick your game, pick your hour and <strong>pay at the venue</strong>. Live availability · No fuss.
      </p>
      <div className="hero-ctas anim-rise" style={{animationDelay:'.25s'}}>
        <button className="btn-primary" onClick={scroll}>
          Book a slot
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
        <a className="btn-secondary" href={`tel:${VENUE.phone.replace(/\s/g,'')}`}><span>📞</span> Call us</a>
      </div>
      <div className="hero-stats anim-rise" style={{animationDelay:'.4s'}}>
        <div>
          <div className="hero-stat-num">
            {liveSlotsToday===null ? (
              <span className="loading-pulse" style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:18,color:'var(--lime)',fontFamily:'var(--body)',fontWeight:600,letterSpacing:0}}>
                <span className="loading-dot"></span>
                Loading
              </span>
            ) : liveSlotsToday}
          </div>
          <div className="hero-stat-lbl">{liveSlotsToday===null ? 'Checking availability…' : 'Slots open today'}</div>
        </div>
        <div>
          <div className="hero-stat-num">{minPrice !== null ? `₹${minPrice.toLocaleString('en-IN')}` : sportsError ? '—' : '…'}</div>
          <div className="hero-stat-lbl">{minPrice !== null ? 'From / hour' : 'Hourly rates'}</div>
        </div>
        <div><div className="hero-stat-num">15</div><div className="hero-stat-lbl">Day booking window</div></div>
      </div>
    </section>
  );
}

function BookingWidget({ sports, sportsError, onRetrySports, onComplete }){
  const next15 = useMemo(()=>getNext15Days(),[]);
  const [date, setDate] = useState(next15[0].iso);
  const [sportId, setSportId] = useState(null);
  const [avail, setAvail] = useState(null);          // getAvailability response for `date`
  const [availError, setAvailError] = useState(null);
  const [availNonce, setAvailNonce] = useState(0);   // bump to force a fresh fetch
  const [selectedSlot, setSelectedSlot] = useState(null);
  const [duration, setDuration] = useState(1);
  const [form, setForm] = useState({ name:'', phone:'', email:'', members:1, notes:'' });
  const [returning, setReturning] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState(null);

  const sport = (sports || []).find(s => s.id === sportId) || null;

  // One getAvailability call covers every sport for the date. Cached per date;
  // a revisit shows the cached copy and refreshes it in the background.
  useEffect(()=>{
    let cancelled = false;
    const hadCache = !!availCache[date] && availNonce === 0;
    setSelectedSlot(null); setAvailError(null);
    if (!hadCache) setAvail(null);
    loadAvailability(date, availNonce > 0).then(
      d => { if(!cancelled) setAvail(d); },
      e => { if(!cancelled) setAvailError(e.message); }
    );
    if (hadCache) loadAvailability(date, true).then(d => { if(!cancelled) setAvail(d); }, ()=>{});
    // Prefetch next 2 days in background — makes date switching instant
    const idx = next15.findIndex(d => d.iso === date);
    [1,2].forEach(off => { const n = next15[idx + off]; if (n) loadAvailability(n.iso).catch(()=>{}); });
    return ()=>{ cancelled = true; };
  }, [date, availNonce]);

  useEffect(()=>{ setSelectedSlot(null); }, [sportId]);

  useEffect(()=>{
    const ph = normalizePhone(form.phone);
    if(ph.length !== 10){ if(returning) setReturning(null); return; }
    let cancelled = false;
    const t = setTimeout(async()=>{
      try {
        const r = await API.get('lookupCustomer', { phone: ph });
        if(cancelled || !r) return;
        if(r.found){
          setReturning(r);
          setForm(p => ({ ...p, name: p.name || r.customer_name, email: p.email || r.email || '' }));
        } else { setReturning(null); }
      } catch(_) {}
    }, 500);
    return ()=>{ cancelled = true; clearTimeout(t); };
  }, [form.phone]);

  // Whenever the user picks a new slot, reset duration to 1 hr.
  useEffect(()=>{ setDuration(1); }, [selectedSlot && selectedSlot.slot_id]);

  const hours = ((avail && avail.sports.find(s => s.sport_id === sportId)) || { hours: [] }).hours.filter(h => h.available > 0);
  const maxPerBooking = sport ? sport.max_slots_per_booking : 1;
  const maxDur = selectedSlot ? Math.min(selectedSlot.max_duration || 1, maxPerBooking) : 1;
  const effectiveDuration = Math.min(duration, maxDur);
  // Display only: server hourly price × hours. The ticket shows the server's final amount.
  const displayTotal = h => '₹' + (Number(selectedSlot ? selectedSlot.price : 0) * h).toLocaleString('en-IN');
  // lookupCustomer returns a sport_id; only ever show a public sport's name
  const lastSportName = returning && ((sports || []).find(s => s.id === returning.last_sport) || {}).name;

  const canBook = sport && selectedSlot && form.name.trim() && normalizePhone(form.phone).length === 10 && isValidEmail(form.email);

  async function submit(){
    if(!canBook || submitting) return;
    setSubmitting(true);
    setError(null);
    try {
      const result = await API.post('createBooking', {
        customer_name: form.name.trim(),
        phone: normalizePhone(form.phone),
        email: form.email.trim(),
        sport_id: sport.id,
        slot_id: selectedSlot.slot_id,
        duration_hrs: effectiveDuration,
        members_count: parseInt(form.members,10) || 1,
        notes: form.notes.trim() || ''
      });
      clearAvailabilityCache();
      onComplete({
        ...result,
        booking_date: result.slot_date,
        sport_name: result.sport_name || sport.name,
        icon: sport.icon,
        members_count: parseInt(form.members,10) || 1,
        customer_name: form.name.trim(),
        email: form.email.trim()
      });
    } catch(e) {
      setError(e.message);
      setSubmitting(false);
      // Someone beat us to it — show fresh counts
      if (e.code === 'SLOT_TAKEN' || e.code === 'SPORT_FULL') setAvailNonce(n => n + 1);
    }
  }

  return (
    <section className="section" id="book">
      <div className="section-head">
        <span className="section-eyebrow">Book in 60 seconds</span>
        <h2 className="section-h2">Lock in<br/>your slot.</h2>
        <p className="section-sub">No advance payment. Pay at the venue when you arrive. Email confirmation hits your inbox immediately.</p>
      </div>
      <div className="booking-card">
        {/* STEP 1 */}
        <div className="booking-step">
          <div className="step-label">
            <span className="step-num">1</span>
            <span className="step-title">When are you playing?</span>
            <span className="step-meta">{dateLong(date)}</span>
          </div>
          <div className="date-strip">
            {next15.map(d => (
              <button key={d.iso} className={`date-pill ${date===d.iso?'active':''}`} onClick={()=>setDate(d.iso)}>
                <span className="d-label">{d.label}</span>
                <span className="d-num">{d.day}</span>
                <span className="d-wd">{d.weekday}</span>
              </button>
            ))}
          </div>
        </div>

        {/* STEP 2 */}
        <div className="booking-step">
          <div className="step-label">
            <span className="step-num">2</span>
            <span className="step-title">What's the game?</span>
          </div>
          {sportsError && <SportsRetry onRetry={onRetrySports}/>}
          {!sportsError && !sports && (
            <div className="sport-grid">{[0,1,2].map(i => <div key={i} className="sport-card shimmer" style={{height:76}}/>)}</div>
          )}
          {sports && sports.length === 0 && (
            <div className="empty-block"><div className="ic">🗓️</div><div className="empty-title">No online bookings right now</div><div style={{fontSize:13}}>Call us on {VENUE.phone} to book.</div></div>
          )}
          {sports && sports.length > 0 && (
            <div className="sport-grid">
              {sports.map(s => (
                <button key={s.id} className={`sport-card ${sportId===s.id?'active':''}`} onClick={()=>setSportId(s.id)}>
                  <span className="ic">{s.icon}</span>
                  <div className="sport-card-text">
                    <div className="name">{s.name}</div>
                    {s.tagline && <div className="price">{s.tagline}</div>}
                    <div className="price">{priceLabel(s)}</div>
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>

        {/* STEP 3 */}
        <div className="booking-step">
          <div className="step-label">
            <span className={`step-num ${sport?'':'dim'}`}>3</span>
            <span className="step-title">Pick your time</span>
            <span className="step-meta">{!sport ? 'Choose a sport first ↑' : !avail ? 'Checking…' : `${hours.length} available`}</span>
          </div>
          {!sport && (
            <div className="empty-block"><div className="ic">🎯</div><div className="empty-title">Pick a sport above</div><div style={{fontSize:13}}>We'll show you what's open on {dateNice(date)}</div></div>
          )}
          {sport && availError && !avail && (
            <div className="empty-block">
              <div className="ic">📡</div><div className="empty-title">Couldn't load availability</div>
              <div style={{fontSize:13,marginBottom:16}}>{availError}</div>
              <button className="btn-secondary" style={{padding:'10px 22px'}} onClick={()=>setAvailNonce(n => n + 1)}>↻ Retry</button>
            </div>
          )}
          {sport && !avail && !availError && (
            <div className="loading-block"><Spinner/><div style={{marginTop:16,fontSize:13,color:'var(--text-2)'}}>Fetching live availability…</div></div>
          )}
          {sport && avail && hours.length === 0 && (
            <div className="empty-block"><div className="ic">📭</div><div className="empty-title">Fully booked</div><div style={{fontSize:13}}>No slots left for {sport.name} on {dateNice(date)}.<br/>Try a different day or sport.</div></div>
          )}
          {sport && avail && hours.length > 0 && (
            <div className="slots-grid">
              {hours.map(h => {
                const active = selectedSlot && selectedSlot.slot_time === h.slot_time;
                const [startT, endT] = h.slot_time.split('-');
                return (
                  <button key={h.slot_time} className={`slot-card ${active?'active':''}`} onClick={()=>setSelectedSlot(h)}>
                    <div className="time-row">
                      <span className="slot-time">{startT}</span>
                      <span className="slot-arrow">→</span>
                      <span className="slot-time end">{endT}</span>
                    </div>
                    <div className="slot-price">₹{Number(h.price).toLocaleString('en-IN')} / hr</div>
                    <div className="slot-meta">{h.available} left</div>
                  </button>
                );
              })}
            </div>
          )}
        </div>

        {/* STEP 3.5 — Duration picker (only when a slot is selected) */}
        {selectedSlot && (
          <div className="booking-step anim-rise-fast">
            <div className="step-label">
              <span className="step-num">⏱</span>
              <span className="step-title">Duration</span>
              <span className="step-meta">{maxDur >= 2 ? `Up to ${maxDur} hours available` : '1 hour only'}</span>
            </div>
            <div className="duration-grid">
              {Array.from({ length: maxPerBooking }, (_, i) => i + 1).map(h => {
                const disabled = h > maxDur;
                const active = effectiveDuration === h;
                return (
                  <button
                    key={h}
                    className={`duration-card ${active?'active':''} ${disabled?'disabled':''}`}
                    onClick={()=>!disabled && setDuration(h)}
                    disabled={disabled}
                    title={disabled ? 'Not enough consecutive slots available' : ''}
                  >
                    <div className="dur-h">{h} hr{h>1?'s':''}</div>
                    <div className="dur-price">{displayTotal(h)}</div>
                    {disabled && <div className="dur-sub">unavailable</div>}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* STEP 4 */}
        {selectedSlot && (
          <div className="booking-step anim-rise-fast">
            <div className="step-label">
              <span className="step-num">4</span>
              <span className="step-title">Your details</span>
              <span className="step-meta">Almost there.</span>
            </div>
            <div className="form-grid">
              {returning && (
                <div className="return-banner anim-rise-fast">
                  <span className="return-emoji">👋</span>
                  <div className="return-text">
                    <strong>Welcome back, {returning.customer_name}!</strong>
                    <span className="sub">{returning.bookings_count} previous {returning.bookings_count===1?'booking':'bookings'}{lastSportName?` · Last played ${lastSportName}`:''}</span>
                  </div>
                </div>
              )}
              <div className="form-field">
                <label className="form-label">Phone *</label>
                <input type="tel" className="form-input" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="98765 43210" maxLength={15} autoComplete="tel"/>
                <div className="field-hint">10 digits, with or without country code</div>
              </div>
              <div className="form-field">
                <label className="form-label">Name *</label>
                <input type="text" className="form-input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Your full name" autoComplete="name"/>
              </div>
              <div className="form-field">
                <label className="form-label">Email * <span style={{ textTransform:'none', letterSpacing:0, fontWeight:500, color:'var(--text-3)' }}>(for booking confirmation)</span></label>
                <input type="email" className="form-input" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="you@example.com" autoComplete="email" required/>
                {!isValidEmail(form.email) && form.email && <div className="field-hint" style={{color:'var(--danger)'}}>Looks like an invalid email</div>}
                {!form.email && <div className="field-hint">Required — we'll send your booking ID and venue details here</div>}
              </div>
              <div className="form-field">
                <label className="form-label">Players</label>
                <input type="number" className="form-input" value={form.members} onChange={e=>setForm({...form,members:e.target.value})} min={1} max={30}/>
              </div>
              <div className="form-field span-2">
                <label className="form-label">Notes (optional)</label>
                <input type="text" className="form-input" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Team name, special equipment, anything we should know…"/>
              </div>
            </div>
            <div className="submit-row">
              <button className="btn-submit" onClick={submit} disabled={!canBook || submitting}>
                {submitting ? <><Spinner small/> Booking…</> : <>Lock in {effectiveDuration} hr{effectiveDuration>1?'s':''} · {displayTotal(effectiveDuration)} <span>→</span></>}
              </button>
              <div className="submit-note">💰 Pay at the venue — cash or UPI. Cancel anytime by calling us.</div>
            </div>
          </div>
        )}
        {error && <div style={{marginTop:16,background:'rgba(239,68,68,.1)',border:'1px solid var(--danger)',borderRadius:12,padding:'12px 16px',fontSize:13,color:'#fca5a5'}}>⚠ {error}</div>}
      </div>
    </section>
  );
}

function ConfirmationTicket({ booking, onReset }){
  const [copied, setCopied] = useState(false);

  function copyShare(){
    navigator.clipboard?.writeText(buildShareText(booking)).then(()=>{
      setCopied(true);
      setTimeout(()=>setCopied(false), 2000);
    });
  }

  return (
    <section className="section" id="book">
      <div className="section-head" style={{textAlign:'center'}}>
        <span className="section-eyebrow">Locked in</span>
        <h2 className="section-h2">You're<br/><span className="lime">on.</span></h2>
      </div>
      <div className="ticket anim-rise">
        <div className="ticket-head">
          <div className="ticket-check pulse-glow">✓</div>
          <div className="ticket-title">{booking.icon} {booking.sport_name} Booked</div>
          <div className="ticket-sub">{booking.email ? `Confirmation sent to ${booking.email}` : 'Show this screen at the venue'}</div>
        </div>
        <div className="ticket-divider"><span className="dash"></span></div>
        <div className="ticket-body">
          <div className="ticket-row"><span className="ticket-label">Booking ID</span><span className="ticket-value mono">{booking.booking_id}</span></div>
          <div className="ticket-row"><span className="ticket-label">Sport</span><span className="ticket-value big">{booking.sport_name}</span></div>
          <div className="ticket-row"><span className="ticket-label">Date</span><span className="ticket-value">{dateLong(booking.booking_date)}</span></div>
          <div className="ticket-row"><span className="ticket-label">Time</span><span className="ticket-value big" style={{fontSize:20}}>{booking.slot_time}</span></div>
          {booking.duration_hrs > 1 && (
            <div className="ticket-row"><span className="ticket-label">Duration</span><span className="ticket-value big">{booking.duration_hrs} hours</span></div>
          )}
          <div className="ticket-row"><span className="ticket-label">Players</span><span className="ticket-value">{booking.members_count}</span></div>
          <div className="ticket-row"><span className="ticket-label">Amount</span><span className="ticket-value big lime">₹{parseInt(booking.amount||0).toLocaleString('en-IN')}</span></div>
        </div>
        <div className="ticket-pay-note">
          <span style={{fontSize:18}}>💰</span>
          <div><strong>Pay at the venue</strong>Cash or UPI accepted on arrival.</div>
        </div>
        <div className="ticket-actions">
          <a className="ticket-btn" href={VENUE.maps} target="_blank" rel="noopener">📍 Get directions</a>
          <a className="ticket-btn" href={buildCalendarLink(booking)} target="_blank" rel="noopener">📅 Add to calendar</a>
          <a className="ticket-btn" href={`tel:${VENUE.phone.replace(/\s/g,'')}`}>📞 Call venue</a>
          <button className="ticket-btn" onClick={copyShare}>{copied?'✓ Copied!':'📤 Share details'}</button>
        </div>
      </div>
      <div style={{textAlign:'center',marginTop:32}}>
        <button className="btn-secondary" onClick={onReset}>Book another slot</button>
      </div>
    </section>
  );
}

function Features(){
  const items = [
    { ic:'⚡', title:'Live availability', text:'See exactly which slots are open. No back-and-forth on calls.' },
    { ic:'💰', title:'Pay at venue',      text:'No advance payment. Cash or UPI when you show up.' },
    { ic:'🎯', title:'Pick your game',    text:'Every game we run is bookable right here, with live prices.' },
    { ic:'📅', title:'15-day window',     text:'Book today or two weeks out. Plan ahead without stress.' }
  ];
  return (
    <section className="section">
      <div className="section-head">
        <span className="section-eyebrow">Why book here</span>
        <h2 className="section-h2">No fuss.<br/>Just play.</h2>
      </div>
      <div className="features">{items.map(i => <div key={i.title} className="feat-card"><div className="feat-ic">{i.ic}</div><div className="feat-title">{i.title}</div><div className="feat-text">{i.text}</div></div>)}</div>
    </section>
  );
}

function PricingCallout({ sports, error, onRetry }){
  return (
    <section className="section">
      <div className="price-callout">
        <div style={{marginBottom:32}}>
          <span className="section-eyebrow">Hourly rates</span>
          <h3 style={{fontFamily:'var(--display)',fontSize:'clamp(32px,4.5vw,52px)',letterSpacing:'-.01em',textTransform:'uppercase',lineHeight:1}}>Simple<br/><span className="lime">pricing.</span></h3>
        </div>
        {error && <SportsRetry onRetry={onRetry}/>}
        {!error && !sports && <div className="loading-block"><Spinner/></div>}
        {sports && (
          <div className="price-grid">
            {sports.map(s => (
              <div key={s.id} className="price-tile">
                <span className="price-tile-tag">{s.icon} {s.name}</span>
                <div className="price-tile-big">₹{Number(s.price).toLocaleString('en-IN')}</div>
                <div className="price-tile-meta">Per hour{s.unit_label ? ` · ${s.unit_label}` : ''}</div>
                {s.tagline && <div className="price-tile-meta" style={{marginBottom:0}}>{s.tagline}</div>}
              </div>
            ))}
          </div>
        )}
      </div>
    </section>
  );
}

function VenueInfo(){
  return (
    <section className="section">
      <div className="venue-grid">
        <div>
          <span className="section-eyebrow">Find us</span>
          <h2 className="section-h2" style={{fontSize:'clamp(36px,5vw,56px)'}}>{VENUE.area}.<br/>Open daily.</h2>
        </div>
        <div>
          <div className="venue-stat"><div className="ic">📍</div><div><div className="venue-stat-label">Address</div><div className="venue-stat-val">{VENUE.address}</div><a href={VENUE.maps} target="_blank" rel="noopener" className="lime" style={{fontSize:13,fontWeight:600,marginTop:6,display:'inline-block'}}>Open in Maps →</a></div></div>
          <div className="venue-stat"><div className="ic">⏰</div><div><div className="venue-stat-label">Hours</div><div className="venue-stat-val">{VENUE.hoursWeek}<br/>{VENUE.hoursWeekend}</div></div></div>
          <div className="venue-stat"><div className="ic">📞</div><div><div className="venue-stat-label">Phone</div><div className="venue-stat-val"><a href={`tel:${VENUE.phone.replace(/\s/g,'')}`}>{VENUE.phone}</a> · <a href={`tel:${VENUE.phone2.replace(/\s/g,'')}`}>{VENUE.phone2}</a></div></div></div>
          <div className="venue-stat"><div className="ic">🗓️</div><div><div className="venue-stat-label">Bookings</div><div className="venue-stat-val"><a href={`tel:${VENUE.phoneNet.replace(/\s/g,'')}`}>{VENUE.phoneNet}</a></div></div></div>
          <div className="venue-stat"><div className="ic">✉️</div><div><div className="venue-stat-label">Email</div><div className="venue-stat-val">{VENUE.email}</div></div></div>
        </div>
      </div>
    </section>
  );
}

function Footer(){
  return (
    <footer className="footer">
      <div className="footer-inner">
        <div className="footer-copy">© {new Date().getFullYear()} {VENUE.name}. {VENUE.area}, {VENUE.city}.</div>
        <div className="footer-copy">Built with ❤️ for the players.</div>
      </div>
    </footer>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state = { error: null }; }
  static getDerivedStateFromError(e){ return { error: e }; }
  componentDidCatch(e, i){ console.error('Crash:', e, i); }
  render(){
    if (this.state.error) {
      return (
        <div className="config-err">
          <div style={{maxWidth:520,textAlign:'center'}}>
            <div style={{fontSize:48,marginBottom:16}}>⚠️</div>
            <div style={{fontFamily:'var(--display)',fontSize:24,marginBottom:10}}>Something broke</div>
            <div style={{fontSize:13,color:'var(--text-2)',lineHeight:1.7,marginBottom:18}}>Please refresh the page. If it persists, share the error below.</div>
            <pre style={{background:'var(--surface)',padding:'12px 14px',borderRadius:10,fontSize:12,color:'var(--lime)',border:'1px solid var(--border)',overflowX:'auto',maxHeight:200,textAlign:'left'}}>{String(this.state.error?.message || this.state.error)}</pre>
            <button onClick={()=>location.reload()} style={{marginTop:18,padding:'10px 24px',background:'var(--lime)',color:'#000',border:'none',borderRadius:8,fontSize:13,fontWeight:800,cursor:'pointer'}}>Reload</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

function App(){
  const [booking, setBooking] = useState(null);
  const [liveSlotsToday, setLiveSlotsToday] = useState(null);
  const [toast, setToast] = useState({ show:false });
  const [sports, setSports] = useState(null);         // null = loading
  const [sportsError, setSportsError] = useState(null);

  async function loadSports(){
    setSportsError(null); setSports(null);
    try { setSports(await API.get('getSports') || []); }
    catch(e){ setSportsError(e.message || 'Request failed'); }
  }

  // Hours today where at least one sport can still be booked
  const refreshSlotCount = async (fresh) => {
    try {
      const d = await loadAvailability(formatDateISO(new Date()), fresh);
      const open = new Set();
      d.sports.forEach(s => s.hours.forEach(h => { if (h.available > 0) open.add(h.slot_time); }));
      setLiveSlotsToday(open.size);
    } catch(_) { setLiveSlotsToday(0); }
  };

  useEffect(()=>{ loadSports(); refreshSlotCount(); }, []);

  function complete(r){
    setBooking(r);
    setToast({ show:true, message:'Booking confirmed!', icon:'✓' });
    setTimeout(()=>document.getElementById('book')?.scrollIntoView({behavior:'smooth'}), 100);
  }

  function reset(){
    setBooking(null);
    refreshSlotCount(true);
    setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}), 100);
  }

  return (
    <>
      <div className="stage-bg"><div className="orb orb-1"/><div className="orb orb-2"/><div className="orb orb-3"/></div>
      <div className="grain"/>
      <Nav/>
      {!booking && <Hero liveSlotsToday={liveSlotsToday} sports={sports} sportsError={sportsError}/>}
      {booking
        ? <ConfirmationTicket booking={booking} onReset={reset}/>
        : <BookingWidget sports={sports} sportsError={sportsError} onRetrySports={loadSports} onComplete={complete}/>}
      {!booking && <><Features/><PricingCallout sports={sports} error={sportsError} onRetry={loadSports}/><VenueInfo/></>}
      <Footer/>
      <Toast toast={toast} onClose={()=>setToast({show:false})}/>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
