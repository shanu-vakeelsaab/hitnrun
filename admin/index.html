  // ── NOTIFICATIONS: sound + browser notification when new bookings arrive ──
  const [notifEnabled, setNotifEnabled] = useState(false);
  const seenBookingsRef = useRef(new Set());
  const isFirstBookingsLoadRef = useRef(true);
  const audioCtxRef = useRef(null);

  // Play a two-tone "ding" using Web Audio (no external file needed)
  function playNotificationSound(){
    try {
      if (!audioCtxRef.current) {
        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      }
      const ctx = audioCtxRef.current;
      if (ctx.state === 'suspended') ctx.resume();
      // Two-tone ding: high then low
      [880, 660].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        const t = ctx.currentTime + i * 0.18;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.35, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
        osc.start(t);
        osc.stop(t + 0.5);
      });
    } catch(e) { console.warn('Audio playback failed:', e); }
  }

  function showBrowserNotification(b){
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    try {
      const kindEmoji = b.booking_kind === 'net' ? '🥅' : '🏏';
      const n = new Notification(`${kindEmoji} New Booking - ${b.customer_name}`, {
        body: `${b.sport} · ${b.slot_time} · ${formatDateShort(b.booking_date)}\nRs ${b.amount} · ${b.members_count} player${b.members_count>1?'s':''}`,
        tag: b.booking_id,
        requireInteraction: false,
        silent: true  // we play our own sound
      });
      n.onclick = () => { window.focus(); n.close(); };
      setTimeout(() => n.close(), 12000);
    } catch(e) { console.warn('Notification failed:', e); }
  }

  async function enableNotifications(){
    // Unlock audio context with this user gesture
    try {
      if (!audioCtxRef.current) {
        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtxRef.current.state === 'suspended') {
        await audioCtxRef.current.resume();
      }
    } catch(_){}

    // Request browser notification permission
    if ('Notification' in window) {
      try {
        const perm = await Notification.requestPermission();
        if (perm !== 'granted') {
          err('Notification permission denied. Enable it in browser settings.');
          return;
        }
      } catch(e) { err('Could not request notification permission'); return; }
    }

    setNotifEnabled(true);
    localStorage.setItem('hnr_notifs_enabled', '1');
    playNotificationSound();  // test sound to confirm + unlock audio
    ok('Alerts enabled - sound + desktop notifications active');
  }

  function disableNotifications(){
    setNotifEnabled(false);
    localStorage.removeItem('hnr_notifs_enabled');
    ok('Alerts disabled');
  }

  // Restore notification setting on mount
  useEffect(() => {
    if (loggedIn && localStorage.getItem('hnr_notifs_enabled') === '1' &&
        'Notification' in window && Notification.permission === 'granted') {
      setNotifEnabled(true);
    }
  }, [loggedIn]);

  // Detect new bookings on every data refresh and fire alerts
  useEffect(() => {
    if (!bookings.length) return;
    if (isFirstBookingsLoadRef.current) {
      // First load: mark all current bookings as "seen" without firing alerts
      bookings.forEach(b => seenBookingsRef.current.add(b.booking_id));
      isFirstBookingsLoadRef.current = false;
      return;
    }
    const newOnes = bookings.filter(b =>
      !seenBookingsRef.current.has(b.booking_id) && b.status === 'confirmed'
    );
    newOnes.forEach(b => seenBookingsRef.current.add(b.booking_id));
    if (newOnes.length && notifEnabled) {
      playNotificationSound();
      newOnes.forEach(showBrowserNotification);
    }
    if (newOnes.length) {
      ok(`🔔 ${newOnes.length} new booking${newOnes.length>1?'s':''} arrived`);
    }
  }, [bookings, notifEnabled]);

  // ── FAST INITIAL LOAD: one combined call ──
  const loadSnapshot = useCallback(async (opts={}) => {
    setRefreshing(true);
    try {
      const params = {
        date: opts.date || slotDate,
        includeLeads: opts.includeLeads ? 'true' : '',
        includeMembers: opts.includeMembers ? 'true' : ''
      };
      // noCache bypass — used by manual refresh button to force fresh data
      if (opts.noCache) params.noCache = '1';
      const snap = await API.get('getDashboardSnapshot', params);
      setBookings(snap.bookings || []);
      setSlots(snap.slots || []);
      setStats(snap.stats || {});
      if(opts.includeLeads && snap.leads)     setLeads(snap.leads);
      if(opts.includeMembers && snap.members) setMembers(snap.members);
      setLastSync(new Date());
    } catch(e){
      err('Failed to load: ' + e.message);
    } finally {
      setRefreshing(false);
    }
  }, [slotDate]);

  // Initial load — fetch everything at once
  useEffect(()=>{
    if(!loggedIn) return;
    setLoading(true);
    loadSnapshot({ includeLeads: true, includeMembers: true }).finally(()=>setLoading(false));
  }, [loggedIn]);

  // Refetch slots only when date changes (after initial load)
  const isInitialLoad = useRef(true);
  useEffect(()=>{
    if(!loggedIn) return;
    if(isInitialLoad.current){ isInitialLoad.current = false; return; }
    (async()=>{
      try {
        const s = await API.get('getSlotsAdmin', { date: slotDate });
        setSlots(s || []);
      } catch(e){ err('Failed to load slots: ' + e.message); }
    })();
  }, [slotDate]);

  // ── AUTO-REFRESH using refs (interval created once per session) ──
  const refreshRefs = useRef({});
  refreshRefs.current = {
    slotDate, tab,
    paused: confirm.show || showSpot || showPass || showLead,
    loadSnapshot
  };
  useEffect(()=>{
    if(!loggedIn) return;
    const tick = async () => {
      const r = refreshRefs.current;
      if(document.hidden || r.paused) return;
      try {
        const params = { date: r.slotDate };
        if(r.tab === 'leads')   params.includeLeads = 'true';
        if(r.tab === 'passes')  params.includeMembers = 'true';
        const snap = await API.get('getDashboardSnapshot', params);
        setBookings(snap.bookings || []);
        setSlots(snap.slots || []);
        setStats(snap.stats || {});
        if(snap.leads)   setLeads(snap.leads);
        if(snap.members) setMembers(snap.members);
        setLastSync(new Date());
      } catch(_) {}
    };
    const id = setInterval(tick, REFRESH_INTERVAL_MS);
    return () => clearInterval(id);
  }, [loggedIn]);

  // Time ticker for "X ago" display
  useEffect(()=>{
    const id = setInterval(()=>setNow(new Date()), 5000);
    return ()=>clearInterval(id);
  }, []);

  // Refetch revenue on tab change
  useEffect(()=>{
    if(loggedIn && tab === 'revenue') fetchRevenue();
  }, [tab, loggedIn]);

  async function fetchRevenue(){
    try {
      const params = {};
      if(revenueRange.from) params.from = revenueRange.from;
      if(revenueRange.to)   params.to   = revenueRange.to;
      const r = await API.get('getRevenue', params);
      setRevenue(r);
    } catch(e){ err('Failed to load revenue: '+e.message); }
  }

  // ── Derived state ──
  const todayStr = formatDateISO(new Date());
  const confirmedToday = bookings.filter(b => b.booking_date===todayStr && b.status==='confirmed');
  const pendingToday   = confirmedToday.filter(b => b.payment_status==='pending');
  const revenueToday   = confirmedToday.filter(b => b.payment_status==='paid').reduce((s,b)=>s+(parseFloat(b.amount)||0), 0);
  const newLeadCount   = leads.filter(l => l.status === 'new').length;

  const filteredBookings = useMemo(()=>{
    if(!searchQ.trim()) return bookings;
    const q = searchQ.toLowerCase().trim();
    const qPhone = normalizePhone(searchQ);
    return bookings.filter(b =>
      (b.booking_id && b.booking_id.toLowerCase().includes(q)) ||
      (b.customer_name && b.customer_name.toLowerCase().includes(q)) ||
      (qPhone.length>=4 && normalizePhone(b.phone).includes(qPhone))
    );
  }, [bookings, searchQ]);

  // Group slots by time window — each window has 4 resources
  const groupedSlots = useMemo(()=>{
    const map = {};
    slots.forEach(s => {
      if(!map[s.slot_time]) map[s.slot_time] = {};
      map[s.slot_time][s.resource] = s;
    });
    return Object.keys(map).sort().map(time => ({
      slot_time: time,
      turf: map[time].turf,
      net1: map[time].net1,
      net2: map[time].net2,
      net3: map[time].net3
    }));
  }, [slots]);

  // Slot filter
  const filteredGrouped = useMemo(()=>{
    if(slotFilter === 'all') return groupedSlots;
    return groupedSlots.filter(g => {
      const all = [g.turf, g.net1, g.net2, g.net3].filter(Boolean);
      if(slotFilter === 'available') return all.some(r => r.status === 'available');
      if(slotFilter === 'booked')    return all.some(r => r.status === 'booked');
      if(slotFilter === 'advance')   return all.some(r => r.status === 'advance');
      if(slotFilter === 'blocked')   return all.some(r => r.status === 'blocked');
      return true;
    });
  }, [groupedSlots, slotFilter]);

  // ── Actions ──
  async function markPaid(id){
    setConfirm({ show:true, title:'Mark as Paid?', message:'This booking will be recorded as paid.', confirmLabel:'Mark Paid', onConfirm: async()=>{
      try {
        // Optimistic update
        setBookings(prev => prev.map(b => b.booking_id===id ? {...b, payment_status:'paid', payment_mode:'cash'} : b));
        await API.post('updateBooking', { id, payment_status:'paid', payment_mode:'cash' });
        ok('Marked as paid');
        loadSnapshot({ noCache: true });
      } catch(e){ err(e.message); loadSnapshot({ noCache: true }); }
    }});
  }

  async function cancelBooking(id){
    setConfirm({ show:true, title:'Cancel Booking?', message:'This will free up the slot. This action cannot be undone.', confirmLabel:'Cancel Booking', danger:true, onConfirm: async()=>{
      try {
        // Optimistic update
        const booking = bookings.find(b => b.booking_id === id);
        setBookings(prev => prev.map(b => b.booking_id===id ? {...b, status:'cancelled'} : b));
        if (booking?.slot_id) {
          setSlots(prev => prev.map(s => s.slot_id===booking.slot_id ? {...s, status:'available', booking_id:'', booked_name:'', booked_phone:'', sport:''} : s));
        }
        await API.post('cancelBooking', { id });
        ok('Booking cancelled');
        loadSnapshot({ noCache: true });
      } catch(e){ err(e.message); loadSnapshot({ noCache: true }); }
    }});
  }

  async function blockSlot(slot_id){
    const reason = prompt('Reason for blocking?');
    if(!reason) return;
    try {
      setSlots(prev => prev.map(s => s.slot_id===slot_id ? {...s, status:'blocked', block_reason:reason} : s));
      await API.post('blockSlot', { slot_id, reason });
      ok('Slot blocked');
      loadSnapshot({ noCache: true });
    } catch(e){ err(e.message); loadSnapshot({ noCache: true }); }
  }

  async function unblockSlot(slot_id){
    try {
      setSlots(prev => prev.map(s => s.slot_id===slot_id ? {...s, status:'available', block_reason:''} : s));
      await API.post('unblockSlot', { slot_id });
      ok('Slot unblocked');
      loadSnapshot({ noCache: true });
    } catch(e){ err(e.message); loadSnapshot({ noCache: true }); }
  }

  async function deleteLead(id){
    setConfirm({ show:true, title:'Delete Lead?', message:'This will permanently remove this lead.', confirmLabel:'Delete', danger:true, onConfirm: async()=>{
      try {
        setLeads(prev => prev.filter(l => l.lead_id !== id));
        await API.post('deleteLead', { id });
        ok('Lead deleted');
        loadSnapshot({ includeLeads: true, noCache: true });
      } catch(e){ err(e.message); loadSnapshot({ includeLeads: true, noCache: true }); }
    }});
  }

  async function moveLeadStatus(id, status){
    try {
      setLeads(prev => prev.map(l => l.lead_id===id ? {...l, status} : l));
      await API.post('updateLead', { id, status });
      ok('Lead moved to ' + status);
      loadSnapshot({ includeLeads: true, noCache: true });
    } catch(e){ err(e.message); loadSnapshot({ includeLeads: true, noCache: true }); }
  }

  async function renewMember(id){
    setConfirm({ show:true, title:'Renew Membership?', message:'This will extend the membership from today.', confirmLabel:'Renew', onConfirm: async()=>{
      try { await API.post('renewMember', { id }); ok('Membership renewed'); loadSnapshot({ includeMembers: true, noCache: true }); }
      catch(e){ err(e.message); }
    }});
  }

  async function cancelMember(id){
    setConfirm({ show:true, title:'Cancel Membership?', message:'This will deactivate the membership.', confirmLabel:'Cancel Membership', danger:true, onConfirm: async()=>{
      try {
        setMembers(prev => prev.map(m => m.member_id===id ? {...m, status:'cancelled'} : m));
        await API.post('cancelMember', { id });
        ok('Membership cancelled');
        loadSnapshot({ includeMembers: true, noCache: true });
      }
      catch(e){ err(e.message); loadSnapshot({ includeMembers: true, noCache: true }); }
    }});
  }

  function signOut(){
    sessionStorage.removeItem('hnr_admin_key');
    setLoggedIn(false);
  }

  // ── Render ──
  if(API_URL === "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE"){
    return (
      <div style={{ minHeight:'100vh', background:'#0a0a0a', color:'#fff', display:'grid', placeItems:'center', padding:24 }}>
        <div style={{ maxWidth:560 }}>
          <div style={{ fontSize:48, marginBottom:16 }}>⚙️</div>
          <div style={{ fontSize:24, fontWeight:800, marginBottom:12 }}>Setup required</div>
          <div style={{ fontSize:14, color:'#888', lineHeight:1.7, marginBottom:18 }}>
            Open this HTML file in a text editor and replace the API_URL placeholder with your Apps Script Web App URL.
          </div>
          <pre style={{ background:'#141414', padding:'12px 14px', borderRadius:8, fontSize:12, color:'#c4f000', overflow:'auto', border:'1px solid #2a2a2a' }}>{`const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";`}</pre>
        </div>
      </div>
    );
  }

  if(!loggedIn) return <LoginPage onLogin={()=>setLoggedIn(true)}/>;

  const navItems = [
    { key:'bookings',     label:'Bookings',     icon:'📅', badge: pendingToday.length },
    { key:'availability', label:'Availability', icon:'⏱️' },
    { key:'leads',        label:'Leads',        icon:'👤', badge: newLeadCount },
    { key:'passes',       label:'Passes',       icon:'🎟️' },
    { key:'revenue',      label:'Revenue',      icon:'💰' }
  ];

  return (
    <div style={{ minHeight:'100vh', background:'#f9fafb' }}>
      {/* ── Top Bar ── */}
      <div className="top-bar" style={{
        background:'#0a0a0a', padding:'0 24px',
        display:'flex', alignItems:'center', justifyContent:'space-between',
        height:58, position:'sticky', top:0, zIndex:80, borderBottom:'1px solid #1a1a1a'
      }}>
        <div style={{ display:'flex', alignItems:'center', gap:14 }}>
          <div style={{ width:32, height:32, borderRadius:8, background:'linear-gradient(135deg,#c4f000,#94c800)', display:'grid', placeItems:'center', fontSize:16 }}>🏏</div>
          <div>
            <div style={{ fontSize:14, fontWeight:800, color:'#fff', lineHeight:1.2, letterSpacing:'-.3px' }}>Hit N Run Sports Arena</div>
            <div className="brand-sub" style={{ fontSize:10, color:'#444', letterSpacing:'.06em', textTransform:'uppercase' }}>Admin Panel</div>
          </div>
        </div>
        <div className="top-bar-actions" style={{ display:'flex', alignItems:'center', gap:14 }}>
          <div className="top-bar-date" style={{ fontSize:12, color:'#444' }}>{formatDateLong()}</div>
          <div title={lastSync ? `Auto-refreshing every ${REFRESH_INTERVAL_MS/1000}s · last sync ${lastSync.toLocaleTimeString('en-IN')}` : 'Connecting…'}
            style={{
              display:'flex', alignItems:'center', gap:6, fontSize:11,
              color: refreshing ? '#f59e0b' : '#10b981',
              padding:'5px 10px',
              background: refreshing ? '#1a1410' : '#0f1a12',
              border:'1px solid ' + (refreshing ? '#3a2a1a' : '#1a3a26'),
              borderRadius:99, fontWeight:600,
              transition: 'all .2s'
            }}>
            {refreshing
              ? <span className="spin" style={{ display:'inline-block', width:7, height:7, border:'1.5px solid #f59e0b', borderTopColor:'transparent', borderRadius:'50%' }}/>
              : <span className="live-dot-green"></span>}
            <span className="live-text-full">{refreshing ? 'Syncing…' : `Live · ${lastSync ? relativeTime(lastSync, now) : 'syncing…'}`}</span>
          </div>
          <button
            onClick={notifEnabled ? disableNotifications : enableNotifications}
            title={notifEnabled ? 'Click to disable booking alerts' : 'Click to enable sound + notifications for new bookings'}
            style={{
              padding:'7px 12px',
              background: notifEnabled ? '#10b981' : '#1a1a1a',
              color: notifEnabled ? '#000' : '#fff',
              borderRadius:8, fontSize:12, fontWeight:700,
              border: '1px solid ' + (notifEnabled ? '#10b981' : '#2a2a2a'),
              display:'inline-flex', alignItems:'center', gap:5
            }}>
            <span>{notifEnabled ? '🔔' : '🔕'}</span>
            <span className="live-text-full">{notifEnabled ? 'Alerts ON' : 'Enable Alerts'}</span>
          </button>
          <button onClick={()=>loadSnapshot({ includeLeads: tab==='leads', includeMembers: tab==='passes', noCache: true })}
            disabled={refreshing}
            title="Refresh now (skips cache)"
            style={{
              padding:'7px 14px', background:'#1a1a1a',
              color: refreshing ? '#666' : '#fff',
              borderRadius:8, fontSize:14, fontWeight:600, border:'1px solid #2a2a2a',
              minWidth:36, display:'inline-flex', alignItems:'center', justifyContent:'center',
              cursor: refreshing ? 'wait' : 'pointer'
            }}>
            {refreshing ? <Spinner small/> : '↻'}
          </button>
          <button onClick={signOut} style={{ padding:'7px 14px', background:'#1a1a1a', color:'#888', borderRadius:8, fontSize:12, fontWeight:600, border:'1px solid #2a2a2a' }}>Sign out</button>
        </div>
      </div>

      {/* ── Stat Cards ── */}
      <div className="stat-grid" style={{ padding:'18px 24px 0', display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:12 }}>
        {[
          { label:'Bookings Today',  value: confirmedToday.length, accent:'#f59e0b', icon:'📅' },
          { label:'Pending Payment', value: pendingToday.length,   accent:'#ef4444', icon:'⏳' },
          { label:'Revenue Today',   value: `₹${revenueToday.toLocaleString('en-IN')}`, accent:'#10b981', icon:'💰' },
          { label:'New Leads',       value: newLeadCount, accent:'#6366f1', icon:'👤' }
        ].map(c => (
          <div key={c.label} className="stat-card" style={{
            background:'#fff', borderRadius:14, padding:'16px 18px',
            borderTop:`3px solid ${c.accent}`, boxShadow:'0 1px 4px rgba(0,0,0,.06)'
          }}>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
              <div className="stat-card-label" style={{ fontSize:11, color:'#9ca3af', fontWeight:600, textTransform:'uppercase', letterSpacing:'.04em' }}>{c.label}</div>
              <div style={{ fontSize:16 }}>{c.icon}</div>
            </div>
            <div className="stat-card-num" style={{ fontSize:26, fontWeight:800, color:c.accent, lineHeight:1 }}>{c.value}</div>
          </div>
        ))}
      </div>

      {/* ── Tab Bar ── */}
      <div className="tab-bar" style={{ display:'flex', gap:2, padding:'16px 24px 0', flexWrap:'wrap' }}>
        {navItems.map(n => (
          <button key={n.key} onClick={()=>setTab(n.key)} style={{
            padding:'9px 18px', borderRadius:'10px 10px 0 0',
            fontSize:13, fontWeight:600,
            background: tab===n.key ? '#fff' : 'transparent',
            color: tab===n.key ? '#111' : '#9ca3af',
            borderBottom: tab===n.key ? '2.5px solid #f59e0b' : '2.5px solid transparent'
          }}>
            {n.icon} {n.label}
            {n.badge>0 && <span style={{ marginLeft:6, background:'#6366f1', color:'#fff', fontSize:10, borderRadius:999, padding:'1px 7px', fontWeight:800 }}>{n.badge}</span>}
          </button>
        ))}
      </div>

      {/* ── Tab Content ── */}
      <div className="content-card" style={{
        background:'#fff', margin:'0 24px 28px',
        borderRadius:'0 12px 12px 12px', padding:24,
        border:'1px solid #e5e7eb', boxShadow:'0 2px 8px rgba(0,0,0,.05)'
      }}>
        {loading && <LoadingBlock message="Loading dashboard…"/>}

        {/* ━━━━━ BOOKINGS TAB ━━━━━ */}
        {!loading && tab === 'bookings' && (
          <div className="anim-up">
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16, flexWrap:'wrap', gap:10 }}>
              <div>
                <div style={{ fontSize:16, fontWeight:800 }}>All Bookings</div>
                <div style={{ fontSize:12, color:'#9ca3af' }}>{filteredBookings.length} {filteredBookings.length===1?'booking':'bookings'}</div>
              </div>
              <div style={{ display:'flex', gap:8, alignItems:'center', flexWrap:'wrap' }}>
                <input value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="🔍 Search name, phone, ID…" style={{
                  padding:'9px 14px', border:'1.5px solid #e5e7eb', borderRadius:8, fontSize:13, minWidth:200, outline:'none'
                }}/>
                <button onClick={()=>setShowSpot(true)} style={{ padding:'9px 16px', background:'#f59e0b', color:'#fff', borderRadius:8, fontSize:13, fontWeight:700 }}>+ Walk-in</button>
              </div>
            </div>

            {/* Desktop: table */}
            <div className="bookings-table-wrap" style={{ overflowX:'auto' }}>
              <table style={{ width:'100%', borderCollapse:'collapse', fontSize:13 }}>
                <thead>
                  <tr style={{ borderBottom:'2px solid #f3f4f6', background:'#fafafa' }}>
                    {['ID','Customer','Sport','Type','Date','Slot','Players','Amount','Payment','Actions'].map(h => (
                      <th key={h} style={{ padding:'9px 11px', textAlign:'left', color:'#9ca3af', fontWeight:700, fontSize:11, textTransform:'uppercase', letterSpacing:'.05em', whiteSpace:'nowrap' }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filteredBookings.map(b => {
                    const sc = sportColor(b.sport);
                    const pc = paymentBadge(b);
                    const cancelled = b.status === 'cancelled';
                    const kindLabel = b.booking_kind==='net' ? `🥅 Net (${b.resource})` : '🏏 Turf';
                    return (
                      <tr key={b.booking_id} style={{ borderBottom:'1px solid #f3f4f6', opacity: cancelled?.4:1, background: cancelled?'#fafafa':'#fff' }}>
                        <td style={{ padding:'11px', fontFamily:'monospace', fontSize:11, color:'#9ca3af' }}>{b.booking_id}</td>
                        <td style={{ padding:'11px' }}>
                          <div style={{ fontWeight:700, fontSize:13 }}>{b.customer_name}</div>
                          <div style={{ fontSize:11, color:'#9ca3af' }}>{formatPhone(b.phone)}</div>
                        </td>
                        <td style={{ padding:'11px' }}><Badge bg={sc.bg} text={sc.text}>{b.sport}</Badge></td>
                        <td style={{ padding:'11px', fontSize:11, color:'#6b7280' }}>{kindLabel}</td>
                        <td style={{ padding:'11px', whiteSpace:'nowrap', fontSize:12, color:'#6b7280' }}>{formatDateShort(b.booking_date)}</td>
                        <td style={{ padding:'11px', whiteSpace:'nowrap', fontWeight:600, fontSize:12 }}>{b.slot_time}</td>
                        <td style={{ padding:'11px', textAlign:'center', fontWeight:600 }}>{b.members_count}</td>
                        <td style={{ padding:'11px', fontWeight:700 }}>{b.amount>0?`₹${parseInt(b.amount).toLocaleString('en-IN')}`:'—'}</td>
                        <td style={{ padding:'11px' }}><Badge bg={pc.bg} text={pc.text}>{pc.label}</Badge></td>
                        <td style={{ padding:'11px' }}>
                          {cancelled ? <span style={{ fontSize:11, color:'#ef4444', fontWeight:700 }}>✕ Cancelled</span> : (
                            <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
                              {b.payment_status==='pending' && <button onClick={()=>markPaid(b.booking_id)} style={{ fontSize:11, padding:'5px 11px', background:'#dcfce7', color:'#14532d', borderRadius:6, fontWeight:700 }}>💰 Paid</button>}
                              <button onClick={()=>setEditingBooking(b)} style={{ fontSize:11, padding:'5px 11px', background:'#fef3c7', color:'#78350f', borderRadius:6, fontWeight:700 }}>✏️ Edit</button>
                              <CancelBtn onClick={()=>cancelBooking(b.booking_id)} small/>
                            </div>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                  {filteredBookings.length===0 && (
                    <tr><td colSpan={10} style={{ padding:40, textAlign:'center', color:'#d1d5db', fontSize:14 }}>
                      {searchQ ? `No bookings match "${searchQ}"` : 'No bookings yet.'}
                    </td></tr>
                  )}
                </tbody>
              </table>
            </div>

            {/* Mobile: cards */}
            <div className="bookings-mobile" style={{ flexDirection:'column', gap:10 }}>
              {filteredBookings.length===0 && (
                <div style={{ padding:'32px 16px', textAlign:'center', color:'#9ca3af', fontSize:13, border:'1.5px dashed #e5e7eb', borderRadius:12 }}>
                  {searchQ ? `No bookings match "${searchQ}"` : 'No bookings yet.'}
                </div>
              )}
              {filteredBookings.map(b => {
                const sc = sportColor(b.sport);
                const pc = paymentBadge(b);
                const cancelled = b.status === 'cancelled';
                return (
                  <div key={b.booking_id} style={{ border:'1px solid #e5e7eb', borderRadius:12, padding:14, opacity: cancelled?.4:1, background: cancelled?'#fafafa':'#fff' }}>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:8, gap:8 }}>
                      <div>
                        <div style={{ fontWeight:800, fontSize:14 }}>{b.customer_name}</div>
                        <div style={{ fontSize:11, color:'#9ca3af', marginTop:1 }}>{formatPhone(b.phone)}</div>
                      </div>
                      <Badge bg={pc.bg} text={pc.text}>{pc.label}</Badge>
                    </div>
                    <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:10 }}>
                      <Badge bg={sc.bg} text={sc.text}>{b.sport}</Badge>
                      <span style={{ fontSize:11, color:'#6b7280', padding:'3px 9px', background:'#f3f4f6', borderRadius:999, fontWeight:600 }}>{b.booking_kind==='net'?'🥅 Net':'🏏 Turf'}</span>
                      <span style={{ fontSize:11, color:'#6b7280', padding:'3px 9px', background:'#f3f4f6', borderRadius:999, fontWeight:600 }}>📅 {formatDateShort(b.booking_date)}</span>
                      <span style={{ fontSize:11, color:'#6b7280', padding:'3px 9px', background:'#f3f4f6', borderRadius:999, fontWeight:600 }}>⏰ {b.slot_time}</span>
                      <span style={{ fontSize:11, color:'#6b7280', padding:'3px 9px', background:'#f3f4f6', borderRadius:999, fontWeight:600 }}>👥 {b.members_count}</span>
                      {b.amount>0 && <span style={{ fontSize:11, color:'#111', padding:'3px 9px', background:'#fef3c7', borderRadius:999, fontWeight:700 }}>₹{parseInt(b.amount).toLocaleString('en-IN')}</span>}
                    </div>
                    <div style={{ fontSize:10, color:'#9ca3af', fontFamily:'monospace', marginBottom: cancelled?0:10 }}>{b.booking_id}</div>
                    {!cancelled && (
                      <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
                        {b.payment_status==='pending' && <button onClick={()=>markPaid(b.booking_id)} style={{ fontSize:11, padding:'6px 12px', background:'#dcfce7', color:'#14532d', borderRadius:7, fontWeight:700 }}>💰 Mark Paid</button>}
                        <button onClick={()=>setEditingBooking(b)} style={{ fontSize:11, padding:'6px 12px', background:'#fef3c7', color:'#78350f', borderRadius:7, fontWeight:700 }}>✏️ Edit</button>
                        <CancelBtn onClick={()=>cancelBooking(b.booking_id)} small/>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* ━━━━━ AVAILABILITY TAB ━━━━━ */}
        {!loading && tab === 'availability' && (
          <div className="anim-up">
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16, flexWrap:'wrap', gap:10 }}>
              <div>
                <div style={{ fontSize:16, fontWeight:800 }}>Slot Availability</div>
                <div style={{ fontSize:12, color:'#9ca3af' }}>Each slot has 1 turf + 3 nets</div>
              </div>
            </div>

            <div className="date-strip-admin" style={{ display:'flex', gap:6, marginBottom:14, overflowX:'auto', paddingBottom:6 }}>
              {getNext15Days().map(d => (
                <button key={d.iso} onClick={()=>setSlotDate(d.iso)} style={{
                  flexShrink:0, padding:'8px 14px', borderRadius:8, minWidth:78,
                  background: slotDate===d.iso ? '#f59e0b' : '#f3f4f6',
                  color: slotDate===d.iso ? '#fff' : '#374151',
                  fontWeight:600, fontSize:12, textAlign:'center'
                }}>
                  <div style={{ fontSize:10, opacity:.75, fontWeight:700, textTransform:'uppercase' }}>{d.label}</div>
                  <div style={{ fontSize:16, fontWeight:800, lineHeight:1.1 }}>{d.day}</div>
                  <div style={{ fontSize:9, opacity:.7 }}>{d.weekday}</div>
                </button>
              ))}
            </div>

            <div className="filter-row" style={{ display:'flex', gap:6, marginBottom:18, flexWrap:'wrap' }}>
              {['all','available','booked','advance','blocked'].map(f => (
                <button key={f} onClick={()=>setSlotFilter(f)} style={{
                  padding:'7px 13px', borderRadius:7, fontSize:12, fontWeight:600,
                  background: slotFilter===f ? '#111' : '#f3f4f6',
                  color: slotFilter===f ? '#fff' : '#6b7280'
                }}>{f.charAt(0).toUpperCase()+f.slice(1)}</button>
              ))}
            </div>

            {filteredGrouped.length === 0 && (
              <div style={{ padding:'40px 16px', textAlign:'center', color:'#9ca3af', fontSize:13, border:'1.5px dashed #e5e7eb', borderRadius:12 }}>
                No slots match this filter.
              </div>
            )}

            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(320px, 1fr))', gap:12 }}>
              {filteredGrouped.map(g => (
                <SlotCard key={g.slot_time} group={g} onBlock={blockSlot} onUnblock={unblockSlot} onCancel={cancelBooking}/>
              ))}
            </div>
          </div>
        )}

        {/* ━━━━━ LEADS TAB ━━━━━ */}
        {!loading && tab === 'leads' && (
          <div className="anim-up">
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16, flexWrap:'wrap', gap:10 }}>
              <div>
                <div style={{ fontSize:16, fontWeight:800 }}>Lead Pipeline</div>
                <div style={{ fontSize:12, color:'#9ca3af' }}>{leads.length} total · {newLeadCount} new</div>
              </div>
              <button onClick={()=>{ setEditingLead(null); setShowLead(true); }} style={{ padding:'9px 16px', background:'#6366f1', color:'#fff', borderRadius:8, fontSize:13, fontWeight:700 }}>+ New Lead</button>
            </div>

            <div className="lead-grid" style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:14 }}>
              {['new','contacted','qualified','converted'].map(status => {
                const items = leads.filter(l => l.status === status);
                return (
                  <div key={status} style={{ background:'#fafafa', borderRadius:12, padding:14, minHeight:200 }}>
                    <div style={{ fontSize:11, fontWeight:800, textTransform:'uppercase', letterSpacing:'.08em', color:'#6b7280', marginBottom:12, display:'flex', justifyContent:'space-between' }}>
                      <span>{status}</span><span style={{ color:'#111' }}>{items.length}</span>
                    </div>
                    {items.length===0 && <div style={{ fontSize:12, color:'#d1d5db', textAlign:'center', padding:20 }}>None</div>}
                    {items.map(l => (
                      <div key={l.lead_id} style={{ background:'#fff', borderRadius:8, padding:'10px 12px', marginBottom:8, border:'1px solid #e5e7eb', fontSize:12 }}>
                        <div style={{ fontWeight:700 }}>{l.name}</div>
                        <div style={{ color:'#9ca3af', fontSize:11 }}>{formatPhone(l.phone)}</div>
                        {l.sport && <Badge bg="#dbeafe" text="#1e40af">{l.sport}</Badge>}
                        <div style={{ display:'flex', gap:4, marginTop:8, flexWrap:'wrap' }}>
                          <button onClick={()=>{ setEditingLead(l); setShowLead(true); }} style={{ fontSize:10, padding:'4px 8px', background:'#f3f4f6', borderRadius:5, fontWeight:600 }}>Edit</button>
                          {status !== 'converted' && <button onClick={()=>moveLeadStatus(l.lead_id, nextStatus(status))} style={{ fontSize:10, padding:'4px 8px', background:'#dbeafe', color:'#1e40af', borderRadius:5, fontWeight:700 }}>→ {nextStatus(status)}</button>}
                          <button onClick={()=>deleteLead(l.lead_id)} style={{ fontSize:10, padding:'4px 8px', background:'#fef2f2', color:'#991b1b', borderRadius:5, fontWeight:600 }}>✕</button>
                        </div>
                      </div>
                    ))}
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* ━━━━━ PASSES TAB ━━━━━ */}
        {!loading && tab === 'passes' && (
          <div className="anim-up">
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:16, flexWrap:'wrap', gap:10 }}>
              <div>
                <div style={{ fontSize:16, fontWeight:800 }}>Memberships & Passes</div>
                <div style={{ fontSize:12, color:'#9ca3af' }}>{members.length} active</div>
              </div>
              <button onClick={()=>{ setEditingMember(null); setShowPass(true); }} style={{ padding:'9px 16px', background:'#6366f1', color:'#fff', borderRadius:8, fontSize:13, fontWeight:700 }}>+ New Pass</button>
            </div>

            <div style={{ marginBottom:24, padding:16, background:'#f9fafb', borderRadius:10 }}>
              <div style={{ fontSize:11, fontWeight:800, color:'#9ca3af', textTransform:'uppercase', letterSpacing:'.06em', marginBottom:10 }}>Available Plans</div>
              <div className="pass-pricing" style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:8 }}>
                {PLANS.map(p => (
                  <div key={p.key} style={{ background:'#fff', padding:'10px 12px', borderRadius:8, border:'1px solid #e5e7eb', fontSize:12 }}>
                    <div style={{ fontWeight:700, fontSize:12 }}>{p.label}</div>
                    <div style={{ color:'#9ca3af', fontSize:10, marginTop:2 }}>{p.days}d · {p.category}{p.hours_quota?` · ${p.hours_quota}hr`:''}{p.max_members?` · ${p.max_members} members`:''}</div>
                    <div style={{ fontSize:14, fontWeight:800, color:'#f59e0b', marginTop:4 }}>₹{p.price.toLocaleString('en-IN')}</div>
                  </div>
                ))}
              </div>
            </div>

            <div style={{ display:'grid', gap:10 }}>
              {members.length === 0 && (
                <div style={{ padding:40, textAlign:'center', color:'#d1d5db', fontSize:13, border:'1.5px dashed #e5e7eb', borderRadius:12 }}>
                  No memberships yet. Click "New Pass" to create one.
                </div>
              )}
              {members.map(m => {
                const expired = m.is_expired || m.status === 'cancelled';
                return (
                  <div key={m.member_id} style={{ background:'#fff', border:'1px solid #e5e7eb', borderRadius:10, padding:'14px 18px', opacity: expired?.5:1, display:'flex', alignItems:'center', justifyContent:'space-between', gap:12, flexWrap:'wrap' }}>
                    <div style={{ flex:1, minWidth:200 }}>
                      <div style={{ fontWeight:800, fontSize:14 }}>{m.team_name} <span style={{ fontWeight:400, color:'#9ca3af', fontSize:12 }}>· {m.plan_label}</span></div>
                      <div style={{ fontSize:11, color:'#9ca3af', marginTop:2 }}>{m.contact_name} · {formatPhone(m.contact_phone)}</div>
                      <div style={{ display:'flex', gap:6, marginTop:8, flexWrap:'wrap' }}>
                        <Badge bg={m.category==='turf'?'#fef3c7':'#dbeafe'} text={m.category==='turf'?'#854d0e':'#1e40af'}>{m.category}</Badge>
                        <Badge bg={m.status==='active'&&!m.is_expired?'#d1fae5':'#fee2e2'} text={m.status==='active'&&!m.is_expired?'#065f46':'#991b1b'}>{m.is_expired?'Expired':m.status}</Badge>
                        <span style={{ fontSize:11, color:'#6b7280' }}>{m.days_left>0?`${m.days_left} days left`:m.days_left===0?'Expires today':`Expired ${-m.days_left}d ago`}</span>
                      </div>
                    </div>
                    <div style={{ fontSize:13, fontWeight:700, color:'#10b981' }}>₹{parseInt(m.amount_paid||0).toLocaleString('en-IN')}</div>
                    <div style={{ display:'flex', gap:6 }}>
                      <button onClick={()=>{ setEditingMember(m); setShowPass(true); }} style={{ fontSize:11, padding:'6px 11px', background:'#f3f4f6', borderRadius:6, fontWeight:600 }}>Edit</button>
                      {(expired || m.status==='cancelled') && <button onClick={()=>renewMember(m.member_id)} style={{ fontSize:11, padding:'6px 11px', background:'#dcfce7', color:'#14532d', borderRadius:6, fontWeight:700 }}>Renew</button>}
                      {m.status==='active' && <CancelBtn onClick={()=>cancelMember(m.member_id)} small/>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* ━━━━━ REVENUE TAB ━━━━━ */}
        {!loading && tab === 'revenue' && (
          <div className="anim-up">
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:16, flexWrap:'wrap', gap:12 }}>
              <div>
                <div style={{ fontSize:16, fontWeight:800 }}>Revenue Report</div>
                <div style={{ fontSize:12, color:'#9ca3af' }}>Confirmed paid bookings · {revenueRange.from} → {revenueRange.to}</div>
              </div>
              <div style={{ display:'flex', gap:6, alignItems:'center', flexWrap:'wrap' }}>
                {[
                  { label:'Today',   from: formatDateISO(new Date()), to: formatDateISO(new Date()) },
                  { label:'7 days',  from: formatDateISO(new Date(Date.now()-6*86400000)), to: formatDateISO(new Date()) },
                  { label:'30 days', from: formatDateISO(new Date(Date.now()-29*86400000)), to: formatDateISO(new Date()) },
                  { label:'This Month', from: (()=>{ const d=new Date(); d.setDate(1); return formatDateISO(d); })(), to: formatDateISO(new Date()) }
                ].map(preset => {
                  const active = revenueRange.from === preset.from && revenueRange.to === preset.to;
                  return (
                    <button key={preset.label}
                      onClick={()=>{ setRevenueRange({ from: preset.from, to: preset.to }); setTimeout(fetchRevenue, 0); }}
                      style={{ padding:'6px 12px', background: active?'#111':'#f3f4f6', color: active?'#fff':'#374151', borderRadius:6, fontSize:11, fontWeight:700, border:'1px solid '+(active?'#111':'#e5e7eb') }}>
                      {preset.label}
                    </button>
                  );
                })}
              </div>
            </div>

            <div style={{ display:'flex', gap:6, alignItems:'center', flexWrap:'wrap', marginBottom:18, padding:12, background:'#fafafa', border:'1px solid #f3f4f6', borderRadius:8 }}>
              <span style={{ fontSize:12, color:'#6b7280', fontWeight:600 }}>Custom range:</span>
              <input type="date" value={revenueRange.from} onChange={e=>setRevenueRange({...revenueRange, from:e.target.value})} style={{ padding:'7px 10px', borderRadius:6, border:'1.5px solid #e5e7eb', fontSize:12 }}/>
              <span style={{ color:'#9ca3af' }}>→</span>
              <input type="date" value={revenueRange.to} onChange={e=>setRevenueRange({...revenueRange, to:e.target.value})} style={{ padding:'7px 10px', borderRadius:6, border:'1.5px solid #e5e7eb', fontSize:12 }}/>
              <button onClick={fetchRevenue} style={{ padding:'7px 14px', background:'#111', color:'#fff', borderRadius:6, fontSize:12, fontWeight:700 }}>Apply</button>
            </div>

            {!revenue && <LoadingBlock message="Computing…"/>}
            {revenue && (() => {
              const total = parseFloat(revenue.total) || 0;
              const count = parseInt(revenue.bookings_count, 10) || 0;
              return (
              <>
                <div className="revenue-cards" style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:14, marginBottom:28 }}>
                  <div style={{ background:'linear-gradient(135deg,#10b981,#059669)', color:'#fff', padding:20, borderRadius:14 }}>
                    <div style={{ fontSize:11, opacity:.85, fontWeight:700, textTransform:'uppercase', letterSpacing:'.06em' }}>Total Revenue</div>
                    <div style={{ fontSize:32, fontWeight:800, marginTop:6 }}>₹{total.toLocaleString('en-IN')}</div>
                  </div>
                  <div style={{ background:'#fff', border:'1px solid #e5e7eb', padding:20, borderRadius:14 }}>
                    <div style={{ fontSize:11, color:'#9ca3af', fontWeight:700, textTransform:'uppercase', letterSpacing:'.06em' }}>Paid Bookings</div>
                    <div style={{ fontSize:32, fontWeight:800, marginTop:6 }}>{count}</div>
                  </div>
                  <div style={{ background:'#fff', border:'1px solid #e5e7eb', padding:20, borderRadius:14 }}>
                    <div style={{ fontSize:11, color:'#9ca3af', fontWeight:700, textTransform:'uppercase', letterSpacing:'.06em' }}>Avg / Booking</div>
                    <div style={{ fontSize:32, fontWeight:800, marginTop:6 }}>₹{count>0?Math.round(total/count).toLocaleString('en-IN'):0}</div>
                  </div>
                </div>

                <div className="revenue-split" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:24 }}>
                  <div>
                    <div style={{ fontSize:13, fontWeight:800, marginBottom:12 }}>By Payment Mode</div>
                    {Object.keys(revenue.by_payment_mode || {}).length === 0 && (
                      <div style={{ fontSize:13, color:'#9ca3af', padding:'10px 0' }}>No paid bookings in this range</div>
                    )}
                    {Object.entries(revenue.by_payment_mode || {}).map(([mode, val]) => (
                      <div key={mode} style={{ display:'flex', justifyContent:'space-between', padding:'10px 0', borderBottom:'1px solid #f3f4f6' }}>
                        <span style={{ textTransform:'capitalize', fontSize:13 }}>{mode || 'Unknown'}</span>
                        <span style={{ fontWeight:700, fontSize:13 }}>₹{(parseFloat(val)||0).toLocaleString('en-IN')}</span>
                      </div>
                    ))}
                  </div>
                  <div>
                    <div style={{ fontSize:13, fontWeight:800, marginBottom:12 }}>By Sport</div>
                    {Object.keys(revenue.by_sport || {}).length === 0 && (
                      <div style={{ fontSize:13, color:'#9ca3af', padding:'10px 0' }}>No paid bookings in this range</div>
                    )}
                    {Object.entries(revenue.by_sport || {}).map(([sport, val]) => (
                      <div key={sport} style={{ display:'flex', justifyContent:'space-between', padding:'10px 0', borderBottom:'1px solid #f3f4f6' }}>
                        <span style={{ fontSize:13 }}>{sport}</span>
                        <span style={{ fontWeight:700, fontSize:13 }}>₹{(parseFloat(val)||0).toLocaleString('en-IN')}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </>
              );
            })()}
          </div>
        )}
      </div>

      <Toast toast={toast} onClose={()=>setToast({show:false})}/>
      <ConfirmModal config={confirm} onClose={()=>setConfirm({show:false})}/>
      {showSpot && <SpotBookingModal
        onClose={()=>setShowSpot(false)}
        defaultDate={slotDate}
        onCreate={(result)=>{
          // OPTIMISTIC UPDATE — show the booking instantly without waiting for reload
          if (result && result.booking) {
            // Mark as seen FIRST so the new-booking alert doesn't fire for our own walk-in
            seenBookingsRef.current.add(result.booking.booking_id);
            setBookings(prev => [result.booking, ...prev]);
            // Also mark the slot as booked locally so Availability tab is consistent
            setSlots(prev => prev.map(s =>
              s.slot_id === result.booking.slot_id
                ? { ...s, status: (result.booking.booking_date > formatDateISO(new Date()) ? 'advance' : 'booked'),
                    sport: result.booking.sport, booking_id: result.booking.booking_id,
                    booked_name: result.booking.customer_name, booked_phone: result.booking.phone }
                : s
            ));
          }
          // Show email status in the toast
          let msg = 'Booking created · ' + (result?.booking_id || '');
          if (result?.email_sent) msg += ' · email sent';
          else if (result?.booking?.email) msg += ' · ⚠ email FAILED (check Apps Script logs)';
          else msg += ' · no customer email';
          ok(msg);
          // Reconcile from server in background (will pick up anything we missed)
          loadSnapshot({ noCache: true });
        }}
      />}
      {showPass && <PassModal editing={editingMember} onClose={()=>{setShowPass(false); setEditingMember(null);}} onCreate={()=>{ ok(editingMember?'Updated':'Pass created'); loadSnapshot({ includeMembers:true, noCache:true }); }}/>}
      {showLead && <LeadModal editing={editingLead} onClose={()=>{setShowLead(false); setEditingLead(null);}} onSave={()=>{ ok(editingLead?'Updated':'Lead added'); loadSnapshot({ includeLeads:true, noCache:true }); }}/>}
      {editingBooking && <EditBookingModal
        booking={editingBooking}
        onClose={()=>setEditingBooking(null)}
        onSave={()=>{
          ok('Booking updated');
          loadSnapshot({ noCache: true });
        }}
      />}
    </div>
  );
}

function nextStatus(s){
  if(s==='new') return 'contacted';
  if(s==='contacted') return 'qualified';
  if(s==='qualified') return 'converted';
  return s;
}

// ──────────────────────────────────────────────────────────
// SLOT CARD — shows 1 turf + 3 nets for a time window
// ──────────────────────────────────────────────────────────
function SlotCard({ group, onBlock, onUnblock, onCancel }){
  const { slot_time, turf, net1, net2, net3 } = group;
  const nets = [net1, net2, net3].filter(Boolean);

  function statusColor(s){
    if(!s) return { bg:'#fafafa', text:'#9ca3af' };
    if(s.status === 'available') return { bg:'#d1fae5', text:'#065f46' };
    if(s.status === 'booked')    return { bg:'#fef3c7', text:'#854d0e' };
    if(s.status === 'advance')   return { bg:'#dbeafe', text:'#1e40af' };
    if(s.status === 'blocked')   return { bg:'#e5e7eb', text:'#374151' };
    return { bg:'#fafafa', text:'#9ca3af' };
  }

  return (
    <div className="slot-card-mobile" style={{ background:'#fff', border:'1px solid #e5e7eb', borderRadius:12, padding:14, boxShadow:'0 1px 3px rgba(0,0,0,.04)' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
        <div style={{ fontFamily:'monospace', fontSize:14, fontWeight:800 }}>{slot_time}</div>
      </div>

      {/* Turf row */}
      {turf && (
        <div className="resource-row" style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 12px', background: statusColor(turf).bg, borderRadius:8, marginBottom:6 }}>
          <div>
            <div style={{ fontSize:11, fontWeight:800, color: statusColor(turf).text, letterSpacing:'.04em' }}>🏏 TURF · ₹{turf.price}</div>
            {turf.status !== 'available' && turf.booked_name && (
              <div style={{ fontSize:11, color:'#374151', marginTop:2, fontWeight:600 }}>{turf.booked_name} · {formatPhone(turf.booked_phone)}</div>
            )}
            {turf.status === 'blocked' && turf.block_reason && (
              <div style={{ fontSize:11, color:'#6b7280', marginTop:2, fontStyle:'italic' }}>{turf.block_reason}</div>
            )}
          </div>
          <div style={{ display:'flex', gap:4 }}>
            {turf.status === 'available' && <button onClick={()=>onBlock(turf.slot_id)} style={{ fontSize:10, padding:'4px 8px', background:'#fff', borderRadius:5, fontWeight:700 }}>Block</button>}
            {turf.status === 'blocked'   && <button onClick={()=>onUnblock(turf.slot_id)} style={{ fontSize:10, padding:'4px 8px', background:'#fff', borderRadius:5, fontWeight:700 }}>Unblock</button>}
            {(turf.status==='booked'||turf.status==='advance') && turf.booking_id && <button onClick={()=>onCancel(turf.booking_id)} style={{ fontSize:10, padding:'4px 8px', background:'#fff', color:'#991b1b', borderRadius:5, fontWeight:700 }}>✕</button>}
          </div>
        </div>
      )}

      {/* Nets */}
      {nets.map((net, idx) => (
        <div key={net.slot_id} className="resource-row" style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 12px', background: statusColor(net).bg, borderRadius:8, marginBottom:6 }}>
          <div>
            <div style={{ fontSize:11, fontWeight:800, color: statusColor(net).text, letterSpacing:'.04em' }}>🥅 NET {idx+1} · ₹{net.price}</div>
            {net.status !== 'available' && net.booked_name && (
              <div style={{ fontSize:11, color:'#374151', marginTop:2, fontWeight:600 }}>{net.booked_name} · {formatPhone(net.booked_phone)}</div>
            )}
            {net.status === 'blocked' && net.block_reason && (
              <div style={{ fontSize:11, color:'#6b7280', marginTop:2, fontStyle:'italic' }}>{net.block_reason}</div>
            )}
          </div>
          <div style={{ display:'flex', gap:4 }}>
            {net.status === 'available' && <button onClick={()=>onBlock(net.slot_id)} style={{ fontSize:10, padding:'4px 8px', background:'#fff', borderRadius:5, fontWeight:700 }}>Block</button>}
            {net.status === 'blocked'   && <button onClick={()=>onUnblock(net.slot_id)} style={{ fontSize:10, padding:'4px 8px', background:'#fff', borderRadius:5, fontWeight:700 }}>Unblock</button>}
            {(net.status==='booked'||net.status==='advance') && net.booking_id && <button onClick={()=>onCancel(net.booking_id)} style={{ fontSize:10, padding:'4px 8px', background:'#fff', color:'#991b1b', borderRadius:5, fontWeight:700 }}>✕</button>}
          </div>
        </div>
      ))}
    </div>
  );
}

// ──────────────────────────────────────────────────────────
// ERROR BOUNDARY
// ──────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state = { error: null }; }
  static getDerivedStateFromError(e){ return { error: e }; }
  componentDidCatch(e, i){ console.error('Admin crashed:', e, i); }
  render(){
    if(this.state.error){
      return (
        <div style={{ minHeight:'100vh', background:'#0a0a0a', color:'#fff', display:'grid', placeItems:'center', padding:24, fontFamily:'Outfit,system-ui,sans-serif' }}>
          <div style={{ maxWidth:520 }}>
            <div style={{ fontSize:48, marginBottom:16 }}>⚠️</div>
            <div style={{ fontSize:22, fontWeight:800, marginBottom:10 }}>Dashboard hit an error</div>
            <div style={{ fontSize:13, color:'#888', lineHeight:1.7, marginBottom:18 }}>Try refreshing. If it persists, share the error below.</div>
            <pre style={{ background:'#1a1a1a', padding:'12px 14px', borderRadius:10, fontSize:12, color:'#f59e0b', border:'1px solid #2a2a2a', overflowX:'auto', whiteSpace:'pre-wrap', maxHeight:200 }}>{String(this.state.error?.message || this.state.error)}</pre>
            <button onClick={()=>location.reload()} style={{ marginTop:18, padding:'10px 24px', background:'#f59e0b', color:'#000', border:'none', borderRadius:8, fontSize:13, fontWeight:800, cursor:'pointer' }}>Reload Dashboard</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
