<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0d0a" />
  <title>Hit N Run Sports Arena · Book your turf in Dehradun</title>
  <meta name="description" content="Dehradun's premier multi-sport arena in Panditwari. Live availability, book online in 60 seconds, open daily. Pay at venue." />
  <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
  <meta property="og:title" content="Hit N Run Sports Arena · Book your turf in Dehradun" />
  <meta property="og:description" content="Dehradun's premier multi-sport arena in Panditwari. Live availability, book online in 60 seconds, open daily. Pay at venue." />
  <meta property="og:image" content="https://hitnrunarena.in/logo.jpeg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

  <style>
    :root {
      --bg:#0a0d0a; --bg-alt:#0e120e; --surface:#141914; --surface-2:#1a201a;
      --border:#232a23; --text:#f5f5f4; --text-2:#a8a29e; --text-3:#57534e;
      --lime:#c4f000; --lime-soft:#d9f99d; --lime-dim:#6b8a00;
      --orange:#fbbf24; --success:#10b981; --danger:#ef4444; --info:#38bdf8;
      --lime-rgb:196,240,0; --red:#e63946; --red-rgb:230,57,70;
      --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
      --display:'Anton',system-ui,sans-serif; --body:'Outfit',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:var(--body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.5}
    body.locked{overflow:hidden}
    body.locked .anim-rise{animation-play-state:paused}
    input,textarea,select,button{font-family:var(--body)}
    button{background:none;border:none;cursor:pointer;color:inherit}
    a{color:inherit;text-decoration:none}

    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:var(--bg-alt)}
    ::-webkit-scrollbar-thumb{background:#2a352a;border-radius:99px}

    @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    @keyframes risefade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(196,240,0,.4)}50%{box-shadow:0 0 0 12px rgba(196,240,0,0)}}
    @keyframes float-orb{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.05)}66%{transform:translate(-30px,25px) scale(.95)}}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    .anim-rise{animation:rise .6s cubic-bezier(.16,1,.3,1) both}
    .anim-rise-fast{animation:risefade .35s cubic-bezier(.16,1,.3,1) both}
    .pulse-glow{animation:glow 2.4s infinite}
    .live-dot{animation:blink 1.6s ease-in-out infinite}
    .spin{animation:spin .9s linear infinite}
    .shimmer{background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}

    /* Visible loading on dark hero */
    .loading-dot{
      width:8px;height:8px;border-radius:50%;background:var(--lime);
      display:inline-block;animation:loading-bounce 1s ease-in-out infinite;
      box-shadow:0 0 12px rgba(196,240,0,.5)
    }
    @keyframes loading-bounce{
      0%,100%{opacity:.3;transform:scale(.8)}
      50%{opacity:1;transform:scale(1.1)}
    }

    .stage-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
    .orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.18;animation:float-orb 16s ease-in-out infinite}
    .orb-1{width:460px;height:460px;background:#c4f000;top:-120px;left:-100px}
    .orb-2{width:380px;height:380px;background:#38bdf8;top:40%;right:-120px;animation-delay:-6s;opacity:.13}
    .orb-3{width:320px;height:320px;background:#fbbf24;bottom:-60px;left:30%;animation-delay:-10s;opacity:.1}
    .grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.04;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

    /* Nav */
    .nav{position:sticky;top:0;z-index:50;background:rgba(10,13,10,.7);backdrop-filter:blur(20px) saturate(1.2);border-bottom:1px solid rgba(255,255,255,.04)}
    .nav-inner{max-width:1280px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
    .logo{display:flex;align-items:center;gap:10px}
    .logo-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--lime) 0%,#94c800 100%);display:grid;place-items:center;font-size:16px;color:#000}
    .logo-text{font-family:var(--display);font-size:18px;letter-spacing:.04em}
    .logo-text small{font-family:var(--body);font-size:9px;font-weight:600;letter-spacing:.15em;color:var(--text-3);text-transform:uppercase;display:block;margin-top:-3px}
    .nav-cta{display:flex;align-items:center;gap:8px}
    .nav-link{font-size:13px;font-weight:600;color:var(--text-2);padding:8px 14px;border-radius:8px;transition:color .15s}
    .nav-link:hover{color:var(--text)}
    .btn-cta{background:var(--lime);color:#000;padding:9px 18px;border-radius:99px;font-size:13px;font-weight:800;letter-spacing:.02em;transition:transform .15s,box-shadow .15s}
    .btn-cta:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(196,240,0,.3)}
    @media (max-width:560px){
      .nav-inner{padding:12px 16px}
      .nav-link{display:none}
      .logo-text{font-size:15px}
      .btn-cta{padding:7px 14px;font-size:12px}
    }

    /* Hero */
    .hero{position:relative;z-index:2;min-height:calc(100vh - 60px);display:flex;flex-direction:column;justify-content:center;padding:80px 24px 60px;max-width:1280px;margin:0 auto}
    @media (max-width:720px){
      .hero{padding:40px 16px 40px;min-height:auto}
      .hero-h1{margin-bottom:18px!important}
      .hero-sub{margin-bottom:24px!important;font-size:14px!important}
      .hero-ctas{margin-bottom:36px!important}
      .btn-primary,.btn-secondary{padding:13px 22px!important;font-size:13px!important}
      .hero-stats{padding-top:22px!important;gap:10px!important}
      .hero-stat-num{font-size:28px!important}
      .hero-stat-lbl{font-size:9px!important}
    }
    .hero-tag{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(196,240,0,.08);border:1px solid rgba(196,240,0,.2);border-radius:99px;font-size:11px;font-weight:700;color:var(--lime);letter-spacing:.15em;text-transform:uppercase;margin-bottom:28px;align-self:flex-start}
    .hero-tag .live-dot{width:6px;height:6px;background:var(--lime);border-radius:50%}
    .hero-h1{font-family:var(--display);font-size:clamp(56px,12vw,180px);line-height:.86;letter-spacing:-.02em;color:var(--text);margin-bottom:28px;text-transform:uppercase}
    .hero-h1 .accent{background:linear-gradient(180deg,var(--lime) 0%,#94c800 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .hero-sub{font-size:clamp(15px,1.6vw,19px);color:var(--text-2);max-width:580px;margin-bottom:36px;line-height:1.6}
    .hero-sub strong{color:var(--text);font-weight:600}
    .hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:60px}
    .btn-primary{background:var(--lime);color:#000;padding:16px 28px;border-radius:99px;font-size:14px;font-weight:800;letter-spacing:.03em;display:inline-flex;align-items:center;gap:10px;transition:transform .15s,box-shadow .2s}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(196,240,0,.35)}
    .btn-primary svg{transition:transform .2s}
    .btn-primary:hover svg{transform:translateX(4px)}
    .btn-secondary{background:transparent;color:var(--text);padding:16px 28px;border-radius:99px;border:1.5px solid var(--border);font-size:14px;font-weight:700;letter-spacing:.02em;display:inline-flex;align-items:center;gap:10px;transition:border-color .15s,background .15s}
    .btn-secondary:hover{border-color:var(--text-2);background:rgba(255,255,255,.02)}
    .hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;max-width:780px;padding-top:32px;border-top:1px solid var(--border)}
    .hero-stat-num{font-family:var(--display);font-size:38px;line-height:1;color:var(--lime);margin-bottom:4px;letter-spacing:.01em}
    .hero-stat-lbl{font-size:11px;font-weight:600;color:var(--text-2);letter-spacing:.12em;text-transform:uppercase}

    /* Sections */
    .section{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:80px 24px}
    @media (max-width:720px){.section{padding:48px 16px} .section-head{margin-bottom:24px!important}}
    .section-head{margin-bottom:40px}
    .section-eyebrow{display:inline-block;font-size:11px;font-weight:700;color:var(--lime);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
    .section-h2{font-family:var(--display);font-size:clamp(40px,6.5vw,76px);line-height:.95;letter-spacing:-.01em;color:var(--text);text-transform:uppercase;margin-bottom:16px}
    .section-sub{font-size:16px;color:var(--text-2);max-width:620px;line-height:1.6}

    /* Booking */
    .booking-card{background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:36px;position:relative}
    @media (max-width:720px){
      .booking-card{padding:18px 14px;border-radius:20px}
      .booking-step{margin-bottom:24px!important}
      .step-label{gap:8px!important;margin-bottom:12px!important;flex-wrap:wrap}
      .step-title{font-size:16px!important}
      .step-meta{font-size:11px!important}
    }
    .booking-step{margin-bottom:36px}
    .booking-step:last-child{margin-bottom:0}
    .step-label{display:flex;align-items:center;gap:10px;margin-bottom:18px}
    .step-num{width:26px;height:26px;border-radius:50%;background:var(--lime);color:#000;font-family:var(--mono);font-size:12px;font-weight:700;display:grid;place-items:center}
    .step-num.dim{background:var(--border);color:var(--text-2)}
    .step-title{font-family:var(--display);font-size:22px;letter-spacing:.02em;color:var(--text);text-transform:uppercase}
    .step-meta{margin-left:auto;font-size:12px;color:var(--text-2);font-weight:500}

    /* Date pills */
    .date-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
    .date-strip::-webkit-scrollbar{height:4px}
    .date-pill{flex:0 0 auto;padding:12px 16px;background:var(--bg-alt);border:1.5px solid var(--border);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px;transition:all .15s;scroll-snap-align:start}
    .date-pill:hover{border-color:var(--text-3);transform:translateY(-1px)}
    .date-pill.active{background:var(--lime);color:#000;border-color:var(--lime)}
    .date-pill .d-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
    .date-pill.active .d-label{color:#000}
    .date-pill .d-num{font-family:var(--display);font-size:26px;line-height:1;color:var(--text)}
    .date-pill.active .d-num{color:#000}
    .date-pill .d-wd{font-size:10px;color:var(--text-3);font-weight:600}
    .date-pill.active .d-wd{color:rgba(0,0,0,.5)}
    @media (max-width:720px){
      .date-pill{min-width:64px;padding:9px 11px;border-radius:11px}
      .date-pill .d-label{font-size:9px}
      .date-pill .d-num{font-size:20px}
      .date-pill .d-wd{font-size:9px}
    }

    /* Sport selector */
    .sport-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    @media (max-width:560px){.sport-grid{grid-template-columns:1fr;gap:8px}}
    .sport-card{background:var(--bg-alt);border:1.5px solid var(--border);border-radius:16px;padding:18px 16px;display:flex;align-items:center;gap:14px;transition:all .15s;text-align:left}
    .sport-card:hover{border-color:var(--text-3);transform:translateY(-2px)}
    .sport-card.active{background:var(--lime);color:#000;border-color:var(--lime);transform:translateY(-2px);box-shadow:0 12px 32px rgba(196,240,0,.2)}
    .sport-card .ic{font-size:30px;flex-shrink:0}
    .sport-card-text{flex:1;min-width:0}
    .sport-card .name{font-family:var(--display);font-size:17px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
    .sport-card .price{font-size:11px;color:var(--text-2);font-weight:600;margin-top:3px}
    .sport-card.active .price{color:rgba(0,0,0,.6)}

    /* Slots */
    .slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
    @media (max-width:720px){.slots-grid{grid-template-columns:repeat(3,1fr);gap:7px}}
    @media (max-width:380px){.slots-grid{grid-template-columns:repeat(2,1fr)}}
    .slot-card{background:var(--bg-alt);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;transition:all .15s;text-align:left}
    @media (max-width:720px){.slot-card{padding:11px 9px;border-radius:11px}}
    .slot-card:hover{border-color:var(--lime);transform:translateY(-2px);box-shadow:0 8px 24px rgba(196,240,0,.08)}
    .slot-card.active{background:var(--lime);color:#000;border-color:var(--lime);transform:translateY(-2px);box-shadow:0 12px 32px rgba(196,240,0,.3)}
    .slot-card .time-row{display:flex;align-items:baseline;gap:6px;margin-bottom:6px;flex-wrap:wrap}
    .slot-time{font-family:var(--display);font-size:21px;letter-spacing:.02em;color:var(--text)}
    .slot-time.end{font-size:14px;opacity:.7}
    .slot-card.active .slot-time{color:#000}
    .slot-arrow{font-size:11px;color:var(--text-3)}
    .slot-card.active .slot-arrow{color:rgba(0,0,0,.5)}
    .slot-price{font-size:12px;font-weight:700;color:var(--lime);display:inline-flex;align-items:center;gap:4px}
    .slot-card.active .slot-price{color:#000}
    .slot-meta{font-size:10px;font-weight:700;color:var(--text-2);letter-spacing:.08em;text-transform:uppercase;margin-top:5px}
    .slot-card.active .slot-meta{color:rgba(0,0,0,.6)}
    @media (max-width:720px){
      .slot-time{font-size:16px}
      .slot-time.end{font-size:12px}
      .slot-price{font-size:11px}
      .slot-meta{font-size:9px}
    }

    /* Duration picker */
    .duration-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px}
    .duration-card{background:var(--bg-alt);border:1.5px solid var(--border);border-radius:14px;padding:16px 14px;transition:all .15s;text-align:center;cursor:pointer;color:var(--text)}
    .duration-card:hover:not(.disabled){border-color:var(--lime);transform:translateY(-2px)}
    .duration-card.active{background:var(--lime);color:#000;border-color:var(--lime);transform:translateY(-2px);box-shadow:0 12px 32px rgba(196,240,0,.3)}
    .duration-card.disabled{opacity:.35;cursor:not-allowed;background:transparent}
    .dur-h{font-family:var(--display);font-size:20px;letter-spacing:.02em;margin-bottom:4px}
    .dur-price{font-size:13px;font-weight:700;color:var(--lime)}
    .duration-card.active .dur-price{color:#000}
    .dur-sub{font-size:10px;font-weight:700;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
    @media (max-width:720px){.dur-h{font-size:16px}.dur-price{font-size:11px}}

    /* Form */
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media (max-width:560px){.form-grid{grid-template-columns:1fr}}
    .form-field.span-2{grid-column:span 2}
    @media (max-width:560px){.form-field.span-2{grid-column:span 1}}
    .form-label{display:block;font-size:11px;font-weight:700;color:var(--text-2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
    .form-input{width:100%;padding:14px 16px;background:var(--bg-alt);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-weight:500;transition:border-color .15s,background .15s;outline:none}
    .form-input:focus{border-color:var(--lime);background:var(--bg)}
    .form-input::placeholder{color:var(--text-3)}
    .field-hint{font-size:11px;color:var(--text-3);margin-top:6px}

    /* Returning */
    .return-banner{background:linear-gradient(135deg,rgba(196,240,0,.12) 0%,rgba(196,240,0,.04) 100%);border:1px solid rgba(196,240,0,.3);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px;grid-column:span 2}
    @media (max-width:560px){.return-banner{grid-column:span 1}}
    .return-emoji{font-size:26px}
    .return-text{font-size:14px;color:var(--text)}
    .return-text strong{color:var(--lime)}
    .return-text .sub{font-size:12px;color:var(--text-2);display:block;margin-top:2px}

    /* Submit */
    .submit-row{margin-top:24px;display:flex;flex-direction:column;gap:10px}
    .btn-submit{width:100%;padding:18px 28px;background:var(--lime);color:#000;border-radius:14px;font-family:var(--display);font-size:18px;letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:12px;transition:transform .15s,box-shadow .2s}
    .btn-submit:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 40px rgba(196,240,0,.35)}
    .btn-submit:disabled{background:var(--border);color:var(--text-3);cursor:not-allowed}
    .submit-note{font-size:12px;color:var(--text-2);text-align:center}

    /* Loading */
    .loading-block{padding:50px 0;text-align:center}
    .loading-spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--lime);border-radius:50%}
    .loading-spinner.small{width:18px;height:18px;border-width:2px}
    .empty-block{padding:40px;text-align:center;color:var(--text-2);border:1.5px dashed var(--border);border-radius:16px}
    .empty-block .ic{font-size:38px;margin-bottom:10px}
    .empty-title{font-family:var(--display);font-size:20px;color:var(--text);letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px}

    /* Ticket */
    .ticket{max-width:540px;margin:0 auto;background:var(--surface);border:1.5px solid var(--lime);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 24px 80px rgba(196,240,0,.15)}
    .ticket-head{padding:36px 32px 24px;text-align:center;background:linear-gradient(180deg,rgba(196,240,0,.06) 0%,transparent 100%)}
    .ticket-check{width:64px;height:64px;border-radius:50%;background:var(--lime);color:#000;display:inline-grid;place-items:center;font-size:32px;margin-bottom:20px;box-shadow:0 0 0 8px rgba(196,240,0,.15)}
    .ticket-title{font-family:var(--display);font-size:32px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:6px}
    .ticket-sub{font-size:13px;color:var(--text-2)}
    .ticket-divider{position:relative;height:36px;padding:0 32px;display:flex;align-items:center}
    .ticket-divider::before,.ticket-divider::after{content:'';position:absolute;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1.5px solid var(--lime);top:50%;transform:translateY(-50%)}
    .ticket-divider::before{left:-12px}
    .ticket-divider::after{right:-12px}
    .ticket-divider .dash{flex:1;border-top:1.5px dashed var(--border)}
    .ticket-body{padding:8px 32px 32px}
    .ticket-row{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--border)}
    .ticket-row:last-child{border-bottom:none}
    .ticket-label{font-size:10px;color:var(--text-2);letter-spacing:.15em;text-transform:uppercase;font-weight:700}
    .ticket-value{font-size:16px;color:var(--text);font-weight:600}
    .ticket-value.mono{font-family:var(--mono);font-size:14px}
    .ticket-value.big{font-family:var(--display);font-size:24px;letter-spacing:.02em}
    .ticket-actions{padding:0 32px 32px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .ticket-btn{padding:12px;border-radius:10px;background:var(--bg-alt);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
    .ticket-btn:hover{background:var(--surface-2);border-color:var(--text-3)}
    .ticket-pay-note{margin:16px 32px 0;background:rgba(196,240,0,.06);border:1px solid rgba(196,240,0,.2);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--lime-soft);display:flex;gap:10px;align-items:flex-start}
    .ticket-pay-note strong{color:var(--lime);display:block;margin-bottom:2px}

    /* Features */
    .features{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    @media (max-width:900px){.features{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:480px){.features{grid-template-columns:1fr}}
    .feat-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px 22px;transition:border-color .15s,transform .15s}
    .feat-card:hover{border-color:var(--lime);transform:translateY(-3px)}
    .feat-ic{width:44px;height:44px;border-radius:12px;background:rgba(196,240,0,.1);border:1px solid rgba(196,240,0,.2);color:var(--lime);display:grid;place-items:center;font-size:20px;margin-bottom:16px}
    .feat-title{font-family:var(--display);font-size:18px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px}
    .feat-text{font-size:13px;color:var(--text-2);line-height:1.6}

    /* Pricing callout */
    .price-callout{background:linear-gradient(135deg,var(--surface) 0%,var(--surface-2) 100%);border:1.5px solid var(--border);border-radius:28px;padding:48px;overflow:hidden;position:relative}
    @media (max-width:720px){.price-callout{padding:28px 20px;border-radius:20px}}
    .price-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
    @media (max-width:720px){.price-grid{grid-template-columns:1fr;gap:14px}}
    .price-tile{background:var(--bg-alt);border:1.5px solid var(--border);border-radius:18px;padding:24px 24px}
    .price-tile-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--lime);letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}
    .price-tile-title{font-family:var(--display);font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:10px}
    .price-tile-big{font-family:var(--display);font-size:48px;line-height:1;color:var(--lime);margin-bottom:6px}
    .price-tile-meta{font-size:13px;color:var(--text-2);margin-bottom:14px}

    /* Venue */
    .venue-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
    @media (max-width:800px){.venue-grid{grid-template-columns:1fr}}
    .venue-stat{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--border)}
    .venue-stat:last-child{border-bottom:none}
    .venue-stat .ic{width:40px;height:40px;border-radius:10px;background:var(--surface);display:grid;place-items:center;font-size:18px;flex-shrink:0}
    .venue-stat-label{font-size:11px;color:var(--text-2);letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
    .venue-stat-val{font-size:15px;color:var(--text);font-weight:500}
    .venue-stat-val a{color:var(--lime)}

    /* Footer */
    .footer{border-top:1px solid var(--border);padding:40px 24px;margin-top:40px;position:relative;z-index:2}
    .footer-inner{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
    .footer-copy{font-size:12px;color:var(--text-3)}

    /* Toast */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);padding:14px 22px;border-radius:99px;display:inline-flex;align-items:center;gap:10px;font-size:14px;font-weight:500;z-index:100;box-shadow:0 24px 64px rgba(0,0,0,.5)}
    .toast.err{border-color:var(--danger);background:rgba(239,68,68,.1);color:#fca5a5}

    /* Config error */
    .config-err{min-height:100vh;display:grid;place-items:center;padding:24px}
    .config-err code{font-family:var(--mono);color:var(--lime)}
    .config-err pre{background:var(--surface);padding:14px 16px;border-radius:10px;font-size:12px;color:var(--lime);border:1px solid var(--border);overflow-x:auto;margin:14px 0;font-family:var(--mono)}

    .lime{color:var(--lime)}
    .mono{font-family:var(--mono)}
    /* ── Online payment, coupons, manage booking, policies ── */
    .pay-box{grid-column:1/-1;background:var(--bg-alt);border:1.5px solid var(--border);border-radius:16px;padding:18px 20px;margin-top:4px}
    .pay-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0;color:var(--text-2)}
    .pay-row strong{color:var(--text);font-weight:700}
    .pay-row.total{border-top:1px dashed var(--border);margin-top:6px;padding-top:12px;font-size:15px}
    .pay-row.now{color:var(--text)}
    .pay-row.now strong{color:var(--lime);font-size:20px;font-family:var(--display);letter-spacing:.02em}
    .pay-row .disc{color:var(--success)}
    .pay-gst{font-size:11px;color:var(--text-3);margin-top:6px}
    .coupon-row{display:flex;gap:8px;margin-bottom:14px}
    .coupon-row .form-input{text-transform:uppercase;letter-spacing:.08em;font-weight:700}
    .coupon-btn{padding:0 18px;border-radius:12px;border:1.5px solid var(--border);background:transparent;color:var(--text);font-weight:800;font-size:13px;white-space:nowrap}
    .coupon-btn:hover{border-color:var(--lime);color:var(--lime)}
    .coupon-applied{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.35);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:#6ee7b7}
    .coupon-applied button{color:var(--text-2);font-size:12px;font-weight:700;text-decoration:underline}
    .coupon-err{font-size:12px;color:#fca5a5;margin:-6px 0 12px}
    /* Offer bar + coupons modal */
    .offer-bar{position:relative;z-index:60;background:linear-gradient(90deg,#14532d,#166534 50%,#14532d);color:#ecfdf5;font-size:13px;font-weight:600;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 16px;text-align:center}
    .offer-bar b{font-family:var(--mono);letter-spacing:.08em;background:rgba(255,255,255,.14);border:1px dashed rgba(255,255,255,.55);border-radius:6px;padding:2px 8px}
    .offer-bar button{color:#fff;text-decoration:underline;font-weight:800;font-size:13px}
    .cp-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:120;display:grid;place-items:center;padding:16px}
    .cp-modal{width:100%;max-width:480px;max-height:85vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px}
    .cp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
    .cp-title{font-family:var(--display);font-size:22px;letter-spacing:.03em}
    .cp-x{font-size:22px;color:var(--text-2);padding:2px 8px}
    .cp-card{border:1.5px dashed var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;align-items:center}
    .cp-off{font-weight:800;font-size:16px;color:var(--lime)}
    .cp-desc{font-size:13px;color:var(--text-2);margin-top:2px}
    .cp-meta{font-size:11.5px;color:var(--text-3);margin-top:6px;line-height:1.5}
    .cp-code{font-family:var(--mono);font-weight:800;letter-spacing:.08em;font-size:13px;margin-top:6px}
    .cp-use{padding:9px 14px;border-radius:99px;border:1.5px solid var(--lime);color:var(--lime);font-weight:800;font-size:12.5px;white-space:nowrap}
    .cp-use:hover{background:var(--lime);color:#000}
    .policy-check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--text-2);line-height:1.5;margin:4px 0 16px;cursor:pointer;text-align:left}
    .policy-check input{margin-top:3px;width:16px;height:16px;accent-color:var(--lime);flex-shrink:0}
    .policy-check a{color:var(--lime);text-decoration:underline}
    .pay-status{margin-top:16px;border-radius:12px;padding:12px 16px;font-size:13px;line-height:1.5}
    .pay-status.err{background:rgba(239,68,68,.1);border:1px solid var(--danger);color:#fca5a5}
    .pay-status.info{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.4);color:#bae6fd}
    .secure-note{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;color:var(--text-3);margin-top:8px;letter-spacing:.04em}
    .manage-card{max-width:640px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px}
    .manage-actions{display:grid;gap:10px;margin-top:20px}
    .btn-danger{background:transparent;color:#fca5a5;border:1.5px solid rgba(239,68,68,.5);padding:14px 22px;border-radius:99px;font-weight:800;font-size:14px}
    .btn-danger:hover{background:rgba(239,68,68,.1)}
    .btn-danger:disabled{opacity:.5;cursor:not-allowed}
    .policy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
    .policy-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px}
    .policy-card h3{font-family:var(--display);font-size:20px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:10px}
    .policy-card ul{padding-left:18px;color:var(--text-2);font-size:13.5px;line-height:1.7}
    .footer-links{display:flex;gap:16px;flex-wrap:wrap}
    .footer-links a{font-size:12px;color:var(--text-2)}
    .footer-links a:hover{color:var(--lime)}

    /* ══ Motion layer (added on top of the original theme) ══ */
    @keyframes pop{0%{opacity:0;transform:scale(.92) translateY(8px)}100%{opacity:1;transform:none}}
    @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    @keyframes shine{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(220%) skewX(-18deg)}}
    @keyframes tick{0%{transform:scale(.4) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
    @keyframes pl-ball{0%{transform:translate(-120px,0) rotate(0)}30%{transform:translate(-40px,-52px) rotate(200deg)}55%{transform:translate(20px,0) rotate(380deg)}75%{transform:translate(70px,-22px) rotate(520deg)}100%{transform:translate(130px,0) rotate(720deg)}}
    @keyframes pl-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes pl-out{to{transform:translateY(-100%);opacity:0}}
    @keyframes pl-text{0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes pl-stump{0%,70%{transform:none}80%{transform:rotate(-12deg) translateX(-2px)}100%{transform:rotate(-30deg) translate(-6px,2px)}}
    @keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
    .anim-pop{animation:pop .45s var(--spring) both}
    .shake{animation:shake .5s both}

    /* Scroll reveal */
    .reveal{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
    .reveal.in{opacity:1;transform:none}
    .reveal.d1{transition-delay:.08s}.reveal.d2{transition-delay:.16s}.reveal.d3{transition-delay:.24s}.reveal.d4{transition-delay:.32s}

    /* Preloader */
    .preloader{position:fixed;inset:0;z-index:1000;background:#070907;display:grid;place-items:center;overflow:hidden}
    .preloader.out{animation:pl-out .7s var(--ease) forwards;pointer-events:none}
    .pl-inner{display:flex;flex-direction:column;align-items:center;gap:22px}
    .pl-logo{width:92px;height:92px;border-radius:22px;object-fit:cover;box-shadow:0 0 0 1px #1c261d,0 30px 80px rgba(var(--lime-rgb),.18)}
    .pl-scene{position:relative;width:300px;height:90px}
    .pl-ground{position:absolute;left:0;right:0;bottom:12px;height:2px;background:linear-gradient(90deg,transparent,var(--lime-dim) 20%,var(--lime) 50%,var(--lime-dim) 80%,transparent)}
    .pl-ball{position:absolute;left:50%;bottom:16px;width:28px;height:28px;margin-left:-14px;animation:pl-ball 1.5s cubic-bezier(.45,0,.55,1) infinite}
    .pl-stumps{position:absolute;right:52px;bottom:14px;display:flex;gap:5px;align-items:flex-end}
    .pl-stumps i{display:block;width:5px;height:40px;background:linear-gradient(#f7f8f5,#b9c0b8);border-radius:3px 3px 0 0;transform-origin:bottom center}
    .pl-stumps i:nth-child(3){animation:pl-stump 1.5s ease-in infinite}
    .pl-bar{width:220px;height:3px;background:#161c17;border-radius:99px;overflow:hidden}
    .pl-bar i{display:block;height:100%;background:var(--lime);transform-origin:left;animation:pl-bar 2.4s var(--ease) forwards}
    .pl-text{font-family:var(--display);font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--text-2);animation:pl-text 1.2s ease-in-out infinite}
    .pl-text b{color:var(--lime)}

    /* Sports ticker */
    .ticker{position:relative;z-index:2;overflow:hidden;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:rgba(var(--lime-rgb),.04);padding:9px 0;user-select:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
    .ticker-track{display:flex;width:max-content;animation:marquee 28s linear infinite}
    body.locked .ticker-track{animation-play-state:paused}
    .ticker:hover .ticker-track{animation-play-state:paused}
    .ticker span{font-family:var(--display);font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-2);padding:0 22px;display:inline-flex;align-items:center;gap:22px;white-space:nowrap}
    .ticker span::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}

    /* Hero: letter reveal + count-up (layout unchanged) */
    .logo img{transition:transform .4s var(--spring)}
    .logo:hover img{transform:rotate(-6deg) scale(1.06)}

    /* Buttons: shine sweep + spring */
    .btn-primary,.btn-submit,.btn-cta{position:relative;overflow:hidden}
    .btn-primary::after,.btn-submit::after,.btn-cta::after{content:'';position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-120%) skewX(-18deg);pointer-events:none}
    .btn-primary:hover::after,.btn-submit:hover:not(:disabled)::after,.btn-cta:hover::after{animation:shine .7s var(--ease)}
    .btn-primary,.btn-cta{transition:transform .25s var(--spring),box-shadow .2s}
    .btn-primary:active,.btn-submit:active:not(:disabled){transform:scale(.98)}
    .btn-ghost{background:transparent;color:var(--text);padding:8px 14px;border-radius:99px;border:1.5px solid var(--border);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,background .15s,transform .2s var(--spring)}
    .btn-ghost:hover{border-color:var(--lime);background:rgba(var(--lime-rgb),.06);transform:translateY(-1px)}
    .btn-ghost .avatar{width:22px;height:22px;border-radius:50%;background:var(--lime);color:#000;display:grid;place-items:center;font-size:11px;font-weight:900}
    @media (max-width:560px){.btn-ghost{padding:7px 11px;font-size:12px}.btn-ghost .lbl{display:none}}

    /* Cards: spring hover, icon bounce, shine on select, staggered slot entry */
    .date-pill,.sport-card,.slot-card,.duration-card,.feat-card,.price-tile,.ticket-btn{transition:transform .3s var(--spring),border-color .15s,background .2s,box-shadow .2s}
    .date-pill.active{transform:translateY(-2px) scale(1.04);box-shadow:0 10px 28px rgba(var(--lime-rgb),.3)}
    .sport-card{position:relative;overflow:hidden}
    .sport-card .ic{transition:transform .35s var(--spring)}
    .sport-card:hover .ic{transform:scale(1.2) rotate(-10deg)}
    .sport-card.active::after{content:'';position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shine .9s var(--ease)}
    .slot-card{animation:pop .45s var(--spring) both}
    .slot-card.active,.duration-card.active{transform:translateY(-3px) scale(1.03)}
    .feat-card{position:relative;overflow:hidden}
    .feat-card::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--lime-rgb),.22),transparent);opacity:0;transition:opacity .3s}
    .feat-card:hover{transform:translateY(-5px);box-shadow:0 24px 60px rgba(0,0,0,.4)}
    .feat-card:hover::before{opacity:1}
    .feat-ic{transition:transform .35s var(--spring)}
    .feat-card:hover .feat-ic{transform:rotate(-8deg) scale(1.1)}
    .price-tile:hover{transform:translateY(-4px);border-color:var(--lime-dim)}
    .ticket-btn:hover{transform:translateY(-2px)}
    .ticket-check{animation:tick .7s var(--spring) both}
    .form-input:focus{box-shadow:0 0 0 4px rgba(var(--lime-rgb),.12)}
    .toast{animation:pop .4s var(--spring) both}
    .cp-backdrop{animation:risefade .25s var(--ease);backdrop-filter:blur(6px)}
    .cp-modal{animation:pop .4s var(--spring)}
    .offer-bar{background-size:200% 100%;animation:shimmer 6s linear infinite}

    /* Pass-covered box in the booking form */
    .pass-box{grid-column:1/-1;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(var(--lime-rgb),.16),rgba(var(--lime-rgb),.04));border:1.5px solid rgba(var(--lime-rgb),.5);border-radius:16px;padding:18px 20px;margin-top:4px;display:flex;gap:14px;align-items:center}
    .pass-box::after{content:'';position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);animation:shine 1.4s var(--ease)}
    .pass-box .ic{font-size:30px}
    .pass-box strong{display:block;color:var(--lime);font-family:var(--display);font-size:20px;letter-spacing:.03em;text-transform:uppercase}
    .pass-box span{font-size:13px;color:var(--text-2)}

    /* My Account */
    .acct-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:150;display:grid;place-items:center;padding:16px;animation:risefade .25s var(--ease)}
    .acct-modal{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:26px;animation:pop .45s var(--spring);position:relative}
    .acct-modal.wide{max-width:720px}
    @media (max-width:560px){.acct-modal{padding:20px 16px;border-radius:18px;max-height:94vh}}
    .acct-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
    .acct-title{font-family:var(--display);font-size:28px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
    .acct-sub{font-size:13px;color:var(--text-2);margin-top:6px}
    .otp-row{display:flex;gap:8px;justify-content:center;margin:18px 0 8px}
    .otp-box{width:46px;height:56px;border-radius:12px;background:var(--bg-alt);border:1.5px solid var(--border);color:var(--text);font-family:var(--mono);font-size:24px;font-weight:700;text-align:center;outline:none;transition:border-color .15s,box-shadow .15s,transform .2s var(--spring)}
    .otp-box:focus{border-color:var(--lime);box-shadow:0 0 0 4px rgba(var(--lime-rgb),.15);transform:translateY(-2px)}
    .otp-box.filled{border-color:var(--lime-dim)}
    @media (max-width:400px){.otp-box{width:40px;height:50px;font-size:20px}}
    .acct-link{color:var(--lime);font-weight:700;font-size:13px;text-decoration:underline;background:none}
    .acct-link:disabled{color:var(--text-3);text-decoration:none;cursor:default}
    .acct-profile{display:flex;align-items:center;gap:14px;padding:16px 18px;background:linear-gradient(135deg,rgba(var(--lime-rgb),.12),transparent);border:1px solid rgba(var(--lime-rgb),.25);border-radius:16px;margin-bottom:18px}
    .acct-avatar{width:48px;height:48px;border-radius:50%;background:var(--lime);color:#000;display:grid;place-items:center;font-family:var(--display);font-size:22px;flex-shrink:0}
    .acct-name{font-family:var(--display);font-size:20px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
    .acct-meta{font-size:12px;color:var(--text-2);margin-top:3px;word-break:break-all}
    .acct-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
    .acct-tab{padding:8px 14px;border-radius:99px;border:1.5px solid var(--border);font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2);transition:all .2s var(--spring)}
    .acct-tab.active{background:var(--lime);color:#000;border-color:var(--lime);transform:scale(1.04)}
    .acct-tab b{margin-left:6px;opacity:.7}
    .bk-card{background:var(--bg-alt);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;animation:pop .4s var(--spring) both;transition:border-color .2s,transform .25s var(--spring)}
    .bk-card:hover{border-color:var(--text-3);transform:translateX(2px)}

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const API_URL = "https://hitnrun-api.vercel.app/api";

const VENUE = {
  name:    "Hit N Run Sports Arena",
  city:    "Dehradun",
  area:    "Panditwari",
  address: "Hit N Run Sports Arena, Panditwari, Dehradun, Uttarakhand 248007",
  phone:   "+91 82733 95003",
  whatsapp:"918273395003",
  maps:    "https://maps.app.goo.gl/N9pPgv9PESbgRMFY7",
  hoursWeek: "Mon–Fri 8 AM – 4 PM and 6 PM – 11 PM",
  hoursWeekend: "Sat–Sun 6 AM – 11 PM",
  email:   "contact@hitnrunarena.in",
  website: "hitnrunarena.in"
};

// Media: hero background montage + gallery. Paths are relative to the site root (GitHub Pages).
// Leave empty until files exist in /media — the hero stays as-is and the gallery section hides itself.
const MEDIA = {
  heroVideo: '/media/hero.mp4',
  heroPoster: '/media/hero.jpg',
  gallery: [
    { src:'/media/g6.mp4', poster:'/media/g6.jpg', video:true, cap:'Match night', wide:true },
    { src:'/media/g0.mp4', poster:'/media/g0.jpg', video:true, cap:'Bowling machine · nets' },
    { src:'/media/g2.mp4', poster:'/media/g2.jpg', video:true, cap:'Batting under lights', tall:true },
    { src:'/media/g3.mp4', poster:'/media/g3.jpg', video:true, cap:'Football · 5-a-side' },
    { src:'/media/g4.mp4', poster:'/media/g4.jpg', video:true, cap:'Astro turf' },
    { src:'/media/g1.mp4', poster:'/media/g1.jpg', video:true, cap:'Night nets', tall:true },
    { src:'/media/g5.mp4', poster:'/media/g5.jpg', video:true, cap:'Bowling machine lane' },
    { src:'/media/g9.mp4', poster:'/media/g9.jpg', video:true, cap:'Open nets', wide:true },
    { src:'/media/g8.mp4', poster:'/media/g8.jpg', video:true, cap:'Machine set-up' },
    { src:'/media/g7.mp4', poster:'/media/g7.jpg', video:true, cap:'Sunset at the ground' }
  ]
};
const WA_HELP_NUMBER = VENUE.whatsapp;   // venue WhatsApp for help; change here if a separate help number is used

const API = {
  async get(action, params = {}) {
    const qs = new URLSearchParams({ action, ...params }).toString();
    const res = await fetch(API_URL + '?' + qs);
    return unwrap(await res.json());
  },
  async post(action, body = {}) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...body })
    });
    return unwrap(await res.json());
  }
};

function unwrap(data){
  if (data.ok) return data.data;
  const e = new Error(data.error || 'Request failed');
  e.code = data.code;  // SLOT_TAKEN, SPORT_FULL, … (see API_CONTRACT.md)
  throw e;
}

// getAvailability cache: date -> Promise. One call returns every public sport for that date.
const availCache = {};
function loadAvailability(date, fresh){
  if (fresh || !availCache[date]) {
    const p = API.get('getAvailability', { date });
    availCache[date] = p;
    p.catch(() => { if (availCache[date] === p) delete availCache[date]; });
  }
  return availCache[date];
}
function clearAvailabilityCache(){ Object.keys(availCache).forEach(k => delete availCache[k]); }

function formatDateISO(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function dateLong(iso){ if(!iso) return ''; return new Date(iso+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function dateNice(iso){ if(!iso) return ''; return new Date(iso+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}); }
function getNext15Days(){
  const t=new Date();
  return Array.from({length:15},(_,i)=>{
    const d=new Date(t); d.setDate(d.getDate()+i);
    let label = i===0 ? 'Today' : i===1 ? 'Tomorrow' : d.toLocaleDateString('en-IN',{month:'short'});
    return { iso: formatDateISO(d), label, day: d.getDate(), weekday: d.toLocaleDateString('en-IN',{weekday:'short'}) };
  });
}
function normalizePhone(p){ if(!p) return ''; return String(p).replace(/\D/g,'').slice(-10); }
function isValidEmail(e){ if(!e) return false; return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function buildCalendarLink(b){
  const [s,e]=b.slot_time.split('-').map(s=>s.trim().replace(':',''));
  const date=b.booking_date.replace(/-/g,'');
  const params = new URLSearchParams({
    action:'TEMPLATE',
    text:`${b.sport_name} at ${VENUE.name}`,
    dates:`${date}T${s}00/${date}T${e}00`,
    details:`Booking ID: ${b.booking_id}\n${Number(b.balance_due ?? b.amount) > 0 ? `Pay ₹${b.balance_due ?? b.amount} at venue.` : 'Paid in full.'}\n\n${VENUE.address}\n${VENUE.maps}`,
    location:VENUE.address,
    ctz:'Asia/Kolkata'
  });
  return 'https://calendar.google.com/calendar/render?'+params.toString();
}
function buildShareText(b){
  const when = isSession(b) ? `${startTime12(b.slot_time)} · ${sessionQty(b, b.duration_hrs)}` : slotRange12(b.slot_time);
  return `${b.icon || '✅'} Booked at ${VENUE.name}!\n\n📅 ${dateLong(b.booking_date)}\n⏰ ${when}\n🎯 ${b.sport_name}\n\nBooking ID: ${b.booking_id}\n📍 Venue location: ${VENUE.maps}\nhttps://${VENUE.website}`;
}

function inr(n){ return '₹' + (Number(n) || 0).toLocaleString('en-IN'); }

// Razorpay Checkout script, loaded once on first payment.
let rzpScript = null;
function loadRazorpay(){
  if (window.Razorpay) return Promise.resolve();
  if (!rzpScript) {
    rzpScript = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://checkout.razorpay.com/v1/checkout.js';
      s.onload = () => resolve();
      s.onerror = () => { rzpScript = null; reject(new Error('Could not load the payment window. Check your connection and try again.')); };
      document.head.appendChild(s);
    });
  }
  return rzpScript;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

function Spinner({ small }){ return <span className={`loading-spinner ${small?'small':''} spin`}/>; }

// ── Scroll reveal: any .reveal element animates in when it enters the viewport ──
function useReveal(deps = []){
  useEffect(()=>{
    let io = null, off = null;
    const setup = () => {
      const els = Array.from(document.querySelectorAll('.reveal:not(.in)'));
      if (!els.length) return;
      if (!('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('in')); return; }
      io = new IntersectionObserver(entries => {
        entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
      els.forEach(el => io.observe(el));
    };
    // Wait for the preloader to lift so the first reveals play in view
    if (document.body.classList.contains('locked')) { off = () => setup(); window.addEventListener('hnr-ready', off, { once: true }); }
    else setup();
    return ()=>{ if (io) io.disconnect(); if (off) window.removeEventListener('hnr-ready', off); };
  }, deps);
}

// Count-up for hero numbers
function CountUp({ value, duration = 900 }){
  const [n, setN] = useState(0);
  useEffect(()=>{
    const target = Number(value) || 0;
    if (!target) { setN(0); return; }
    let raf, start;
    const step = t => {
      if (!start) start = t;
      const k = Math.min(1, (t - start) / duration);
      const e = 1 - Math.pow(1 - k, 3);
      setN(Math.round(target * e));
      if (k < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  }, [value]);
  return <>{n.toLocaleString('en-IN')}</>;
}

const BallSVG = ({ className }) => (
  <svg className={className} viewBox="0 0 64 64" aria-hidden="true">

  <svg className={className} viewBox="0 0 64 64" aria-hidden="true">

    <polygon points="10,22 17,29 18,40 10,44 4,34" fill="#111" opacity=".9"/>
    <polygon points="22,60 26,50 38,50 42,60 32,62" fill="#111" opacity=".9"/>
  </svg>
);

const PRELOAD_MIN_MS = 1700;
function Preloader({ ready }){
  const [gone, setGone] = useState(false);
  const [out, setOut] = useState(false);
  useEffect(()=>{
    document.body.classList.add('locked');
    return ()=>document.body.classList.remove('locked');
  }, []);
  useEffect(()=>{
    if (!ready) return;
    const t = setTimeout(()=>{ setOut(true); document.body.classList.remove('locked'); window.dispatchEvent(new Event('hnr-ready')); setTimeout(()=>setGone(true), 700); }, 250);
    return ()=>clearTimeout(t);
  }, [ready]);
  if (gone) return null;
  return (
    <div className={`preloader ${out?'out':''}`} aria-hidden="true">
      <div className="pl-inner">
        <img className="pl-logo" src="/logo.jpeg" alt=""/>
        <div className="pl-scene">
          <div className="pl-stumps"><i/><i/><i/></div>
          <BallSVG className="pl-ball"/>
          <div className="pl-ground"/>
        </div>
        <div className="pl-bar"><i/></div>
        <div className="pl-text">Warming <b>up</b></div>
      </div>
    </div>
  );
}

function Ticker({ sports }){
  const items = (sports && sports.length ? sports.map(s => `${s.icon} ${s.name}`) : ['🏏 Cricket','⚽ Football','🏐 Volleyball','🥅 Net practice','🎯 Bowling machine'])
    .concat([`📍 ${VENUE.area}, ${VENUE.city}`, '⚡ Live availability', '🕐 Open daily']);
  const row = items.concat(items);
  return (
    <div className="ticker" aria-hidden="true">
      <div className="ticker-track">{row.map((t, i) => <span key={i}>{t}</span>)}</div>
    </div>
  );
}

// ── My Account session (email OTP). Booking never needs this. ──
const ACCT_KEY = 'hnr_account';
function loadAccount(){
  try { const a = JSON.parse(localStorage.getItem(ACCT_KEY) || 'null'); if (a && a.token && new Date(a.expires_at) > new Date()) return a; } catch(_) {}
  return null;
}
function saveAccount(a){ try { a ? localStorage.setItem(ACCT_KEY, JSON.stringify(a)) : localStorage.removeItem(ACCT_KEY); } catch(_) {} }


function Toast({ toast, onClose }){
  useEffect(()=>{ if(!toast?.show) return; const t=setTimeout(onClose,4000); return ()=>clearTimeout(t); },[toast?.show]);
  if(!toast?.show) return null;
  return <div className={`toast ${toast.isError?'err':''}`}><span>{toast.icon||(toast.isError?'⚠️':'✓')}</span><span>{toast.message}</span></div>;
}

function couponOff(c){
  return c.discount_type === 'percent'
    ? `${c.discount_value}% OFF${c.max_discount ? ` (up to ₹${c.max_discount})` : ''}`
    : `₹${c.discount_value} OFF`;
}
function couponMeta(c){
  const m = [];
  if (c.first_booking_only) m.push('First booking only');
  m.push(c.sports && c.sports.length ? 'On ' + c.sports.join(', ') : 'On any sport');
  if (c.min_order) m.push('Min booking ₹' + c.min_order);
  if (c.day_rule === 'weekday') m.push('Weekdays only');
  if (c.day_rule === 'weekend') m.push('Weekends only');
  if (c.valid_to) m.push('Valid till ' + dateNice(c.valid_to));
  return m.join(' · ');
}

// pricing_mode "session" (API_CONTRACT.md): one slot = session_qty session_unit; never show it as hourly.
function isSession(s){ return !!s && s.pricing_mode === 'session'; }
function sessionQty(s, n){ return `${s.session_qty * n} ${s.session_unit}`; }
function durationText(s, n){ return isSession(s) ? sessionQty(s, n) : `${n} hr${n>1?'s':''}`; }
function startTime12(slotTime){
  const [h, m] = String(slotTime).split('-')[0].split(':').map(Number);
  return `${(h % 12) || 12}:${String(m || 0).padStart(2,'0')} ${h >= 12 ? 'PM' : 'AM'}`;
}
// All times shown to customers are 12-hour. Stored slot_time stays "HH:MM-HH:MM".
function time12(hhmm){
  const [h, m] = String(hhmm).trim().split(':').map(Number);
  if (isNaN(h)) return String(hhmm);
  return `${(h % 12) || 12}:${String(m || 0).padStart(2,'0')} ${h % 24 >= 12 ? 'PM' : 'AM'}`;
}
function slotRange12(slotTime){
  const p = String(slotTime || '').split(/\s*[–-]\s*/);
  return p.length === 2 ? `${time12(p[0])} – ${time12(p[1])}` : time12(slotTime);
}
function priceLabel(s){
  const p = `₹${Number(s.price).toLocaleString('en-IN')}`;
  return isSession(s) ? `${p} · ${sessionQty(s, 1)}` : `${p} / hr${s.unit_label ? ' · ' + s.unit_label : ''}`;
}

function BookingWidget({ sports, sportsError, onRetrySports, onComplete, payCfg, coupons }){
  const [offersOpen, setOffersOpen] = useState(false);
  const next15 = useMemo(()=>getNext15Days(),[]);
  const [date, setDate] = useState(next15[0].iso);
  const [sportId, setSportId] = useState(null);
  const [avail, setAvail] = useState(null);          // getAvailability response for `date`
  const [availError, setAvailError] = useState(null);
  const [availNonce, setAvailNonce] = useState(0);   // bump to force a fresh fetch
  const [selectedSlot, setSelectedSlot] = useState(null);
  const [duration, setDuration] = useState(1);
  const [form, setForm] = useState({ name:'', phone:'', email:'', members:1, notes:'' });
  const [returning, setReturning] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState(null);
  // Online payment state
  const online = !!(payCfg && payCfg.online);
  const [quote, setQuote] = useState(null);          // previewCoupon response (server maths)
  const [couponInput, setCouponInput] = useState('');
  const [coupon, setCoupon] = useState('');           // applied code
  const [couponErr, setCouponErr] = useState(null);
  const [couponBusy, setCouponBusy] = useState(false);
  useEffect(()=>{
    const fill = c => { if (c) { setCouponInput(String(c).toUpperCase()); setCouponErr(null); } };
    try { fill(sessionStorage.getItem('hnr_coupon')); } catch(_) {}
    const h = e => fill(e.detail);
    window.addEventListener('hnr-coupon', h);
    return ()=>window.removeEventListener('hnr-coupon', h);
  }, []);
  const [agree, setAgree] = useState(false);
  const [payInfo, setPayInfo] = useState(null);       // { kind:'err'|'info', text }

  const sport = (sports || []).find(s => s.id === sportId) || null;

  // One getAvailability call covers every sport for the date. Cached per date;
  // a revisit shows the cached copy and refreshes it in the background.
  useEffect(()=>{
    let cancelled = false;
    const hadCache = !!availCache[date] && availNonce === 0;
    setSelectedSlot(null); setAvailError(null);
    if (!hadCache) setAvail(null);
    loadAvailability(date, availNonce > 0).then(
      d => { if(!cancelled) setAvail(d); },
      e => { if(!cancelled) setAvailError(e.message); }
    );
    if (hadCache) loadAvailability(date, true).then(d => { if(!cancelled) setAvail(d); }, ()=>{});
    // Prefetch next 2 days in background — makes date switching instant
    const idx = next15.findIndex(d => d.iso === date);
    [1,2].forEach(off => { const n = next15[idx + off]; if (n) loadAvailability(n.iso).catch(()=>{}); });
    return ()=>{ cancelled = true; };
  }, [date, availNonce]);

  useEffect(()=>{ setSelectedSlot(null); }, [sportId]);
  useEffect(()=>{
    const ctx = sport ? `booking ${sport.name} on ${dateNice(date)}${selectedSlot ? ` at ${startTime12(selectedSlot.slot_time)}` : ''}` : null;
    window.dispatchEvent(new CustomEvent('hnr-help-context', { detail: ctx }));
  }, [sportId, date, selectedSlot && selectedSlot.slot_time]);
  useEffect(()=>{
    const h = e => { if ((sports || []).some(s => s.id === e.detail)) setSportId(e.detail); };
    window.addEventListener('hnr-pick-sport', h);
    return ()=>window.removeEventListener('hnr-pick-sport', h);
  }, [sports]);

  useEffect(()=>{
    const ph = normalizePhone(form.phone);
    if(ph.length !== 10){ if(returning) setReturning(null); return; }
    let cancelled = false;
    const t = setTimeout(async()=>{
      try {
        const r = await API.get('lookupCustomer', { phone: ph });
        if(cancelled || !r) return;
        if(r.found || r.pass){
          setReturning(r);
          if (r.found) setForm(p => ({ ...p, name: p.name || r.customer_name, email: p.email || r.email || '' }));
        } else { setReturning(null); }
      } catch(_) {}
    }, 500);
    return ()=>{ cancelled = true; clearTimeout(t); };
  }, [form.phone]);

  // Whenever the user picks a new slot, reset duration to 1 hr.
  useEffect(()=>{ setDuration(1); }, [selectedSlot && selectedSlot.slot_id]);

  const hours = ((avail && avail.sports.find(s => s.sport_id === sportId)) || { hours: [] }).hours.filter(h => h.available > 0);
  const maxPerBooking = sport ? sport.max_slots_per_booking : 1;
  const maxDur = selectedSlot ? Math.min(selectedSlot.max_duration || 1, maxPerBooking) : 1;
  const effectiveDuration = Math.min(duration, maxDur);
  // Display only: server hourly price × hours. The ticket shows the server's final amount.
  const displayTotal = h => '₹' + (Number(selectedSlot ? selectedSlot.price : 0) * h).toLocaleString('en-IN');
  // lookupCustomer returns a sport_id; only ever show a public sport's name
  const lastSportName = returning && ((sports || []).find(s => s.id === returning.last_sport) || {}).name;

  const phoneOk = normalizePhone(form.phone).length === 10;
  // A weekly/monthly pass on this phone covers the booking: no advance, no Razorpay.
  const passCovered = !!(quote && quote.pass_covered);
  const canBook = sport && selectedSlot && form.name.trim() && phoneOk && isValidEmail(form.email)
    && (!online || passCovered || (agree && quote));

  // Server price quote (with coupon) whenever the selection changes. The browser never computes money.
  async function fetchQuote(code){
    const r = await API.get('previewCoupon', {
      sport_id: sport.id, slot_id: selectedSlot.slot_id, duration_hrs: effectiveDuration,
      phone: normalizePhone(form.phone), ...(code ? { coupon_code: code } : {})
    });
    setQuote(r);
    return r;
  }
  // Re-quoted when the phone becomes valid too, so a pass holder sees "covered" before paying.
  useEffect(()=>{
    if (!sport || !selectedSlot) { setQuote(null); return; }
    if (!online && !phoneOk) { setQuote(null); return; }
    let cancelled = false;
    setQuote(null);
    fetchQuote(coupon).catch(e => {
      if (cancelled) return;
      if (e.code === 'COUPON_INVALID' && coupon) { setCoupon(''); setCouponErr(e.message); fetchQuote('').catch(()=>{}); }
    });
    return ()=>{ cancelled = true; };
  }, [online, sportId, selectedSlot && selectedSlot.slot_id, effectiveDuration, phoneOk]);

  // Load Razorpay's checkout script as soon as a slot is picked, so Pay opens instantly.
  useEffect(()=>{ if (online && selectedSlot) loadRazorpay().catch(()=>{}); }, [online, !!selectedSlot]);

  async function applyCoupon(){
    const code = couponInput.trim().toUpperCase();
    if (!code || couponBusy) return;
    if (normalizePhone(form.phone).length !== 10) { setCouponErr('Enter your phone number first'); return; }
    setCouponBusy(true); setCouponErr(null);
    try { await fetchQuote(code); setCoupon(code); }
    catch(e){ setCouponErr(e.message); }
    finally { setCouponBusy(false); }
  }
  function removeCoupon(){
    setCoupon(''); setCouponInput(''); setCouponErr(null);
    fetchQuote('').catch(()=>{});
  }

  function bookingFromServer(b, extra = {}){
    return {
      ...b, ...extra,
      sport_name: sport.name, icon: sport.icon,
      pricing_mode: sport.pricing_mode, session_qty: sport.session_qty, session_unit: sport.session_unit
    };
  }

  async function payAndBook(){
    if(!canBook || submitting) return;
    setSubmitting(true); setError(null); setPayInfo(null);
    let order;
    try {
      await loadRazorpay();
      order = await API.post('createOrder', {
        customer_name: form.name.trim(), phone: normalizePhone(form.phone), email: form.email.trim(),
        sport_id: sport.id, slot_id: selectedSlot.slot_id, duration_hrs: effectiveDuration,
        members_count: parseInt(form.members,10) || 1, notes: form.notes.trim() || '',
        coupon_code: coupon || ''
      });
    } catch(e) {
      setSubmitting(false);
      if (e.code === 'COUPON_INVALID') { setCoupon(''); setCouponErr(e.message); fetchQuote('').catch(()=>{}); return; }
      setError(e.message);
      if (e.code === 'SLOT_TAKEN' || e.code === 'SPORT_FULL') setAvailNonce(n => n + 1);
      return;
    }

    let settled = false;
    const finish = (res) => {
      settled = true;
      clearAvailabilityCache();
      onComplete(bookingFromServer(res.booking, { manage_url: res.manage_url, invoice_url: res.invoice_url, paid_online: true }));
    };
    // UPI apps can confirm after the modal closes: poll the server for up to 2 minutes.
    const poll = async () => {
      setPayInfo({ kind:'info', text:'Confirming your payment with the bank… please keep this page open.' });
      for (let i = 0; i < 40 && !settled; i++) {
        await sleep(3000);
        try {
          const st = await API.get('getPaymentStatus', { booking_id: order.booking_id, order_id: order.order_id });
          if (st.status === 'confirmed') return finish(st);
        } catch(_) {}
      }
      if (!settled) { setSubmitting(false); setPayInfo({ kind:'info', text:`We haven't received confirmation yet. If money was deducted, you'll get a confirmation email within a few minutes, or an automatic refund. Booking ref: ${order.booking_id}` }); }
    };

    const rzp = new window.Razorpay({
      key: order.key_id,
      order_id: order.order_id,
      amount: order.amount,
      currency: order.currency,
      name: order.name,
      description: order.description,
      image: 'https://hitnrunarena.in/logo.jpeg',
      prefill: order.prefill,
      notes: { booking_id: order.booking_id },
      theme: { color: '#c4f000' },
      timeout: order.timeout,
      retry: { enabled: true, max_count: 3 },
      handler: async (resp) => {
        setPayInfo({ kind:'info', text:'Payment received. Confirming your booking…' });
        try {
          const res = await API.post('verifyPayment', { ...resp, booking_id: order.booking_id });
          if (res.status === 'confirmed') return finish(res);
          if (res.status === 'refunded') {
            settled = true; setSubmitting(false); clearAvailabilityCache(); setAvailNonce(n => n + 1);
            setPayInfo({ kind:'err', text:'Sorry, that slot was taken while you were paying. Your payment has been refunded in full (5-7 working days). Please pick another slot.' });
            return;
          }
          poll();
        } catch(e) {
          if (e.code === 'NOT_CAPTURED') return poll();
          setSubmitting(false);
          setPayInfo({ kind:'err', text: e.message + ` (ref ${order.booking_id})` });
        }
      },
      modal: {
        confirm_close: true,
        ondismiss: async () => {
          if (settled) return;
          setSubmitting(false);
          setPayInfo({ kind:'err', text:'Payment cancelled. Your slot was not booked.' });
          try { await API.post('abandonOrder', { booking_id: order.booking_id, order_id: order.order_id }); } catch(_) {}
          clearAvailabilityCache(); setAvailNonce(n => n + 1);
        }
      }
    });
    rzp.on('payment.failed', (r) => {
      const reason = (r && r.error && (r.error.description || r.error.reason)) || 'Payment failed';
      setPayInfo({ kind:'err', text: `${reason}. You can try again with another method in the payment window.` });
    });
    rzp.open();
  }

  async function submit(){
    if (online && !passCovered) return payAndBook();
    if(!canBook || submitting) return;
    setSubmitting(true);
    setError(null);
    try {
      const result = await API.post('createBooking', {
        customer_name: form.name.trim(),
        phone: normalizePhone(form.phone),
        email: form.email.trim(),
        sport_id: sport.id,
        slot_id: selectedSlot.slot_id,
        duration_hrs: effectiveDuration,
        members_count: parseInt(form.members,10) || 1,
        notes: form.notes.trim() || ''
      });
      clearAvailabilityCache();
      onComplete({
        ...result,
        booking_date: result.slot_date,
        sport_name: result.sport_name || sport.name,
        icon: sport.icon,
        pricing_mode: sport.pricing_mode, session_qty: sport.session_qty, session_unit: sport.session_unit,
        members_count: parseInt(form.members,10) || 1,
        customer_name: form.name.trim(),
        email: form.email.trim(),
        on_pass: result.payment_mode === 'pass'
      });
    } catch(e) {
      setError(e.message);
      setSubmitting(false);
      // Someone beat us to it — show fresh counts
      if (e.code === 'SLOT_TAKEN' || e.code === 'SPORT_FULL') setAvailNonce(n => n + 1);
      // Pass no longer covers (used up / expired) while the form was open → fall back to normal pricing
      if (e.code === 'PAYMENT_REQUIRED') fetchQuote(coupon).catch(()=>{});
    }
  }

  return (
    <section className="section" id="book">
      <div className="section-head reveal">
        <span className="section-eyebrow">Book in 60 seconds</span>
        <h2 className="section-h2">Lock in<br/>your slot.</h2>
        <p className="section-sub">{online
          ? `Pay a ₹${payCfg.advance} advance online to lock your slot; the rest at the venue. Free cancellation up to ${payCfg.refund_cutoff_hours} hours before.`
          : 'No advance payment. Pay at the venue when you arrive. Email confirmation hits your inbox immediately.'}</p>
      </div>
      <div className="booking-card reveal d1">
        {/* STEP 1 */}
        <div className="booking-step">
          <div className="step-label">
            <span className="step-num">1</span>
            <span className="step-title">When are you playing?</span>
            <span className="step-meta">{dateLong(date)}</span>
          </div>

            {next15.map(d => (
              <button key={d.iso} className={`date-pill ${date===d.iso?'active':''}`} onClick={()=>setDate(d.iso)}>
