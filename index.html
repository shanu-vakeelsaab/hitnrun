<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0d0a" />
  <title>Hit N Run Sports Arena · Book your turf in Pune</title>
  <meta name="description" content="Pune's premier multi-sport turf. Book cricket, football, badminton and more — open 6 AM to 10 PM, 365 days a year. Pay at venue." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg:        #0a0d0a;
      --bg-alt:    #0e120e;
      --surface:   #141914;
      --surface-2: #1a201a;
      --border:    #232a23;
      --text:      #f5f5f4;
      --text-2:    #a8a29e;
      --text-3:    #57534e;
      --lime:      #c4f000;
      --lime-soft: #d9f99d;
      --lime-dim:  #6b8a00;
      --orange:    #fbbf24;
      --success:   #10b981;
      --danger:    #ef4444;
      --info:      #38bdf8;

      --display: 'Anton', system-ui, sans-serif;
      --body: 'Outfit', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--body);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      line-height: 1.5;
    }
    input, textarea, select, button { font-family: var(--body); }
    button { background: none; border: none; cursor: pointer; color: inherit; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-alt); }
    ::-webkit-scrollbar-thumb { background: #2a352a; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #3a4a3a; }

    /* Animations */
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes risefade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(196, 240, 0, 0.4); }
      50% { box-shadow: 0 0 0 12px rgba(196, 240, 0, 0); }
    }
    @keyframes float-orb {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.05); }
      66% { transform: translate(-30px, 25px) scale(0.95); }
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes slide-up-bg {
      from { background-position: 0 100%; }
      to { background-position: 0 0%; }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    .anim-rise { animation: rise .6s cubic-bezier(.16,1,.3,1) both; }
    .anim-rise-fast { animation: risefade .35s cubic-bezier(.16,1,.3,1) both; }
    .anim-fade { animation: fade-in .35s ease both; }
    .pulse-glow { animation: glow 2.4s infinite; }
    .live-dot { animation: blink 1.6s ease-in-out infinite; }
    .spin { animation: spin .9s linear infinite; }
    .shimmer { background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.4s ease-in-out infinite; }

    /* ---------- Background orbs / grain ---------- */
    .stage-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.18;
      animation: float-orb 16s ease-in-out infinite;
    }
    .orb-1 { width: 460px; height: 460px; background: #c4f000; top: -120px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 380px; height: 380px; background: #38bdf8; top: 40%; right: -120px; animation-delay: -6s; opacity: 0.13; }
    .orb-3 { width: 320px; height: 320px; background: #fbbf24; bottom: -60px; left: 30%; animation-delay: -10s; opacity: 0.1; }

    .grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.04;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* ---------- Nav ---------- */
    .nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(10,13,10,.7); backdrop-filter: blur(20px) saturate(1.2);
      border-bottom: 1px solid rgba(255,255,255,.04);
    }
    .nav-inner { max-width: 1280px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-mark { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--lime) 0%, #94c800 100%); display: grid; place-items: center; font-size: 16px; color: #000; }
    .logo-text { font-family: var(--display); font-size: 18px; letter-spacing: 0.04em; }
    .logo-text small { font-family: var(--body); font-size: 9px; font-weight: 600; letter-spacing: .15em; color: var(--text-3); text-transform: uppercase; display: block; margin-top: -3px; }
    .nav-cta { display: flex; align-items: center; gap: 8px; }
    .nav-link { font-size: 13px; font-weight: 600; color: var(--text-2); padding: 8px 14px; border-radius: 8px; transition: color .15s; }
    .nav-link:hover { color: var(--text); }
    .btn-cta { background: var(--lime); color: #000; padding: 9px 18px; border-radius: 99px; font-size: 13px; font-weight: 800; letter-spacing: .02em; transition: transform .15s, box-shadow .15s; }
    .btn-cta:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(196,240,0,.3); }

    /* ---------- Hero ---------- */
    .hero { position: relative; z-index: 2; min-height: calc(100vh - 60px); display: flex; flex-direction: column; justify-content: center; padding: 80px 24px 60px; max-width: 1280px; margin: 0 auto; }
    .hero-tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; background: rgba(196,240,0,.08); border: 1px solid rgba(196,240,0,.2); border-radius: 99px; font-size: 11px; font-weight: 700; color: var(--lime); letter-spacing: .15em; text-transform: uppercase; margin-bottom: 28px; align-self: flex-start; }
    .hero-tag .live-dot { width: 6px; height: 6px; background: var(--lime); border-radius: 50%; }

    .hero-h1 {
      font-family: var(--display);
      font-size: clamp(64px, 12vw, 180px);
      line-height: 0.86;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 28px;
      text-transform: uppercase;
    }
    .hero-h1 span { color: var(--lime); }
    .hero-h1 .accent {
      background: linear-gradient(180deg, var(--lime) 0%, #94c800 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-sub { font-size: clamp(15px, 1.6vw, 19px); color: var(--text-2); max-width: 580px; margin-bottom: 36px; line-height: 1.6; }
    .hero-sub strong { color: var(--text); font-weight: 600; }

    .hero-ctas { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 60px; }
    .btn-primary {
      background: var(--lime); color: #000;
      padding: 16px 28px; border-radius: 99px;
      font-size: 14px; font-weight: 800; letter-spacing: .03em;
      display: inline-flex; align-items: center; gap: 10px;
      transition: transform .15s, box-shadow .2s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 36px rgba(196,240,0,.35); }
    .btn-primary svg { transition: transform .2s; }
    .btn-primary:hover svg { transform: translateX(4px); }
    .btn-secondary {
      background: transparent; color: var(--text);
      padding: 16px 28px; border-radius: 99px;
      border: 1.5px solid var(--border);
      font-size: 14px; font-weight: 700; letter-spacing: .02em;
      display: inline-flex; align-items: center; gap: 10px;
      transition: border-color .15s, background .15s;
    }
    .btn-secondary:hover { border-color: var(--text-2); background: rgba(255,255,255,.02); }

    .hero-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; max-width: 720px; padding-top: 32px; border-top: 1px solid var(--border); }
    .hero-stat-num { font-family: var(--display); font-size: 38px; line-height: 1; color: var(--lime); margin-bottom: 4px; letter-spacing: .01em; }
    .hero-stat-lbl { font-size: 11px; font-weight: 600; color: var(--text-2); letter-spacing: .12em; text-transform: uppercase; }

    /* ---------- Booking section ---------- */
    .section { position: relative; z-index: 2; max-width: 1280px; margin: 0 auto; padding: 80px 24px; }
    .section-head { margin-bottom: 40px; }
    .section-eyebrow { display: inline-block; font-size: 11px; font-weight: 700; color: var(--lime); letter-spacing: .2em; text-transform: uppercase; margin-bottom: 12px; }
    .section-h2 { font-family: var(--display); font-size: clamp(40px, 6.5vw, 76px); line-height: 0.95; letter-spacing: -0.01em; color: var(--text); text-transform: uppercase; margin-bottom: 16px; }
    .section-sub { font-size: 16px; color: var(--text-2); max-width: 620px; line-height: 1.6; }

    .booking-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 36px;
      position: relative;
    }
    .booking-step { margin-bottom: 36px; }
    .booking-step:last-child { margin-bottom: 0; }
    .step-label { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .step-num {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--lime); color: #000;
      font-family: var(--mono); font-size: 12px; font-weight: 700;
      display: grid; place-items: center;
    }
    .step-num.dim { background: var(--border); color: var(--text-2); }
    .step-title { font-family: var(--display); font-size: 22px; letter-spacing: .02em; color: var(--text); text-transform: uppercase; }
    .step-meta { margin-left: auto; font-size: 12px; color: var(--text-2); font-weight: 500; }

    /* Date pills */
    .date-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
    .date-strip::-webkit-scrollbar { height: 4px; }
    .date-pill {
      flex: 0 0 auto; padding: 12px 16px;
      background: var(--bg-alt); border: 1.5px solid var(--border);
      border-radius: 14px;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      min-width: 84px;
      transition: all .15s;
      scroll-snap-align: start;
    }
    .date-pill:hover { border-color: var(--text-3); transform: translateY(-1px); }
    .date-pill.active { background: var(--lime); color: #000; border-color: var(--lime); }
    .date-pill .d-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
    .date-pill.active .d-label { color: #000; }
    .date-pill .d-num { font-family: var(--display); font-size: 26px; line-height: 1; color: var(--text); }
    .date-pill.active .d-num { color: #000; }
    .date-pill .d-wd { font-size: 10px; color: var(--text-3); font-weight: 600; }
    .date-pill.active .d-wd { color: rgba(0,0,0,.5); }

    /* Sport grid */
    .sport-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    @media (max-width: 720px) { .sport-grid { grid-template-columns: repeat(2, 1fr); } }
    .sport-card {
      background: var(--bg-alt); border: 1.5px solid var(--border);
      border-radius: 14px; padding: 18px 16px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      transition: all .15s;
    }
    .sport-card:hover { border-color: var(--text-3); transform: translateY(-2px); }
    .sport-card.active { background: var(--lime); color: #000; border-color: var(--lime); transform: translateY(-2px); }
    .sport-card .ic { font-size: 28px; }
    .sport-card .name { font-family: var(--display); font-size: 16px; letter-spacing: .04em; text-transform: uppercase; }

    /* Slots */
    .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .slot-card {
      background: var(--bg-alt); border: 1.5px solid var(--border);
      border-radius: 16px; padding: 16px 18px;
      transition: all .15s; text-align: left;
    }
    .slot-card:hover { border-color: var(--lime); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(196,240,0,.08); }
    .slot-card.active { background: var(--lime); color: #000; border-color: var(--lime); transform: translateY(-2px); box-shadow: 0 12px 32px rgba(196,240,0,.3); }
    .slot-card .time-row { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
    .slot-time { font-family: var(--display); font-size: 22px; letter-spacing: .02em; color: var(--text); }
    .slot-card.active .slot-time { color: #000; }
    .slot-arrow { font-size: 13px; color: var(--text-3); }
    .slot-card.active .slot-arrow { color: rgba(0,0,0,.5); }
    .slot-price { font-size: 12px; font-weight: 700; color: var(--lime); display: inline-flex; align-items: center; gap: 4px; }
    .slot-card.active .slot-price { color: #000; }
    .slot-status { font-size: 10px; font-weight: 700; color: var(--text-2); letter-spacing: .1em; text-transform: uppercase; margin-top: 6px; display: block; }
    .slot-card.active .slot-status { color: rgba(0,0,0,.6); }

    /* Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
    .form-field { display: block; }
    .form-field.span-2 { grid-column: span 2; }
    @media (max-width: 560px) { .form-field.span-2 { grid-column: span 1; } }
    .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-2); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; }
    .form-input {
      width: 100%; padding: 14px 16px;
      background: var(--bg-alt); border: 1.5px solid var(--border);
      border-radius: 12px; color: var(--text);
      font-size: 15px; font-weight: 500;
      transition: border-color .15s, background .15s;
      outline: none;
    }
    .form-input:focus { border-color: var(--lime); background: var(--bg); }
    .form-input::placeholder { color: var(--text-3); }
    .field-hint { font-size: 11px; color: var(--text-3); margin-top: 6px; }

    /* Returning customer banner */
    .return-banner {
      background: linear-gradient(135deg, rgba(196,240,0,.12) 0%, rgba(196,240,0,.04) 100%);
      border: 1px solid rgba(196,240,0,.3);
      border-radius: 14px; padding: 14px 18px;
      display: flex; align-items: center; gap: 12px;
      grid-column: span 2;
    }
    @media (max-width: 560px) { .return-banner { grid-column: span 1; } }
    .return-emoji { font-size: 26px; }
    .return-text { font-size: 14px; color: var(--text); }
    .return-text strong { color: var(--lime); }
    .return-text .sub { font-size: 12px; color: var(--text-2); display: block; margin-top: 2px; }

    /* Submit btn */
    .submit-row { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
    .btn-submit {
      width: 100%; padding: 18px 28px;
      background: var(--lime); color: #000;
      border-radius: 14px; font-family: var(--display);
      font-size: 18px; letter-spacing: .04em; text-transform: uppercase;
      display: inline-flex; align-items: center; justify-content: center; gap: 12px;
      transition: transform .15s, box-shadow .2s;
    }
    .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(196,240,0,.35); }
    .btn-submit:disabled { background: var(--border); color: var(--text-3); cursor: not-allowed; }
    .submit-note { font-size: 12px; color: var(--text-2); text-align: center; }

    /* Loading / empty states */
    .loading-block { padding: 60px 0; text-align: center; }
    .loading-spinner { display: inline-block; width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--lime); border-radius: 50%; }
    .loading-spinner.small { width: 18px; height: 18px; border-width: 2px; }
    .empty-block { padding: 40px; text-align: center; color: var(--text-2); border: 1.5px dashed var(--border); border-radius: 16px; }
    .empty-block .ic { font-size: 40px; margin-bottom: 12px; }
    .empty-title { font-family: var(--display); font-size: 20px; color: var(--text); letter-spacing: .03em; text-transform: uppercase; margin-bottom: 6px; }

    /* ---------- Ticket / Confirmation ---------- */
    .ticket {
      max-width: 540px; margin: 0 auto;
      background: var(--surface); border: 1.5px solid var(--lime);
      border-radius: 24px; overflow: hidden; position: relative;
      box-shadow: 0 24px 80px rgba(196,240,0,.15);
    }
    .ticket-head {
      padding: 36px 32px 24px; text-align: center;
      background: linear-gradient(180deg, rgba(196,240,0,.06) 0%, transparent 100%);
    }
    .ticket-check {
      width: 64px; height: 64px; border-radius: 50%;
      background: var(--lime); color: #000;
      display: inline-grid; place-items: center; font-size: 32px;
      margin-bottom: 20px;
      box-shadow: 0 0 0 8px rgba(196,240,0,.15);
    }
    .ticket-title { font-family: var(--display); font-size: 32px; letter-spacing: .02em; text-transform: uppercase; margin-bottom: 6px; }
    .ticket-sub { font-size: 13px; color: var(--text-2); }

    .ticket-divider {
      position: relative; height: 36px; padding: 0 32px;
      display: flex; align-items: center;
    }
    .ticket-divider::before, .ticket-divider::after {
      content: ''; position: absolute;
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--bg); border: 1.5px solid var(--lime);
      top: 50%; transform: translateY(-50%);
    }
    .ticket-divider::before { left: -12px; }
    .ticket-divider::after { right: -12px; }
    .ticket-divider .dash { flex: 1; border-top: 1.5px dashed var(--border); }

    .ticket-body { padding: 8px 32px 32px; }
    .ticket-row { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .ticket-row:last-child { border-bottom: none; }
    .ticket-label { font-size: 10px; color: var(--text-2); letter-spacing: .15em; text-transform: uppercase; font-weight: 700; }
    .ticket-value { font-size: 16px; color: var(--text); font-weight: 600; }
    .ticket-value.mono { font-family: var(--mono); font-size: 14px; }
    .ticket-value.big { font-family: var(--display); font-size: 24px; letter-spacing: .02em; }

    .ticket-actions {
      padding: 0 32px 32px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .ticket-btn {
      padding: 12px; border-radius: 10px;
      background: var(--bg-alt); border: 1px solid var(--border);
      font-size: 12px; font-weight: 700; color: var(--text);
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      transition: all .15s;
    }
    .ticket-btn:hover { background: var(--surface-2); border-color: var(--text-3); }
    .ticket-pay-note {
      margin: 16px 32px 0;
      background: rgba(196,240,0,.06); border: 1px solid rgba(196,240,0,.2);
      border-radius: 12px; padding: 14px 16px;
      font-size: 13px; color: var(--lime-soft);
      display: flex; gap: 10px; align-items: flex-start;
    }
    .ticket-pay-note strong { color: var(--lime); display: block; margin-bottom: 2px; }

    /* ---------- Features grid ---------- */
    .features { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    @media (max-width: 900px) { .features { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .features { grid-template-columns: 1fr; } }
    .feat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 24px 22px;
      transition: border-color .15s, transform .15s;
    }
    .feat-card:hover { border-color: var(--lime); transform: translateY(-3px); }
    .feat-ic {
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(196,240,0,.1); border: 1px solid rgba(196,240,0,.2);
      color: var(--lime);
      display: grid; place-items: center; font-size: 20px;
      margin-bottom: 16px;
    }
    .feat-title { font-family: var(--display); font-size: 18px; letter-spacing: .03em; text-transform: uppercase; margin-bottom: 8px; }
    .feat-text { font-size: 13px; color: var(--text-2); line-height: 1.6; }

    /* ---------- Team/Pass callout ---------- */
    .pass-callout {
      background: linear-gradient(135deg, var(--surface) 0%, var(--surface-2) 100%);
      border: 1.5px solid var(--border); border-radius: 28px;
      padding: 48px; overflow: hidden; position: relative;
    }
    .pass-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 36px; align-items: center; }
    @media (max-width: 800px) { .pass-grid { grid-template-columns: 1fr; } }
    .pass-content h3 { font-family: var(--display); font-size: clamp(32px, 4.5vw, 52px); letter-spacing: -.01em; text-transform: uppercase; line-height: 1; margin-bottom: 16px; }
    .pass-content h3 .lime { color: var(--lime); }
    .pass-content p { font-size: 15px; color: var(--text-2); margin-bottom: 24px; line-height: 1.6; }
    .pass-plans { display: grid; gap: 10px; }
    .pass-plan {
      background: var(--bg-alt); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 18px;
      display: flex; justify-content: space-between; align-items: center;
      transition: border-color .15s;
    }
    .pass-plan:hover { border-color: var(--lime); }
    .pp-label { font-family: var(--display); font-size: 17px; letter-spacing: .04em; text-transform: uppercase; }
    .pp-meta { font-size: 11px; color: var(--text-2); margin-top: 2px; letter-spacing: .04em; }
    .pp-price { font-family: var(--display); font-size: 22px; color: var(--lime); letter-spacing: .02em; }

    /* ---------- Venue ---------- */
    .venue-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 36px; align-items: center; }
    @media (max-width: 800px) { .venue-grid { grid-template-columns: 1fr; } }
    .venue-stat { display: flex; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--border); }
    .venue-stat:last-child { border-bottom: none; }
    .venue-stat .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--surface); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
    .venue-stat-label { font-size: 11px; color: var(--text-2); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
    .venue-stat-val { font-size: 15px; color: var(--text); font-weight: 500; }

    /* ---------- Footer ---------- */
    .footer { border-top: 1px solid var(--border); padding: 40px 24px; margin-top: 40px; position: relative; z-index: 2; }
    .footer-inner { max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px; }
    .footer-copy { font-size: 12px; color: var(--text-3); }

    /* ---------- Toast / errors ---------- */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--surface); border: 1px solid var(--border);
      padding: 14px 22px; border-radius: 99px;
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 14px; font-weight: 500;
      z-index: 100;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }
    .toast.err { border-color: var(--danger); background: rgba(239,68,68,.1); color: #fca5a5; }

    /* ---------- Config error ---------- */
    .config-err { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .config-err-box { max-width: 520px; }
    .config-err code { font-family: var(--mono); color: var(--lime); }
    .config-err pre { background: var(--surface); padding: 14px 16px; border-radius: 10px; font-size: 12px; color: var(--lime); border: 1px solid var(--border); overflow-x: auto; margin: 14px 0; font-family: var(--mono); }

    /* ---------- Misc ---------- */
    .lime { color: var(--lime); }
    .mono { font-family: var(--mono); }
    .hidden { display: none; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ═══════════════════════════════════════════
   CONFIG — paste your Apps Script Web App URL
═══════════════════════════════════════════ */
const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

const VENUE = {
  name:    "Hit N Run Sports Arena",
  city:    "Pune",
  address: "Hit N Run Sports Arena, [your full address], Pune",
  phone:   "+91 98765 43210",
  whatsapp:"919876543210",
  maps:    "https://maps.google.com/?q=Hit+N+Run+Sports+Arena",
  hours:   "Mon–Fri 8 AM – 4:30 PM · Sat–Sun 6 AM – 11:30 PM",
  email:   "hello@hitnrun.example"
};

/* ═══════════════════════════════════════════
   API CLIENT (public only)
═══════════════════════════════════════════ */
const API = {
  async get(action, params = {}) {
    const qs = new URLSearchParams({ action, ...params }).toString();
    const res = await fetch(API_URL + '?' + qs);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Request failed');
    return data.data;
  },
  async post(action, body = {}) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...body })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Request failed');
    return data.data;
  }
};

/* ═══════════════════════════════════════════
   CONSTANTS
═══════════════════════════════════════════ */
const SPORTS = [
  { key: "Cricket",              icon: "🏏" },
  { key: "Football",             icon: "⚽" },
  { key: "Cricket Net Practice", icon: "🥅" }
];

const PASS_PLANS = [
  { key: "weekly",    label: "Weekly Pass",    price: 4999,  days: 7  },
  { key: "monthly",   label: "Monthly Pass",   price: 14999, days: 30 },
  { key: "quarterly", label: "Quarterly Pass", price: 39999, days: 90 },
];

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function formatDateISO(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function dateLong(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function dateNice(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
}

function getNext15Days() {
  const today = new Date();
  return Array.from({ length: 15 }, (_, i) => {
    const d = new Date(today);
    d.setDate(d.getDate() + i);
    const iso = formatDateISO(d);
    let label = '';
    if (i === 0) label = 'Today';
    else if (i === 1) label = 'Tomorrow';
    else label = d.toLocaleDateString('en-IN', { month: 'short' });
    return {
      iso,
      label,
      day: d.getDate(),
      weekday: d.toLocaleDateString('en-IN', { weekday: 'short' })
    };
  });
}

function normalizePhone(p) {
  if (!p) return '';
  return String(p).replace(/\D/g, '').slice(-10);
}

function isValidEmail(e) {
  if (!e) return true; // optional
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
}

function buildCalendarLink(b) {
  // ICS format start: 20260525T060000
  const [startTime, endTime] = b.slot_time.split('-').map(s => s.trim().replace(':', ''));
  const dateStr = b.booking_date.replace(/-/g, '');
  const start = `${dateStr}T${startTime}00`;
  const end = `${dateStr}T${endTime}00`;
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: `${b.sport} at ${VENUE.name}`,
    dates: `${start}/${end}`,
    details: `Booking ID: ${b.booking_id}\nPay ₹${b.amount} at venue.\n\n${VENUE.address}`,
    location: VENUE.address,
    ctz: 'Asia/Kolkata'
  });
  return 'https://calendar.google.com/calendar/render?' + params.toString();
}

function buildShareText(b) {
  return `🏏 Booked at ${VENUE.name}!\n\n📅 ${dateLong(b.booking_date)}\n⏰ ${b.slot_time}\n🎯 ${b.sport}\n\nBooking ID: ${b.booking_id}`;
}

/* ═══════════════════════════════════════════
   COMPONENTS
═══════════════════════════════════════════ */

function Spinner({ small }) {
  return <span className={`loading-spinner ${small ? 'small' : ''} spin`} />;
}

function Toast({ toast, onClose }) {
  useEffect(() => {
    if (!toast?.show) return;
    const t = setTimeout(onClose, 4000);
    return () => clearTimeout(t);
  }, [toast?.show]);
  if (!toast?.show) return null;
  return (
    <div className={`toast anim-fade ${toast.isError ? 'err' : ''}`}>
      <span>{toast.icon || (toast.isError ? '⚠️' : '✓')}</span>
      <span>{toast.message}</span>
    </div>
  );
}

function ConfigError() {
  return (
    <div className="config-err">
      <div className="config-err-box">
        <div style={{ fontSize: 48, marginBottom: 16 }}>⚙️</div>
        <div style={{ fontFamily: 'var(--display)', fontSize: 28, letterSpacing: '.02em', textTransform: 'uppercase', marginBottom: 12 }}>Setup required</div>
        <div style={{ fontSize: 14, color: 'var(--text-2)', lineHeight: 1.7 }}>
          This booking page needs your Google Apps Script Web App URL before it can connect to the backend.
          Open the HTML file, find this line near the top:
        </div>
        <pre>{`const API_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";`}</pre>
        <div style={{ fontSize: 13, color: 'var(--text-2)', lineHeight: 1.7 }}>
          Replace it with your live URL (looks like<br />
          <code style={{ color: 'var(--lime)' }}>https://script.google.com/macros/s/AKfycb.../exec</code>)<br />
          and refresh.
        </div>
      </div>
    </div>
  );
}

/* ─── Nav ─── */
function Nav() {
  const scrollToBooking = () => {
    const el = document.getElementById('book');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  return (
    <nav className="nav">
      <div className="nav-inner">
        <a href="#" className="logo" onClick={(e) => { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>
          <span className="logo-mark">🏏</span>
          <span className="logo-text">{VENUE.name.split(' ').slice(0, 3).join(' ')}<small>{VENUE.city}</small></span>
        </a>
        <div className="nav-cta">
          <a className="nav-link" href={`tel:${VENUE.phone.replace(/\s/g,'')}`}>📞 {VENUE.phone}</a>
          <button className="btn-cta" onClick={scrollToBooking}>Book Slot</button>
        </div>
      </div>
    </nav>
  );
}

/* ─── Hero ─── */
function Hero({ liveSlotsToday }) {
  const scrollToBooking = () => {
    const el = document.getElementById('book');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  return (
    <section className="hero">
      <div className="hero-tag anim-rise">
        <span className="live-dot"></span>
        <span>Live availability · {VENUE.city}</span>
      </div>

      <h1 className="hero-h1 anim-rise" style={{ animationDelay: '.05s' }}>
        Book your<br />
        <span className="accent">ground.</span>
      </h1>

      <p className="hero-sub anim-rise" style={{ animationDelay: '.15s' }}>
        Pune's premier multi-sport turf. <strong>Cricket, Football, and dedicated net practice.</strong> Open every day —
        weekdays 8 AM to 4:30 PM, weekends 6 AM to 11:30 PM. No advance payment. No fuss.
      </p>

      <div className="hero-ctas anim-rise" style={{ animationDelay: '.25s' }}>
        <button className="btn-primary" onClick={scrollToBooking}>
          Book a slot
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
            <line x1="5" y1="12" x2="19" y2="12" /><polyline points="12 5 19 12 12 19" />
          </svg>
        </button>
        <a className="btn-secondary" href={`tel:${VENUE.phone.replace(/\s/g,'')}`}>
          <span>📞</span> Call us
        </a>
      </div>

      <div className="hero-stats anim-rise" style={{ animationDelay: '.4s' }}>
        <div>
          <div className="hero-stat-num">
            {liveSlotsToday === null ? <span className="shimmer" style={{ display: 'inline-block', width: 60, height: 38, borderRadius: 6 }}></span> : liveSlotsToday}
          </div>
          <div className="hero-stat-lbl">Slots open today</div>
        </div>
        <div>
          <div className="hero-stat-num">3</div>
          <div className="hero-stat-lbl">Sports available</div>
        </div>
        <div>
          <div className="hero-stat-num">15</div>
          <div className="hero-stat-lbl">Day booking window</div>
        </div>
        <div>
          <div className="hero-stat-num">365</div>
          <div className="hero-stat-lbl">Days open per year</div>
        </div>
      </div>
    </section>
  );
}

/* ─── Booking widget ─── */
function BookingWidget({ onComplete }) {
  const next15 = useMemo(() => getNext15Days(), []);
  const [selectedDate, setSelectedDate] = useState(next15[0].iso);
  const [selectedSport, setSelectedSport] = useState(null);
  const [slots, setSlots] = useState([]);
  const [selectedSlot, setSelectedSlot] = useState(null);
  const [loadingSlots, setLoadingSlots] = useState(false);
  const [form, setForm] = useState({ name: '', phone: '', email: '', members: 1, notes: '' });
  const [returningInfo, setReturningInfo] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState(null);

  // Fetch slots when date or sport changes
  useEffect(() => {
    if (!selectedSport) {
      setSlots([]);
      return;
    }
    let cancelled = false;
    (async () => {
      setLoadingSlots(true);
      setSelectedSlot(null);
      try {
        const data = await API.get('getSlots', { date: selectedDate, sport: selectedSport });
        if (!cancelled) setSlots(data || []);
      } catch (e) {
        if (!cancelled) {
          setError(e.message);
          setSlots([]);
        }
      } finally {
        if (!cancelled) setLoadingSlots(false);
      }
    })();
    return () => { cancelled = true; };
  }, [selectedDate, selectedSport]);

  // Returning customer detection on phone change
  useEffect(() => {
    const phone = normalizePhone(form.phone);
    if (phone.length !== 10) {
      if (returningInfo) setReturningInfo(null);
      return;
    }
    let cancelled = false;
    const t = setTimeout(async () => {
      try {
        const result = await API.get('lookupCustomer', { phone });
        if (cancelled || !result) return;
        if (result.found) {
          setReturningInfo(result);
          setForm(prev => ({
            ...prev,
            name: prev.name || result.customer_name,
            email: prev.email || result.email || ''
          }));
        } else {
          setReturningInfo(null);
        }
      } catch (_) { /* silent */ }
    }, 500);
    return () => { cancelled = true; clearTimeout(t); };
  }, [form.phone]);

  const canBook = selectedSlot && form.name.trim() && normalizePhone(form.phone).length === 10 && isValidEmail(form.email);

  async function submit() {
    if (!canBook || submitting) return;
    setSubmitting(true);
    setError(null);
    try {
      const result = await API.post('createBooking', {
        customer_name: form.name.trim(),
        phone: normalizePhone(form.phone),
        email: form.email.trim() || '',
        sport: selectedSport,
        slot_id: selectedSlot.slot_id,
        members_count: parseInt(form.members, 10) || 1,
        notes: form.notes.trim() || ''
      });
      onComplete({
        ...result,
        booking_date: selectedSlot.slot_date,
        slot_time: selectedSlot.slot_time,
        sport: selectedSport,
        amount: selectedSlot.price,
        members_count: parseInt(form.members, 10) || 1,
        customer_name: form.name.trim(),
        email: form.email.trim()
      });
    } catch (e) {
      setError(e.message);
      setSubmitting(false);
    }
  }

  // step states
  const step3Active = !!selectedSport;
  const step4Active = !!selectedSlot;
  const slotsBySport = useMemo(() => slots.length, [slots]);

  return (
    <section className="section" id="book">
      <div className="section-head">
        <span className="section-eyebrow">Book in 60 seconds</span>
        <h2 className="section-h2">Lock in<br />your slot.</h2>
        <p className="section-sub">No advance payment. Pay at the venue when you arrive. Email confirmation hits your inbox the second you submit.</p>
      </div>

      <div className="booking-card">
        {/* STEP 1: Date */}
        <div className="booking-step">
          <div className="step-label">
            <span className="step-num">1</span>
            <span className="step-title">When are you playing?</span>
            <span className="step-meta">{dateLong(selectedDate)}</span>
          </div>
          <div className="date-strip">
            {next15.map((d, i) => (
              <button
                key={d.iso}
                className={`date-pill ${selectedDate === d.iso ? 'active' : ''}`}
                onClick={() => setSelectedDate(d.iso)}
              >
                <span className="d-label">{d.label}</span>
                <span className="d-num">{d.day}</span>
                <span className="d-wd">{d.weekday}</span>
              </button>
            ))}
          </div>
        </div>

        {/* STEP 2: Sport */}
        <div className="booking-step">
          <div className="step-label">
            <span className="step-num">2</span>
            <span className="step-title">What's the game?</span>
          </div>
          <div className="sport-grid">
            {SPORTS.map(s => (
              <button
                key={s.key}
                className={`sport-card ${selectedSport === s.key ? 'active' : ''}`}
                onClick={() => setSelectedSport(s.key)}
              >
                <span className="ic">{s.icon}</span>
                <span className="name">{s.key}</span>
              </button>
            ))}
          </div>
        </div>

        {/* STEP 3: Slot */}
        <div className="booking-step">
          <div className="step-label">
            <span className={`step-num ${step3Active ? '' : 'dim'}`}>3</span>
            <span className="step-title">Pick your slot</span>
            <span className="step-meta">
              {!selectedSport ? 'Choose a sport first ↑' : loadingSlots ? 'Checking availability…' : `${slotsBySport} available`}
            </span>
          </div>

          {!selectedSport && (
            <div className="empty-block" style={{ padding: '32px' }}>
              <div className="ic">🎯</div>
              <div className="empty-title">Pick a sport above</div>
              <div style={{ fontSize: 13 }}>We'll show you what's open on {dateNice(selectedDate)}</div>
            </div>
          )}

          {selectedSport && loadingSlots && (
            <div className="loading-block">
              <Spinner />
              <div style={{ marginTop: 16, fontSize: 13, color: 'var(--text-2)' }}>Fetching live availability…</div>
            </div>
          )}

          {selectedSport && !loadingSlots && slots.length === 0 && (
            <div className="empty-block">
              <div className="ic">📭</div>
              <div className="empty-title">Fully booked</div>
              <div style={{ fontSize: 13 }}>No slots left for {selectedSport} on {dateNice(selectedDate)}.<br />Try a different day or sport.</div>
            </div>
          )}

          {selectedSport && !loadingSlots && slots.length > 0 && (
            <div className="slots-grid">
              {slots.map(s => {
                const isActive = selectedSlot && selectedSlot.slot_id === s.slot_id;
                const [startT, endT] = s.slot_time.split('-');
                return (
                  <button
                    key={s.slot_id}
                    className={`slot-card ${isActive ? 'active' : ''}`}
                    onClick={() => setSelectedSlot(s)}
                  >
                    <div className="time-row">
                      <span className="slot-time">{startT}</span>
                      <span className="slot-arrow">→</span>
                      <span className="slot-time" style={{ fontSize: 16, opacity: .7 }}>{endT}</span>
                    </div>
                    <div className="slot-price">₹{parseInt(s.price || 0).toLocaleString('en-IN')}</div>
                    <span className="slot-status">{isActive ? 'Selected ✓' : 'Available'}</span>
                  </button>
                );
              })}
            </div>
          )}
        </div>

        {/* STEP 4: Details */}
        {step4Active && (
          <div className="booking-step anim-rise-fast">
            <div className="step-label">
              <span className="step-num">4</span>
              <span className="step-title">Your details</span>
              <span className="step-meta">Almost there.</span>
            </div>

            <div className="form-grid">
              {returningInfo && (
                <div className="return-banner anim-rise-fast">
                  <span className="return-emoji">👋</span>
                  <div className="return-text">
                    <strong>Welcome back, {returningInfo.customer_name}!</strong>
                    <span className="sub">
                      {returningInfo.bookings_count} previous {returningInfo.bookings_count === 1 ? 'booking' : 'bookings'}
                      {returningInfo.last_sport ? ` · Last played ${returningInfo.last_sport}` : ''}
                    </span>
                  </div>
                </div>
              )}

              <div className="form-field">
                <label className="form-label">Phone *</label>
                <input
                  type="tel"
                  className="form-input"
                  value={form.phone}
                  onChange={e => setForm({ ...form, phone: e.target.value })}
                  placeholder="98765 43210"
                  maxLength={15}
                  autoComplete="tel"
                />
                <div className="field-hint">10 digits, with or without country code</div>
              </div>

              <div className="form-field">
                <label className="form-label">Name *</label>
                <input
                  type="text"
                  className="form-input"
                  value={form.name}
                  onChange={e => setForm({ ...form, name: e.target.value })}
                  placeholder="Your full name"
                  autoComplete="name"
                />
              </div>

              <div className="form-field">
                <label className="form-label">Email (for confirmation)</label>
                <input
                  type="email"
                  className="form-input"
                  value={form.email}
                  onChange={e => setForm({ ...form, email: e.target.value })}
                  placeholder="you@example.com"
                  autoComplete="email"
                />
                {!isValidEmail(form.email) && form.email && (
                  <div className="field-hint" style={{ color: 'var(--danger)' }}>Looks like an invalid email</div>
                )}
              </div>

              <div className="form-field">
                <label className="form-label">Players</label>
                <input
                  type="number"
                  className="form-input"
                  value={form.members}
                  onChange={e => setForm({ ...form, members: e.target.value })}
                  min={1}
                  max={30}
                />
              </div>

              <div className="form-field span-2">
                <label className="form-label">Notes (optional)</label>
                <input
                  type="text"
                  className="form-input"
                  value={form.notes}
                  onChange={e => setForm({ ...form, notes: e.target.value })}
                  placeholder="Anything we should know? e.g. team name, special equipment…"
                />
              </div>
            </div>

            <div className="submit-row">
              <button
                className="btn-submit"
                onClick={submit}
                disabled={!canBook || submitting}
              >
                {submitting ? (
                  <><Spinner small /> Booking…</>
                ) : (
                  <>Lock in slot · ₹{parseInt(selectedSlot.price || 0).toLocaleString('en-IN')} <span>→</span></>
                )}
              </button>
              <div className="submit-note">
                💰 Pay at the venue — cash or UPI. Cancel anytime by calling us.
              </div>
              {error && (
                <div style={{ background: 'rgba(239,68,68,.1)', border: '1px solid var(--danger)', borderRadius: 12, padding: '12px 16px', fontSize: 13, color: '#fca5a5' }}>
                  ⚠ {error}
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    </section>
  );
}

/* ─── Confirmation ticket ─── */
function ConfirmationTicket({ booking, onReset }) {

  function copyShare() {

    navigator.clipboard?.writeText(text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    });
  }

  return (
    <section className="section" id="book">
      <div className="section-head" style={{ textAlign: 'center' }}>
        <span className="section-eyebrow">Locked in</span>
        <h2 className="section-h2">You're<br /><span className="lime">on.</span></h2>
      </div>

      <div className="ticket anim-rise">
        <div className="ticket-head">
          <div className="ticket-check pulse-glow">✓</div>
          <div className="ticket-title">Booking confirmed</div>
          <div className="ticket-sub">
            {booking.email ? `Confirmation sent to ${booking.email}` : 'Show this screen at the venue'}
          </div>
        </div>

        <div className="ticket-divider"><span className="dash"></span></div>

        <div className="ticket-body">
          <div className="ticket-row">
            <span className="ticket-label">Booking ID</span>
            <span className="ticket-value mono">{booking.booking_id}</span>
          </div>
          <div className="ticket-row">
            <span className="ticket-label">Sport</span>
            <span className="ticket-value big">{booking.sport}</span>
          </div>
          <div className="ticket-row">
            <span className="ticket-label">Date</span>
            <span className="ticket-value">{dateLong(booking.booking_date)}</span>
          </div>
          <div className="ticket-row">
            <span className="ticket-label">Time</span>
            <span className="ticket-value big" style={{ fontSize: 20 }}>{booking.slot_time}</span>
          </div>
          <div className="ticket-row">
            <span className="ticket-label">Players</span>
            <span className="ticket-value">{booking.members_count}</span>
          </div>
          <div className="ticket-row">
            <span className="ticket-label">Amount</span>
            <span className="ticket-value big lime">₹{parseInt(booking.amount || 0).toLocaleString('en-IN')}</span>
          </div>
        </div>

        <div className="ticket-pay-note">
          <span style={{ fontSize: 18 }}>💰</span>
          <div>
            <strong>Pay at the venue</strong>
            Cash or UPI accepted on arrival. No prepayment needed.
          </div>
        </div>

        <div className="ticket-actions">
          <a className="ticket-btn" href={VENUE.maps} target="_blank" rel="noopener">
            📍 Get directions
          </a>
          <a className="ticket-btn" href={buildCalendarLink(booking)} target="_blank" rel="noopener">
            📅 Add to calendar
          </a>
          <a className="ticket-btn" href={`tel:${VENUE.phone.replace(/\s/g,'')}`}>
            📞 Call venue
          </a>
          <button className="ticket-btn" onClick={copyShare}>
            {copied ? '✓ Copied!' : '📤 Share details'}
          </button>
        </div>
      </div>

      <div style={{ textAlign: 'center', marginTop: 32 }}>
        <button className="btn-secondary" onClick={onReset}>
          Book another slot
        </button>
      </div>
    </section>
  );
}

/* ═══════════════════════════════════════════
   APP
═══════════════════════════════════════════ */
function App() {
  const [booking, setBooking] = useState(null);
  const [liveSlotsToday, setLiveSlotsToday] = useState(null);
  const [toast, setToast] = useState({ show: false });

  // Pre-fetch today's slot count for the hero stat
  useEffect(() => {
    if (API_URL === "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE") return;
    (async () => {
      try {
        const today = formatDateISO(new Date());
        // Count by querying without sport filter (returns slots with no sport restriction)
        // Actually backend filters by sport — without it, returns all available slots
        const data = await API.get('getSlots', { date: today });
        setLiveSlotsToday(data?.length || 0);
      } catch (_) {
        setLiveSlotsToday(0);
      }
    })();
  }, []);

  if (API_URL === "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE") {
    return <ConfigError />;
  }

  function handleBookingComplete(result) {
    setBooking(result);
    setToast({ show: true, message: 'Booking confirmed!', icon: '✓' });
    // Scroll to top of confirmation
    setTimeout(() => {
      const el = document.getElementById('book');
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }

  function reset() {
    setBooking(null);
    // refresh live count
    (async () => {
      try {
        const today = formatDateISO(new Date());
        const data = await API.get('getSlots', { date: today });
        setLiveSlotsToday(data?.length || 0);
      } catch (_) {}
    })();
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }

  return (
    <>
      <div className="stage-bg">
        <div className="orb orb-1"></div>
        <div className="orb orb-2"></div>
        <div className="orb orb-3"></div>
      </div>
      <div className="grain"></div>

      <Nav />
      {!booking && <Hero liveSlotsToday={liveSlotsToday} />}
      {booking
        ? <ConfirmationTicket booking={booking} onReset={reset} />
        : <BookingWidget onComplete={handleBookingComplete} />
      }
      {!booking && (
        <>
          <Features />
          <PassCallout />
          <VenueInfo />
        </>
      )}
      <Footer />

      <Toast toast={toast} onClose={() => setToast({ show: false })} />
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
