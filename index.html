<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060807" />
  <title>Hit N Run Sports Arena · Book your turf in Dehradun</title>
  <meta name="description" content="Dehradun's premier multi-sport arena in Panditwari. Live availability, book online in 60 seconds, open daily. Pay at venue." />
  <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
  <meta property="og:title" content="Hit N Run Sports Arena · Book your turf in Dehradun" />
  <meta property="og:description" content="Dehradun's premier multi-sport arena in Panditwari. Live availability, book online in 60 seconds, open daily. Pay at venue." />
  <meta property="og:image" content="https://hitnrunarena.in/logo.jpeg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

  <style>
    :root {
      /* Floodlight theme — black / logo green / white, red for the ball */
      --bg:#060807; --bg-alt:#0c100d; --surface:#10150f; --surface-2:#161c15;
      --border:#1f2a20; --border-2:#2b3a2c; --text:#f7f8f5; --text-2:#a7b0a6; --text-3:#5d6a5e;
      --lime:#22e05a; --lime-soft:#8af0ad; --lime-dim:#0fa843; --lime-rgb:34,224,90;
      --red:#e63946; --red-rgb:230,57,70;
      --orange:#fbbf24; --success:#22e05a; --danger:#ef4444; --info:#38bdf8;
      --display:'Anton',system-ui,sans-serif; --serif:'Instrument Serif',Georgia,serif; --body:'Outfit',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
      --ease:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
      --r:18px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:var(--body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.5}
    body.locked{overflow:hidden}
    input,textarea,select,button{font-family:var(--body)}
    button{background:none;border:none;cursor:pointer;color:inherit}
    a{color:inherit;text-decoration:none}
    ::selection{background:var(--lime);color:#000}

    ::-webkit-scrollbar{width:6px;height:6px}
    ::-webkit-scrollbar-track{background:var(--bg-alt)}
    ::-webkit-scrollbar-thumb{background:#243126;border-radius:99px}

    /* ── Keyframes ── */
    @keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
    @keyframes risefade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pop{0%{opacity:0;transform:scale(.92) translateY(8px)}100%{opacity:1;transform:none}}
    @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(var(--lime-rgb),.45)}50%{box-shadow:0 0 0 14px rgba(var(--lime-rgb),0)}}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
    @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    @keyframes stripes{from{background-position:0 0}to{background-position:160px 0}}
    @keyframes floodlight{0%,100%{opacity:.55;transform:translateX(-50%) scale(1)}50%{opacity:.8;transform:translateX(-50%) scale(1.06)}}
    @keyframes ballfly{0%{transform:translate(-40px,0) rotate(0)}50%{transform:translate(0,-26px) rotate(180deg)}100%{transform:translate(40px,0) rotate(360deg)}}
    @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}
    @keyframes bob2{0%,100%{transform:translateY(0) rotate(8deg)}50%{transform:translateY(-18px) rotate(-10deg)}}
    @keyframes shine{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(220%) skewX(-18deg)}}
    @keyframes underline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes tick{0%{transform:scale(.4) rotate(-20deg);opacity:0}60%{transform:scale(1.15) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0)}}
    @keyframes loading-bounce{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
    @keyframes pl-ball{0%{transform:translate(-120px,0) rotate(0)}30%{transform:translate(-40px,-52px) rotate(200deg)}55%{transform:translate(20px,0) rotate(380deg)}75%{transform:translate(70px,-22px) rotate(520deg)}100%{transform:translate(130px,0) rotate(720deg)}}
    @keyframes pl-bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes pl-out{to{transform:translateY(-100%);opacity:0}}
    @keyframes pl-text{0%,100%{opacity:.4}50%{opacity:1}}
    @keyframes pl-stump{0%,70%{transform:none}80%{transform:rotate(-12deg) translateX(-2px)}100%{transform:rotate(-30deg) translate(-6px,2px)}}
    @keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}

    .anim-rise{animation:rise .7s var(--ease) both}
    body.locked .anim-rise,body.locked .hero-h1 .accent::after,body.locked .ticker-track{animation-play-state:paused}
    .anim-rise-fast{animation:risefade .4s var(--ease) both}
    .anim-pop{animation:pop .45s var(--spring) both}
    .pulse-glow{animation:glow 2.2s infinite}
    .live-dot{animation:blink 1.4s ease-in-out infinite}
    .spin{animation:spin .9s linear infinite}
    .shimmer{background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite}
    .shake{animation:shake .5s both}

    /* Scroll reveal */
    .reveal{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
    .reveal.in{opacity:1;transform:none}
    .reveal.d1{transition-delay:.08s}.reveal.d2{transition-delay:.16s}.reveal.d3{transition-delay:.24s}.reveal.d4{transition-delay:.32s}

    .loading-dot{width:8px;height:8px;border-radius:50%;background:var(--lime);display:inline-block;animation:loading-bounce 1s ease-in-out infinite;box-shadow:0 0 12px rgba(var(--lime-rgb),.5)}

    /* ── Preloader ── */
    .preloader{position:fixed;inset:0;z-index:1000;background:#050605;display:grid;place-items:center;overflow:hidden}
    .preloader.out{animation:pl-out .7s var(--ease) forwards;pointer-events:none}
    .pl-inner{display:flex;flex-direction:column;align-items:center;gap:22px}
    .pl-logo{width:92px;height:92px;border-radius:22px;object-fit:cover;box-shadow:0 0 0 1px #1c261d,0 30px 80px rgba(var(--lime-rgb),.18)}
    .pl-scene{position:relative;width:300px;height:90px}
    .pl-ground{position:absolute;left:0;right:0;bottom:12px;height:2px;background:linear-gradient(90deg,transparent,var(--lime-dim) 20%,var(--lime) 50%,var(--lime-dim) 80%,transparent)}
    .pl-ball{position:absolute;left:50%;bottom:16px;width:28px;height:28px;margin-left:-14px;animation:pl-ball 1.5s cubic-bezier(.45,0,.55,1) infinite}
    .pl-stumps{position:absolute;right:52px;bottom:14px;display:flex;gap:5px;align-items:flex-end}
    .pl-stumps i{display:block;width:5px;height:40px;background:linear-gradient(#f7f8f5,#b9c0b8);border-radius:3px 3px 0 0;transform-origin:bottom center}
    .pl-stumps i:nth-child(3){animation:pl-stump 1.5s ease-in infinite}
    .pl-bar{width:220px;height:3px;background:#161c17;border-radius:99px;overflow:hidden}
    .pl-bar i{display:block;height:100%;background:var(--lime);transform-origin:left;animation:pl-bar 2.4s var(--ease) forwards}
    .pl-text{font-family:var(--display);font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--text-2);animation:pl-text 1.2s ease-in-out infinite}
    .pl-text b{color:var(--lime)}

    /* ── Stage background ── */
    .stage-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;background:
      radial-gradient(1200px 600px at 50% -200px,rgba(var(--lime-rgb),.16),transparent 60%),
      radial-gradient(800px 500px at 100% 100%,rgba(var(--red-rgb),.07),transparent 60%),
      var(--bg)}
    .flood{position:absolute;top:-340px;left:50%;width:1100px;height:720px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(var(--lime-rgb),.22),rgba(var(--lime-rgb),.06) 55%,transparent 72%);filter:blur(30px);animation:floodlight 9s ease-in-out infinite}
    .pitch{position:absolute;inset:0;background-image:
      linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 70%)}
    .stripes{position:absolute;inset:0;opacity:.06;background:repeating-linear-gradient(-55deg,transparent 0 60px,rgba(var(--lime-rgb),.9) 60px 62px);animation:stripes 6s linear infinite}
    .grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.05;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}

    /* ── Nav ── */
    .nav{position:sticky;top:0;z-index:50;background:rgba(6,8,7,.72);backdrop-filter:blur(20px) saturate(1.3);border-bottom:1px solid rgba(255,255,255,.05)}
    .nav-inner{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .logo{display:flex;align-items:center;gap:10px}
    .logo img{height:46px;width:auto;border-radius:10px;transition:transform .4s var(--spring)}
    .logo:hover img{transform:rotate(-6deg) scale(1.06)}
    .logo-text{font-family:var(--display);font-size:18px;letter-spacing:.04em}
    .logo-text small{font-family:var(--body);font-size:9px;font-weight:600;letter-spacing:.15em;color:var(--text-3);text-transform:uppercase;display:block;margin-top:-3px}
    .nav-cta{display:flex;align-items:center;gap:8px}
    .nav-link{font-size:13px;font-weight:600;color:var(--text-2);padding:8px 14px;border-radius:8px;transition:color .15s}
    .nav-link:hover{color:var(--text)}
    .btn-cta{background:var(--lime);color:#000;padding:9px 18px;border-radius:99px;font-size:13px;font-weight:800;letter-spacing:.02em;transition:transform .2s var(--spring),box-shadow .2s;position:relative;overflow:hidden}
    .btn-cta:hover{transform:translateY(-1px) scale(1.03);box-shadow:0 8px 24px rgba(var(--lime-rgb),.35)}
    .btn-ghost{background:transparent;color:var(--text);padding:8px 14px;border-radius:99px;border:1.5px solid var(--border-2);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,background .15s,transform .2s var(--spring)}
    .btn-ghost:hover{border-color:var(--lime);background:rgba(var(--lime-rgb),.06);transform:translateY(-1px)}
    .btn-ghost .avatar{width:22px;height:22px;border-radius:50%;background:var(--lime);color:#000;display:grid;place-items:center;font-size:11px;font-weight:900}
    @media (max-width:560px){
      .nav-inner{padding:10px 14px}
      .nav-link{display:none}
      .logo-text{font-size:15px}
      .logo img{height:40px}
      .btn-cta{padding:8px 13px;font-size:12px}
      .btn-ghost{padding:7px 11px;font-size:12px}
      .btn-ghost .lbl{display:none}
    }

    /* ── Ticker ── */
    .ticker{position:relative;z-index:2;overflow:hidden;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:rgba(var(--lime-rgb),.05);padding:9px 0;user-select:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
    .ticker-track{display:flex;width:max-content;animation:marquee 28s linear infinite}
    .ticker:hover .ticker-track{animation-play-state:paused}
    .ticker span{font-family:var(--display);font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-2);padding:0 22px;display:inline-flex;align-items:center;gap:22px;white-space:nowrap}
    .ticker span::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}

    /* ── Hero ── */
    @keyframes beam{0%,100%{transform:rotate(-6deg);opacity:.55}50%{transform:rotate(5deg);opacity:.85}}
    @keyframes beam2{0%,100%{transform:rotate(6deg) scaleX(-1);opacity:.45}50%{transform:rotate(-4deg) scaleX(-1);opacity:.75}}
    @keyframes dashflow{to{stroke-dashoffset:-48}}
    @keyframes cue{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(8px);opacity:1}}
    @keyframes barin{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @keyframes wordin{from{opacity:0;transform:translateY(110%) rotate(4deg)}to{opacity:1;transform:none}}
    @keyframes sweep{0%{left:-30%}100%{left:130%}}
    .hero{position:relative;z-index:2;min-height:calc(100vh - 110px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center;padding:64px 24px 56px;max-width:1280px;margin:0 auto}
    .hero-beams{position:absolute;inset:-120px 0 0 0;pointer-events:none;z-index:-1;overflow:visible}
    .beam{position:absolute;top:-60px;width:52vw;height:120vh;max-width:760px;transform-origin:top center;background:conic-gradient(from 180deg at 50% 0%,transparent 165deg,rgba(var(--lime-rgb),.22) 176deg,rgba(255,255,255,.14) 180deg,rgba(var(--lime-rgb),.22) 184deg,transparent 195deg);filter:blur(14px);mix-blend-mode:screen;animation:beam 11s ease-in-out infinite}
    .beam.b1{left:-8vw}
    .beam.b2{right:-8vw;animation:beam2 13s ease-in-out -4s infinite}
    .beam.b3{left:50%;margin-left:-26vw;opacity:.35;animation-duration:17s;animation-delay:-7s;filter:blur(22px)}
    .pitch-lines{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;z-index:-1;opacity:.35;-webkit-mask-image:linear-gradient(180deg,transparent,#000 40%);mask-image:linear-gradient(180deg,transparent,#000 40%)}
    .pitch-lines line,.pitch-lines path{stroke:rgba(var(--lime-rgb),.55);stroke-width:1;fill:none;vector-effect:non-scaling-stroke}
    .pitch-lines .flow{stroke-dasharray:6 18;animation:dashflow 2.4s linear infinite}
    .hero-copy{position:relative}
    .hero-kicker{display:flex;align-items:center;gap:14px;margin-bottom:26px;font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--text-2)}
    .hero-kicker .live{display:inline-flex;align-items:center;gap:7px;color:var(--lime);padding:6px 12px;border:1px solid rgba(var(--lime-rgb),.35);border-radius:99px;background:rgba(var(--lime-rgb),.06)}
    .hero-kicker .live i{width:6px;height:6px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime);animation:blink 1.4s ease-in-out infinite}
    .hero-kicker .rule{flex:0 0 40px;height:1px;background:var(--border-2)}
    .hero-h1{font-family:var(--display);font-size:clamp(56px,8.6vw,132px);line-height:.9;letter-spacing:.005em;text-transform:uppercase;color:var(--text);margin-bottom:28px;font-style:normal;transform:none}
    .hero-h1 .line{display:block;overflow:hidden;padding-bottom:.06em;margin-bottom:-.06em}
    .hero-h1 .line>span{display:inline-block;animation:wordin 1s var(--ease) both}
    .hero-h1 .line:nth-child(2)>span{animation-delay:.12s}
    .hero-h1 .line:nth-child(3)>span{animation-delay:.24s}
    .hero-h1 .serif{font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.01em;color:var(--lime);font-size:1.12em;line-height:.8;padding-right:.1em;background:linear-gradient(180deg,#9dffbd,var(--lime) 55%,var(--lime-dim));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .hero-h1 .dot{color:var(--red);-webkit-text-fill-color:var(--red)}
    .hero-sub{font-size:clamp(15px,1.5vw,18px);color:var(--text-2);max-width:520px;margin-bottom:34px;line-height:1.65;font-weight:300}
    .hero-sub strong{color:var(--text);font-weight:600}
    .hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:46px;align-items:center}
    .btn-primary{position:relative;overflow:hidden;background:var(--lime);color:#000;padding:17px 30px;border-radius:99px;font-size:14px;font-weight:800;letter-spacing:.03em;display:inline-flex;align-items:center;gap:10px;transition:transform .25s var(--spring),box-shadow .2s}
    .btn-primary::after,.btn-submit::after,.btn-cta::after{content:'';position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-120%) skewX(-18deg)}
    .btn-primary:hover::after,.btn-submit:hover:not(:disabled)::after,.btn-cta:hover::after{animation:shine .7s var(--ease)}
    .btn-primary:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 14px 40px rgba(var(--lime-rgb),.38)}
    .btn-primary:active{transform:scale(.98)}
    .btn-primary svg{transition:transform .25s var(--spring)}
    .btn-primary:hover svg{transform:translateX(5px)}
    .btn-secondary{background:transparent;color:var(--text);padding:16px 28px;border-radius:99px;border:1.5px solid var(--border-2);font-size:14px;font-weight:700;letter-spacing:.02em;display:inline-flex;align-items:center;gap:10px;transition:border-color .15s,background .15s,transform .25s var(--spring)}
    .btn-secondary:hover{border-color:var(--text-2);background:rgba(255,255,255,.03);transform:translateY(-1px)}
    .hero-stats{display:flex;gap:0;max-width:640px;border-top:1px solid var(--border);padding-top:22px}
    .hero-stats>div{flex:1;padding-right:22px;position:relative}
    .hero-stats>div+div{padding-left:22px;border-left:1px solid var(--border)}
    .hero-stat-num{font-family:var(--display);font-size:38px;line-height:1;color:var(--text);margin-bottom:6px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
    .hero-stat-num em{font-family:var(--serif);font-style:italic;color:var(--lime);font-size:.7em;margin-left:2px}
    .hero-stat-lbl{font-size:10px;font-weight:700;color:var(--text-3);letter-spacing:.16em;text-transform:uppercase}
    .scroll-cue{position:absolute;left:24px;bottom:-6px;display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--text-3)}
    .scroll-cue i{width:1px;height:34px;background:linear-gradient(var(--lime),transparent);display:block;animation:cue 1.8s ease-in-out infinite}

    /* Tonight's board */
    .board{position:relative;border-radius:26px;padding:1px;background:linear-gradient(160deg,rgba(var(--lime-rgb),.55),rgba(255,255,255,.06) 35%,rgba(255,255,255,.04) 65%,rgba(var(--red-rgb),.35));box-shadow:0 50px 120px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4);animation:pop .9s var(--ease) .35s both;transform-style:preserve-3d}
    .board-in{position:relative;border-radius:25px;background:linear-gradient(180deg,rgba(16,21,15,.92),rgba(8,11,9,.96));backdrop-filter:blur(20px);padding:24px 24px 18px;overflow:hidden}
    .board-in::before{content:'';position:absolute;top:0;left:-30%;width:30%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);transform:skewX(-18deg);animation:sweep 7s ease-in-out 2s infinite}
    .board-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px dashed var(--border-2)}
    .board-title{font-family:var(--display);font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--text)}
    .board-title small{display:block;font-family:var(--body);font-size:10px;letter-spacing:.2em;color:var(--text-3);font-weight:700;margin-top:3px}
    .board-clock{font-family:var(--mono);font-size:13px;color:var(--lime);letter-spacing:.06em;display:flex;align-items:center;gap:8px}
    .board-clock i{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:blink 1.2s ease-in-out infinite}
    .board-row{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:transform .25s var(--spring)}
    .board-row:last-of-type{border-bottom:none}
    .board-row:hover{transform:translateX(4px)}
    .board-row .ic{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--border);display:grid;place-items:center;font-size:17px}
    .board-row .nm{font-family:var(--display);font-size:15px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
    .board-row .pr{font-size:11px;color:var(--text-3);font-weight:600;margin-top:2px}
    .board-row .bar{height:3px;border-radius:99px;background:rgba(255,255,255,.06);margin-top:7px;overflow:hidden;max-width:220px}
    .board-row .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--lime-dim),var(--lime));transform-origin:left;animation:barin 1.2s var(--ease) both}
    .board-row .bar.full i{background:linear-gradient(90deg,#7a2a2a,var(--red))}
    .board-row .ct{text-align:right;font-family:var(--display);font-size:22px;color:var(--lime);line-height:1;font-variant-numeric:tabular-nums}
    .board-row .ct.full{color:var(--text-3);font-size:11px;font-family:var(--body);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    .board-row .ct small{display:block;font-family:var(--body);font-size:9px;letter-spacing:.16em;color:var(--text-3);font-weight:700;margin-top:3px;text-transform:uppercase}
    .board-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px dashed var(--border-2);font-size:11px;color:var(--text-3)}
    .board-foot b{color:var(--text-2);font-weight:700}
    .board-foot a{color:var(--lime);font-weight:800;letter-spacing:.04em}
    .board-skel{height:46px;border-radius:12px;margin:8px 0}
    .board-tag{position:absolute;z-index:3;top:-12px;right:22px;background:var(--red);color:#fff;font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;padding:5px 12px;border-radius:99px;box-shadow:0 10px 24px rgba(var(--red-rgb),.4)}
    @media (max-width:980px){
      .hero{grid-template-columns:1fr;gap:34px;min-height:auto;padding:52px 24px 40px}
      .board{max-width:560px}
      .scroll-cue{display:none}
    }
    @media (max-width:720px){
      .hero{padding:36px 16px 30px}
      .hero-h1{margin-bottom:18px;font-size:clamp(50px,15vw,88px)}
      .hero-sub{margin-bottom:24px;font-size:14px}
      .hero-ctas{margin-bottom:30px}
      .btn-primary,.btn-secondary{padding:13px 22px;font-size:13px}
      .hero-stats{padding-top:18px}
      .hero-stats>div{padding-right:12px}
      .hero-stats>div+div{padding-left:12px}
      .hero-stat-num{font-size:26px}
      .hero-stat-lbl{font-size:9px;letter-spacing:.1em}
      .hero-kicker{margin-bottom:18px;font-size:10px}
      .hero-kicker .rule,.hero-kicker .place{display:none}
      .board-in{padding:18px 16px 14px}
      .beam{width:90vw}
    }

    /* ── Sections ── */
    .section{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:84px 24px}
    @media (max-width:720px){.section{padding:48px 16px} .section-head{margin-bottom:24px!important}}
    .section-head{margin-bottom:40px}
    .section-eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;font-weight:700;color:var(--lime);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
    .section-eyebrow::before{content:'';width:26px;height:2px;background:var(--lime);border-radius:99px}
    .section-h2{font-family:var(--display);font-size:clamp(40px,6.5vw,76px);line-height:.95;letter-spacing:-.01em;color:var(--text);text-transform:uppercase;margin-bottom:16px;font-style:italic}
    .section-sub{font-size:16px;color:var(--text-2);max-width:620px;line-height:1.6}

    /* ── Booking ── */
    .booking-card{background:linear-gradient(180deg,var(--surface),var(--bg-alt));border:1px solid var(--border);border-radius:28px;padding:36px;position:relative;box-shadow:0 40px 120px rgba(0,0,0,.45)}
    .booking-card::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(var(--lime-rgb),.35),transparent 40%,transparent 60%,rgba(var(--red-rgb),.25));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    @media (max-width:720px){
      .booking-card{padding:18px 14px;border-radius:20px}
      .booking-step{margin-bottom:24px!important}
      .step-label{gap:8px!important;margin-bottom:12px!important;flex-wrap:wrap}
      .step-title{font-size:16px!important}
      .step-meta{font-size:11px!important}
    }
    .booking-step{margin-bottom:36px}
    .booking-step:last-child{margin-bottom:0}
    .step-label{display:flex;align-items:center;gap:10px;margin-bottom:18px}
    .step-num{width:28px;height:28px;border-radius:50%;background:var(--lime);color:#000;font-family:var(--mono);font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 4px rgba(var(--lime-rgb),.15)}
    .step-num.dim{background:var(--border);color:var(--text-2);box-shadow:none}
    .step-title{font-family:var(--display);font-size:22px;letter-spacing:.02em;color:var(--text);text-transform:uppercase}
    .step-meta{margin-left:auto;font-size:12px;color:var(--text-2);font-weight:500}

    /* Date pills */
    .date-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
    .date-strip::-webkit-scrollbar{height:4px}
    .date-pill{flex:0 0 auto;padding:12px 16px;background:var(--bg-alt);border:1.5px solid var(--border);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px;transition:transform .25s var(--spring),border-color .15s,background .15s;scroll-snap-align:start}
    .date-pill:hover{border-color:var(--text-3);transform:translateY(-2px)}
    .date-pill.active{background:var(--lime);color:#000;border-color:var(--lime);transform:translateY(-2px) scale(1.04);box-shadow:0 10px 28px rgba(var(--lime-rgb),.3)}
    .date-pill .d-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
    .date-pill.active .d-label{color:#000}
    .date-pill .d-num{font-family:var(--display);font-size:26px;line-height:1;color:var(--text)}
    .date-pill.active .d-num{color:#000}
    .date-pill .d-wd{font-size:10px;color:var(--text-3);font-weight:600}
    .date-pill.active .d-wd{color:rgba(0,0,0,.55)}
    @media (max-width:720px){
      .date-pill{min-width:64px;padding:9px 11px;border-radius:11px}
      .date-pill .d-label{font-size:9px}
      .date-pill .d-num{font-size:20px}
      .date-pill .d-wd{font-size:9px}
    }

    /* Sport selector */
    .sport-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    @media (max-width:560px){.sport-grid{grid-template-columns:1fr;gap:8px}}
    .sport-card{position:relative;overflow:hidden;background:var(--bg-alt);border:1.5px solid var(--border);border-radius:16px;padding:18px 16px;display:flex;align-items:center;gap:14px;transition:transform .3s var(--spring),border-color .15s,background .2s,box-shadow .2s;text-align:left}
    .sport-card:hover{border-color:var(--lime-dim);transform:translateY(-3px)}
    .sport-card:hover .ic{transform:scale(1.2) rotate(-10deg)}
    .sport-card.active{background:linear-gradient(135deg,var(--lime),var(--lime-dim));color:#000;border-color:var(--lime);transform:translateY(-3px);box-shadow:0 16px 40px rgba(var(--lime-rgb),.28)}
    .sport-card.active::after{content:'';position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shine .9s var(--ease)}
    .sport-card .ic{font-size:30px;flex-shrink:0;transition:transform .35s var(--spring)}
    .sport-card-text{flex:1;min-width:0}
    .sport-card .name{font-family:var(--display);font-size:17px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
    .sport-card .price{font-size:11px;color:var(--text-2);font-weight:600;margin-top:3px}
    .sport-card.active .price{color:rgba(0,0,0,.62)}

    /* Slots */
    .slots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
    @media (max-width:720px){.slots-grid{grid-template-columns:repeat(3,1fr);gap:7px}}
    @media (max-width:380px){.slots-grid{grid-template-columns:repeat(2,1fr)}}
    .slot-card{background:var(--bg-alt);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;transition:transform .3s var(--spring),border-color .15s,background .2s,box-shadow .2s;text-align:left;animation:pop .45s var(--spring) both}
    @media (max-width:720px){.slot-card{padding:11px 9px;border-radius:11px}}
    .slot-card:hover{border-color:var(--lime);transform:translateY(-3px);box-shadow:0 10px 26px rgba(var(--lime-rgb),.1)}
    .slot-card.active{background:var(--lime);color:#000;border-color:var(--lime);transform:translateY(-3px) scale(1.03);box-shadow:0 14px 36px rgba(var(--lime-rgb),.35)}
    .slot-card .time-row{display:flex;align-items:baseline;gap:6px;margin-bottom:6px;flex-wrap:wrap}
    .slot-time{font-family:var(--display);font-size:21px;letter-spacing:.02em;color:var(--text)}
    .slot-time.end{font-size:14px;opacity:.7}
    .slot-card.active .slot-time{color:#000}
    .slot-arrow{font-size:11px;color:var(--text-3)}
    .slot-card.active .slot-arrow{color:rgba(0,0,0,.5)}
    .slot-price{font-size:12px;font-weight:700;color:var(--lime);display:inline-flex;align-items:center;gap:4px}
    .slot-card.active .slot-price{color:#000}
    .slot-meta{font-size:10px;font-weight:700;color:var(--text-2);letter-spacing:.08em;text-transform:uppercase;margin-top:5px}
    .slot-card.active .slot-meta{color:rgba(0,0,0,.6)}
    @media (max-width:720px){.slot-time{font-size:16px}.slot-time.end{font-size:12px}.slot-price{font-size:11px}.slot-meta{font-size:9px}}

    /* Duration picker */
    .duration-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px}
    .duration-card{background:var(--bg-alt);border:1.5px solid var(--border);border-radius:14px;padding:16px 14px;transition:transform .3s var(--spring),border-color .15s,background .2s;text-align:center;cursor:pointer;color:var(--text)}
    .duration-card:hover:not(.disabled){border-color:var(--lime);transform:translateY(-3px)}
    .duration-card.active{background:var(--lime);color:#000;border-color:var(--lime);transform:translateY(-3px) scale(1.03);box-shadow:0 14px 36px rgba(var(--lime-rgb),.3)}
    .duration-card.disabled{opacity:.35;cursor:not-allowed;background:transparent}
    .dur-h{font-family:var(--display);font-size:20px;letter-spacing:.02em;margin-bottom:4px}
    .dur-price{font-size:13px;font-weight:700;color:var(--lime)}
    .duration-card.active .dur-price{color:#000}
    .dur-sub{font-size:10px;font-weight:700;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
    @media (max-width:720px){.dur-h{font-size:16px}.dur-price{font-size:11px}}

    /* Form */
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    @media (max-width:560px){.form-grid{grid-template-columns:1fr}}
    .form-field.span-2{grid-column:span 2}
    @media (max-width:560px){.form-field.span-2{grid-column:span 1}}
    .form-label{display:block;font-size:11px;font-weight:700;color:var(--text-2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
    .form-input{width:100%;padding:14px 16px;background:var(--bg-alt);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-weight:500;transition:border-color .15s,background .15s,box-shadow .15s;outline:none}
    .form-input:focus{border-color:var(--lime);background:var(--bg);box-shadow:0 0 0 4px rgba(var(--lime-rgb),.12)}
    .form-input::placeholder{color:var(--text-3)}
    .field-hint{font-size:11px;color:var(--text-3);margin-top:6px}

    /* Returning / pass banners */
    .return-banner{background:linear-gradient(135deg,rgba(var(--lime-rgb),.14) 0%,rgba(var(--lime-rgb),.04) 100%);border:1px solid rgba(var(--lime-rgb),.3);border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px;grid-column:span 2}
    @media (max-width:560px){.return-banner{grid-column:span 1}}
    .return-emoji{font-size:26px}
    .return-text{font-size:14px;color:var(--text)}
    .return-text strong{color:var(--lime)}
    .return-text .sub{font-size:12px;color:var(--text-2);display:block;margin-top:2px}
    .pass-box{grid-column:1/-1;position:relative;overflow:hidden;background:linear-gradient(135deg,#0d2a16,#0a1a10);border:1.5px solid rgba(var(--lime-rgb),.5);border-radius:16px;padding:18px 20px;margin-top:4px;display:flex;gap:14px;align-items:center}
    .pass-box::after{content:'';position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);animation:shine 1.4s var(--ease)}
    .pass-box .ic{font-size:30px}
    .pass-box strong{display:block;color:var(--lime);font-family:var(--display);font-size:20px;letter-spacing:.03em;text-transform:uppercase}
    .pass-box span{font-size:13px;color:var(--text-2)}

    /* Submit */
    .submit-row{margin-top:24px;display:flex;flex-direction:column;gap:10px}
    .btn-submit{position:relative;overflow:hidden;width:100%;padding:18px 28px;background:var(--lime);color:#000;border-radius:14px;font-family:var(--display);font-size:18px;letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:12px;transition:transform .25s var(--spring),box-shadow .2s}
    .btn-submit:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 18px 44px rgba(var(--lime-rgb),.38)}
    .btn-submit:active:not(:disabled){transform:scale(.99)}
    .btn-submit:disabled{background:var(--border);color:var(--text-3);cursor:not-allowed}
    .submit-note{font-size:12px;color:var(--text-2);text-align:center}

    /* Loading */
    .loading-block{padding:50px 0;text-align:center}
    .loading-spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--lime);border-right-color:var(--red);border-radius:50%}
    .loading-spinner.small{width:18px;height:18px;border-width:2px}
    .empty-block{padding:40px;text-align:center;color:var(--text-2);border:1.5px dashed var(--border-2);border-radius:16px}
    .empty-block .ic{font-size:38px;margin-bottom:10px}
    .empty-title{font-family:var(--display);font-size:20px;color:var(--text);letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px}

    /* Ticket */
    .ticket{max-width:540px;margin:0 auto;background:var(--surface);border:1.5px solid var(--lime);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 30px 90px rgba(var(--lime-rgb),.16)}
    .ticket-head{padding:36px 32px 24px;text-align:center;background:linear-gradient(180deg,rgba(var(--lime-rgb),.08) 0%,transparent 100%)}
    .ticket-check{width:68px;height:68px;border-radius:50%;background:var(--lime);color:#000;display:inline-grid;place-items:center;font-size:34px;margin-bottom:20px;box-shadow:0 0 0 8px rgba(var(--lime-rgb),.15);animation:tick .7s var(--spring) both}
    .ticket-title{font-family:var(--display);font-size:32px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:6px}
    .ticket-sub{font-size:13px;color:var(--text-2)}
    .ticket-divider{position:relative;height:36px;padding:0 32px;display:flex;align-items:center}
    .ticket-divider::before,.ticket-divider::after{content:'';position:absolute;width:24px;height:24px;border-radius:50%;background:var(--bg);border:1.5px solid var(--lime);top:50%;transform:translateY(-50%)}
    .ticket-divider::before{left:-12px}
    .ticket-divider::after{right:-12px}
    .ticket-divider .dash{flex:1;border-top:1.5px dashed var(--border-2)}
    .ticket-body{padding:8px 32px 32px}
    .ticket-row{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--border);gap:12px}
    .ticket-row:last-child{border-bottom:none}
    .ticket-label{font-size:10px;color:var(--text-2);letter-spacing:.15em;text-transform:uppercase;font-weight:700}
    .ticket-value{font-size:16px;color:var(--text);font-weight:600;text-align:right}
    .ticket-value.mono{font-family:var(--mono);font-size:14px}
    .ticket-value.big{font-family:var(--display);font-size:24px;letter-spacing:.02em}
    .ticket-actions{padding:0 32px 32px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .ticket-btn{padding:12px;border-radius:10px;background:var(--bg-alt);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .2s var(--spring)}
    .ticket-btn:hover{background:var(--surface-2);border-color:var(--lime-dim);transform:translateY(-2px)}
    .ticket-pay-note{margin:16px 32px 0;background:rgba(var(--lime-rgb),.06);border:1px solid rgba(var(--lime-rgb),.22);border-radius:12px;padding:14px 16px;font-size:13px;color:var(--lime-soft);display:flex;gap:10px;align-items:flex-start}
    .ticket-pay-note strong{color:var(--lime);display:block;margin-bottom:2px}

    /* Features */
    .features{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    @media (max-width:900px){.features{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:480px){.features{grid-template-columns:1fr}}
    .feat-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px 22px;transition:border-color .2s,transform .3s var(--spring),box-shadow .3s;overflow:hidden}
    .feat-card::before{content:'';position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--lime-rgb),.22),transparent);opacity:0;transition:opacity .3s}
    .feat-card:hover{border-color:var(--lime-dim);transform:translateY(-5px);box-shadow:0 24px 60px rgba(0,0,0,.4)}
    .feat-card:hover::before{opacity:1}
    .feat-ic{width:46px;height:46px;border-radius:13px;background:rgba(var(--lime-rgb),.1);border:1px solid rgba(var(--lime-rgb),.22);color:var(--lime);display:grid;place-items:center;font-size:21px;margin-bottom:16px;transition:transform .35s var(--spring)}
    .feat-card:hover .feat-ic{transform:rotate(-8deg) scale(1.1)}
    .feat-title{font-family:var(--display);font-size:18px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px}
    .feat-text{font-size:13px;color:var(--text-2);line-height:1.6}

    /* Pricing */
    .price-callout{background:linear-gradient(135deg,var(--surface) 0%,var(--surface-2) 100%);border:1.5px solid var(--border);border-radius:28px;padding:48px;overflow:hidden;position:relative}
    .price-callout::after{content:'';position:absolute;right:-120px;top:-120px;width:360px;height:360px;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--lime-rgb),.16),transparent);pointer-events:none}
    @media (max-width:720px){.price-callout{padding:28px 20px;border-radius:20px}}
    .price-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;position:relative}
    @media (max-width:720px){.price-grid{grid-template-columns:1fr;gap:14px}}
    .price-tile{background:var(--bg-alt);border:1.5px solid var(--border);border-radius:18px;padding:24px 24px;transition:transform .3s var(--spring),border-color .2s}
    .price-tile:hover{transform:translateY(-4px);border-color:var(--lime-dim)}
    .price-tile-tag{display:inline-block;font-size:10px;font-weight:700;color:var(--lime);letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}
    .price-tile-title{font-family:var(--display);font-size:24px;letter-spacing:.02em;text-transform:uppercase;margin-bottom:10px}
    .price-tile-big{font-family:var(--display);font-size:48px;line-height:1;color:var(--lime);margin-bottom:6px}
    .price-tile-meta{font-size:13px;color:var(--text-2);margin-bottom:14px}

    /* Venue */
    .venue-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center}
    @media (max-width:800px){.venue-grid{grid-template-columns:1fr}}
    .venue-stat{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--border)}
    .venue-stat:last-child{border-bottom:none}
    .venue-stat .ic{width:40px;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-size:18px;flex-shrink:0}
    .venue-stat-label{font-size:11px;color:var(--text-2);letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:4px}
    .venue-stat-val{font-size:15px;color:var(--text);font-weight:500}
    .venue-stat-val a{color:var(--lime)}

    /* Footer */
    .footer{border-top:1px solid var(--border);padding:40px 24px;margin-top:40px;position:relative;z-index:2}
    .footer-inner{max-width:1280px;margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
    .footer-copy{font-size:12px;color:var(--text-3)}

    /* Toast */

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const API_URL = "https://hitnrun-api.vercel.app/api";

const VENUE = {
  name:    "Hit N Run Sports Arena",
  city:    "Dehradun",
  area:    "Panditwari",
  address: "Hit N Run Sports Arena, Panditwari, Dehradun, Uttarakhand 248007",
  phone:   "+91 82733 95003",
  whatsapp:"918273395003",
  maps:    "https://maps.app.goo.gl/N9pPgv9PESbgRMFY7",
  hoursWeek: "Mon–Fri 8 AM – 4 PM and 6 PM – 11 PM",
  hoursWeekend: "Sat–Sun 6 AM – 11 PM",
  email:   "contact@hitnrunarena.in",
  website: "hitnrunarena.in"
};

const API = {
  async get(action, params = {}) {
    const qs = new URLSearchParams({ action, ...params }).toString();
    const res = await fetch(API_URL + '?' + qs);
    return unwrap(await res.json());
  },
  async post(action, body = {}) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...body })
    });
    return unwrap(await res.json());
  }
};

function unwrap(data){
  if (data.ok) return data.data;
  const e = new Error(data.error || 'Request failed');
  e.code = data.code;  // SLOT_TAKEN, SPORT_FULL, … (see API_CONTRACT.md)
  throw e;
}

// getAvailability cache: date -> Promise. One call returns every public sport for that date.
const availCache = {};
function loadAvailability(date, fresh){
  if (fresh || !availCache[date]) {
    const p = API.get('getAvailability', { date });
    availCache[date] = p;
    p.catch(() => { if (availCache[date] === p) delete availCache[date]; });
  }
  return availCache[date];
}
function clearAvailabilityCache(){ Object.keys(availCache).forEach(k => delete availCache[k]); }

function formatDateISO(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function dateLong(iso){ if(!iso) return ''; return new Date(iso+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function dateNice(iso){ if(!iso) return ''; return new Date(iso+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}); }
function getNext15Days(){
  const t=new Date();
  return Array.from({length:15},(_,i)=>{
    const d=new Date(t); d.setDate(d.getDate()+i);
    let label = i===0 ? 'Today' : i===1 ? 'Tomorrow' : d.toLocaleDateString('en-IN',{month:'short'});
    return { iso: formatDateISO(d), label, day: d.getDate(), weekday: d.toLocaleDateString('en-IN',{weekday:'short'}) };
  });
}
function normalizePhone(p){ if(!p) return ''; return String(p).replace(/\D/g,'').slice(-10); }
function isValidEmail(e){ if(!e) return false; return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }
function buildCalendarLink(b){
  const [s,e]=b.slot_time.split('-').map(s=>s.trim().replace(':',''));
  const date=b.booking_date.replace(/-/g,'');
  const params = new URLSearchParams({
    action:'TEMPLATE',
    text:`${b.sport_name} at ${VENUE.name}`,
    dates:`${date}T${s}00/${date}T${e}00`,
    details:`Booking ID: ${b.booking_id}\n${Number(b.balance_due ?? b.amount) > 0 ? `Pay ₹${b.balance_due ?? b.amount} at venue.` : 'Paid in full.'}\n\n${VENUE.address}\n${VENUE.maps}`,
    location:VENUE.address,
    ctz:'Asia/Kolkata'
  });
  return 'https://calendar.google.com/calendar/render?'+params.toString();
}
function buildShareText(b){
  const when = isSession(b) ? `${startTime12(b.slot_time)} · ${sessionQty(b, b.duration_hrs)}` : slotRange12(b.slot_time);
  return `${b.icon || '✅'} Booked at ${VENUE.name}!\n\n📅 ${dateLong(b.booking_date)}\n⏰ ${when}\n🎯 ${b.sport_name}\n\nBooking ID: ${b.booking_id}\n📍 Venue location: ${VENUE.maps}\nhttps://${VENUE.website}`;
}

function inr(n){ return '₹' + (Number(n) || 0).toLocaleString('en-IN'); }

// Razorpay Checkout script, loaded once on first payment.
let rzpScript = null;
function loadRazorpay(){
  if (window.Razorpay) return Promise.resolve();
  if (!rzpScript) {
    rzpScript = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://checkout.razorpay.com/v1/checkout.js';
      s.onload = () => resolve();
      s.onerror = () => { rzpScript = null; reject(new Error('Could not load the payment window. Check your connection and try again.')); };
      document.head.appendChild(s);
    });
  }
  return rzpScript;
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

function Spinner({ small }){ return <span className={`loading-spinner ${small?'small':''} spin`}/>; }

// ── Scroll reveal: any .reveal element animates in when it enters the viewport ──
function useReveal(deps = []){
  useEffect(()=>{
    let io = null, off = null;
    const setup = () => {
      const els = Array.from(document.querySelectorAll('.reveal:not(.in)'));
      if (!els.length) return;
      if (!('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('in')); return; }
      io = new IntersectionObserver(entries => {
        entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
      els.forEach(el => io.observe(el));
    };
    // Wait for the preloader to lift so the first reveals play in view
    if (document.body.classList.contains('locked')) { off = () => setup(); window.addEventListener('hnr-ready', off, { once: true }); }
    else setup();
    return ()=>{ if (io) io.disconnect(); if (off) window.removeEventListener('hnr-ready', off); };
  }, deps);
}

// Count-up for hero numbers
function CountUp({ value, duration = 900 }){
  const [n, setN] = useState(0);
  useEffect(()=>{
    const target = Number(value) || 0;
    if (!target) { setN(0); return; }
    let raf, start;
    const step = t => {
      if (!start) start = t;
      const k = Math.min(1, (t - start) / duration);
      const e = 1 - Math.pow(1 - k, 3);
      setN(Math.round(target * e));
      if (k < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  }, [value]);
  return <>{n.toLocaleString('en-IN')}</>;
}

const PRELOAD_MIN_MS = 1700;
function Preloader({ ready }){
  const [gone, setGone] = useState(false);
  const [out, setOut] = useState(false);
  useEffect(()=>{
    document.body.classList.add('locked');
    return ()=>document.body.classList.remove('locked');
  }, []);
  useEffect(()=>{
    if (!ready) return;

  }, [ready]);

  );
}

// pricing_mode "session" (API_CONTRACT.md): one slot = session_qty session_unit; never show it as hourly.
function isSession(s){ return !!s && s.pricing_mode === 'session'; }
function sessionQty(s, n){ return `${s.session_qty * n} ${s.session_unit}`; }
function durationText(s, n){ return isSession(s) ? sessionQty(s, n) : `${n} hr${n>1?'s':''}`; }
function startTime12(slotTime){
  const [h, m] = String(slotTime).split('-')[0].split(':').map(Number);
  return `${(h % 12) || 12}:${String(m || 0).padStart(2,'0')} ${h >= 12 ? 'PM' : 'AM'}`;
}
// All times shown to customers are 12-hour. Stored slot_time stays "HH:MM-HH:MM".
function time12(hhmm){
  const [h, m] = String(hhmm).trim().split(':').map(Number);
  if (isNaN(h)) return String(hhmm);
  return `${(h % 12) || 12}:${String(m || 0).padStart(2,'0')} ${h % 24 >= 12 ? 'PM' : 'AM'}`;
}
function slotRange12(slotTime){
  const p = String(slotTime || '').split(/\s*[–-]\s*/);
  return p.length === 2 ? `${time12(p[0])} – ${time12(p[1])}` : time12(slotTime);
}
function priceLabel(s){
  const p = `₹${Number(s.price).toLocaleString('en-IN')}`;
  return isSession(s) ? `${p} · ${sessionQty(s, 1)}` : `${p} / hr${s.unit_label ? ' · ' + s.unit_label : ''}`;
}

function BookingWidget({ sports, sportsError, onRetrySports, onComplete, payCfg }){
  const next15 = useMemo(()=>getNext15Days(),[]);
  const [date, setDate] = useState(next15[0].iso);
  const [sportId, setSportId] = useState(null);
  const [avail, setAvail] = useState(null);          // getAvailability response for `date`
  const [availError, setAvailError] = useState(null);
  const [availNonce, setAvailNonce] = useState(0);   // bump to force a fresh fetch
  const [selectedSlot, setSelectedSlot] = useState(null);
  const [duration, setDuration] = useState(1);
  const [form, setForm] = useState({ name:'', phone:'', email:'', members:1, notes:'' });
  const [returning, setReturning] = useState(null);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState(null);
  // Online payment state
  const online = !!(payCfg && payCfg.online);
  const [quote, setQuote] = useState(null);          // previewCoupon response (server maths)
  const [couponInput, setCouponInput] = useState('');
  const [coupon, setCoupon] = useState('');           // applied code
  const [couponErr, setCouponErr] = useState(null);
  const [couponBusy, setCouponBusy] = useState(false);
  useEffect(()=>{
    const fill = c => { if (c) { setCouponInput(String(c).toUpperCase()); setCouponErr(null); } };
    try { fill(sessionStorage.getItem('hnr_coupon')); } catch(_) {}
    const h = e => fill(e.detail);
    window.addEventListener('hnr-coupon', h);
    return ()=>window.removeEventListener('hnr-coupon', h);
  }, []);
  const [agree, setAgree] = useState(false);
  const [payInfo, setPayInfo] = useState(null);       // { kind:'err'|'info', text }

  const sport = (sports || []).find(s => s.id === sportId) || null;

  // One getAvailability call covers every sport for the date. Cached per date;
  // a revisit shows the cached copy and refreshes it in the background.
  useEffect(()=>{
    let cancelled = false;
    const hadCache = !!availCache[date] && availNonce === 0;
    setSelectedSlot(null); setAvailError(null);
    if (!hadCache) setAvail(null);
    loadAvailability(date, availNonce > 0).then(
      d => { if(!cancelled) setAvail(d); },
      e => { if(!cancelled) setAvailError(e.message); }
    );
    if (hadCache) loadAvailability(date, true).then(d => { if(!cancelled) setAvail(d); }, ()=>{});
    // Prefetch next 2 days in background — makes date switching instant
    const idx = next15.findIndex(d => d.iso === date);
    [1,2].forEach(off => { const n = next15[idx + off]; if (n) loadAvailability(n.iso).catch(()=>{}); });
    return ()=>{ cancelled = true; };
  }, [date, availNonce]);

  useEffect(()=>{ setSelectedSlot(null); }, [sportId]);
  useEffect(()=>{
    const h = e => { if ((sports || []).some(s => s.id === e.detail)) setSportId(e.detail); };
    window.addEventListener('hnr-pick-sport', h);
    return ()=>window.removeEventListener('hnr-pick-sport', h);
  }, [sports]);

  useEffect(()=>{
    const ph = normalizePhone(form.phone);
    if(ph.length !== 10){ if(returning) setReturning(null); return; }
    let cancelled = false;
    const t = setTimeout(async()=>{
      try {
        const r = await API.get('lookupCustomer', { phone: ph });
        if(cancelled || !r) return;
        if(r.found || r.pass){
          setReturning(r);
          if (r.found) setForm(p => ({ ...p, name: p.name || r.customer_name, email: p.email || r.email || '' }));
        } else { setReturning(null); }
      } catch(_) {}
    }, 500);
    return ()=>{ cancelled = true; clearTimeout(t); };
  }, [form.phone]);

  // Whenever the user picks a new slot, reset duration to 1 hr.
  useEffect(()=>{ setDuration(1); }, [selectedSlot && selectedSlot.slot_id]);

  const hours = ((avail && avail.sports.find(s => s.sport_id === sportId)) || { hours: [] }).hours.filter(h => h.available > 0);
  const maxPerBooking = sport ? sport.max_slots_per_booking : 1;
  const maxDur = selectedSlot ? Math.min(selectedSlot.max_duration || 1, maxPerBooking) : 1;
  const effectiveDuration = Math.min(duration, maxDur);
  // Display only: server hourly price × hours. The ticket shows the server's final amount.
  const displayTotal = h => '₹' + (Number(selectedSlot ? selectedSlot.price : 0) * h).toLocaleString('en-IN');
  // lookupCustomer returns a sport_id; only ever show a public sport's name
  const lastSportName = returning && ((sports || []).find(s => s.id === returning.last_sport) || {}).name;

  const phoneOk = normalizePhone(form.phone).length === 10;
  // A weekly/monthly pass on this phone covers the booking: no advance, no Razorpay.
  const passCovered = !!(quote && quote.pass_covered);
  const canBook = sport && selectedSlot && form.name.trim() && phoneOk && isValidEmail(form.email)
    && (!online || passCovered || (agree && quote));

  // Server price quote (with coupon) whenever the selection changes. The browser never computes money.
  async function fetchQuote(code){
    const r = await API.get('previewCoupon', {
      sport_id: sport.id, slot_id: selectedSlot.slot_id, duration_hrs: effectiveDuration,
      phone: normalizePhone(form.phone), ...(code ? { coupon_code: code } : {})
    });
    setQuote(r);
    return r;
  }
  // Re-quoted when the phone becomes valid too, so a pass holder sees "covered" before paying.
  useEffect(()=>{
    if (!sport || !selectedSlot) { setQuote(null); return; }
    if (!online && !phoneOk) { setQuote(null); return; }
    let cancelled = false;
    setQuote(null);
    fetchQuote(coupon).catch(e => {
      if (cancelled) return;
      if (e.code === 'COUPON_INVALID' && coupon) { setCoupon(''); setCouponErr(e.message); fetchQuote('').catch(()=>{}); }
    });
    return ()=>{ cancelled = true; };
  }, [online, sportId, selectedSlot && selectedSlot.slot_id, effectiveDuration, phoneOk]);

  // Load Razorpay's checkout script as soon as a slot is picked, so Pay opens instantly.
  useEffect(()=>{ if (online && selectedSlot) loadRazorpay().catch(()=>{}); }, [online, !!selectedSlot]);

  async function applyCoupon(){
    const code = couponInput.trim().toUpperCase();
    if (!code || couponBusy) return;
    if (normalizePhone(form.phone).length !== 10) { setCouponErr('Enter your phone number first'); return; }
    setCouponBusy(true); setCouponErr(null);
    try { await fetchQuote(code); setCoupon(code); }
    catch(e){ setCouponErr(e.message); }
    finally { setCouponBusy(false); }
  }
  function removeCoupon(){
    setCoupon(''); setCouponInput(''); setCouponErr(null);
    fetchQuote('').catch(()=>{});
  }

  function bookingFromServer(b, extra = {}){
    return {
      ...b, ...extra,
      sport_name: sport.name, icon: sport.icon,
      pricing_mode: sport.pricing_mode, session_qty: sport.session_qty, session_unit: sport.session_unit
    };
  }

  async function payAndBook(){
    if(!canBook || submitting) return;
    setSubmitting(true); setError(null); setPayInfo(null);
    let order;
    try {
      await loadRazorpay();
      order = await API.post('createOrder', {
        customer_name: form.name.trim(), phone: normalizePhone(form.phone), email: form.email.trim(),
        sport_id: sport.id, slot_id: selectedSlot.slot_id, duration_hrs: effectiveDuration,
        members_count: parseInt(form.members,10) || 1, notes: form.notes.trim() || '',
        coupon_code: coupon || ''
      });
    } catch(e) {
      setSubmitting(false);
      if (e.code === 'COUPON_INVALID') { setCoupon(''); setCouponErr(e.message); fetchQuote('').catch(()=>{}); return; }
      setError(e.message);
      if (e.code === 'SLOT_TAKEN' || e.code === 'SPORT_FULL') setAvailNonce(n => n + 1);
      return;
    }

    let settled = false;
    const finish = (res) => {
      settled = true;
      clearAvailabilityCache();
      onComplete(bookingFromServer(res.booking, { manage_url: res.manage_url, invoice_url: res.invoice_url, paid_online: true }));
    };
    // UPI apps can confirm after the modal closes: poll the server for up to 2 minutes.
    const poll = async () => {
      setPayInfo({ kind:'info', text:'Confirming your payment with the bank… please keep this page open.' });
      for (let i = 0; i < 40 && !settled; i++) {
        await sleep(3000);
        try {
          const st = await API.get('getPaymentStatus', { booking_id: order.booking_id, order_id: order.order_id });
          if (st.status === 'confirmed') return finish(st);
        } catch(_) {}
      }
      if (!settled) { setSubmitting(false); setPayInfo({ kind:'info', text:`We haven't received confirmation yet. If money was deducted, you'll get a confirmation email within a few minutes, or an automatic refund. Booking ref: ${order.booking_id}` }); }
    };

    const rzp = new window.Razorpay({
      key: order.key_id,
      order_id: order.order_id,
      amount: order.amount,
      currency: order.currency,
      name: order.name,
      description: order.description,
      image: 'https://hitnrunarena.in/logo.jpeg',
      prefill: order.prefill,
      notes: { booking_id: order.booking_id },
      theme: { color: '#22e05a' },
      timeout: order.timeout,
      retry: { enabled: true, max_count: 3 },
      handler: async (resp) => {
        setPayInfo({ kind:'info', text:'Payment received. Confirming your booking…' });
        try {
          const res = await API.post('verifyPayment', { ...resp, booking_id: order.booking_id });
          if (res.status === 'confirmed') return finish(res);
          if (res.status === 'refunded') {
            settled = true; setSubmitting(false); clearAvailabilityCache(); setAvailNonce(n => n + 1);
            setPayInfo({ kind:'err', text:'Sorry, that slot was taken while you were paying. Your payment has been refunded in full (5-7 working days). Please pick another slot.' });
            return;
          }
          poll();
        } catch(e) {
          if (e.code === 'NOT_CAPTURED') return poll();
          setSubmitting(false);
          setPayInfo({ kind:'err', text: e.message + ` (ref ${order.booking_id})` });
        }
      },
      modal: {
        confirm_close: true,
        ondismiss: async () => {
          if (settled) return;
          setSubmitting(false);
          setPayInfo({ kind:'err', text:'Payment cancelled. Your slot was not booked.' });
          try { await API.post('abandonOrder', { booking_id: order.booking_id, order_id: order.order_id }); } catch(_) {}
          clearAvailabilityCache(); setAvailNonce(n => n + 1);
        }
      }
    });
    rzp.on('payment.failed', (r) => {
      const reason = (r && r.error && (r.error.description || r.error.reason)) || 'Payment failed';
      setPayInfo({ kind:'err', text: `${reason}. You can try again with another method in the payment window.` });
    });
    rzp.open();
  }

  async function submit(){
    if (online && !passCovered) return payAndBook();
    if(!canBook || submitting) return;
    setSubmitting(true);
    setError(null);
    try {
      const result = await API.post('createBooking', {
        customer_name: form.name.trim(),
        phone: normalizePhone(form.phone),
        email: form.email.trim(),
        sport_id: sport.id,
        slot_id: selectedSlot.slot_id,
        duration_hrs: effectiveDuration,
        members_count: parseInt(form.members,10) || 1,
        notes: form.notes.trim() || ''
      });
      clearAvailabilityCache();
      onComplete({
        ...result,
        booking_date: result.slot_date,
        sport_name: result.sport_name || sport.name,
        icon: sport.icon,
        pricing_mode: sport.pricing_mode, session_qty: sport.session_qty, session_unit: sport.session_unit,
        members_count: parseInt(form.members,10) || 1,
        customer_name: form.name.trim(),
        email: form.email.trim(),
        on_pass: result.payment_mode === 'pass'
      });
    } catch(e) {
      setError(e.message);
      setSubmitting(false);
      // Someone beat us to it — show fresh counts
      if (e.code === 'SLOT_TAKEN' || e.code === 'SPORT_FULL') setAvailNonce(n => n + 1);
      // Pass no longer covers (used up / expired) while the form was open → fall back to normal pricing
      if (e.code === 'PAYMENT_REQUIRED') fetchQuote(coupon).catch(()=>{});
    }
  }

  return (
    <section className="section" id="book">
      <div className="section-head reveal">
        <span className="section-eyebrow">Book in 60 seconds</span>
        <h2 className="section-h2">Lock in<br/>your slot.</h2>
        <p className="section-sub">{online
          ? `Pay a ₹${payCfg.advance} advance online to lock your slot; the rest at the venue. Free cancellation up to ${payCfg.refund_cutoff_hours} hours before.`
          : 'No advance payment. Pay at the venue when you arrive. Email confirmation hits your inbox immediately.'}</p>
      </div>
      <div className="booking-card reveal d1">
        {/* STEP 1 */}
        <div className="booking-step">
          <div className="step-label">
            <span className="step-num">1</span>
            <span className="step-title">When are you playing?</span>
            <span className="step-meta">{dateLong(date)}</span>
          </div>
          <div className="date-strip">
            {next15.map(d => (
              <button key={d.iso} className={`date-pill ${date===d.iso?'active':''}`} onClick={()=>setDate(d.iso)}>
                <span className="d-label">{d.label}</span>
                <span className="d-num">{d.day}</span>
                <span className="d-wd">{d.weekday}</span>
              </button>
            ))}
          </div>
        </div>

        {/* STEP 2 */}
        <div className="booking-step">
          <div className="step-label">
            <span className="step-num">2</span>
            <span className="step-title">What's the game?</span>
          </div>
          {sportsError && <SportsRetry onRetry={onRetrySports}/>}
          {!sportsError && !sports && (
            <div className="sport-grid">{[0,1,2].map(i => <div key={i} className="sport-card shimmer" style={{height:76}}/>)}</div>
          )}
          {sports && sports.length === 0 && (
            <div className="empty-block"><div className="ic">🗓️</div><div className="empty-title">No online bookings right now</div><div style={{fontSize:13}}>Call us on {VENUE.phone} to book.</div></div>
          )}
          {sports && sports.length > 0 && (
            <div className="sport-grid">
              {sports.map(s => (
                <button key={s.id} className={`sport-card ${sportId===s.id?'active':''}`} onClick={()=>setSportId(s.id)}>
                  <span className="ic">{s.icon}</span>
                  <div className="sport-card-text">
                    <div className="name">{s.name}</div>
                    {s.tagline && <div className="price">{s.tagline}</div>}
                    <div className="price">{priceLabel(s)}</div>
                  </div>
                </button>
              ))}
            </div>
          )}
        </div>

        {/* STEP 3 */}
        <div className="booking-step">
          <div className="step-label">
            <span className={`step-num ${sport?'':'dim'}`}>3</span>
            <span className="step-title">Pick your time</span>
            <span className="step-meta">{!sport ? 'Choose a sport first ↑' : !avail ? 'Checking…' : `${hours.length} available`}</span>
          </div>
          {!sport && (
            <div className="empty-block"><div className="ic">🎯</div><div className="empty-title">Pick a sport above</div><div style={{fontSize:13}}>We'll show you what's open on {dateNice(date)}</div></div>
          )}
          {sport && availError && !avail && (
            <div className="empty-block">
              <div className="ic">📡</div><div className="empty-title">Couldn't load availability</div>
              <div style={{fontSize:13,marginBottom:16}}>{availError}</div>
              <button className="btn-secondary" style={{padding:'10px 22px'}} onClick={()=>setAvailNonce(n => n + 1)}>↻ Retry</button>
            </div>
          )}
          {sport && !avail && !availError && (
            <div className="loading-block"><Spinner/><div style={{marginTop:16,fontSize:13,color:'var(--text-2)'}}>Fetching live availability…</div></div>
          )}
          {sport && avail && hours.length === 0 && (
            <div className="empty-block"><div className="ic">📭</div><div className="empty-title">Fully booked</div><div style={{fontSize:13}}>No slots left for {sport.name} on {dateNice(date)}.<br/>Try a different day or sport.</div></div>
          )}
          {sport && avail && hours.length > 0 && (
            <div className="slots-grid">
              {hours.map(h => {
                const active = selectedSlot && selectedSlot.slot_time === h.slot_time;
                const [startT, endT] = h.slot_time.split('-');
                return (
                  <button key={h.slot_time} className={`slot-card ${active?'active':''}`} style={{animationDelay:`${Math.min(hours.indexOf(h),12)*35}ms`}} onClick={()=>setSelectedSlot(h)}>
                    {isSession(sport) ? (
                      <div className="time-row"><span className="slot-time">{startTime12(h.slot_time)}</span></div>
                    ) : (
                      <div className="time-row">
                        <span className="slot-time">{time12(startT)}</span>
                        <span className="slot-arrow">→</span>
                        <span className="slot-time end">{time12(endT)}</span>
                      </div>
                    )}
                    <div className="slot-price">₹{Number(h.price).toLocaleString('en-IN')}{isSession(sport) ? '' : ' / hr'}</div>
                    <div className="slot-meta">{h.available} left</div>
                  </button>
                );
              })}
            </div>
          )}
        </div>

        {/* STEP 3.5 — Duration picker (only when a slot is selected) */}
        {selectedSlot && (
          <div className="booking-step anim-rise-fast">
            <div className="step-label">
              <span className="step-num">⏱</span>
              <span className="step-title">{isSession(sport) ? `How many ${sport.session_unit}?` : 'Duration'}</span>
              <span className="step-meta">{isSession(sport)
                ? (maxDur >= 2 ? `Up to ${sessionQty(sport, maxDur)} available` : `${sessionQty(sport, 1)} only`)
                : (maxDur >= 2 ? `Up to ${maxDur} hours available` : '1 hour only')}</span>
            </div>
            <div className="duration-grid">
              {Array.from({ length: maxPerBooking }, (_, i) => i + 1).map(h => {
                const disabled = h > maxDur;
                const active = effectiveDuration === h;
                return (
                  <button
                    key={h}
                    className={`duration-card ${active?'active':''} ${disabled?'disabled':''}`}
                    onClick={()=>!disabled && setDuration(h)}
                    disabled={disabled}
                    title={disabled ? 'Not enough consecutive slots available' : ''}
                  >
                    <div className="dur-h">{durationText(sport, h)}</div>
                    <div className="dur-price">{displayTotal(h)}</div>
                    {disabled && <div className="dur-sub">unavailable</div>}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* STEP 4 */}
        {selectedSlot && (
          <div className="booking-step anim-rise-fast">
            <div className="step-label">
              <span className="step-num">4</span>
              <span className="step-title">Your details</span>
              <span className="step-meta">Almost there.</span>
            </div>
            <div className="form-grid">
              {returning && returning.found && (
                <div className="return-banner anim-rise-fast">
                  <span className="return-emoji">👋</span>
                  <div className="return-text">
                    <strong>Welcome back, {returning.customer_name}!</strong>
                    <span className="sub">{returning.booking_count} previous {returning.booking_count===1?'booking':'bookings'}{lastSportName?` · Last played ${lastSportName}`:''}</span>
                  </div>
                </div>
              )}
              {returning && returning.pass && !passCovered && (
                <div className="return-banner anim-rise-fast" style={{borderColor:'rgba(var(--lime-rgb),.5)'}}>
                  <span className="return-emoji">🎟️</span>
                  <div className="return-text">
                    <strong>{returning.pass.plan_label} on this number</strong>
                    <span className="sub">
                      {returning.pass.hours_left !== null ? `${returning.pass.hours_left} of ${returning.pass.hours_quota} hrs left · ` : ''}valid till {dateNice(returning.pass.end_date)}
                      {quote && quote.pass_reason ? ` · ${quote.pass_reason}` : ''}
                    </span>
                  </div>
                </div>
              )}
              <div className="form-field">
                <label className="form-label">Phone *</label>
                <input type="tel" className="form-input" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="98765 43210" maxLength={15} autoComplete="tel"/>
                <div className="field-hint">10 digits, with or without country code</div>
              </div>
              <div className="form-field">
                <label className="form-label">Name *</label>
                <input type="text" className="form-input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Your full name" autoComplete="name"/>
              </div>
              <div className="form-field">
                <label className="form-label">Email * <span style={{ textTransform:'none', letterSpacing:0, fontWeight:500, color:'var(--text-3)' }}>(for booking confirmation)</span></label>
                <input type="email" className="form-input" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="you@example.com" autoComplete="email" required/>
                {!isValidEmail(form.email) && form.email && <div className="field-hint" style={{color:'var(--danger)'}}>Looks like an invalid email</div>}
                {!form.email && <div className="field-hint">Required — we'll send your booking ID and venue details here</div>}
              </div>
              <div className="form-field">
                <label className="form-label">Players</label>
                <input type="number" className="form-input" value={form.members} onChange={e=>setForm({...form,members:e.target.value})} min={1} max={30}/>
              </div>
              <div className="form-field span-2">
                <label className="form-label">Notes (optional)</label>
                <input type="text" className="form-input" value={form.notes} onChange={e=>setForm({...form,notes:e.target.value})} placeholder="Team name, special equipment, anything we should know…"/>
              </div>
            </div>
            {passCovered && (
              <div className="pass-box anim-pop" style={{marginTop:22}}>
                <span className="ic">🎟️</span>
                <div>
                  <strong>Covered by your pass</strong>
                  <span>{quote.pass.plan_label} · {quote.pass.hours_left !== null ? `${quote.pass.hours_left} hr${quote.pass.hours_left===1?'':'s'} left before this booking · ` : ''}nothing to pay{online ? ', no advance' : ''}.</span>
                </div>
              </div>
            )}
            {online && !passCovered && (
              <div style={{marginTop:22}}>
                {coupon ? (
                  <div className="coupon-applied">
                    <span>Coupon <strong>{coupon}</strong> applied{quote && quote.discount ? ` · you save ${inr(quote.discount)}` : ''}</span>
                    <button onClick={removeCoupon}>Remove</button>
                  </div>
                ) : (
                  <div className="coupon-row">
                    <input className="form-input" value={couponInput} onChange={e=>{ setCouponInput(e.target.value); setCouponErr(null); }}
                      onKeyDown={e=>e.key==='Enter' && applyCoupon()} placeholder="Coupon code" maxLength={20} aria-label="Coupon code"/>
                    <button className="coupon-btn" onClick={applyCoupon} disabled={couponBusy || !couponInput.trim()}>{couponBusy ? 'Checking…' : 'Apply'}</button>
                  </div>
                )}
                {couponErr && <div className="coupon-err">{couponErr}</div>}
                <div className="pay-box">
                  {!quote ? <div style={{textAlign:'center',padding:8}}><Spinner small/></div> : <>
                    {quote.discount > 0 && <div className="pay-row"><span>Booking total</span><strong>{inr(quote.total)}</strong></div>}
                    {quote.discount > 0 && <div className="pay-row"><span>Coupon {quote.coupon_code}</span><strong className="disc">− {inr(quote.discount)}</strong></div>}
                    <div className="pay-row total"><span>Total (incl. GST)</span><strong>{inr(quote.net)}</strong></div>
                    <div className="pay-row now"><span>Pay now to confirm</span><strong>{inr(quote.advance)}</strong></div>
                    <div className="pay-row"><span>Pay at venue</span><strong>{inr(quote.balance)}</strong></div>
                    <div className="pay-gst">Includes GST @ {quote.gst_rate}% ({inr(quote.gst)}). GST invoice emailed after payment.</div>
                  </>}
                </div>
              </div>
            )}
            <div className="submit-row">
              {online && !passCovered && (
                <label className="policy-check">
                  <input type="checkbox" checked={agree} onChange={e=>setAgree(e.target.checked)}/>
                  <span>I agree to the <a href="#policies" onClick={e=>{e.preventDefault();document.getElementById('policies')?.scrollIntoView({behavior:'smooth'});}}>cancellation policy</a>: free cancellation up to {payCfg.refund_cutoff_hours} hours before the slot; the advance is non-refundable after that.</span>
                </label>
              )}
              <button className="btn-submit" onClick={submit} disabled={!canBook || submitting}>
                {submitting
                  ? <><Spinner small/> {online && !passCovered ? 'Processing payment…' : 'Booking…'}</>
                  : passCovered
                    ? <>Confirm with pass · {durationText(sport, effectiveDuration)} <span>→</span></>
                  : online
                    ? <>Pay {quote ? inr(quote.advance) : ''} & confirm <span>→</span></>
                    : <>Lock in {durationText(sport, effectiveDuration)} · {displayTotal(effectiveDuration)} <span>→</span></>}
              </button>
              {passCovered
                ? <div className="submit-note">🎟️ Booked on your membership — no payment needed.</div>
                : online
                ? <div className="secure-note">Secured by Razorpay · UPI, cards, netbanking, wallets</div>
                : <div className="submit-note">💰 Pay at the venue — cash or UPI. Cancel anytime by calling us.</div>}
              {payInfo && <div className={`pay-status ${payInfo.kind}`}>{payInfo.text}</div>}
            </div>
          </div>
        )}
        {error && <div style={{marginTop:16,background:'rgba(239,68,68,.1)',border:'1px solid var(--danger)',borderRadius:12,padding:'12px 16px',fontSize:13,color:'#fca5a5'}}>⚠ {error}</div>}
      </div>
    </section>
  );
}

      <div className="ticket anim-rise">

          <div className="ticket-check pulse-glow">✓</div>
          <div className="ticket-title">{booking.icon} {booking.sport_name} Booked</div>
          <div className="ticket-sub">{booking.email ? `Confirmation sent to ${booking.email}` : 'Show this screen at the venue'}</div>
        </div>
        <div className="ticket-divider"><span className="dash"></span></div>
        <div className="ticket-body">
          <div className="ticket-row"><span className="ticket-label">Booking ID</span><span className="ticket-value mono">{booking.booking_id}</span></div>
          <div className="ticket-row"><span className="ticket-label">Sport</span><span className="ticket-value big">{booking.sport_name}</span></div>
          <div className="ticket-row"><span className="ticket-label">Date</span><span className="ticket-value">{dateLong(booking.booking_date)}</span></div>
          <div className="ticket-row"><span className="ticket-label">Time</span><span className="ticket-value big" style={{fontSize:20}}>{isSession(booking) ? startTime12(booking.slot_time) : slotRange12(booking.slot_time)}</span></div>
          {isSession(booking) ? (
            <div className="ticket-row"><span className="ticket-label">Session</span><span className="ticket-value big">{sessionQty(booking, booking.duration_hrs)}</span></div>
