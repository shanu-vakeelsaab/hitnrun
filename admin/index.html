<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d0e" />
  <title>Admin · Hit N Run Sports Arena</title>
  <link rel="icon" type="image/jpeg" href="/logo.jpeg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />

  <!-- Theme before first paint: saved choice, else the OS setting -->
  <script>
    (function(){
      var t = null;
      try { t = localStorage.getItem('hnr_theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

  <style>
    /* ═══════ DESIGN TOKENS ═══════ */
    :root, :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f9fafb; --surface-3: #f1f3f5;
      --border: #e4e7ec; --border-subtle: #eef0f3; --border-strong: #d0d5dd;
      --text: #101418; --text-2: #3b4350; --text-3: #5d6673; --text-4: #8a93a0;
      --ink: #0b0d0e; --on-ink: #ffffff;
      --accent: #c4f000; --accent-ink: #0b0d0e; --accent-text: #4a6400; --accent-soft: rgba(196,240,0,.18);
      --success: #12a35c; --success-bg: #ebf8f1; --success-text: #0b6b3c;
      --warning: #e8890b; --warning-bg: #fff6e6; --warning-text: #9a4f00; --warning-border: #fcd9a8;
      --danger: #e5483d; --danger-bg: #fdf0ef; --danger-text: #b42318; --danger-border: #f8c7c2;
      --info: #2e7fd9; --info-bg: #edf5fe; --info-text: #1a5aa6;
      --violet-bg: #f3f1fe; --violet-text: #5b3fc4;
      --sc1-bg:#fff4dc; --sc1-fg:#8a5a00; --sc2-bg:#e6f6ee; --sc2-fg:#13704a; --sc3-bg:#ffeadb; --sc3-fg:#a2400f;
      --sc4-bg:#e8f1fd; --sc4-fg:#1d5bb0; --sc5-bg:#eeedfd; --sc5-fg:#4b3bb5; --sc6-bg:#fdeaf3; --sc6-fg:#a3245f;
      --sc7-bg:#e2f7f4; --sc7-fg:#0f6b62; --sc8-bg:#f8ebfd; --sc8-fg:#8a2aa6;
      --shadow-sm: 0 1px 2px rgba(16,20,24,.05);
      --shadow-md: 0 4px 16px rgba(16,20,24,.07);
      --shadow-lg: 0 24px 64px rgba(16,20,24,.18);
      --overlay: rgba(11,13,14,.45);
      --radius: 10px;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0b0d0f; --surface: #131619; --surface-2: #171a1e; --surface-3: #1d2126;
      --border: #262b31; --border-subtle: #1f2328; --border-strong: #353b43;
      --text: #f1f3f5; --text-2: #c6ccd4; --text-3: #9aa3ae; --text-4: #6c7580;
      --ink: #f1f3f5; --on-ink: #0b0d0f;
      --accent: #c4f000; --accent-ink: #0b0d0e; --accent-text: #c4f000; --accent-soft: rgba(196,240,0,.12);
      --success: #2fbf71; --success-bg: rgba(47,191,113,.13); --success-text: #5fd897;
      --warning: #f0a028; --warning-bg: rgba(240,160,40,.13); --warning-text: #f7bd5e; --warning-border: rgba(240,160,40,.35);
      --danger: #f0574c; --danger-bg: rgba(240,87,76,.13); --danger-text: #ff8a80; --danger-border: rgba(240,87,76,.38);
      --info: #4b9cf0; --info-bg: rgba(75,156,240,.14); --info-text: #8cc2fb;
      --violet-bg: rgba(140,120,250,.15); --violet-text: #b3a6ff;
      --sc1-bg:rgba(240,170,40,.15); --sc1-fg:#f4c36a; --sc2-bg:rgba(47,191,113,.14); --sc2-fg:#6edca0; --sc3-bg:rgba(240,120,60,.15); --sc3-fg:#f6a47a;
      --sc4-bg:rgba(75,156,240,.15); --sc4-fg:#8cc2fb; --sc5-bg:rgba(130,115,250,.16); --sc5-fg:#b3a6ff; --sc6-bg:rgba(240,90,160,.15); --sc6-fg:#f59ac4;
      --sc7-bg:rgba(40,200,180,.14); --sc7-fg:#6fe0d0; --sc8-bg:rgba(200,100,240,.15); --sc8-fg:#dca2f6;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
      --shadow-md: 0 4px 16px rgba(0,0,0,.35);
      --shadow-lg: 0 24px 64px rgba(0,0,0,.6);
      --overlay: rgba(0,0,0,.6);
    }

    /* ═══════ BASE ═══════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color: var(--text); line-height: 1.5; font-size: 14px;
      -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01', 'tnum';
    }
    input, textarea, select, button { font-family: inherit; color: inherit; }
    input, textarea, select { background: var(--surface); }
    input::placeholder, textarea::placeholder { color: var(--text-4); }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--text-3) !important; box-shadow: 0 0 0 3px var(--accent-soft); }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    button:disabled { cursor: not-allowed; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    a { color: inherit; text-decoration: none; }
    svg { flex-shrink: 0; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 99px; }

    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
    @keyframes live-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: .55; } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    @keyframes drawerSlide { from { transform: translateX(100%); } to { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

    /* backwards, not both: a transform left on the element would trap fixed-position popups inside it */
    .anim-up { animation: rise .2s ease backwards; }
    .spin { animation: spin .8s linear infinite; }
    .pulse { animation: pulse 1.4s infinite; }
    .shake { animation: shake .4s; }
    .live-dot-green { width: 7px; height: 7px; border-radius: 50%; background: var(--success); display: inline-block; animation: live-pulse 2s ease-in-out infinite; }

    /* ═══════ APP SHELL ═══════ */
    .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
    .sidebar {
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
      background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 18px 14px; gap: 18px; z-index: 90;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 2px 6px 12px; border-bottom: 1px solid var(--border-subtle); }
    .brand img { width: 38px; height: 38px; border-radius: 9px; object-fit: cover; }
    .brand-name { font-weight: 800; font-size: 14px; letter-spacing: -.01em; line-height: 1.2; }
    .brand-sub { font-size: 11px; color: var(--text-4); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .nav-group-label { font-size: 11px; font-weight: 700; color: var(--text-4); letter-spacing: .08em; text-transform: uppercase; padding: 0 10px 6px; }
    .nav-item {
      width: 100%; display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 8px;
      font-size: 13.5px; font-weight: 600; color: var(--text-3); text-align: left; position: relative; transition: background .12s, color .12s;
    }
    .nav-item:hover { background: var(--surface-3); color: var(--text); }
    .nav-item.active { background: var(--surface-3); color: var(--text); }
    .nav-item.active::before { content: ''; position: absolute; left: -14px; top: 7px; bottom: 7px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
    .nav-item .count { margin-left: auto; font-size: 11px; font-weight: 700; background: var(--ink); color: var(--on-ink); border-radius: 99px; padding: 1px 7px; min-width: 20px; text-align: center; }
    .sidebar-foot { margin-top: auto; display: grid; gap: 6px; padding-top: 12px; border-top: 1px solid var(--border-subtle); }

    .main { min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 80; height: 64px; display: flex; align-items: center; gap: 12px;
      padding: 0 28px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .page-title { font-size: 18px; font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
    .page-sub { font-size: 12px; color: var(--text-4); font-weight: 500; }
    .topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .page { padding: 22px 28px 40px; display: grid; gap: 18px; align-content: start; }
    .btn.menu-btn { display: none; }
    .scrim { display: none; }

    /* ═══════ COMPONENTS ═══════ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap;
      height: 36px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 700;
      border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
      transition: background .12s, border-color .12s, color .12s, transform .06s;
    }
    .btn:hover:not(:disabled) { border-color: var(--border-strong); color: var(--text); background: var(--surface-2); }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: .55; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn-primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); filter: brightness(.95); }
    .btn-dark { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
    .btn-dark:hover:not(:disabled) { background: var(--ink); color: var(--on-ink); opacity: .9; }
    .btn-danger { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }
    .btn-danger:hover:not(:disabled) { background: var(--danger-bg); border-color: var(--danger); color: var(--danger-text); }
    .btn-ghost { border-color: transparent; background: transparent; }
    .btn-sm { height: 30px; padding: 0 10px; font-size: 12px; border-radius: 7px; }
    .btn-icon { width: 36px; padding: 0; }
    .btn-icon.btn-sm { width: 30px; }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; box-shadow: var(--shadow-sm); min-width: 0; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .panel-title { font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
    .panel-sub { font-size: 12px; color: var(--text-4); margin-top: 2px; }

    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .kpi {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; text-align: left;
      box-shadow: var(--shadow-sm); transition: border-color .12s, transform .12s; display: grid; gap: 8px;
    }
    button.kpi:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .kpi-label { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--text-3); }
    .kpi-label svg { color: var(--text-4); }
    .kpi-value { font-size: 26px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
    .kpi-foot { font-size: 12px; color: var(--text-4); font-weight: 500; }

    .seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-3); border-radius: 9px; border: 1px solid var(--border-subtle); flex-wrap: wrap; }
    .seg button { padding: 6px 12px; border-radius: 7px; font-size: 12px; font-weight: 700; color: var(--text-3); white-space: nowrap; }
    .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

    .field { display: grid; gap: 6px; }
    .label { font-size: 12px; font-weight: 700; color: var(--text-2); }
    .hint { font-size: 11.5px; color: var(--text-4); }
    .input {
      width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px;
      background: var(--surface); color: var(--text); font-size: 13.5px;
    }
    textarea.input { height: auto; padding: 10px 12px; }
    .search { position: relative; }
    .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-4); pointer-events: none; }
    .search .input { padding-left: 34px; min-width: 240px; }

    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text-4); background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
    .table td { padding: 12px 14px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
    .table tr:last-child td { border-bottom: none; }
    .table tbody tr:hover td { background: var(--surface-2); }
    .table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .table .empty { padding: 44px; text-align: center; color: var(--text-4); }

    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 700; white-space: nowrap; line-height: 1.6; }
    .pill::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
    .pill.plain::before { display: none; }
    .p-success { background: var(--success-bg); color: var(--success-text); }
    .p-warning { background: var(--warning-bg); color: var(--warning-text); }
    .p-danger { background: var(--danger-bg); color: var(--danger-text); }
    .p-info { background: var(--info-bg); color: var(--info-text); }
    .p-violet { background: var(--violet-bg); color: var(--violet-text); }
    .p-muted { background: var(--surface-3); color: var(--text-3); }
    .p-accent { background: var(--accent-soft); color: var(--accent-text); }

    .callout { border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.55; display: flex; gap: 10px; align-items: flex-start; }
    .callout svg { margin-top: 2px; }
    .callout.warn { background: var(--warning-bg); color: var(--warning-text); border: 1px solid var(--warning-border); }
    .callout.info { background: var(--info-bg); color: var(--info-text); }
    .callout.danger { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }
    .callout.ok { background: var(--success-bg); color: var(--success-text); }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
    .stack { display: grid; gap: 14px; }
    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .spacer { flex: 1; }
    .muted { color: var(--text-3); }
    .faint { color: var(--text-4); }
    .strong { font-weight: 700; color: var(--text); }
    .money { font-variant-numeric: tabular-nums; font-weight: 700; }
    .divider { height: 1px; background: var(--border-subtle); margin: 4px 0; }

    .modal-backdrop { position: fixed; inset: 0; background: var(--overlay); z-index: 150; display: grid; place-items: center; padding: 16px; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg); width: 100%; max-height: calc(100vh - 32px); overflow-y: auto; }

    /* Booking rows */
    .booking-row:hover td { background: var(--surface-2) !important; }
    .booking-row:hover td:last-child { color: var(--text) !important; }
    .bookings-mobile > div:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .bookings-mobile { display: none; }

    /* Old wrapper classes from the previous layout, kept as no-ops */
    .content-card { background: transparent; }

    /* ═══════ PRINT — Bookings day sheet ═══════ */
    @media print {
      @page { margin: 12mm; }
      :root { --surface: #fff; --surface-2: #fff; --text: #000; --bg: #fff; }
      body { background: #fff !important; }
      .sidebar, .topbar, .kpis, .sports-today, .filter-row, .bookings-mobile, .no-print,
      button, input { display: none !important; }
      .app { display: block; }
      .page { padding: 0; }
      .panel { box-shadow: none !important; border: none !important; padding: 0 !important; }
      .bookings-table-wrap { display: block !important; overflow: visible !important; border: none; }
      .bookings-table-wrap td:last-child, .bookings-table-wrap th:last-child { display: none; }
      .booking-row { page-break-inside: avoid; }
      table { font-size: 12px !important; }
      body::before {
        content: "Hit N Run Sports Arena · Bookings Day Sheet · " attr(data-print-date);
        display: block; font-size: 14px; font-weight: 800; padding: 0 0 12px; border-bottom: 2px solid #000; margin-bottom: 12px;
      }
    }

    /* ═══════ RESPONSIVE ═══════ */
    @media (max-width: 1180px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 960px) {
      .app { grid-template-columns: minmax(0, 1fr); }
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 272px; transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow-lg); }
      .sidebar.open { transform: translateX(0); }
      .scrim.open { display: block; position: fixed; inset: 0; background: var(--overlay); z-index: 85; }
      .btn.menu-btn { display: inline-flex; }
      .topbar { padding: 0 16px; }
      .page { padding: 16px 16px 32px; }
      .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 700px) {
      .page-sub, .hide-sm { display: none !important; }
      .panel { padding: 16px; border-radius: 12px; }
      .kpis { gap: 8px; }
      .kpi { padding: 12px 14px; }
      .kpi-value { font-size: 21px; }
      .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); }
      .search .input { min-width: 0; }
      .search { flex: 1 1 100%; }
      .bookings-table-wrap { display: none !important; }
      .bookings-mobile { display: flex !important; }
      .slot-card-mobile { padding: 12px !important; }
      .resource-row { padding: 8px 10px !important; font-size: 12px !important; }
      .lead-grid { grid-template-columns: 1fr !important; gap: 18px !important; }
      .date-strip-admin button { min-width: 60px !important; padding: 6px 10px !important; }
      .filter-row { gap: 5px !important; }
      .pass-pricing { grid-template-columns: 1fr !important; gap: 8px !important; }
      .revenue-cards { grid-template-columns: 1fr !important; gap: 10px !important; }
      .revenue-split { grid-template-columns: 1fr !important; gap: 18px !important; }
      .modal-inner { padding: 16px !important; max-width: calc(100vw - 24px) !important; }
      .form-grid-2 { grid-template-columns: 1fr !important; }
      .seg { max-width: 100%; overflow-x: auto; flex-wrap: nowrap; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

const API_URL = "https://hitnrun-api.vercel.app/api";
const REFRESH_INTERVAL_MS = 15000; // 15s auto-refresh

// PLANS — must match Code.gs PLANS array
const PLANS = [
  { key: 'turf_weekly',  label: 'Turf Weekly Team Pass',  category: 'turf', price:  4999, days:  7, max_members: 12 },
  { key: 'turf_monthly', label: 'Turf Monthly Team Pass', category: 'turf', price: 14999, days: 30, max_members: 18 },
  { key: 'net_week_weekday', label: 'Net Weekly (Weekday)', category: 'net', price: 1800, days: 7 },
  { key: 'net_week_weekend', label: 'Net Weekly (Weekend)', category: 'net', price: 1400, days: 7 },
  { key: 'net_week_full',    label: 'Net Weekly (Mon–Sun)', category: 'net', price: 2500, days: 7 },
  { key: 'net_month_basic',    label: 'Net Monthly Basic (12 hrs)',    category: 'net', price: 4200, days: 30, hours_quota: 12 },
  { key: 'net_month_standard', label: 'Net Monthly Standard (20 hrs)', category: 'net', price: 6500, days: 30, hours_quota: 20 },
  { key: 'net_month_premium',  label: 'Net Monthly Premium (30 hrs)',  category: 'net', price: 9000, days: 30, hours_quota: 30 }
];

const API = {
  async get(action, params = {}) {
    const adminKey = sessionStorage.getItem('hnr_admin_key') || '';
    const qs = new URLSearchParams({ action, adminKey, ...params }).toString();
    const res = await fetch(API_URL + '?' + qs);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Request failed');
    return data.data;
  },
  async post(action, body = {}) {
    const adminKey = sessionStorage.getItem('hnr_admin_key') || '';
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, adminKey, ...body })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Request failed');
    return data.data;
  },
  async validateKey(key) {
    const res = await fetch(API_URL + '?action=validateKey&adminKey=' + encodeURIComponent(key));
    const data = await res.json();
    return data.ok && data.data && data.data.valid;
  }
};

// Bookings store sport_id; look everything up here so archived sports keep their name + icon.
const ConfigCtx = React.createContext(null);
function useConfig(){ return React.useContext(ConfigCtx); }
const SPORT_COLORS = [1,2,3,4,5,6,7,8].map(n => ({ bg:`var(--sc${n}-bg)`, text:`var(--sc${n}-fg)` }));
function makeConfig(sports, resources){
  const byId = {};
  sports.forEach((s, i) => { byId[s.sport_id] = { ...s, color: SPORT_COLORS[i % SPORT_COLORS.length] }; });
  const resById = {};
  resources.forEach(r => { resById[r.resource_id] = r; });
  return {
    sports, resources,
    bookable: sports.filter(s => s.active && !s.archived),
    sport: id => byId[id] || { sport_id: id, name: id || '—', icon: '🏷️', color: { bg:'var(--surface-3)', text:'var(--text-3)' }, unknown: true },
    resourceLabel: id => (resById[id] && resById[id].label) || String(id || '').toUpperCase()
  };
}
// Open hours for one sport via getAvailability in admin mode (API.get sends adminKey): includes
// walk-in-only sports; with excludeId that booking's own slots count as free (Edit Booking).
async function loadSportHours(date, sportId, excludeId){
  const d = await API.get('getAvailability', excludeId ? { date, exclude_booking_id: excludeId } : { date });
  const sp = (d.sports || []).find(x => x.sport_id === sportId);
  return sp ? sp.hours.filter(h => h.available > 0) : [];
}
const isPooled = sp => (sp.resource_pool || []).length > 1;   // show "N left" only when there's a pool
function rupees(n){ return '₹' + (Number(n) || 0).toLocaleString('en-IN'); }
// pricing_mode "session" (API_CONTRACT.md): one slot = session_qty session_unit; never show it as hourly.
// Bookings don't store the mode, so it comes from the sport's current config.
function isSession(s){ return !!s && s.pricing_mode === 'session'; }
function sessionQty(s, n){ return `${(Number(s.session_qty) || 0) * (n || 1)} ${s.session_unit}`; }
function startTime12(slotTime){
  const [h, m] = String(slotTime).split('-')[0].split(':').map(Number);
  return `${(h % 12) || 12}:${String(m || 0).padStart(2,'0')} ${h >= 12 ? 'PM' : 'AM'}`;
}
// Every time shown in admin is 12-hour. Stored slot_time stays "HH:MM-HH:MM".
function time12(hhmm){
  const [h, m] = String(hhmm).trim().split(':').map(Number);
  if (isNaN(h)) return String(hhmm);
  return `${(h % 12) || 12}:${String(m || 0).padStart(2,'0')} ${h % 24 >= 12 ? 'PM' : 'AM'}`;
}
function slotRange12(slotTime){
  const p = String(slotTime || '').split(/\s*[–-]\s*/);
  return p.length === 2 ? `${time12(p[0])} – ${time12(p[1])}` : time12(slotTime);
}
function slotTimeText(sp, slotTime){ return isSession(sp) ? startTime12(slotTime) : slotRange12(slotTime); }
// Payment mode is Cash or Online (older bookings may still say upi/card).
function payModeLabel(m){ const v = String(m || '').toLowerCase(); return !v ? 'Unknown' : v === 'cash' ? 'Cash' : v === 'pass' ? 'Pass' : 'Online'; }
function sportPriceText(s){
  return isSession(s) ? `${rupees(s.price_per_slot)} · ${sessionQty(s, 1)}`
                      : `${rupees(s.price_per_slot)} / hr${s.unit_label ? ` · ${s.unit_label}` : ''}`;
}

// ── Utils ──────────────────────────────────────────────────
function formatDateISO(d){ const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function formatDateLong(){ return new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'short' }); }
function formatDateShort(iso){ if(!iso) return ''; return new Date(iso+'T00:00:00').toLocaleDateString('en-IN', { day:'2-digit', month:'short' }); }
function getNext15Days(){
  const t = new Date();
  return Array.from({length:15}, (_,i) => {
    const d = new Date(t); d.setDate(d.getDate()+i);
    return { iso: formatDateISO(d), label: i===0?'Today':i===1?'Tomorrow':d.toLocaleDateString('en-IN',{month:'short'}), day: d.getDate(), weekday: d.toLocaleDateString('en-IN',{weekday:'short'}) };
  });
}
function formatPhone(p){ if(!p) return ''; const s=String(p).replace(/\D/g,''); if(s.length===10) return s.slice(0,5)+' '+s.slice(5); return p; }
function normalizePhone(p){ return p ? String(p).replace(/\D/g,'').slice(-10) : ''; }
function relativeTime(then, now){
  if(!then) return 'never';
  const secs = Math.round((now-then)/1000);
  if(secs<5) return 'just now';
  if(secs<60) return secs+'s ago';
  if(secs<3600) return Math.round(secs/60)+'m ago';
  return Math.round(secs/3600)+'h ago';
}
function paymentBadge(b){
  if(b.status === 'cancelled') return { bg:'var(--danger-bg)', text:'var(--danger-text)', label:'Cancelled' };
  if(b.status === 'pending_payment') return { bg:'var(--info-bg)', text:'var(--info-text)', label:'Awaiting payment' };
  if(b.status === 'expired') return { bg:'var(--surface-3)', text:'var(--text-3)', label:'Not completed' };
  if(b.payment_status === 'paid') return { bg:'var(--success-bg)', text:'var(--success-text)', label:'Paid' };
  if(b.payment_status === 'partial') return { bg:'var(--violet-bg)', text:'var(--violet-text)', label:`Advance paid` };
  return { bg:'var(--warning-bg)', text:'var(--warning-text)', label:'Pending' };
}

// ── Theme ───────────────────────────────────────────────────
function getTheme(){ return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
function useTheme(){
  const [theme, setThemeState] = useState(getTheme());
  const setTheme = t => {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('hnr_theme', t); } catch(_) {}
    setThemeState(t);
  };
  return [theme, setTheme];
}
function ThemeToggle({ theme, setTheme, full }){
  const next = theme === 'dark' ? 'light' : 'dark';
  return (
    <button className={full ? 'nav-item' : 'btn btn-icon'} onClick={()=>setTheme(next)} title={`Switch to ${next} mode`} aria-label={`Switch to ${next} mode`}>
      <Icon name={theme === 'dark' ? 'sun' : 'moon'}/>{full && <span>{theme === 'dark' ? 'Light mode' : 'Dark mode'}</span>}
    </button>
  );
}

function Badge({ bg, text, children }){

function Spinner({ small }){

function Toast({ toast, onClose }){
  useEffect(()=>{
    if(!toast?.show) return;
    const t = setTimeout(onClose, 4000);
    return ()=>clearTimeout(t);
  }, [toast?.show, toast?.message]);
  if(!toast?.show) return null;
  return <div role="status" style={{
    position:'fixed', bottom:24, left:'50%', transform:'translateX(-50%)',
    background: toast.isError?'var(--danger-bg)':'var(--ink)', color: toast.isError?'var(--danger-text)':'var(--on-ink)',
    padding:'11px 18px', borderRadius:10, fontSize:13.5, fontWeight:600,

  }}>
    <Icon name={toast.isError ? 'alert' : 'check'} size={16}/>
    <span>{toast.message}</span>
  </div>;
}

function LoginPage({ onLogin }){
  const [pw, setPw] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState(null);
  const [shake, setShake] = useState(false);
  const inputRef = useRef(null);
  const [theme, setTheme] = useTheme();

  useEffect(()=>{ inputRef.current?.focus(); }, []);

  async function attempt(){
    if(!pw || loading) return;
    setLoading(true); setErr(null);
    try {
      const ok = await API.validateKey(pw);
      if(ok){
        sessionStorage.setItem('hnr_admin_key', pw);
        onLogin();
      } else {
        setErr('Incorrect admin key.');
        setShake(true);
        setTimeout(()=>setShake(false), 400);
        setLoading(false);
      }
    } catch(e){
      setErr(e.message || 'Connection error');
      setLoading(false);
    }
  }

  return (
    <div style={{ minHeight:'100vh', background:'var(--bg)', display:'grid', placeItems:'center', padding:16, position:'relative' }}>
      <div style={{ position:'absolute', top:16, right:16 }}><ThemeToggle theme={theme} setTheme={setTheme}/></div>
      <div className={shake?'shake':''} style={{ maxWidth:380, width:'100%' }}>
        <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:26 }}>
          <img src="/logo.jpeg" alt="" style={{ width:46, height:46, borderRadius:10, objectFit:'cover' }}/>
          <div>
            <div style={{ fontSize:18, fontWeight:800, letterSpacing:'-.02em' }}>Hit N Run Sports Arena</div>
            <div style={{ fontSize:13, color:'var(--text-3)' }}>Admin console</div>
          </div>
        </div>
        <div className="panel" style={{ padding:24 }}>
          <div className="field">
            <label className="label" htmlFor="adminkey">Admin key</label>
            <input id="adminkey" ref={inputRef} type="password" value={pw} onChange={e=>setPw(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&attempt()} className="input" placeholder="Enter your admin key" autoComplete="current-password"/>
          </div>
          {err && <div style={{ color:'var(--danger-text)', fontSize:12.5, marginTop:10, fontWeight:600 }}>{err}</div>}
          <button onClick={attempt} disabled={!pw||loading} className="btn btn-primary" style={{ width:'100%', marginTop:16, height:40 }}>
            {loading ? <><Spinner small/> Signing in…</> : 'Sign in'}
          </button>
        </div>
      </div>
    </div>
  );
}

    return ()=>{ cancelled = true; clearTimeout(t); };
  }, [form.phone, form.sport_id, form.booking_date, form.duration_hrs]);
  const passApplies = !!(passInfo && passInfo.covered && usePass && String(form.amount).trim() === '');

  useEffect(()=>{
    if (!form.sport_id) return;
    let cancelled = false;
    (async ()=>{
      setLoadingSlots(true);
      setForm(f => ({ ...f, slot_time: '', duration_hrs: 1 }));
      try {
        const hours = await loadSportHours(form.booking_date, form.sport_id);
        if (!cancelled) setAvailSlots(hours);
      } catch(e) {
        if (!cancelled) { setAvailSlots([]); setErr('Could not load available slots: ' + e.message); }
      } finally {
        if (!cancelled) setLoadingSlots(false);
      }
    })();
    return ()=>{ cancelled = true; };
  }, [form.booking_date, form.sport_id]);

  const selectedSlot = availSlots.find(s => s.slot_time === form.slot_time);
  const maxDur = (selectedSlot && selectedSlot.max_duration) || 1;
  const hourOptions = Array.from({ length: sport.max_slots_per_booking || 3 }, (_, i) => i + 1);

  async function submit(){
    setErr(null);
    if(!form.customer_name.trim()){ setErr('Customer name required'); return; }
    if(normalizePhone(form.phone).length !== 10){ setErr('Valid 10-digit phone required'); return; }
    if(!form.slot_time){ setErr('Please pick an available time slot'); return; }
    setSubmitting(true);
    try {
      const result = await API.post('createSpotBooking', {
        customer_name: form.customer_name.trim(),
        phone: normalizePhone(form.phone),
        email: form.email.trim(),
        sport_id: form.sport_id,
        booking_date: form.booking_date,
        slot_time: form.slot_time,
        duration_hrs: parseInt(form.duration_hrs,10) || 1,
        members_count: parseInt(form.members_count,10)||1,
        amount: String(form.amount).trim() === '' ? undefined : parseInt(form.amount,10) || 0,
        payment_status: form.payment_status,
        payment_mode: form.payment_status === 'paid' ? form.payment_mode : '',
        use_pass: usePass ? 'true' : 'false'
      });
      onCreate(result);  // includes result.booking for optimistic UI
      onClose();
    } catch(e){ setErr(e.message); setSubmitting(false); }
  }

  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{
      position:'fixed', inset:0, background:'rgba(0,0,0,.5)', zIndex:140,
      display:'grid', placeItems:'center', padding:16, overflowY:'auto'
    }}>
      <div className="modal-inner" style={{
        background:'var(--surface)', borderRadius:16, padding:24, maxWidth:560, width:'100%',
        boxShadow:'0 24px 80px rgba(0,0,0,.3)', maxHeight:'92vh', overflowY:'auto'
      }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:18 }}>
          <div>
            <div style={{ fontSize:20, fontWeight:800 }}>Walk-in Booking</div>
            <div style={{ fontSize:12, color:'var(--text-4)', marginTop:2 }}>Quick add for customers at the venue</div>
          </div>
          <button onClick={onClose} style={{ fontSize:22, color:'var(--text-4)', padding:0, lineHeight:1 }}>×</button>
        </div>

        <div style={{ marginBottom:14 }}>
          <label style={lblStyle}>Sport</label>
          {sports.length === 0
            ? <div style={{ padding:14, background:'var(--danger-bg)', color:'var(--danger-text)', borderRadius:8, fontSize:13 }}>No active sports. Turn one on in the Sports tab.</div>
            : <SportPicker sports={sports} value={form.sport_id} onChange={id=>setForm(f => ({ ...f, sport_id:id }))}/>}
        </div>

        <div style={{ marginBottom:14 }}>
          <label style={lblStyle}>Date *</label>
          <input type="date" value={form.booking_date} onChange={e=>setForm({...form, booking_date:e.target.value})} style={inputStyle}/>
        </div>

        {/* Time slot grid */}
        <div style={{ marginBottom:18 }}>
          <label style={lblStyle}>
            Available Time Slots * {form.slot_time && <span style={{ color:'var(--success-text)', fontWeight:700, textTransform:'none', letterSpacing:0 }}>· Selected: {slotTimeText(sport, form.slot_time)}</span>}
          </label>
          {loadingSlots ? (
            <div style={{ padding:'20px 16px', background:'var(--surface-2)', borderRadius:8, textAlign:'center', display:'flex', alignItems:'center', justifyContent:'center', gap:10, color:'var(--text-3)', fontSize:13 }}>
              <Spinner small/> Loading available slots…
            </div>
          ) : availSlots.length === 0 ? (
            <div style={{ padding:'20px 16px', background:'var(--danger-bg)', border:'1px dashed var(--danger-border)', borderRadius:8, textAlign:'center', color:'var(--danger-text)', fontSize:13 }}>
              No {sport.name} slots available for this date.
            </div>
          ) : (
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(110px, 1fr))', gap:6, maxHeight:200, overflowY:'auto', padding:4, background:'var(--surface-2)', borderRadius:8, border:'1px solid var(--border)' }}>
              {availSlots.map(s => {
                const active = form.slot_time === s.slot_time;
                return (
                  <button key={s.slot_time} type="button" onClick={()=>setForm({...form, slot_time: s.slot_time, duration_hrs: 1})}
                    style={{
                      padding:'9px 8px', borderRadius:7,
                      background: active ? 'var(--accent)' : 'var(--surface)',
                      color: active ? 'var(--accent-ink)' : 'var(--text)',
                      border: '1.5px solid ' + (active ? 'var(--accent)' : 'var(--border)'),
                      fontSize:12, fontWeight:700, lineHeight:1.3, cursor:'pointer'
                    }}>
                    <div style={{ fontFamily:'monospace' }}>{slotTimeText(sport, s.slot_time)}</div>
                    {isPooled(sport) && <div style={{ fontSize:9, fontWeight:600, opacity:.8, marginTop:2 }}>{s.available} left</div>}
                    {s.max_duration > 1 && (
                      <div style={{ fontSize:9, fontWeight:600, opacity:.7, marginTop:1 }}>up to {isSession(sport) ? sessionQty(sport, s.max_duration) : `${s.max_duration}h`}</div>
                    )}
                  </button>
                );
              })}
            </div>
          )}
        </div>

        {/* Duration picker — only when a slot is selected */}
        {form.slot_time && (
          <div style={{ marginBottom:18 }}>
            <label style={lblStyle}>Duration {maxDur >= 2 && <span style={{ color:'var(--text-3)', fontWeight:600, textTransform:'none', letterSpacing:0 }}>· up to {isSession(sport) ? sessionQty(sport, maxDur) : `${maxDur} hours`} available</span>}</label>
            <div style={{ display:'grid', gridTemplateColumns:`repeat(${Math.min(hourOptions.length, 6)},1fr)`, gap:8 }}>
              {hourOptions.map(h => {
                const disabled = h > maxDur;
                const active = parseInt(form.duration_hrs,10) === h;
                return (
                  <button key={h} type="button" onClick={()=>!disabled && setForm({...form, duration_hrs:h})}
                    disabled={disabled}
                    style={{
                      padding:'12px 10px', borderRadius:8,
                      background: active ? 'var(--accent)' : 'var(--surface)',
                      color: active ? 'var(--accent-ink)' : (disabled ? 'var(--text-4)' : 'var(--text)'),
                      border: '1.5px solid ' + (active ? 'var(--accent)' : 'var(--border)'),
                      fontSize:13, fontWeight:700, cursor: disabled ? 'not-allowed' : 'pointer',
                      opacity: disabled ? 0.4 : 1
                    }}>
                    {isSession(sport) ? sessionQty(sport, h) : `${h} hr${h>1?'s':''}`}
                  </button>
                );
              })}
            </div>
          </div>
        )}

        <div className="form-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
          <div>
            <label style={lblStyle}>Customer Name *</label>
            <input value={form.customer_name} onChange={e=>setForm({...form, customer_name:e.target.value})} placeholder="Full name" style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Phone *</label>
            <input type="tel" value={form.phone} onChange={e=>setForm({...form, phone:e.target.value})} placeholder="98765 43210" style={inputStyle} maxLength={15}/>
          </div>
          <div>
            <label style={lblStyle}>Email</label>
            <input type="email" value={form.email} onChange={e=>setForm({...form, email:e.target.value})} placeholder="optional" style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Players</label>
            <input type="number" value={form.members_count} onChange={e=>setForm({...form, members_count:e.target.value})} min={1} max={30} style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Amount (₹)</label>
            <input type="number" value={form.amount} onChange={e=>setForm({...form, amount:e.target.value})}
              placeholder={`Auto · ${rupees(sport.price_per_slot)}/hr`} style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Payment Status</label>
            <select value={form.payment_status} onChange={e=>setForm({...form, payment_status:e.target.value})} style={inputStyle}>
              <option value="pending">Pending</option>
              <option value="paid">Paid</option>
            </select>
          </div>
          {form.payment_status === 'paid' && (
            <div style={{ gridColumn:'span 2' }}>
              <label style={lblStyle}>Payment Mode</label>
              <select value={form.payment_mode} onChange={e=>setForm({...form, payment_mode:e.target.value})} style={inputStyle}>
                <option value="cash">Cash</option>
                <option value="online">Online (UPI / card / transfer)</option>
              </select>
            </div>
          )}
        </div>
        <div style={{ fontSize:11, color:'var(--text-3)', marginTop:6 }}>Leave Amount blank and the server charges the sport's hourly price × hours.</div>
        {passInfo && passInfo.pass && (
          <div style={{ marginTop:12, padding:'12px 14px', borderRadius:10, background: passInfo.covered ? 'var(--success-bg)' : 'var(--warning-bg)', color: passInfo.covered ? 'var(--success-text)' : 'var(--warning-text)', fontSize:13, lineHeight:1.5 }}>
            <div style={{ fontWeight:800 }}>🎟️ {passInfo.pass.plan_label} · {passInfo.pass.member_id}{passInfo.pass.hours_left !== null ? ` · ${passInfo.pass.hours_left} hrs left` : ''}</div>
            {passInfo.covered ? (
              <label style={{ display:'flex', gap:8, alignItems:'center', marginTop:6, cursor:'pointer' }}>
                <input type="checkbox" checked={usePass} onChange={e=>setUsePass(e.target.checked)}/>
                <span>{passApplies ? 'Book on the pass — ₹0, marked paid (Pass).' : usePass ? 'Pass ignored because an amount is typed.' : 'Charge normally instead of using the pass.'}</span>
              </label>
            ) : <div style={{ marginTop:4 }}>{passInfo.reason || 'This pass does not cover the booking.'} Charging normally.</div>}
          </div>
        )}

        {err && <div style={{ background:'var(--danger-bg)', color:'var(--danger-text)', padding:'10px 14px', borderRadius:8, fontSize:13, marginTop:14 }}>{err}</div>}

        <div style={{ display:'flex', gap:8, marginTop:20, justifyContent:'flex-end' }}>
          <button onClick={onClose} style={{ padding:'11px 18px', background:'var(--surface-3)', color:'var(--text-2)', borderRadius:8, fontWeight:700, fontSize:13 }}>Cancel</button>
          <button onClick={submit} disabled={submitting || !form.slot_time} style={{ padding:'11px 22px', background: (submitting||!form.slot_time)?'var(--border-strong)':'var(--accent)', color: (submitting||!form.slot_time)?'var(--text-3)':'var(--accent-ink)', borderRadius:8, fontWeight:800, fontSize:13, display:'inline-flex', alignItems:'center', gap:8 }}>
            {submitting && <Spinner small/>}{submitting?'Creating…':'Create Booking'}
          </button>
        </div>
      </div>
    </div>
  );
}

const lblStyle = { display:'block', fontSize:11, fontWeight:700, color:'var(--text-3)', textTransform:'uppercase', letterSpacing:'.06em', marginBottom:6 };
const inputStyle = { width:'100%', padding:'10px 12px', border:'1.5px solid var(--border)', borderRadius:8, fontSize:14, outline:'none', background:'var(--surface)' };

// ──────────────────────────────────────────────────────────
// EDIT BOOKING MODAL — change sport, slot date/time, duration and amount
// ──────────────────────────────────────────────────────────
function EditBookingModal({ booking, onClose, onSave }){
  const cfg = useConfig();
  const [form, setForm] = useState({
    sport_id: booking.sport,
    booking_date: booking.booking_date,
    slot_id: booking.slot_id,
    slot_time: booking.slot_time,
    duration_hrs: booking.duration_hrs || 1,
    amount: '',            // blank → server rule (hourly rate × hours, or new sport's price)
    notes: booking.notes || '',
    members_count: booking.members_count || 1
  });
  const [availSlots, setAvailSlots] = useState([]);
  const [loadingSlots, setLoadingSlots] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [err, setErr] = useState(null);

  const current = cfg.sport(booking.sport);
  const sport = cfg.sport(form.sport_id);
  const sportChanged = form.sport_id !== booking.sport;
  // The booking's own sport stays selectable even if it has since been turned off or archived
  const sportOptions = cfg.bookable.some(s => s.sport_id === booking.sport) ? cfg.bookable : [current, ...cfg.bookable];
  const currentDur = booking.duration_hrs || 1;
  const maxHours = Math.max(sport.max_slots_per_booking || 3, currentDur);

  // Fetch open hours whenever date or sport changes. exclude_booking_id frees this booking's own slots,
  // so every hour listed is one updateBooking will accept (API_CONTRACT.md).
  useEffect(()=>{
    let cancelled = false;
    (async ()=>{
      setLoadingSlots(true);
      try {
        const hours = await loadSportHours(form.booking_date, form.sport_id, booking.booking_id);
        if (cancelled) return;
        const [startStr] = String(booking.slot_time).split('-');
        const keepCurrent = form.booking_date === booking.booking_date && !sportChanged;
        // The booking's own start hour keeps its slot_id, so the server keeps its current resource.
        const list = hours.map(h => keepCurrent && h.slot_time.startsWith(startStr + '-')
          ? { ...h, slot_id: booking.slot_id, _current: true } : h);
        if (keepCurrent) {
          const hasCurrent = list.some(s => s._current);
          if (!hasCurrent) {
            // Not listed because the hour has already started today; keep it selectable.
            // The booking's slot_time may span multiple hours (e.g. "14:00-17:00") — use the START hour.
            const [sh, sm] = startStr.split(':').map(Number);
            const startMin = sh * 60 + (sm || 0);
            const endMin = startMin + 60;
            const fmt = m => String(Math.floor(m/60)).padStart(2,'0') + ':' + String(m%60).padStart(2,'0');
            list.unshift({
              slot_id:   booking.slot_id,
              slot_date: booking.booking_date,
              slot_time: fmt(startMin) + '-' + fmt(endMin),
              resource:  booking.resource,
              max_duration: maxHours,
              _current:  true
            });
          }
        }
        setAvailSlots(list);
      } catch(e) {
        if (!cancelled) { setAvailSlots([]); setErr('Could not load slots: '+e.message); }
      } finally {
        if (!cancelled) setLoadingSlots(false);
      }
    })();
    return ()=>{ cancelled = true; };
  }, [form.booking_date, form.sport_id]);

  async function submit(){
    setErr(null);
    if (!form.slot_id) { setErr('Pick a slot'); return; }
    setSubmitting(true);
    try {
      await API.post('updateBooking', {
        id: booking.booking_id,
        slot_id: form.slot_id,
        sport_id: sportChanged ? form.sport_id : undefined,
        duration_hrs: parseInt(form.duration_hrs, 10) || 1,
        amount: String(form.amount).trim() === '' ? undefined : parseInt(form.amount, 10) || 0,
        notes: form.notes,
        members_count: parseInt(form.members_count, 10) || 1
      });
      onSave();
      onClose();
    } catch(e){ setErr(e.message); setSubmitting(false); }
  }

  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{
      position:'fixed', inset:0, background:'rgba(0,0,0,.5)', zIndex:140,
      display:'grid', placeItems:'center', padding:16, overflowY:'auto'
    }}>
      <div className="modal-inner" style={{
        background:'var(--surface)', borderRadius:16, padding:24, maxWidth:600, width:'100%',
        boxShadow:'0 24px 80px rgba(0,0,0,.3)', maxHeight:'92vh', overflowY:'auto'
      }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:18 }}>
          <div>
            <div style={{ fontSize:20, fontWeight:800 }}>Edit Booking</div>
            <div style={{ fontSize:12, color:'var(--text-4)', marginTop:2, fontFamily:'monospace' }}>{booking.booking_id} · {booking.customer_name}</div>
          </div>
          <button onClick={onClose} style={{ fontSize:22, color:'var(--text-4)', padding:0, lineHeight:1 }}>×</button>
        </div>

        <div style={{ background:'var(--surface-2)', padding:12, borderRadius:8, marginBottom:16, fontSize:13 }}>
          <div style={{ color:'var(--text-3)', fontSize:11, textTransform:'uppercase', letterSpacing:'.06em', fontWeight:700, marginBottom:4 }}>Current</div>
          <div><strong>{current.name}</strong> · {formatDateShort(booking.booking_date)} · {slotTimeText(current, booking.slot_time)}{isSession(current) ? ` · ${sessionQty(current, booking.duration_hrs)}` : ''} · {rupees(booking.amount)}</div>
        </div>

        <div style={{ marginBottom:14 }}>
          <label style={lblStyle}>Sport {sportChanged && <span style={{ textTransform:'none', color:'var(--accent-text)', fontWeight:700, letterSpacing:0 }}>· changing from {current.name}</span>}</label>
          <SportPicker sports={sportOptions} value={form.sport_id} onChange={id=>setForm(f => ({ ...f, sport_id:id, slot_id:'' }))}/>
        </div>

        <div style={{ marginBottom:14 }}>
          <label style={lblStyle}>Date</label>
          <input type="date" value={form.booking_date}
            onChange={e=>setForm({...form, booking_date:e.target.value, slot_id:''})}
            style={inputStyle}/>
        </div>

        <div style={{ marginBottom:16 }}>
          <label style={lblStyle}>
            Slot {form.slot_id && <span style={{ textTransform:'none', color:'var(--success-text)', fontWeight:700, letterSpacing:0 }}>· Selected</span>}
          </label>
          {loadingSlots ? (
            <div style={{ padding:'20px', background:'var(--surface-2)', borderRadius:8, textAlign:'center', display:'flex', alignItems:'center', justifyContent:'center', gap:10, color:'var(--text-3)', fontSize:13 }}>
              <Spinner small/> Loading slots…
            </div>
          ) : availSlots.length === 0 ? (
            <div style={{ padding:'20px', background:'var(--danger-bg)', border:'1px dashed var(--danger-border)', borderRadius:8, textAlign:'center', color:'var(--danger-text)', fontSize:13 }}>
              No slots available for this date.
            </div>
          ) : (
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(110px, 1fr))', gap:6, maxHeight:240, overflowY:'auto', padding:6, background:'var(--surface-2)', borderRadius:8, border:'1px solid var(--border)' }}>
              {availSlots.map(s => {
                const active = form.slot_id === s.slot_id;
                return (
                  <button key={s.slot_time} type="button"
                    onClick={()=>setForm({...form, slot_id:s.slot_id, slot_time:s.slot_time})}
                    style={{
                      padding:'9px 8px', borderRadius:7,
                      background: active ? 'var(--accent)' : (s._current ? 'var(--success-bg)' : 'var(--surface)'),
                      color: active ? 'var(--accent-ink)' : 'var(--text)',
                      border: '1.5px solid ' + (active ? 'var(--accent)' : (s._current ? 'var(--success)' : 'var(--border)')),
                      fontSize:12, fontWeight:700, lineHeight:1.3, cursor:'pointer'
                    }}>
                    <div style={{ fontFamily:'monospace' }}>{slotTimeText(sport, s.slot_time)}</div>
                    {s._current && <div style={{ fontSize:9, opacity:.8 }}>current</div>}
                    {isPooled(sport) && !s._current && <div style={{ fontSize:9, opacity:.7 }}>{s.available} left</div>}
                    {s.max_duration > 1 && !s._current && (
                      <div style={{ fontSize:9, opacity:.7 }}>up to {isSession(sport) ? sessionQty(sport, s.max_duration) : `${s.max_duration}h`}</div>
                    )}
                  </button>
                );
              })}
            </div>
          )}
        </div>

        {/* Duration picker — extend / shrink the booking */}
        {form.slot_id && (
          <div style={{ marginBottom:16 }}>
            <label style={lblStyle}>Duration <span style={{ color:'var(--text-3)', fontWeight:600, textTransform:'none', letterSpacing:0 }}>· extend or shrink the booking</span></label>
            <div style={{ display:'grid', gridTemplateColumns:`repeat(${Math.min(maxHours, 6)},1fr)`, gap:8 }}>
              {Array.from({ length: maxHours }, (_, i) => i + 1).map(h => {
                const active = parseInt(form.duration_hrs,10) === h;
                return (
                  <button key={h} type="button" onClick={()=>setForm({...form, duration_hrs:h})}
                    style={{
                      padding:'12px 10px', borderRadius:8,
                      background: active ? 'var(--accent)' : 'var(--surface)',
                      color: active ? 'var(--accent-ink)' : 'var(--text)',
                      border: '1.5px solid ' + (active ? 'var(--accent)' : 'var(--border)'),
                      fontSize:13, fontWeight:700, cursor:'pointer'
                    }}>
                    {isSession(sport) ? sessionQty(sport, h) : `${h} hr${h>1?'s':''}`}
                  </button>
                );
              })}
            </div>
            <div style={{ fontSize:11, color:'var(--text-3)', marginTop:6 }}>If consecutive slots aren't free, the system will show an error.</div>
          </div>
        )}

        <div className="form-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, marginBottom:6 }}>
          <div>
            <label style={lblStyle}>Amount (₹)</label>
            <input type="number" value={form.amount}
              onChange={e=>setForm({...form, amount:e.target.value})}
              placeholder={`Auto · now ${rupees(booking.amount)}`}
              style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Players</label>
            <input type="number" value={form.members_count}
              onChange={e=>setForm({...form, members_count:e.target.value})}
              min={1} style={inputStyle}/>
          </div>
        </div>
        <div style={{ fontSize:11, color:'var(--text-3)', marginBottom:14 }}>
          Leave Amount blank: the server keeps the hourly rate × new hours{sportChanged ? `, using ${sport.name}'s price` : ''}.
        </div>

        <div style={{ marginBottom:16 }}>
          <label style={lblStyle}>Notes</label>
          <textarea value={form.notes}
            onChange={e=>setForm({...form, notes:e.target.value})}
            style={{ ...inputStyle, minHeight:60, resize:'vertical' }}/>
        </div>

        {err && <div style={{ background:'var(--danger-bg)', color:'var(--danger-text)', padding:'10px 14px', borderRadius:8, fontSize:13, marginBottom:14 }}>{err}</div>}

        <div style={{ display:'flex', gap:8, justifyContent:'flex-end' }}>
          <button onClick={onClose} style={{ padding:'11px 18px', background:'var(--surface-3)', color:'var(--text-2)', borderRadius:8, fontWeight:700, fontSize:13 }}>Cancel</button>
          <button onClick={submit} disabled={submitting || !form.slot_id} style={{ padding:'11px 22px', background:(submitting||!form.slot_id)?'var(--border-strong)':'var(--accent)', color:(submitting||!form.slot_id)?'var(--text-3)':'var(--accent-ink)', borderRadius:8, fontWeight:800, fontSize:13, display:'inline-flex', alignItems:'center', gap:8 }}>
            {submitting && <Spinner small/>}{submitting?'Saving…':'Save Changes'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ──────────────────────────────────────────────────────────
// PASS MODAL (create/edit member)
// ──────────────────────────────────────────────────────────
function PassModal({ onClose, onCreate, editing }){
  const [form, setForm] = useState(editing ? {
    plan_key: editing.plan_key || PLANS[0].key,
    team_name: editing.team_name || '',
    contact_name: editing.contact_name || '',
    contact_phone: editing.contact_phone || '',
    contact_email: editing.contact_email || '',
    members_list: editing.members_list || '',
    start_date: editing.start_date || formatDateISO(new Date()),
    amount_paid: editing.amount_paid || '',
    hours_used: editing.hours_used ?? 0,
    notes: editing.notes || ''
  } : {
    plan_key: PLANS[0].key,
    team_name: '', contact_name: '', contact_phone: '', contact_email: '',
    members_list: '',
    start_date: formatDateISO(new Date()),
    amount_paid: '',
    notes: ''
  });
  const [submitting, setSubmitting] = useState(false);
  const [err, setErr] = useState(null);

  const plan = PLANS.find(p => p.key === form.plan_key);

  useEffect(()=>{
    if(!form.amount_paid && plan) setForm(f => ({ ...f, amount_paid: plan.price }));
  }, [form.plan_key]);

  async function submit(){
    setErr(null);
    if(!form.team_name.trim()){ setErr('Team name required'); return; }
    if(!form.contact_name.trim()){ setErr('Contact name required'); return; }
    if(normalizePhone(form.contact_phone).length !== 10){ setErr('Valid 10-digit phone required'); return; }
    setSubmitting(true);
    try {
      if(editing){
        await API.post('updateMember', {
          id: editing.member_id,
          team_name: form.team_name.trim(),
          contact_name: form.contact_name.trim(),
          contact_phone: normalizePhone(form.contact_phone),
          contact_email: form.contact_email.trim(),
          members_list: form.members_list.trim(),
          amount_paid: parseInt(form.amount_paid,10) || plan.price,
          hours_used: editing.hours_quota > 0 ? Math.max(0, parseInt(form.hours_used,10) || 0) : undefined,
          notes: form.notes.trim()
        });
      } else {
        await API.post('createMember', {
          plan_key: form.plan_key,
          team_name: form.team_name.trim(),
          contact_name: form.contact_name.trim(),
          contact_phone: normalizePhone(form.contact_phone),
          contact_email: form.contact_email.trim(),
          members_list: form.members_list.trim(),
          start_date: form.start_date,
          amount_paid: parseInt(form.amount_paid,10) || plan.price,
          notes: form.notes.trim()
        });
      }
      onCreate();
      onClose();
    } catch(e){ setErr(e.message); setSubmitting(false); }
  }

  const turfPlans = PLANS.filter(p => p.category === 'turf');
  const netPlans  = PLANS.filter(p => p.category === 'net');

  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()} style={{
      position:'fixed', inset:0, background:'rgba(0,0,0,.5)', zIndex:140,
      display:'grid', placeItems:'center', padding:16, overflowY:'auto'
    }}>
      <div className="modal-inner" style={{
        background:'var(--surface)', borderRadius:16, padding:24, maxWidth:560, width:'100%',
        boxShadow:'0 24px 80px rgba(0,0,0,.3)', maxHeight:'92vh', overflowY:'auto'
      }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:18 }}>
          <div>
            <div style={{ fontSize:20, fontWeight:800 }}>{editing ? 'Edit Member' : 'New Membership'}</div>
            <div style={{ fontSize:12, color:'var(--text-4)', marginTop:2 }}>{editing ? 'Update member details' : 'Issue a new turf or net pass'}</div>
          </div>
          <button onClick={onClose} style={{ fontSize:22, color:'var(--text-4)', padding:0, lineHeight:1 }}>×</button>
        </div>

        {!editing && (
          <div style={{ marginBottom:18 }}>
            <label style={lblStyle}>Plan</label>
            <select value={form.plan_key} onChange={e=>setForm({...form, plan_key:e.target.value, amount_paid:''})} style={inputStyle}>
              <optgroup label="Turf Passes">
                {turfPlans.map(p => <option key={p.key} value={p.key}>{p.label} · ₹{p.price.toLocaleString('en-IN')}</option>)}
              </optgroup>
              <optgroup label="Net Practice Packages">
                {netPlans.map(p => <option key={p.key} value={p.key}>{p.label} · ₹{p.price.toLocaleString('en-IN')}</option>)}
              </optgroup>
            </select>
            {plan && (
              <div style={{ marginTop:10, padding:'10px 14px', background:'var(--surface-2)', borderRadius:8, fontSize:12, color:'var(--text-3)', lineHeight:1.6 }}>
                <strong style={{ color:'var(--text)' }}>{plan.label}</strong> · {plan.days} day{plan.days>1?'s':''}
                {plan.max_members && <span> · Up to {plan.max_members} members</span>}
                {plan.hours_quota && <span> · {plan.hours_quota} hr quota</span>}
              </div>
            )}
          </div>
        )}

        <div className="form-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
          <div>
            <label style={lblStyle}>Team Name *</label>
            <input value={form.team_name} onChange={e=>setForm({...form, team_name:e.target.value})} placeholder="e.g. Eagles XI" style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Contact Name *</label>
            <input value={form.contact_name} onChange={e=>setForm({...form, contact_name:e.target.value})} style={inputStyle}/>
          </div>
          <div>
            <label style={lblStyle}>Phone *</label>
            <input type="tel" value={form.contact_phone} onChange={e=>setForm({...form, contact_phone:e.target.value})} style={inputStyle} maxLength={15}/>
          </div>
          <div>
            <label style={lblStyle}>Email</label>
            <input type="email" value={form.contact_email} onChange={e=>setForm({...form, contact_email:e.target.value})} style={inputStyle}/>
          </div>
          {!editing && (
            <div>
              <label style={lblStyle}>Start Date</label>
              <input type="date" value={form.start_date} onChange={e=>setForm({...form, start_date:e.target.value})} style={inputStyle}/>
            </div>
          )}
          <div>
            <label style={lblStyle}>Amount Paid (₹)</label>
            <input type="number" value={form.amount_paid} onChange={e=>setForm({...form, amount_paid:e.target.value})} style={inputStyle}/>
          </div>
          {editing && editing.hours_quota > 0 && (
            <div>
              <label style={lblStyle}>Hours Used (of {editing.hours_quota})</label>
              <input type="number" min={0} max={editing.hours_quota} value={form.hours_used} onChange={e=>setForm({...form, hours_used:e.target.value})} style={inputStyle}/>
            </div>
          )}
          <div style={{ gridColumn: 'span 2' }}>
            <label style={lblStyle}>Members List</label>
            <textarea value={form.members_list} onChange={e=>setForm({...form, members_list:e.target.value})} placeholder="Comma-separated names" style={{...inputStyle, minHeight:60, resize:'vertical', fontFamily:'inherit'}}/>
          </div>
          <div style={{ gridColumn: 'span 2' }}>
            <label style={lblStyle}>Notes</label>
            <input value={form.notes} onChange={e=>setForm({...form, notes:e.target.value})} style={inputStyle}/>
          </div>
        </div>

        {err && <div style={{ background:'var(--danger-bg)', color:'var(--danger-text)', padding:'10px 14px', borderRadius:8, fontSize:13, marginTop:14 }}>{err}</div>}

        <div style={{ display:'flex', gap:8, marginTop:20, justifyContent:'flex-end' }}>
          <button onClick={onClose} style={{ padding:'11px 18px', background:'var(--surface-3)', color:'var(--text-2)', borderRadius:8, fontWeight:700, fontSize:13 }}>Cancel</button>
          <button onClick={submit} disabled={submitting} style={{ padding:'11px 22px', background: submitting?'var(--border-strong)':'var(--ink)', color:'var(--on-ink)', borderRadius:8, fontWeight:800, fontSize:13, display:'inline-flex', alignItems:'center', gap:8 }}>
            {submitting && <Spinner small/>}{submitting?'Saving…':(editing?'Save Changes':'Create Pass')}
          </button>
        </div>
      </div>
    </div>
  );
}

function LeadModal({ onClose, onSave, editing }){

  const [form, setForm] = useState(editing ? {
    name: editing.name, phone: editing.phone, email: editing.email || '',
    sport: editing.sport || '', interest: editing.interest || '',
    status: editing.status || 'new', notes: editing.notes || ''
  } : { name:'', phone:'', email:'', sport:'', interest:'', status:'new', notes:'' });
  const [submitting, setSubmitting] = useState(false);
  const [err, setErr] = useState(null);

  async function submit(){
    setErr(null);
    if(!form.name.trim()){ setErr('Name required'); return; }
    if(normalizePhone(form.phone).length !== 10){ setErr('Valid 10-digit phone required'); return; }
    setSubmitting(true);
    try {
      if(editing){
        await API.post('updateLead', { id: editing.lead_id, ...form });
      } else {
        await API.post('createLead', {
          name: form.name.trim(),

          email: form.email.trim(),
          sport: form.sport,
          interest: form.interest,
          source: 'manual',

    }}>

        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:18 }}>
          <div style={{ fontSize:20, fontWeight:800 }}>{editing ? 'Edit Lead' : 'New Lead'}</div>

          <div><label style={lblStyle}>Phone *</label><input value={form.phone} onChange={e=>setForm({...form, phone:e.target.value})} style={inputStyle} maxLength={15}/></div>
          <div><label style={lblStyle}>Email</label><input value={form.email} onChange={e=>setForm({...form, email:e.target.value})} style={inputStyle}/></div>

              <option value="pass">Weekly/Monthly Pass</option>
              <option value="tournament">Tournament</option>
              <option value="coaching">Coaching</option>
            </select>
          </div>
          {editing && (
            <div><label style={lblStyle}>Status</label>
              <select value={form.status} onChange={e=>setForm({...form, status:e.target.value})} style={inputStyle}>
                <option>new</option><option>contacted</option><option>qualified</option><option>converted</option><option>lost</option>
              </select>

          <div style={{ gridColumn: 'span 2' }}><label style={lblStyle}>Notes</label><input value={form.notes} onChange={e=>setForm({...form, notes:e.target.value})} style={inputStyle}/></div>

// BOOKING DETAIL DRAWER — slide-in right panel with all info & actions

function DrawerSection({ title, children, right }){
  return (
    <div style={{ padding:'16px 22px', borderBottom:'1px solid var(--border-subtle)' }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
        <div style={{ fontSize:11, fontWeight:700, color:'var(--text-4)', textTransform:'uppercase', letterSpacing:'.07em' }}>{title}</div>
        {right}
      </div>
      {children}
    </div>
  );
}

function InfoRow({ label, value, mono, highlight }){
  return (
    <div style={{ display:'flex', justifyContent:'space-between', padding:'5px 0', fontSize:13, gap:12 }}>
      <div style={{ color:'var(--text-3)', flexShrink:0 }}>{label}</div>
      <div style={{
        color:'var(--text)', fontWeight: highlight ? 800 : 600, fontSize: highlight ? 14 : 13,
        fontFamily: mono ? "'JetBrains Mono', ui-monospace, monospace" : 'inherit', textAlign:'right', minWidth:0, overflowWrap:'anywhere'
      }}>{value}</div>
    </div>
  );
}

function StatusPill({ bg, text, label }){
  return <span style={{ fontSize:11.5, fontWeight:700, padding:'2px 10px', background:bg, color:text, borderRadius:999, whiteSpace:'nowrap', lineHeight:1.6 }}>{label}</span>;
}

function ActionBtn({ as, href, target, onClick, icon, label, disabled, variant }){
  const cls = `btn ${variant ? 'btn-' + variant : ''}`;
  const inner = <>{icon && <Icon name={icon}/>}{label}</>;
  if (as === 'a' && !disabled) return <a href={href} target={target} rel="noopener" className={cls}>{inner}</a>;
  return <button onClick={onClick} disabled={disabled} className={cls}>{inner}</button>;
}

function formatDateFull(iso){
  if (!iso) return '';
  return new Date(iso + 'T00:00:00').toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function formatDateTime(ts){
  if (!ts) return '';
  return new Date(ts).toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'numeric', minute:'2-digit', hour12:true });
}

const VENUE_MAPS = 'https://maps.app.goo.gl/N9pPgv9PESbgRMFY7';
const INVOICE_URL = API_URL.replace(/\/api$/, '/api/invoice');
function invoiceLink(no, pdf){
  const key = sessionStorage.getItem('hnr_admin_key') || '';
  return `${INVOICE_URL}?no=${encodeURIComponent(no)}&adminKey=${encodeURIComponent(key)}${pdf ? '&format=pdf' : ''}`;
}
const LEDGER_LABEL = {
  captured:['Received','p-success'], collected:['Collected','p-success'], failed:['Failed','p-danger'],
  refund_pending:['Refund pending','p-warning'], refunded:['Refunded','p-muted'], refund_failed:['Refund failed','p-danger'],
  superseded:['Not completed','p-muted']
};
// A failed advance attempt on a booking whose advance was paid by another attempt
// (customer switched UPI app / method inside the same checkout). Not a real failure.
const SUPERSEDED_NOTE = 'Unfinished attempt. Customer paid with another attempt, nothing was charged.';
function paidBookingIds(payments){
  return new Set((payments || []).filter(p => p.kind === 'advance' && p.status !== 'failed').map(p => p.booking_id));
}
function ledgerView(p, paidSet){
  if (p.status === 'failed' && p.kind === 'advance' && paidSet.has(p.booking_id)) return { status:'superseded', note: SUPERSEDED_NOTE };
  return { status: p.status, note: p.error || '' };
}
const KIND_LABEL = { advance:'Online advance', balance:'Balance at venue', full:'Paid at venue', refund:'Refund' };

function BookingDetailDrawer({ booking, allBookings, onClose, onMarkPaid, onEdit, onCancel, onChanged, ok, err }){
  const cfg = useConfig();
  const [ledger, setLedger] = useState(null);
  const [busy, setBusy] = useState(null);
  const bid = booking && booking.booking_id;

  const loadLedger = useCallback(async () => {
    if (!bid) return;
    try { setLedger(await API.get('getBookingPayments', { id: bid })); } catch(_) { setLedger({ payments: [], invoice: null }); }
  }, [bid]);
  useEffect(()=>{ setLedger(null); loadLedger(); }, [bid, booking && booking.payment_status, booking && booking.status, booking && booking.invoice_no]);

  if (!booking) return null;
  const sp = cfg.sport(booking.sport);
  const sc = sp.color;

  const customerBookings = (allBookings || [])
    .filter(b => b.phone === booking.phone && b.booking_id !== booking.booking_id && ['confirmed','cancelled'].includes(b.status))
    .sort((a, b) => String(b.created_at || b.booking_date || '').localeCompare(String(a.created_at || a.booking_date || '')))
    .slice(0, 6);

  const isCancelled = booking.status === 'cancelled';
  const isPending = booking.status === 'pending_payment' || booking.status === 'expired';
  const isPaid = booking.payment_status === 'paid';
  const online = !!booking.rzp_payment_id;
  const todayIso = formatDateISO(new Date());
  const isToday = booking.booking_date === todayIso;
  const isFuture = booking.booking_date > todayIso;
  const pb = paymentBadge(booking);
  const amount = Number(booking.amount) || 0;
  const paid = isPaid ? amount : (Number(booking.amount_paid) || 0);
  const due = Math.max(0, amount - paid);
  const refundable = online ? (Number(booking.advance_amount) || 0) - (Number(booking.refund_amount) || 0) : 0;

  const phoneDigits = String(booking.phone || '').replace(/\D/g,'').slice(-10);
  const waMessage = encodeURIComponent(
    `Hi ${booking.customer_name}, this is Hit N Run Sports Arena.\n\n` +
    `Your booking for ${sp.name} on ${formatDateShort(booking.booking_date)} at ${slotTimeText(sp, booking.slot_time)}${isSession(sp) ? ` (${sessionQty(sp, booking.duration_hrs)})` : ''} is confirmed.\n` +
    `Booking ID: ${booking.booking_id}\n` +
    (isPaid
      ? 'Payment received, thank you!'
      : paid > 0
        ? `Advance of ₹${paid.toLocaleString('en-IN')} received. Please pay the balance ₹${due.toLocaleString('en-IN')} at the venue (cash or online).`
        : `Please pay ₹${amount.toLocaleString('en-IN')} at the venue (cash or online).`) +
    `\n\nVenue location: ${VENUE_MAPS}`
  );
  const waUrl   = phoneDigits.length === 10 ? `https://wa.me/91${phoneDigits}?text=${waMessage}` : '#';
  const telUrl  = phoneDigits.length === 10 ? `tel:+91${phoneDigits}` : '#';

  async function run(label, fn, msg){
    setBusy(label);
    try { const r = await fn(); ok(typeof msg === 'function' ? msg(r) : msg); await loadLedger(); onChanged && onChanged(); }
    catch(e){ err(e.message); }
    finally { setBusy(null); }
  }
  const issueInvoice = (email) => run(email ? 'email' : 'issue', () => API.post('issueInvoice', { id: booking.booking_id, email }),
    r => email ? (r.emailed ? `Invoice ${r.invoice_no} emailed` : `Invoice ${r.invoice_no} ready (email not sent)`) : `Invoice ${r.invoice_no} issued`);
  const refund = () => {
    const v = prompt(`Refund how much? Up to ₹${refundable} (the online advance) can be refunded.`, String(refundable));
    if (v === null) return;
    const amt = parseInt(v, 10);
    if (!(amt > 0) || amt > refundable) { err(`Enter an amount between 1 and ${refundable}`); return; }
    run('refund', () => API.post('refundBooking', { id: booking.booking_id, amount: amt }), r => `Refund of ₹${r.refunded} started`);
  };
  const inv = ledger && ledger.invoice;

  return (
    <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget && onClose()} style={{ placeItems:'stretch', justifyContent:'flex-end', display:'flex', padding:0 }}>
      <div role="dialog" aria-label="Booking details" style={{
        width:'min(480px, 100vw)', height:'100vh', background:'var(--surface)', borderLeft:'1px solid var(--border)',
        boxShadow:'var(--shadow-lg)', overflowY:'auto', animation:'drawerSlide .22s ease-out'
      }}>
        {/* Header */}
        <div style={{ padding:'18px 22px 16px', borderBottom:'1px solid var(--border)', position:'sticky', top:0, background:'var(--surface)', zIndex:1 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8 }}>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:20, fontWeight:800, letterSpacing:'-.02em', lineHeight:1.2 }}>{booking.customer_name}</div>
              <div style={{ fontSize:13, color:'var(--text-3)', marginTop:4 }}>
                {formatPhone(booking.phone)}{booking.email && <> · {booking.email}</>}
              </div>
            </div>
            <button onClick={onClose} className="btn btn-icon btn-ghost" aria-label="Close"><Icon name="x" size={18}/></button>
          </div>
          <div style={{ display:'flex', gap:6, marginTop:12, flexWrap:'wrap' }}>
            <StatusPill bg={sc.bg} text={sc.text} label={sp.name}/>
            {booking.resource && <StatusPill bg='var(--surface-3)' text='var(--text-2)' label={cfg.resourceLabel(booking.resource)}/>}
            <StatusPill bg={pb.bg} text={pb.text} label={pb.label}/>
            {booking.source === 'online' && <StatusPill bg='var(--accent-soft)' text='var(--accent-text)' label='Online'/>}
            {isToday && !isCancelled && !isPending && <StatusPill bg='var(--info-bg)' text='var(--info-text)' label='Today'/>}
            {isFuture && !isCancelled && !isPending && <StatusPill bg='var(--violet-bg)' text='var(--violet-text)' label='Upcoming'/>}
          </div>
        </div>

        {/* Quick actions */}
        {!isCancelled && !isPending && (
          <div style={{ padding:'14px 22px', borderBottom:'1px solid var(--border-subtle)', display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
            {!isPaid && <ActionBtn onClick={()=>onMarkPaid(booking.booking_id, due)} variant='primary' icon='check' label={paid > 0 ? `Collect ₹${due.toLocaleString('en-IN')}` : 'Mark paid'}/>}
            <ActionBtn as='a' href={waUrl} target='_blank' icon='message' label='WhatsApp' disabled={phoneDigits.length !== 10}/>
            <ActionBtn as='a' href={telUrl} icon='phone' label='Call' disabled={phoneDigits.length !== 10}/>
            <ActionBtn onClick={()=>onEdit(booking)} icon='edit' label='Edit'/>
          </div>
        )}

        <DrawerSection title='Booking'>
          <InfoRow label='Booking ID' value={booking.booking_id} mono/>
          <InfoRow label='Date' value={formatDateFull(booking.booking_date)}/>
          <InfoRow label='Time' value={slotTimeText(sp, booking.slot_time)} highlight/>
          {isSession(sp)
            ? <InfoRow label='Session' value={sessionQty(sp, booking.duration_hrs)} highlight/>
            : booking.duration_hrs > 1 && <InfoRow label='Duration' value={`${booking.duration_hrs} hours`} highlight/>}
          <InfoRow label='Players' value={booking.members_count || 1}/>
          {booking.created_at && <InfoRow label='Booked' value={formatDateTime(booking.created_at)}/>}
          {isCancelled && <InfoRow label='Cancelled' value={`${booking.cancelled_by ? 'by ' + booking.cancelled_by : ''}${booking.cancelled_at ? ' · ' + formatDateTime(booking.cancelled_at) : ''}`}/>}
          {booking.cancel_reason && <InfoRow label='Reason' value={booking.cancel_reason}/>}

                  <a className="btn btn-sm" href={invoiceLink(inv.invoice_no)} target="_blank" rel="noopener"><Icon name="eye" size={14}/> View</a>

              {customerBookings.map(b => {
                const bb = paymentBadge(b);

                        {isSession(cfg.sport(b.sport)) ? `${startTime12(b.slot_time)} (${sessionQty(cfg.sport(b.sport), b.duration_hrs)})` : <>{slotRange12(b.slot_time)}{b.duration_hrs > 1 ? ` (${b.duration_hrs}h)` : ''}</>}

          <div style={{ padding:'18px 22px 24px' }}>
            <button onClick={()=>onCancel(booking)} className="btn btn-danger" style={{ width:'100%', height:40 }}>
