        )}
      </div>
    </div>
  );
}

function CancelBookingModal({ booking, onClose, onDone, ok, err }){
  const online = !!booking.rzp_payment_id;
  const refundable = online ? (Number(booking.advance_amount) || 0) - (Number(booking.refund_amount) || 0) : 0;
  const [refund, setRefund] = useState(refundable > 0);
  const [amount, setAmount] = useState(String(refundable));
  const [reason, setReason] = useState('');
  const [notify, setNotify] = useState(!!booking.email);
  const [busy, setBusy] = useState(false);
  async function go(){
    const amt = parseInt(amount, 10);
    if (refund && (!(amt > 0) || amt > refundable)) { err(`Refund must be between 1 and ${refundable}`); return; }
    setBusy(true);
    try {
      const r = await API.post('cancelBooking', { id: booking.booking_id, refund: refund && refundable > 0, refund_amount: refund ? amt : 0, reason, notify });
      ok(r.message || 'Booking cancelled');
      onDone();
    } catch(e){ err(e.message); setBusy(false); }
  }
  return (
    <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget && onClose()}>
      <div className="modal modal-inner" style={{ padding:24, maxWidth:460 }}>
        <div style={{ fontSize:17, fontWeight:800, marginBottom:6 }}>Cancel booking {booking.booking_id}?</div>
        <div className="muted" style={{ fontSize:13.5, marginBottom:16, lineHeight:1.6 }}>
          {booking.customer_name}'s slots will be freed for others. {online ? `They paid ${rupees(booking.advance_amount)} online.` : 'Nothing was paid online.'}
        </div>
        <div className="stack">
          {refundable > 0 && (
            <label className="row" style={{ fontSize:13.5, fontWeight:600, cursor:'pointer' }}>
              <input type="checkbox" checked={refund} onChange={e=>setRefund(e.target.checked)}/> Refund the online advance
            </label>
          )}
          {refund && refundable > 0 && (
            <div className="field">
              <label className="label">Refund amount (max {rupees(refundable)})</label>
              <input className="input" type="number" min={1} max={refundable} value={amount} onChange={e=>setAmount(e.target.value)}/>
            </div>
          )}
          <div className="field">
            <label className="label">Reason (shown to the customer)</label>
            <input className="input" value={reason} onChange={e=>setReason(e.target.value)} placeholder="e.g. Rain, maintenance, customer request"/>
          </div>
          {booking.email && booking.status === 'confirmed' && (
            <label className="row" style={{ fontSize:13.5, cursor:'pointer' }}>
              <input type="checkbox" checked={notify} onChange={e=>setNotify(e.target.checked)}/> Email the customer
            </label>
          )}
        </div>
        <div style={{ display:'flex', gap:8, justifyContent:'flex-end', marginTop:20 }}>
          <button className="btn" onClick={onClose}>Keep booking</button>
          <button className="btn btn-danger" disabled={busy} onClick={go}>{busy ? 'Cancelling…' : refund && refundable > 0 ? `Cancel & refund ₹${parseInt(amount,10)||0}` : 'Cancel booking'}</button>
        </div>
      </div>
    </div>
  );
}

const ICON_SUGGESTIONS = ['🏏','⚽','🏐','🥅','🎯','🏸','🎾','🏀','🏓','🏑'];
const ID_RE = /^[a-z0-9-]{2,30}$/;   // sport_id / resource_id rule from API_CONTRACT.md
const isInt = v => /^-?\d+$/.test(String(v).trim());
function slugify(s){ return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30); }

function sportStatus(s){
  if (s.archived)        return { label:'Archived',     bg:'var(--surface-3)', text:'var(--text-3)' };
  if (!s.active)         return { label:'Hidden',       bg:'var(--danger-bg)', text:'var(--danger-text)' };
  if (!s.online_booking) return { label:'Walk-in only', bg:'var(--warning-bg)', text:'var(--warning-text)' };
  return                        { label:'Active',       bg:'var(--success-bg)', text:'var(--success-text)' };
}
function impactLine(n){
  return n ? `${n} upcoming booking${n > 1 ? 's' : ''} will still be honoured.` : 'No upcoming bookings are affected.';
}

// Mirrors the backend's sport validation table (API_CONTRACT.md → "Sport validation").
function validateSport(f, isCreate, sports){
  const e = {};
  if (isCreate) {
    if (!ID_RE.test(f.sport_id)) e.sport_id = 'Use 2–30 lowercase letters, digits or dashes.';
    else if (sports.some(s => s.sport_id === f.sport_id)) e.sport_id = `Sport id "${f.sport_id}" already exists.`;
  }
  const name = f.name.trim();
  if (name.length < 1 || name.length > 40) e.name = 'Name must be 1–40 characters.';
  if (!isInt(f.price_per_slot) || +f.price_per_slot < 50 || +f.price_per_slot > 50000) e.price_per_slot = 'Whole rupees, 50–50000.';
  if (!f.resource_pool.length) e.resource_pool = 'Pick at least one resource.';
  const mc = String(f.max_concurrent).trim();
  if (mc !== '' && (!isInt(mc) || +mc < 1 || +mc > f.resource_pool.length)) e.max_concurrent = `Blank (= all), or 1–${f.resource_pool.length || 1}.`;
  if (!isInt(f.max_slots_per_booking) || +f.max_slots_per_booking < 1 || +f.max_slots_per_booking > 6) e.max_slots_per_booking = 'Whole hours, 1–6.';
  if (!isInt(f.sort_order)) e.sort_order = 'Whole number.';
  if (f.pricing_mode === 'session') {
    if (!isInt(f.session_qty) || +f.session_qty < 1 || +f.session_qty > 1000) e.session_qty = 'Whole number, 1–1000.';
    const u = f.session_unit.trim();
    if (u.length < 1 || u.length > 20) e.session_unit = 'Unit must be 1–20 characters.';
  }
  return e;
}

function Toggle({ on, onChange, disabled, label }){
  return (
    <button type="button" role="switch" aria-checked={on} aria-label={label} title={label} disabled={disabled}
      onClick={()=>onChange(!on)} style={{
        width:40, height:22, borderRadius:99, background: on ? 'var(--success)' : 'var(--border-strong)', position:'relative',
        flexShrink:0, opacity: disabled ? .5 : 1, cursor: disabled ? 'not-allowed' : 'pointer', transition:'background .15s'
      }}>
      <span style={{ position:'absolute', top:2, left: on ? 20 : 2, width:18, height:18, borderRadius:'50%', background:'var(--surface)', boxShadow:'0 1px 3px rgba(0,0,0,.2)', transition:'left .15s' }}/>
    </button>
  );
}

function FieldErr({ msg }){ return msg ? <div style={{ fontSize:11, color:'var(--danger-text)', marginTop:4, fontWeight:600 }}>{msg}</div> : null; }

function SportDrawer({ sport, onClose, onSaved }){
  const cfg = useConfig();
  const isCreate = !sport;
  const nextSort = Math.max(0, ...cfg.sports.map(s => s.sort_order || 0)) + 10;
  const [f, setF] = useState(() => sport ? {
    sport_id: sport.sport_id, name: sport.name || '', icon: sport.icon || '', tagline: sport.tagline || '',
    unit_label: sport.unit_label || '', price_per_slot: String(sport.price_per_slot ?? ''),
    resource_pool: sport.resource_pool || [], max_concurrent: sport.max_concurrent == null ? '' : String(sport.max_concurrent),
    max_slots_per_booking: String(sport.max_slots_per_booking ?? 3), online_booking: sport.online_booking !== false,
    pricing_mode: sport.pricing_mode === 'session' ? 'session' : 'hourly',
    session_qty: sport.session_qty == null ? '' : String(sport.session_qty), session_unit: sport.session_unit || '',
    sort_order: String(sport.sort_order ?? 0)
  } : {
    sport_id:'', name:'', icon:'', tagline:'', unit_label:'', price_per_slot:'', resource_pool:[],
    max_concurrent:'', max_slots_per_booking:'3', online_booking:true, sort_order:String(nextSort),
    pricing_mode:'hourly', session_qty:'', session_unit:''
  });
  const [slugTouched, setSlugTouched] = useState(false);
  const [touched, setTouched] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const [serverErr, setServerErr] = useState(null);
  const [saving, setSaving] = useState(false);
  const [archiveText, setArchiveText] = useState(null);   // null = archive confirm closed

  const errors = validateSport(f, isCreate, cfg.sports);
  const show = k => (submitted || touched[k]) ? errors[k] : null;
  const blur = k => () => setTouched(t => ({ ...t, [k]: true }));
  const set = (k, v) => setF(prev => {
    const next = { ...prev, [k]: v };
    if (k === 'name' && isCreate && !slugTouched) next.sport_id = slugify(v);
    return next;
  });
  function togglePool(id){
    // keep the existing pool order (it is the auto-assign order); new picks go last
    setF(prev => ({ ...prev, resource_pool: prev.resource_pool.includes(id) ? prev.resource_pool.filter(x => x !== id) : [...prev.resource_pool, id] }));
    setTouched(t => ({ ...t, resource_pool: true }));
  }

  async function save(){
    setSubmitted(true); setServerErr(null);
    if (Object.keys(errors).length) return;
    setSaving(true);
    try {
      const saved = await API.post(isCreate ? 'createSport' : 'updateSport', {
        sport_id: f.sport_id.trim(), name: f.name.trim(), icon: f.icon.trim(), tagline: f.tagline.trim(),
        unit_label: f.unit_label.trim(), price_per_slot: +f.price_per_slot, resource_pool: f.resource_pool,
        max_concurrent: String(f.max_concurrent).trim() === '' ? null : +f.max_concurrent,
        max_slots_per_booking: +f.max_slots_per_booking, online_booking: f.online_booking, sort_order: +f.sort_order,
        pricing_mode: f.pricing_mode,
        session_qty: f.pricing_mode === 'session' ? +f.session_qty : null,
        session_unit: f.pricing_mode === 'session' ? f.session_unit.trim() : null
      });
      onSaved(isCreate ? `${saved.name} created. It stays hidden until you turn it on.` : `${saved.name} saved`, saved);
    } catch(e){ setServerErr(e.message); setSaving(false); }
  }

  async function archive(){
    setServerErr(null); setSaving(true);
    try {
      const r = await API.post('archiveSport', { sport_id: sport.sport_id });
      onSaved(`${sport.name} archived. ${impactLine(r.impact ? r.impact.count : 0)}`, r.sport);
    } catch(e){ setServerErr(e.message); setSaving(false); }
  }

  const sectionLbl = { ...lblStyle, marginTop:14 };
  return (
    <div onClick={e=>e.target===e.currentTarget && onClose()} style={{
      position:'fixed', inset:0, background:'rgba(15,23,42,.55)', zIndex:150, display:'flex', justifyContent:'flex-end'
    }}>
      <div style={{ width:'min(480px, 100vw)', height:'100vh', background:'var(--surface)', boxShadow:'-20px 0 60px rgba(0,0,0,.2)', overflowY:'auto', animation:'drawerSlide .25s ease-out' }}>
        <div style={{ padding:'20px 22px 14px', borderBottom:'1px solid var(--border)', position:'sticky', top:0, background:'var(--surface)', zIndex:1, display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
          <div>
            <div style={{ fontSize:20, fontWeight:800 }}>{isCreate ? 'Add sport' : sport.name}</div>
            {!isCreate && <div style={{ fontSize:12, color:'var(--text-3)', marginTop:3, fontFamily:'monospace' }}>{sport.sport_id}</div>}
          </div>
          <button onClick={onClose} style={{ fontSize:26, color:'var(--text-4)', lineHeight:1 }}>×</button>
        </div>

        <div style={{ padding:'6px 22px 24px' }}>
          <label style={sectionLbl}>Name *</label>
          <input value={f.name} onChange={e=>set('name', e.target.value)} onBlur={blur('name')} maxLength={40} style={inputStyle} placeholder="e.g. Bowling Machine Practice"/>
          <FieldErr msg={show('name')}/>

          <label style={sectionLbl}>Sport id {isCreate ? '*' : '(read-only)'}</label>
          <input value={f.sport_id} readOnly={!isCreate}
            onChange={e=>{ setSlugTouched(true); set('sport_id', e.target.value.toLowerCase()); }} onBlur={blur('sport_id')}
            style={{ ...inputStyle, fontFamily:'monospace', background: isCreate ? 'var(--surface)' : 'var(--surface-3)', color: isCreate ? 'var(--text)' : 'var(--text-3)' }}/>
          {isCreate && <div style={{ fontSize:11, color:'var(--text-3)', marginTop:4 }}>Suggested from the name. Permanent once created.</div>}
          <FieldErr msg={show('sport_id')}/>

          <label style={sectionLbl}>Icon</label>
          <div style={{ display:'flex', gap:6, alignItems:'center', flexWrap:'wrap' }}>
            <input value={f.icon} onChange={e=>set('icon', e.target.value)} style={{ ...inputStyle, width:64, fontSize:20, textAlign:'center', padding:'6px' }} aria-label="Icon emoji"/>
            {ICON_SUGGESTIONS.map(ic => (
              <button key={ic} type="button" onClick={()=>set('icon', ic)} style={{
                fontSize:18, width:34, height:34, borderRadius:8, border:'1.5px solid ' + (f.icon===ic ? 'var(--accent)' : 'var(--border)'), background:'var(--surface)'
              }}>{ic}</button>
            ))}
          </div>

          <label style={sectionLbl}>Tagline</label>
          <input value={f.tagline} onChange={e=>set('tagline', e.target.value)} style={inputStyle} placeholder="Shown under the name on the website"/>

          <label style={sectionLbl}>Charge per</label>
          <div role="radiogroup" aria-label="Charge per" style={{ display:'inline-flex', gap:4, padding:3, background:'var(--surface-3)', borderRadius:10 }}>

              }}>{label}</button>

          </div>

          {f.pricing_mode === 'session' ? (
            <div className="form-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:12 }}>

                <label style={sectionLbl}>Price (₹) *</label>

              <div>
                <label style={sectionLbl}>Qty *</label>

              </div>
              <div>
                <label style={sectionLbl}>Unit *</label>
                <input value={f.session_unit} onChange={e=>set('session_unit', e.target.value)} onBlur={blur('session_unit')} maxLength={20} style={inputStyle} placeholder="overs"/>
                <FieldErr msg={show('session_unit')}/>
              </div>
            </div>
          ) : (
            <div className="form-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
              <div>
                <label style={sectionLbl}>Price per hour (₹) *</label>
                <input type="number" value={f.price_per_slot} onChange={e=>set('price_per_slot', e.target.value)} onBlur={blur('price_per_slot')} style={inputStyle}/>
                <FieldErr msg={show('price_per_slot')}/>
              </div>
              <div>
                <label style={sectionLbl}>Unit label</label>
                <input value={f.unit_label} onChange={e=>set('unit_label', e.target.value)} style={inputStyle} placeholder="e.g. 20 overs"/>
              </div>

          )}
          {f.pricing_mode === 'session' && isInt(f.session_qty) && f.session_unit.trim() && isInt(f.price_per_slot) && (
            <div style={{ fontSize:11, color:'var(--text-3)', marginTop:4 }}>Customers see "{rupees(f.price_per_slot)} · {f.session_qty} {f.session_unit.trim()}". Each session uses a 1-hour slot.</div>

          {!isCreate && String(sport.price_per_slot) !== String(f.price_per_slot).trim() && !errors.price_per_slot && (

              <input type="number" value={f.max_slots_per_booking} onChange={e=>set('max_slots_per_booking', e.target.value)} onBlur={blur('max_slots_per_booking')} min={1} max={6} style={inputStyle}/>
              <FieldErr msg={show('max_slots_per_booking')}/>

          <div className="form-grid-2" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12, alignItems:'end' }}>

              <label style={sectionLbl}>Show on website</label>
              <div style={{ display:'flex', alignItems:'center', gap:8, fontSize:13, padding:'8px 0' }}>
                <Toggle on={f.online_booking} onChange={v=>set('online_booking', v)} label="Show on website"/>

            <div>

          {serverErr && <div style={{ background:'var(--danger-bg)', color:'var(--danger-text)', padding:'10px 14px', borderRadius:8, fontSize:13, marginTop:16 }}>{serverErr}</div>}

            <button onClick={onClose} style={{ padding:'11px 18px', background:'var(--surface-3)', color:'var(--text-2)', borderRadius:8, fontWeight:700, fontSize:13 }}>Cancel</button>
            <button onClick={save} disabled={saving} style={{ padding:'11px 22px', background: saving ? 'var(--border-strong)' : 'var(--accent)', color:'var(--accent-ink)', borderRadius:8, fontWeight:800, fontSize:13, display:'inline-flex', alignItems:'center', gap:8 }}>
              {saving && <Spinner small/>}{isCreate ? 'Create sport' : 'Save changes'}
            </button>
          </div>

          {!isCreate && !sport.archived && (
            <div style={{ marginTop:28, paddingTop:18, borderTop:'1px solid var(--border-subtle)' }}>
              {archiveText === null ? (
                <button onClick={()=>setArchiveText('')} style={{ width:'100%', padding:'11px', background:'var(--danger-bg)', color:'var(--danger-text)', border:'1px solid var(--danger-border)', borderRadius:10, fontWeight:700, fontSize:13 }}>Archive sport…</button>
              ) : (
                <div style={{ background:'var(--danger-bg)', border:'1px solid var(--danger-border)', borderRadius:10, padding:14 }}>
                  <div style={{ fontSize:13, color:'var(--danger-text)', marginBottom:8, lineHeight:1.5 }}>
                    Archiving hides <strong>{sport.name}</strong> everywhere and stops new bookings. Existing bookings are honoured. Type <strong>{sport.name}</strong> to confirm.
                  </div>
                  <input value={archiveText} onChange={e=>setArchiveText(e.target.value)} style={inputStyle} aria-label="Type the sport name to confirm" autoFocus/>
                  <div style={{ display:'flex', gap:8, marginTop:10, justifyContent:'flex-end' }}>
                    <button onClick={()=>setArchiveText(null)} style={{ padding:'9px 14px', background:'var(--surface)', borderRadius:8, fontWeight:700, fontSize:12 }}>Cancel</button>
                    <button onClick={archive} disabled={archiveText !== sport.name || saving} style={{ padding:'9px 14px', background: archiveText === sport.name ? 'var(--danger)' : 'var(--danger-border)', color:'var(--on-ink)', borderRadius:8, fontWeight:800, fontSize:12 }}>Archive</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function ResourceRow({ r, onToggle, onSaveConflicts, busy }){
  const cfg = useConfig();
  const saved = r.conflicts || [];
  const [draft, setDraft] = useState(saved);
  useEffect(()=>{ setDraft(saved); }, [saved.join(',')]);
  const dirty = [...draft].sort().join() !== [...saved].sort().join();
  const others = cfg.resources.filter(x => x.resource_id !== r.resource_id);
  const usedBy = cfg.sports.filter(sp => !sp.archived && (sp.resource_pool || []).includes(r.resource_id));
  return (
    <div style={{ border:'1px solid var(--border)', borderRadius:10, padding:'12px 14px', opacity: r.active ? 1 : .85, background: r.active ? 'var(--surface)' : 'var(--surface-2)' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:10, flexWrap:'wrap' }}>
        <div>
          <div style={{ fontWeight:800, fontSize:14 }}>{r.label} <span style={{ fontFamily:'monospace', fontSize:11, color:'var(--text-4)', fontWeight:600 }}>{r.resource_id}</span></div>
          <div style={{ fontSize:11, color:'var(--text-3)', marginTop:2 }}>
            {usedBy.length ? 'Used by ' + usedBy.map(sp => sp.name).join(', ') : 'Not used by any sport yet'}
          </div>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:8, fontSize:12, fontWeight:700, color: r.active ? 'var(--success-text)' : 'var(--danger-text)' }}>
          <Toggle on={r.active} disabled={busy} onChange={v=>onToggle(r, v)} label={`${r.label}: available or under maintenance`}/>
          {r.active ? 'Available' : 'Under maintenance'}
        </div>
      </div>
      <div style={{ marginTop:10 }}>
        <div style={{ fontSize:10.5, fontWeight:800, color:'var(--text-3)', textTransform:'uppercase', letterSpacing:'.06em', marginBottom:6 }}>Shares space with</div>
        <div style={{ display:'flex', gap:5, flexWrap:'wrap', alignItems:'center' }}>
          {others.map(o => {
            const on = draft.includes(o.resource_id);
            return (
              <button key={o.resource_id} type="button" aria-pressed={on}
                onClick={()=>setDraft(d => on ? d.filter(x => x !== o.resource_id) : [...d, o.resource_id])}
                style={{ padding:'5px 10px', borderRadius:99, fontSize:11, fontWeight:700,
                  background: on ? 'var(--ink)' : 'var(--surface-3)', color: on ? 'var(--on-ink)' : 'var(--text-3)' }}>
                {on ? '' : ''}{o.label}
              </button>
            );
          })}
          {dirty && (
            <>
              <button onClick={()=>onSaveConflicts(r, draft)} disabled={busy} style={{ padding:'5px 12px', borderRadius:7, fontSize:11, fontWeight:800, background:'var(--accent)', color:'var(--accent-ink)' }}>Save</button>
              <button onClick={()=>setDraft(saved)} style={{ padding:'5px 10px', borderRadius:7, fontSize:11, fontWeight:700, color:'var(--text-3)' }}>Undo</button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

const AUDIT_FIELDS = {
  name:'name', icon:'icon', tagline:'tagline', unit_label:'unit', price_per_slot:'price',
  resource_pool:'resources', max_concurrent:'max at the same time', max_slots_per_booking:'max hours per booking',
  online_booking:'show on website', sort_order:'sort order', label:'label',
  pricing_mode:'charge per', session_qty:'session qty', session_unit:'session unit'
};
function auditVal(k, v, cfg){
  if (v == null || v === '') return k === 'max_concurrent' ? 'all' : '—';
  if (Array.isArray(v)) return v.map(cfg.resourceLabel).join(', ') || 'none';
  if (typeof v === 'boolean') return v ? 'on' : 'off';
  return String(v);
}
function describeAudit(e, cfg){
  const before = e.before || {}, after = e.after || {};
  const name = e.entity === 'sport'
    ? (after.name || before.name || cfg.sport(e.entity_id).name)
    : (after.label || before.label || cfg.resourceLabel(e.entity_id));
  switch (e.action) {
    case 'createSport':      return `${name} created`;
    case 'setSportActive':   return `${name} turned ${after.active ? 'on' : 'off'}`;
    case 'archiveSport':     return `${name} archived`;
    case 'restoreSport':     return `${name} restored`;
    case 'createResource':   return `Resource ${name} added`;
    case 'setResourceActive': return `${name} marked ${after.active ? 'available' : 'under maintenance'}`;
    case 'setResourceConflicts':
      return (after.conflicts || []).length
        ? `${name} now shares space with ${auditVal('', after.conflicts, cfg)}`
        : `${name} no longer shares space with anything`;
    case 'generateSlotsForResource':
      return `Slots generated for ${name}${after.added != null ? ` (${after.added} added)` : ''}`;
    case 'updateSport':
    case 'updateResource': {
      const changes = Object.keys(AUDIT_FIELDS)
        .filter(k => k in after && JSON.stringify(before[k]) !== JSON.stringify(after[k]))
        .map(k => `${AUDIT_FIELDS[k]} ${auditVal(k, before[k], cfg)} → ${auditVal(k, after[k], cfg)}`);
      return changes.length ? `${name} ${changes.join(', ')}` : `${name} saved (no changes)`;
    }
    default: return `${e.action} · ${e.entity_id}`;
  }
}
function auditTime(at){
  return new Date(at).toLocaleString('en-IN', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit', hour12:true, timeZone:'Asia/Kolkata' })
    .replace(/\b(am|pm)\b/i, m => m.toUpperCase());
}

function SportsManager({ patchConfig, ok, err, setConfirm }){
  const cfg = useConfig();
  const [drawer, setDrawer] = useState(null);        // { sport } — sport null = create
  const inFlight = useRef(new Set());                // ids of sports/resources with a write in flight
  const [, rerender] = useState(0);
  const isBusy = id => inFlight.current.has(id);
  const [audit, setAudit] = useState(null);
  const [auditErr, setAuditErr] = useState(null);
  const [newRes, setNewRes] = useState({ resource_id:'', label:'' });
  const [newResErr, setNewResErr] = useState(null);
  const [justAdded, setJustAdded] = useState(null);  // resource_id awaiting "Generate slots now"

  const loadAudit = useCallback(async () => {
    try { setAudit(await API.get('listAudit') || []); setAuditErr(null); }
    catch(e){ setAuditErr(e.message); }
  }, []);
  useEffect(()=>{ loadAudit(); }, []);

  // Apply each write's own response. Re-listing right after a write can hit a server instance whose
  // config cache is up to 30 s stale (API_CONTRACT.md) and show the old state until reload.
  const upsert = (list, key, row) => {
    const i = list.findIndex(x => x[key] === row[key]);
    const next = i < 0 ? [...list, row] : list.map((x, j) => j === i ? { ...x, ...row } : x);
    return next.sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  };
  const applySport = sp => patchConfig(c => ({ sports: upsert(c.sports, 'sport_id', sp) }));
  const applyResource = r => patchConfig(c => ({ resources: upsert(c.resources, 'resource_id', r) }));
  // Conflicts are symmetric: update the other resources' lists too.
  const applyConflicts = (id, list) => patchConfig(c => ({ resources: c.resources.map(x => x.resource_id === id
    ? { ...x, conflicts: list }
    : { ...x, conflicts: list.includes(x.resource_id) ? [...new Set([...(x.conflicts || []), id])] : (x.conflicts || []).filter(y => y !== id) }) }));

  function afterWrite(msg){ if (msg) ok(msg); loadAudit(); }
  async function run(id, fn, onErr = e => err(e.message)){
    if (inFlight.current.has(id)) return;        // double click → still one request
    inFlight.current.add(id); rerender(n => n + 1);
    try { await fn(); } catch(e){ onErr(e); } finally { inFlight.current.delete(id); rerender(n => n + 1); }
  }

  function toggleSport(s, on){
    if (on) return run(s.sport_id, async () => {
      const r = await API.post('setSportActive', { sport_id: s.sport_id, active: true });
      applySport(r.sport);
      afterWrite(`${s.name} is on`);
    });
    return run(s.sport_id, async () => {
      const impact = await API.get('getSportImpact', { sport_id: s.sport_id });
      setConfirm({ show:true, title:`Turn off ${s.name}?`, danger:true, confirmLabel:'Turn off',
        message: `${impactLine(impact.count)} New online bookings will stop.`,
        onConfirm: () => run(s.sport_id, async () => {
          const r = await API.post('setSportActive', { sport_id: s.sport_id, active: false });
          applySport(r.sport);
          afterWrite(`${s.name} turned off`);
        })
      });
    });
  }

  function restoreSport(s){
    return run(s.sport_id, async () => {
      const r = await API.post('restoreSport', { sport_id: s.sport_id });
      applySport(r.sport);
      afterWrite(`${s.name} restored. It stays hidden until you turn it on.`);
    });
  }

  function toggleResource(r, on){
    if (on) return run(r.resource_id, async () => {
      const res = await API.post('setResourceActive', { resource_id: r.resource_id, active: true });
      applyResource(res.resource);
      afterWrite(`${r.label} is available`);
    });
    return run(r.resource_id, async () => {
      const impact = await API.get('getResourceImpact', { resource_id: r.resource_id });
      setConfirm({ show:true, title:`Put ${r.label} under maintenance?`, danger:true, confirmLabel:'Under maintenance',
        message: `${impactLine(impact.count)} ${r.label} won't be given to new bookings.`,
        onConfirm: () => run(r.resource_id, async () => {
          const res = await API.post('setResourceActive', { resource_id: r.resource_id, active: false });
          applyResource(res.resource);
          afterWrite(`${r.label} is under maintenance`);
        })
      });
    });
  }

  function saveConflicts(r, conflicts){
    return run(r.resource_id, async () => {
      const res = await API.post('setResourceConflicts', { resource_id: r.resource_id, conflicts });
      applyConflicts(res.resource_id, res.conflicts || []);
      afterWrite(`${r.label} conflicts saved`);
    });
  }

  async function addResource(){
    setNewResErr(null);
    const id = newRes.resource_id.trim(), label = newRes.label.trim();
    if (!ID_RE.test(id)) return setNewResErr('Id: 2–30 lowercase letters, digits or dashes (e.g. net4).');
    if (cfg.resources.some(r => r.resource_id === id)) return setNewResErr(`Resource "${id}" already exists.`);
    if (label.length < 1 || label.length > 40) return setNewResErr('Label must be 1–40 characters.');
    await run('new-resource', async () => {
      const row = await API.post('createResource', { resource_id: id, label });
      applyResource({ conflicts: [], ...row });
      setNewRes({ resource_id:'', label:'' });
      setJustAdded(id);
      afterWrite(`${label} added`);
    }, e => setNewResErr(e.message));
  }

  function generateSlots(id){
    return run(id, async () => {
      const r = await API.post('generateSlotsForResource', { resource_id: id });
      setJustAdded(null);
      afterWrite(r.message || `Slots generated for ${cfg.resourceLabel(id)}`);
    });
  }

  const live = cfg.sports.filter(s => !s.archived);
  const archived = cfg.sports.filter(s => s.archived);
  const h2 = { fontSize:16, fontWeight:800, color:'var(--text)' };
  const sub = { fontSize:12, color:'var(--text-3)', marginTop:2 };

  return (
    <div className="anim-up">
      {/* ── Section 1: Sports ── */}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14, flexWrap:'wrap', gap:10 }}>
        <div>
          <div style={h2}>Sports</div>
          <div style={sub}>What customers can book, at what price, on which resources</div>
        </div>
        <button onClick={()=>setDrawer({ sport:null })} style={{ padding:'10px 16px', background:'var(--accent)', color:'var(--accent-ink)', borderRadius:10, fontSize:13, fontWeight:700 }}>+ Add sport</button>
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(280px, 1fr))', gap:12 }}>
        {live.map(s => {
          const st = sportStatus(s);
          return (
            <div key={s.sport_id} style={{ border:'1px solid var(--border)', borderRadius:12, padding:14, display:'flex', flexDirection:'column', gap:8 }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8 }}>
                <div style={{ display:'flex', gap:10, alignItems:'center', minWidth:0 }}>
                  <SportDot sp={s} size={14}/>
                  <div style={{ minWidth:0 }}>
                    <div style={{ fontWeight:800, fontSize:14 }}>{s.name}</div>
                    <div style={{ fontSize:12, color:'var(--text)', fontWeight:700 }}>{sportPriceText(s)}</div>
                  </div>
                </div>
                <Toggle on={s.active} disabled={isBusy(s.sport_id)} onChange={v=>toggleSport(s, v)} label={`${s.name} on or off`}/>
              </div>
              <div style={{ fontSize:11, color:'var(--text-3)' }}>
                {(s.resource_pool || []).map(cfg.resourceLabel).join(', ')}
                {' · '}{s.max_concurrent == null ? 'all at once' : `max ${s.max_concurrent} at once`}
                {' · '}up to {isSession(s) ? sessionQty(s, s.max_slots_per_booking) : `${s.max_slots_per_booking}h`}
              </div>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <StatusPill bg={st.bg} text={st.text} label={st.label}/>
                <button onClick={()=>setDrawer({ sport:s })} style={{ fontSize:12, padding:'6px 12px', background:'var(--surface-3)', borderRadius:7, fontWeight:700 }}>Edit</button>
              </div>
            </div>
          );
        })}
      </div>

      {archived.length > 0 && (
        <details style={{ marginTop:14, border:'1px dashed var(--border)', borderRadius:10, padding:'10px 14px' }}>
          <summary style={{ cursor:'pointer', fontSize:13, fontWeight:700, color:'var(--text-3)' }}>Archived ({archived.length})</summary>
          <div style={{ display:'flex', flexDirection:'column', gap:6, marginTop:10 }}>
            {archived.map(s => (
              <div key={s.sport_id} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', fontSize:13, padding:'6px 0' }}>
                <span><strong>{s.name}</strong> <span style={{ color:'var(--text-4)', fontFamily:'monospace', fontSize:11 }}>{s.sport_id}</span></span>
                <button onClick={()=>restoreSport(s)} disabled={isBusy(s.sport_id)} style={{ fontSize:11, padding:'5px 11px', background:'var(--success-bg)', color:'var(--success-text)', borderRadius:6, fontWeight:700 }}>Restore</button>
              </div>
            ))}
          </div>
        </details>
      )}

      {/* ── Section 2: Resources ── */}
      <div style={{ marginTop:32, marginBottom:14 }}>
        <div style={h2}>Resources</div>
        <div style={sub}>Physical spaces. Resources that share space can't be booked at the same hour.</div>
      </div>
      <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
        {cfg.resources.map(r => (
          <ResourceRow key={r.resource_id} r={r} busy={isBusy(r.resource_id)} onToggle={toggleResource} onSaveConflicts={saveConflicts}/>
        ))}
      </div>
      <div style={{ marginTop:12, padding:14, background:'var(--surface-2)', borderRadius:10 }}>
        <div style={{ fontSize:12, fontWeight:800, marginBottom:8 }}>Add resource</div>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          <input value={newRes.resource_id} onChange={e=>setNewRes({ ...newRes, resource_id:e.target.value.toLowerCase() })} placeholder="id, e.g. net4" aria-label="Resource id" style={{ ...inputStyle, width:160, fontFamily:'monospace' }}/>
          <input value={newRes.label} onChange={e=>setNewRes({ ...newRes, label:e.target.value })} placeholder="Label, e.g. Net 4" aria-label="Resource label" maxLength={40} style={{ ...inputStyle, flex:1, minWidth:160 }}/>
          <button onClick={addResource} disabled={isBusy('new-resource')} style={{ padding:'10px 16px', background:'var(--ink)', color:'var(--on-ink)', borderRadius:8, fontSize:13, fontWeight:700 }}>Add</button>
        </div>
        <div style={{ fontSize:11, color:'var(--text-3)', marginTop:6 }}>The id is permanent. Trailing digits set its kind (net4 → net). Set "Shares space with" after adding.</div>
        {newResErr && <div style={{ background:'var(--danger-bg)', color:'var(--danger-text)', padding:'8px 12px', borderRadius:8, fontSize:12, marginTop:8 }}>{newResErr}</div>}
        {justAdded && (
          <div style={{ display:'flex', alignItems:'center', gap:10, marginTop:10, padding:'10px 12px', background:'var(--accent-soft)', border:'1px solid var(--warning-border)', borderRadius:8, fontSize:12, flexWrap:'wrap' }}>
            <span><strong>{cfg.resourceLabel(justAdded)}</strong> has no slots until tonight's run.</span>
            <button onClick={()=>generateSlots(justAdded)} disabled={isBusy(justAdded)} style={{ padding:'6px 12px', background:'var(--accent)', color:'var(--accent-ink)', borderRadius:7, fontWeight:800 }}>
              {isBusy(justAdded) ? 'Generating…' : 'Generate slots now'}
            </button>
          </div>
        )}
      </div>

      {/* ── Section 3: Change log ── */}
      <div style={{ marginTop:32, marginBottom:10, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
        <div>
          <div style={h2}>Change log</div>
          <div style={sub}>Last 100 changes to sports and resources</div>
        </div>
        <button onClick={loadAudit} style={{ fontSize:12, padding:'6px 12px', background:'var(--surface-3)', borderRadius:7, fontWeight:700 }}>↻</button>
      </div>
      {auditErr && <div style={{ background:'var(--danger-bg)', color:'var(--danger-text)', padding:'10px 14px', borderRadius:8, fontSize:13 }}>{auditErr}</div>}
      {!audit && !auditErr && <LoadingBlock message="Loading change log…"/>}
      {audit && audit.length === 0 && <div style={{ fontSize:13, color:'var(--text-4)', padding:'12px 0' }}>No changes yet.</div>}
      {audit && audit.length > 0 && (
        <div style={{ border:'1px solid var(--border-subtle)', borderRadius:10 }}>
          {audit.map(e => (
            <div key={e.id} style={{ display:'flex', justifyContent:'space-between', gap:12, padding:'9px 12px', borderBottom:'1px solid var(--border-subtle)', fontSize:13 }}>
              <span>{describeAudit(e, cfg)}</span>
              <span style={{ color:'var(--text-4)', fontSize:12, whiteSpace:'nowrap' }}>{auditTime(e.at)}</span>
            </div>
          ))}
        </div>
      )}

      {drawer && <SportDrawer sport={drawer.sport} onClose={()=>setDrawer(null)}
        onSaved={(msg, row) => { setDrawer(null); if (row) applySport(row); afterWrite(msg); }}/>}
    </div>
  );
}

// SheetJS, loaded on first export only.
let xlsxLoader = null;
function loadXLSX(){
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!xlsxLoader) {
    xlsxLoader = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = () => resolve(window.XLSX);
      s.onerror = () => { xlsxLoader = null; reject(new Error('Could not load the Excel library. Check your connection.')); };
      document.head.appendChild(s);
    });
  }
  return xlsxLoader;
}
/** sheets: [{ name, rows: [{col: value}], widths?: [n] }] */
async function downloadExcel(filename, sheets){
  const XLSX = await loadXLSX();
  const wb = XLSX.utils.book_new();
  sheets.forEach(sh => {
    const ws = XLSX.utils.json_to_sheet(sh.rows.length ? sh.rows : [{ Note: 'No data for this period' }]);
    const cols = Object.keys(sh.rows[0] || { Note: '' });
    ws['!cols'] = cols.map(c => ({ wch: Math.min(40, Math.max(10, c.length + 2, ...sh.rows.slice(0, 200).map(r => String(r[c] ?? '').length + 1))) }));
    XLSX.utils.book_append_sheet(wb, ws, sh.name.slice(0, 31));
  });
  XLSX.writeFile(wb, filename);
}

const n2 = v => Math.round((Number(v) || 0) * 100) / 100;
function monthStart(){ const d = new Date(); return formatDateISO(new Date(d.getFullYear(), d.getMonth(), 1)); }
function daysAgo(n){ const d = new Date(); d.setDate(d.getDate() - n); return formatDateISO(d); }
function fyStart(){ const d = new Date(); const y = d.getMonth() >= 3 ? d.getFullYear() : d.getFullYear() - 1; return `${y}-04-01`; }

function RangePicker({ range, setRange, presets }){
  const today = formatDateISO(new Date());
  const opts = presets || [
    { k:'today', label:'Today', from: today, to: today },
    { k:'7d', label:'7 days', from: daysAgo(6), to: today },
    { k:'month', label:'This month', from: monthStart(), to: today },
    { k:'fy', label:'This FY', from: fyStart(), to: today }
  ];
  const active = opts.find(o => o.from === range.from && o.to === range.to);
  return (
    <div className="row">
      <div className="seg">
        {opts.map(o => <button key={o.k} className={active && active.k === o.k ? 'on' : ''} onClick={()=>setRange({ from:o.from, to:o.to })}>{o.label}</button>)}
      </div>
      <input type="date" className="input" style={{ width:150 }} value={range.from} max={range.to} onChange={e=>setRange(r => ({ ...r, from: e.target.value }))} aria-label="From date"/>
      <span className="faint">to</span>
      <input type="date" className="input" style={{ width:150 }} value={range.to} min={range.from} onChange={e=>setRange(r => ({ ...r, to: e.target.value }))} aria-label="To date"/>
    </div>
  );
}

function Kpi({ label, value, foot, icon, onClick, tone }){
  const Tag = onClick ? 'button' : 'div';
  return (
    <Tag className="kpi" onClick={onClick}>
      <div className="kpi-label"><span>{label}</span>{icon && <Icon name={icon} size={16}/>}</div>
      <div className="kpi-value" style={tone ? { color:`var(--${tone}-text)` } : null}>{value}</div>
      {foot && <div className="kpi-foot">{foot}</div>}
    </Tag>
  );
}

function EmptyState({ icon, title, text, action }){
  return (
    <div style={{ padding:'44px 16px', textAlign:'center', border:'1px dashed var(--border)', borderRadius:12 }}>
      {icon && <div style={{ width:40, height:40, borderRadius:10, background:'var(--surface-3)', display:'grid', placeItems:'center', margin:'0 auto 12px', color:'var(--text-3)' }}><Icon name={icon} size={18}/></div>}
      <div style={{ fontWeight:700, fontSize:14 }}>{title}</div>
      {text && <div className="faint" style={{ fontSize:13, marginTop:4 }}>{text}</div>}
      {action && <div style={{ marginTop:14 }}>{action}</div>}
    </div>
  );
}

  }, [range.from, range.to]);
  useEffect(()=>{ load(); }, [load]);

  const paidSet = paidBookingIds(data ? data.payments : []);
  const rows = (data ? data.payments : []).filter(p =>
    filter === 'all' ? true :
    filter === 'online' ? p.provider === 'razorpay' && p.kind !== 'refund' :

    filter === 'refunds' ? p.kind === 'refund' :
    filter === 'failed' ? ledgerView(p, paidSet).status === 'failed' : true);

  async function exportXlsx(){
    setBusy(true);
    try {
      await downloadExcel(`HitNRun-Payments-${range.from}-to-${range.to}.xlsx`, [{ name:'Payments', rows: (data.payments || []).map(p => ({
        'Date & time': formatDateTime(p.created_at), 'Booking ID': p.booking_id, Customer: p.booking?.customer_name || '', Phone: p.booking?.phone || '',
        Type: KIND_LABEL[p.kind] || p.kind, Provider: p.provider, Method: p.method || '', Amount: (p.kind === 'refund' ? -1 : 1) * Number(p.amount),
        Status: (LEDGER_LABEL[ledgerView(p, paidSet).status] || [p.status])[0], 'Razorpay payment ID': p.rzp_payment_id || '', 'Razorpay refund ID': p.rzp_refund_id || '',

        <Kpi label="Collected at venue" value={rupees(S.venue_collected)} foot="Cash, Online" icon="wallet"/>

        <Kpi label="Balance due (upcoming)" value={rupees(S.upcoming_balance_due)} foot="To collect at the venue" icon="clock" tone={S.upcoming_balance_due ? 'warning' : null}/>
      </div>

      {data && data.awaiting && data.awaiting.length > 0 && (
        <div className="panel">
          <div className="panel-head">
            <div><div className="panel-title">Checkouts in progress</div><div className="panel-sub">Slots are held until payment completes or the hold runs out.</div></div>
          </div>
          <div className="table-wrap">
            <table className="table">
              <thead><tr><th>Booking</th><th>Customer</th><th>Slot</th><th className="num">Advance</th><th>Hold ends</th><th>Attempts</th></tr></thead>
              <tbody>

                    <td>{cfg.sport(a.sport).name} · {formatDateShort(a.booking_date)} · {slotRange12(a.slot_time)}</td>
                    <td className="num">{rupees(a.advance_amount)}</td>
                    <td>{a.hold_expires_at ? new Date(a.hold_expires_at).toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit', hour12:true }) : '—'}</td>
                    <td>{a.payment_failed_count > 0 ? <span className="pill p-danger">{a.payment_failed_count} failed</span> : <span className="pill p-info">Paying</span>}</td>

            </table>
          </div>
        </div>
      )}

      <div className="panel">
        <div className="panel-head">
          <div><div className="panel-title">Transactions</div><div className="panel-sub">Every payment, collection and refund in the period</div></div>
          <div className="row">
            <button className="btn btn-icon" onClick={load} title="Refresh" aria-label="Refresh"><Icon name="refresh"/></button>

        </div>
        <div className="row" style={{ marginBottom:14, justifyContent:'space-between' }}>
          <RangePicker range={range} setRange={setRange}/>
          <div className="seg">
            {[['all','All'],['online','Online'],['venue','At venue'],['refunds','Refunds'],['failed','Failed']].map(([k, l]) =>
              <button key={k} className={filter === k ? 'on' : ''} onClick={()=>setFilter(k)}>{l}</button>)}

              <tbody>
                {rows.length === 0 && <tr><td colSpan={7} className="empty">No transactions in this period.</td></tr>}
                {rows.map(p => {
                  const v = ledgerView(p, paidSet);
                  const [lbl, cls] = LEDGER_LABEL[v.status] || [v.status, 'p-muted'];
                  return (
                    <tr key={p.id} onClick={()=>onOpenBooking(p.booking_id)} style={{ cursor:'pointer' }}>
                      <td style={{ whiteSpace:'nowrap' }}>{formatDateTime(p.created_at)}</td>
                      <td><div className="strong">{p.booking?.customer_name || '—'}</div><div className="faint mono" style={{ fontSize:11.5 }}>{p.booking_id}</div></td>
                      <td>{KIND_LABEL[p.kind] || p.kind}</td>
                      <td>{String(p.method || p.provider).toUpperCase()}</td>
                      <td className="num money" style={{ color: p.kind === 'refund' ? 'var(--danger-text)' : 'var(--text)' }}>{p.kind === 'refund' ? '−' : ''}{rupees(p.amount)}</td>
                      <td><span className={`pill ${cls}`}>{lbl}</span>{v.note && <div className="faint" style={{ fontSize:11.5, marginTop:2 }}>{v.note}</div>}</td>
                      <td className="mono faint hide-sm" style={{ fontSize:11.5 }}>{p.rzp_refund_id || p.rzp_payment_id || '—'}</td>

            </table>
          </div>
        )}
      </div>
    </div>
  );
}

  useEffect(()=>{ const t = setTimeout(load, q ? 350 : 0); return ()=>clearTimeout(t); }, [load]);

      <div className="panel">
        <div className="panel-head">
          <div><div className="panel-title">GST invoices</div><div className="panel-sub">View any invoice anytime. PDF download is available for {data ? data.download_days : 90} days from the invoice date.</div></div>

          <div className="search"><Icon name="search"/><input className="input" value={q} onChange={e=>setQ(e.target.value)} placeholder="Invoice no, booking, name, phone"/></div>

                    <td className="num money">{rupees(n2(i.total))}</td>
                    <td>{i.status === 'cancelled' ? <span className="pill p-danger">Cancelled</span> : Number(i.balance_due) > 0 ? <span className="pill p-warning">Balance due</span> : <span className="pill p-success">Paid</span>}</td>

                      {i.downloadable
                        ? <a className="btn btn-sm" href={invoiceLink(i.invoice_no, true)} title="Download PDF"><Icon name="download" size={14}/><span className="hide-sm">PDF</span></a>

                  </tr>

            </table>

function CouponModal({ editing, sports, onClose, onSaved, err }){
  const blank = { code:'', description:'', discount_type:'percent', discount_value:'', max_discount:'', min_order:'', max_uses:'', per_phone_limit:'1', valid_from:'', valid_to:'', sports:[], day_rule:'all', first_booking_only:false, active:true };

  const [busy, setBusy] = useState(false);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  async function save(){
    setBusy(true);
    try { await API.post('saveCoupon', { ...f, sports: f.sports.join(','), is_new: !editing }); onSaved(); }
    catch(e){ err(e.message); setBusy(false); }

    <div className="modal-backdrop" onClick={e=>e.target===e.currentTarget && onClose()}>
      <div className="modal modal-inner" style={{ padding:24, maxWidth:560 }}>
        <div className="row" style={{ marginBottom:18 }}>
          <div style={{ fontSize:17, fontWeight:800 }}>{editing ? `Edit ${editing.code}` : 'New coupon'}</div>
          <span className="spacer"/>
          <button className="btn btn-icon btn-ghost" onClick={onClose} aria-label="Close"><Icon name="x"/></button>

        <div className="stack">
          <div className="grid-2">
            <div className="field"><label className="label">Code</label>
              <input className="input mono" value={f.code} disabled={!!editing} onChange={e=>set('code', e.target.value.toUpperCase().replace(/[^A-Z0-9_-]/g,''))} placeholder="WELCOME10" maxLength={20}/></div>
            <div className="field"><label className="label">Description</label>
              <input className="input" value={f.description} onChange={e=>set('description', e.target.value)} placeholder="Shown when applied"/></div>
          </div>
          <div className="grid-3">
            <div className="field"><label className="label">Type</label>
              <div className="seg">{[['percent','Percent'],['flat','Flat ₹']].map(([k,l]) => <button key={k} type="button" className={f.discount_type===k?'on':''} onClick={()=>set('discount_type', k)}>{l}</button>)}</div></div>
            <div className="field"><label className="label">{f.discount_type === 'percent' ? 'Discount %' : 'Discount ₹'}</label>
              <input className="input" type="number" min={1} value={f.discount_value} onChange={e=>set('discount_value', e.target.value)}/></div>
            {f.discount_type === 'percent'
              ? <div className="field"><label className="label">Max discount ₹</label><input className="input" type="number" min={0} value={f.max_discount} onChange={e=>set('max_discount', e.target.value)} placeholder="No cap"/></div>
              : <div/>}
          </div>
          <div className="grid-3">
            <div className="field"><label className="label">Min booking ₹</label><input className="input" type="number" min={0} value={f.min_order} onChange={e=>set('min_order', e.target.value)} placeholder="0"/></div>
            <div className="field"><label className="label">Total uses</label><input className="input" type="number" min={1} value={f.max_uses} onChange={e=>set('max_uses', e.target.value)} placeholder="Unlimited"/></div>
            <div className="field"><label className="label">Uses per phone</label><input className="input" type="number" min={1} value={f.per_phone_limit} onChange={e=>set('per_phone_limit', e.target.value)}/></div>
          </div>
          <div className="grid-3">
            <div className="field"><label className="label">Valid from</label><input className="input" type="date" value={f.valid_from || ''} onChange={e=>set('valid_from', e.target.value)}/></div>
            <div className="field"><label className="label">Valid to</label><input className="input" type="date" value={f.valid_to || ''} onChange={e=>set('valid_to', e.target.value)}/></div>
            <div className="field"><label className="label">Days</label>
              <select className="input" value={f.day_rule} onChange={e=>set('day_rule', e.target.value)}><option value="all">Any day</option><option value="weekday">Weekdays</option><option value="weekend">Weekends</option></select></div>
          </div>
          <div className="field"><label className="label">Sports <span className="faint" style={{ fontWeight:500 }}>(none selected = all sports)</span></label>
            <div className="row">{sports.map(s => (
              <button key={s.sport_id} type="button" onClick={()=>toggleSport(s.sport_id)} className={`btn btn-sm ${f.sports.includes(s.sport_id) ? 'btn-dark' : ''}`}>{s.name}</button>
            ))}</div></div>
          <label className="row" style={{ fontSize:13.5, cursor:'pointer' }}><input type="checkbox" checked={!!f.first_booking_only} onChange={e=>set('first_booking_only', e.target.checked)}/> First booking only (new customers)</label>
          <label className="row" style={{ fontSize:13.5, cursor:'pointer' }}><input type="checkbox" checked={!!f.active} onChange={e=>set('active', e.target.checked)}/> Active</label>
        </div>
        <div style={{ display:'flex', gap:8, justifyContent:'flex-end', marginTop:20 }}>
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" disabled={busy || !f.code || !f.discount_value} onClick={save}>{busy ? 'Saving…' : 'Save coupon'}</button>
        </div>
      </div>
    </div>,
    document.body
  );
}

function CouponsTab({ ok, err }){

  const collected = b => b.payment_status === 'paid' ? Number(b.amount) || 0 : Number(b.amount_paid) || 0;
  const tot = { bookings: live.length, value: live.reduce((s,b) => s + (Number(b.amount)||0), 0), collected: live.reduce((s,b) => s + collected(b), 0) };

  const bookingRows = list => list.map(b => ({
    'Booking ID': b.booking_id, 'Booking date': b.booking_date, Time: slotRange12(b.slot_time), Sport: cfg.sport(b.sport).name, Resource: cfg.resourceLabel(b.resource),
    Hours: Number(b.duration_hrs) || 1, Customer: b.customer_name, Phone: b.phone, Email: b.email || '', Source: b.source || 'admin', Status: b.status,
    'Payment status': b.payment_status, 'Total before coupon': Number(b.total_amount ?? b.amount) || 0, Coupon: b.coupon_code || '', Discount: Number(b.discount_amount) || 0,
    'Amount (incl. GST)': Number(b.amount) || 0, 'Paid online': b.rzp_payment_id ? Number(b.advance_amount) || 0 : 0, 'Collected total': collected(b),
    'Due': b.status === 'confirmed' ? Math.max(0, (Number(b.amount)||0) - collected(b)) : 0, Refunded: Number(b.refund_amount) || 0, Invoice: b.invoice_no || '',
    'Created at': b.created_at ? formatDateTime(b.created_at) : ''
  }));
  const summaryRows = () => {
    const bySport = {};
    live.forEach(b => { const k = cfg.sport(b.sport).name; const r = bySport[k] ||= { Sport:k, Bookings:0, Hours:0, 'Booking value':0, Collected:0, Due:0 };
      r.Bookings++; r.Hours += Number(b.duration_hrs)||1; r['Booking value'] += Number(b.amount)||0; r.Collected += collected(b); r.Due += Math.max(0,(Number(b.amount)||0)-collected(b)); });
    return Object.values(bySport);
  };
  const dailyRows = () => {
    const byDay = {};
    live.forEach(b => { const r = byDay[b.booking_date] ||= { Date:b.booking_date, Bookings:0, 'Booking value':0, Collected:0 };
      r.Bookings++; r['Booking value'] += Number(b.amount)||0; r.Collected += collected(b); });
    return Object.values(byDay).sort((a,b) => a.Date.localeCompare(b.Date));
  };

      if (kind === 'bookings') await downloadExcel(`HitNRun-Bookings-${tag}.xlsx`, [{ name:'Bookings', rows: bookingRows(inRange) }]);
      if (kind === 'summary') await downloadExcel(`HitNRun-Summary-${tag}.xlsx`, [{ name:'By sport', rows: summaryRows() }, { name:'By day', rows: dailyRows() }]);
      if (kind === 'gst' || kind === 'payments' || kind === 'full') {
        const [inv, pay] = await Promise.all([
          kind !== 'payments' ? API.get('listInvoices', range) : null,
          kind !== 'gst' ? API.get('listPayments', range) : null
        ]);
        const invRows = inv ? inv.invoices.map(i => ({ 'Invoice No.': i.invoice_no, 'Invoice date': i.invoice_date, 'Booking ID': i.booking_id, Customer: i.customer_name,
          'Place of supply': i.place_of_supply, SAC: i.sac, 'Taxable value': n2(i.taxable_value), 'GST rate %': n2(i.gst_rate), CGST: n2(i.cgst), SGST: n2(i.sgst),
          'Invoice total': n2(i.total), Status: i.status })) : [];
        const payRows = pay ? pay.payments.map(p => ({ 'Date & time': formatDateTime(p.created_at), 'Booking ID': p.booking_id, Customer: p.booking?.customer_name || '',

        if (kind === 'payments') await downloadExcel(`HitNRun-Payments-${tag}.xlsx`, [{ name:'Payments', rows: payRows }]);

  const [paymentFilter, setPaymentFilter] = useState('all'); // 'all' | 'pending' | 'paid'

  // ── NOTIFICATIONS: sound + browser notification when new bookings arrive ──
  const [notifEnabled, setNotifEnabled] = useState(false);
  const seenBookingsRef = useRef(new Set());
  const isFirstBookingsLoadRef = useRef(true);
  const audioCtxRef = useRef(null);
  const bellAudioUrlRef = useRef(null);

  // Build a 2.5s bell WAV once and cache the blob URL. HTML5 Audio plays
  // this reliably even when the page has been backgrounded — much more
  // dependable than Web Audio API for ongoing alerts.
  useEffect(() => {
    if (bellAudioUrlRef.current) return;
    try {
      bellAudioUrlRef.current = generateBellWavUrl();
      console.log('[bell] WAV generated and cached');
    } catch(e) {
      console.warn('[bell] WAV generation failed (will fall back to Web Audio):', e);
    }
    return () => {
      if (bellAudioUrlRef.current) {
        try { URL.revokeObjectURL(bellAudioUrlRef.current); } catch(_){}
        bellAudioUrlRef.current = null;
      }
    };
  }, []);

  // Build a 3-ring bell sound as a WAV in memory. Returns a blob URL.
  function generateBellWavUrl(){
    const sampleRate = 22050;
    const totalDuration = 2.5;
    const totalSamples = Math.floor(sampleRate * totalDuration);
    const samples = new Float32Array(totalSamples);

    // 3 rings, each ~0.7s decay
    [0, 0.8, 1.6].forEach(startTime => {
      const startIdx = Math.floor(startTime * sampleRate);
      const ringSamples = Math.floor(0.7 * sampleRate);
      for (let i = 0; i < ringSamples; i++) {
        const idx = startIdx + i;
        if (idx >= totalSamples) break;
        const t = i / sampleRate;
        const env = Math.exp(-t * 4); // fast-attack, exp-decay envelope
        const s = (
          Math.sin(2*Math.PI*1000*t) * 0.45 +  // fundamental
          Math.sin(2*Math.PI*1500*t) * 0.30 +  // 3rd harmonic
          Math.sin(2*Math.PI*2000*t) * 0.15    // 5th harmonic shimmer
        ) * env;
        samples[idx] = Math.max(-1, Math.min(1, samples[idx] + s));
      }
    });

    // Pack into 16-bit PCM WAV
    const dataLen = samples.length * 2;
    const buf = new ArrayBuffer(44 + dataLen);
    const v = new DataView(buf);
    const writeStr = (off, str) => { for (let i = 0; i < str.length; i++) v.setUint8(off + i, str.charCodeAt(i)); };
    writeStr(0, 'RIFF'); v.setUint32(4, 36 + dataLen, true); writeStr(8, 'WAVE');
    writeStr(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    writeStr(36, 'data'); v.setUint32(40, dataLen, true);
    for (let i = 0; i < samples.length; i++) {
      const c = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(44 + i*2, c < 0 ? c * 0x8000 : c * 0x7FFF, true);
    }
    return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  }

  // Loud bell-like alarm — 3 rings over ~2.5s. Primary: HTML5 Audio (reliable),
  // fallback: Web Audio API (if blob URL not available for some reason).
  async function playNotificationSound(){
    // PRIMARY: HTML5 Audio via cached WAV blob
    if (bellAudioUrlRef.current) {
      try {
        const audio = new Audio(bellAudioUrlRef.current);
        audio.volume = 1.0;
        const p = audio.play();
        if (p && p.catch) {
          p.catch(e => {
            console.warn('[bell] HTML5 Audio play() rejected, trying Web Audio:', e);
            playBellViaWebAudio();
          });
        }
        console.log('[bell] played via HTML5 Audio');
        return;
      } catch(e) {
        console.warn('[bell] HTML5 Audio failed, falling back:', e);
      }
    }
    // FALLBACK: Web Audio (used when blob URL unavailable)
    playBellViaWebAudio();
  }

  async function playBellViaWebAudio(){
    try {
      if (!audioCtxRef.current) {
        audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      }
      const ctx = audioCtxRef.current;
      if (ctx.state === 'suspended') {
        try { await ctx.resume(); } catch(_){}
      }
      [0, 0.8, 1.6].forEach(delay => {
        const t0 = ctx.currentTime + delay;
        [
          { freq: 1000, gain: 0.45, dur: 0.7 },
          { freq: 1500, gain: 0.30, dur: 0.55 },
          { freq: 2000, gain: 0.15, dur: 0.4 }
        ].forEach(({ freq, gain: g0, dur }) => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine'; osc.frequency.value = freq;
          osc.connect(g); g.connect(ctx.destination);
          g.gain.setValueAtTime(0, t0);
          g.gain.linearRampToValueAtTime(g0, t0 + 0.005);
          g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
          osc.start(t0); osc.stop(t0 + dur + 0.05);
        });
      });
      console.log('[bell] played via Web Audio fallback');
    } catch(e) { console.error('[bell] all audio failed:', e); }
  }

                    <button key={preset.label}
                      onClick={()=>{ setRevenueRange({ from: preset.from, to: preset.to }); setTimeout(fetchRevenue, 0); }}
                      style={{ padding:'6px 12px', background: active?'var(--ink)':'var(--surface-3)', color: active?'var(--on-ink)':'var(--text-2)', borderRadius:6, fontSize:11, fontWeight:700, border:'1px solid '+(active?'var(--border-strong)':'var(--border)') }}>
                      {preset.label}
                    </button>
                  );
                })}
              </div>
            </div>

            <div style={{ display:'flex', gap:6, alignItems:'center', flexWrap:'wrap', marginBottom:18, padding:12, background:'var(--surface-2)', border:'1px solid var(--border-subtle)', borderRadius:8 }}>
              <span style={{ fontSize:12, color:'var(--text-3)', fontWeight:600 }}>Custom range:</span>
              <input type="date" value={revenueRange.from} onChange={e=>setRevenueRange({...revenueRange, from:e.target.value})} style={{ padding:'7px 10px', borderRadius:6, border:'1.5px solid var(--border)', fontSize:12 }}/>
              <span style={{ color:'var(--text-4)' }}>→</span>
              <input type="date" value={revenueRange.to} onChange={e=>setRevenueRange({...revenueRange, to:e.target.value})} style={{ padding:'7px 10px', borderRadius:6, border:'1.5px solid var(--border)', fontSize:12 }}/>
              <button onClick={fetchRevenue} style={{ padding:'7px 14px', background:'var(--ink)', color:'var(--on-ink)', borderRadius:6, fontSize:12, fontWeight:700 }}>Apply</button>
            </div>

            {!revenue && <LoadingBlock message="Computing…"/>}
            {revenue && (() => {
              const total = parseFloat(revenue.total) || 0;
              const count = parseInt(revenue.bookings_count, 10) || 0;
              return (
              <>
                <div className="revenue-cards" style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:14, marginBottom:28 }}>
                  <div style={{ background:'var(--accent)', color:'var(--accent-ink)', padding:20, borderRadius:12 }}>
                    <div style={{ fontSize:11, opacity:.75, fontWeight:700, textTransform:'uppercase', letterSpacing:'.06em' }}>Collected</div>
                    <div style={{ fontSize:32, fontWeight:800, marginTop:6 }}>₹{total.toLocaleString('en-IN')}</div>
                  </div>
                  <div style={{ background:'var(--surface)', border:'1px solid var(--border)', padding:20, borderRadius:14 }}>
                    <div style={{ fontSize:11, color:'var(--text-4)', fontWeight:700, textTransform:'uppercase', letterSpacing:'.06em' }}>Paid Bookings</div>
                    <div style={{ fontSize:32, fontWeight:800, marginTop:6 }}>{count}</div>
                  </div>
                  <div style={{ background:'var(--surface)', border:'1px solid var(--border)', padding:20, borderRadius:14 }}>
                    <div style={{ fontSize:11, color:'var(--text-4)', fontWeight:700, textTransform:'uppercase', letterSpacing:'.06em' }}>Avg / Booking</div>
                    <div style={{ fontSize:32, fontWeight:800, marginTop:6 }}>₹{count>0?Math.round(total/count).toLocaleString('en-IN'):0}</div>
                  </div>
                </div>

                <div className="revenue-split" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:24 }}>
                  <div>
                    <div style={{ fontSize:13, fontWeight:800, marginBottom:12 }}>By Payment Mode</div>
                    {Object.keys(revenue.by_payment_mode || {}).length === 0 && (
                      <div style={{ fontSize:13, color:'var(--text-4)', padding:'10px 0' }}>No paid bookings in this range</div>
                    )}
                    {Object.entries(revenue.by_payment_mode || {}).map(([mode, val]) => (
                      <div key={mode} style={{ display:'flex', justifyContent:'space-between', padding:'10px 0', borderBottom:'1px solid var(--border-subtle)' }}>
                        <span style={{ fontSize:13 }}>{mode === 'razorpay' ? 'Online advance (Razorpay)' : payModeLabel(mode)}</span>
                        <span style={{ fontWeight:700, fontSize:13 }}>₹{(parseFloat(val)||0).toLocaleString('en-IN')}</span>
                      </div>
                    ))}
                  </div>
                  <div>
                    <div style={{ fontSize:13, fontWeight:800, marginBottom:12 }}>By Sport</div>
                    {Object.keys(revenue.by_sport || {}).length === 0 && (
                      <div style={{ fontSize:13, color:'var(--text-4)', padding:'10px 0' }}>No paid bookings in this range</div>
                    )}
                    {Object.entries(revenue.by_sport || {}).map(([sport, val]) => (
                      <div key={sport} style={{ display:'flex', justifyContent:'space-between', padding:'10px 0', borderBottom:'1px solid var(--border-subtle)' }}>
                        <span style={{ fontSize:13 }}>{cfg.sport(sport).name}</span>
                        <span style={{ fontWeight:700, fontSize:13 }}>₹{(parseFloat(val)||0).toLocaleString('en-IN')}</span>
                      </div>
                    ))}
                  </div>
                </div>
              </>
              );
            })()}
          </div>
        )}

        {/* ━━━━━ SPORTS TAB ━━━━━ */}
        {!loading && tab === 'sports' && (
          cfgData.loaded
            ? <SportsManager patchConfig={patchConfig} ok={ok} err={err} setConfirm={setConfirm}/>
            : cfgData.error
              ? <div style={{ padding:40, textAlign:'center', fontSize:13, color:'var(--danger-text)' }}>{cfgData.error} <button onClick={loadConfig} style={{ marginLeft:8, padding:'6px 12px', background:'var(--surface-3)', borderRadius:7, fontWeight:700 }}>Retry</button></div>
              : <LoadingBlock message="Loading sports…"/>
        )}
      </div>
          )}

          {tab === 'payments' && <PaymentsTab ok={ok} err={err} payCfg={payCfg} onOpenBooking={openBooking}/>}
          {tab === 'invoices' && <InvoicesTab err={err} onOpenBooking={openBooking}/>}
          {tab === 'coupons'  && <CouponsTab ok={ok} err={err}/>}
          {tab === 'reports'  && <ReportsTab bookings={bookings} ok={ok} err={err}/>}
          {tab === 'settings' && <SettingsTab ok={ok} err={err} setConfirm={setConfirm} onPayCfg={d => setPayCfg({ online: !!d.payments.online_enabled, mode: d.gateway.mode })}/>}
        </main>
      </div>

      <Toast toast={toast} onClose={()=>setToast({show:false})}/>
      <ConfirmModal config={confirm} onClose={()=>setConfirm({show:false})}/>
      {showSpot && <SpotBookingModal
        onClose={()=>setShowSpot(false)}
        defaultDate={slotDate}
        onCreate={(result)=>{
          // OPTIMISTIC UPDATE — show the booking instantly without waiting for reload
          if (result && result.booking) {
            // Mark as seen FIRST so the new-booking alert doesn't fire for our own walk-in
            seenBookingsRef.current.add(result.booking.booking_id);
            setBookings(prev => [result.booking, ...prev]);
            // Also mark the slot as booked locally so Availability tab is consistent
            setSlots(prev => prev.map(s =>
              s.slot_id === result.booking.slot_id
                ? { ...s, status: (result.booking.booking_date > formatDateISO(new Date()) ? 'advance' : 'booked'),
                    sport: result.booking.sport, booking_id: result.booking.booking_id,
                    booked_name: result.booking.customer_name, booked_phone: result.booking.phone }
                : s
            ));
          }
          // Show email status in the toast
          let msg = 'Booking created · ' + (result?.booking_id || '');
          if (result?.email_sent) msg += ' · email sent';
          else if (result?.booking?.email) msg += ' · email FAILED (check Apps Script logs)';
          else msg += ' · no customer email';
          ok(msg);
          // Reconcile from server in background (will pick up anything we missed)
          loadSnapshot({ noCache: true });
        }}
      />}
      {showPass && <PassModal editing={editingMember} onClose={()=>{setShowPass(false); setEditingMember(null);}} onCreate={()=>{ ok(editingMember?'Updated':'Pass created'); loadSnapshot({ includeMembers:true, noCache:true }); }}/>}
      {showLead && <LeadModal editing={editingLead} onClose={()=>{setShowLead(false); setEditingLead(null);}} onSave={()=>{ ok(editingLead?'Updated':'Lead added'); loadSnapshot({ includeLeads:true, noCache:true }); }}/>}
      {editingBooking && <EditBookingModal
        booking={editingBooking}
        onClose={()=>setEditingBooking(null)}
        onSave={()=>{
          ok('Booking updated');
          loadSnapshot({ noCache: true });
        }}
      />}
      {selectedBooking && <BookingDetailDrawer
        booking={selectedBooking}
        allBookings={bookings}
        onClose={()=>setSelectedBookingId(null)}
        onMarkPaid={markPaid}
        onEdit={(b)=>{ setSelectedBookingId(null); setEditingBooking(b); }}
        onCancel={(b)=>setCancelling(b)}
        onChanged={()=>loadSnapshot({ noCache: true })}
        ok={ok} err={err}
      />}
      {cancelling && <CancelBookingModal booking={cancelling} ok={ok} err={err}
        onClose={()=>setCancelling(null)}
        onDone={()=>{ setCancelling(null); setSelectedBookingId(null); loadSnapshot({ noCache: true }); }}/>}
      {collecting && <CollectModal booking={collecting.booking} due={collecting.due} onClose={()=>setCollecting(null)} onCollect={collectBalance}/>}
    </div>
    </ConfigCtx.Provider>
  );
}

function nextStatus(s){
  if(s==='new') return 'contacted';
  if(s==='contacted') return 'qualified';
  if(s==='qualified') return 'converted';
  return s;
}

// ──────────────────────────────────────────────────────────
// SLOT CARD — one row per resource for a time window
// ──────────────────────────────────────────────────────────
function SlotCard({ group, resources, onBlock, onUnblock, onCancel }){
  const cfg = useConfig();
  const { slot_time, byRes } = group;

  function statusColor(s){
    if(!s) return { bg:'var(--surface-2)', text:'var(--text-4)' };
    if(s.status === 'available') return { bg:'var(--success-bg)', text:'var(--success-text)' };
    if(s.status === 'booked')    return { bg:'var(--warning-bg)', text:'var(--warning-text)' };
    if(s.status === 'advance')   return { bg:'var(--info-bg)', text:'var(--info-text)' };
    if(s.status === 'blocked')   return { bg:'var(--surface-3)', text:'var(--text-2)' };
    return { bg:'var(--surface-2)', text:'var(--text-4)' };
  }

  return (
    <div className="slot-card-mobile" style={{ background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, padding:14, boxShadow:'0 1px 3px rgba(0,0,0,.04)' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
        <div style={{ fontFamily:'monospace', fontSize:14, fontWeight:800 }}>{slotRange12(slot_time)}</div>
      </div>

      {resources.filter(r => byRes[r.resource_id]).map(r => {
        const slot = byRes[r.resource_id];
        const c = statusColor(slot);
        const held = slot.status === 'booked' || slot.status === 'advance';
        const sp = held && slot.sport ? cfg.sport(slot.sport) : null;
        return (
          <div key={slot.slot_id} className="resource-row" style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 12px', background: c.bg, borderRadius:8, marginBottom:6 }}>
            <div>
              <div style={{ fontSize:11, fontWeight:800, color: c.text, letterSpacing:'.04em', textTransform:'uppercase' }}>
                {r.label}{!r.active ? ' · maintenance' : ''}{sp ? ` · ${sp.name}` : ''}
              </div>
              {held && slot.booked_name && (
                <div style={{ fontSize:11, color:'var(--text-2)', marginTop:2, fontWeight:600 }}>{slot.booked_name} · {formatPhone(slot.booked_phone)}</div>
              )}
              {slot.status === 'blocked' && slot.block_reason && (
                <div style={{ fontSize:11, color:'var(--text-3)', marginTop:2, fontStyle:'italic' }}>{slot.block_reason}</div>
              )}
            </div>
            <div style={{ display:'flex', gap:4 }}>
              {slot.status === 'available' && <button onClick={()=>onBlock(slot.slot_id)} style={{ fontSize:10, padding:'4px 8px', background:'var(--surface)', borderRadius:5, fontWeight:700 }}>Block</button>}
              {slot.status === 'blocked'   && <button onClick={()=>onUnblock(slot.slot_id)} style={{ fontSize:10, padding:'4px 8px', background:'var(--surface)', borderRadius:5, fontWeight:700 }}>Unblock</button>}
              {held && slot.booking_id && <button onClick={()=>onCancel(slot.booking_id)} style={{ fontSize:10, padding:'4px 8px', background:'var(--surface)', color:'var(--danger-text)', borderRadius:5, fontWeight:700 }}></button>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ──────────────────────────────────────────────────────────
// ERROR BOUNDARY
// ──────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(p){ super(p); this.state = { error: null }; }
  static getDerivedStateFromError(e){ return { error: e }; }
  componentDidCatch(e, i){ console.error('Admin crashed:', e, i); }
  render(){
    if(this.state.error){
      return (
        <div style={{ minHeight:'100vh', background:'var(--ink)', color:'var(--on-ink)', display:'grid', placeItems:'center', padding:24, fontFamily:'Outfit,system-ui,sans-serif' }}>
          <div style={{ maxWidth:520 }}>
            <div style={{ fontSize:48, marginBottom:16 }}></div>
            <div style={{ fontSize:22, fontWeight:800, marginBottom:10 }}>Dashboard hit an error</div>
            <div style={{ fontSize:13, color:'var(--text-3)', lineHeight:1.7, marginBottom:18 }}>Try refreshing. If it persists, share the error below.</div>
            <pre style={{ background:'var(--ink)', padding:'12px 14px', borderRadius:10, fontSize:12, color:'var(--accent-text)', border:'1px solid var(--border)', overflowX:'auto', whiteSpace:'pre-wrap', maxHeight:200 }}>{String(this.state.error?.message || this.state.error)}</pre>
            <button onClick={()=>location.reload()} style={{ marginTop:18, padding:'10px 24px', background:'var(--accent)', color:'var(--text)', border:'none', borderRadius:8, fontSize:13, fontWeight:800, cursor:'pointer' }}>Reload Dashboard</button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><App/></ErrorBoundary>);

</script>
</body>
